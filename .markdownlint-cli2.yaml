# markdownlint-cli2 の設定
# https://github.com/DavidAnson/markdownlint-cli2
# 実行: npx markdownlint-cli2 "**/*.md"
# 自動修正: npx markdownlint-cli2 --fix "**/*.md"

config:
  # ============================================================
  # 恒久的に無効化（本プロジェクトの文書スタイルと衝突するため）
  # ============================================================

  # 行の長さ（長い URL・表・コード例・ASCII 図があるため）
  MD013: false

  # 重複する見出し（プラットフォーム別ガイドで同じ節名が繰り返されるため）
  MD024: false

  # インライン HTML（README のスクリーンショットやバッジで <img> を使うため）
  MD033: false

  # コードブロック内のハードタブは、コマンド出力や外部形式の例を正確に示すため許可する。
  # 地の文のハードタブは引き続き検出する。
  MD010:
    code_blocks: false

  # ============================================================
  # スタイル設定
  # ============================================================

  # 表はパイプを縦にそろえる整形済みスタイルを強制する
  MD060:
    style: "aligned"

  # OKF v0.2 バンドルの概念ドキュメントはフロントマターに title を持つ。
  # front_matter_title を空にして、フロントマターの title を H1 と数えないようにし、
  # 本文の見出しと二重の H1 になる MD025 違反を防ぐ。
  MD025:
    front_matter_title: ""

ignores:
  - "**/node_modules/**"
  - "**/build/**"
  - ".agents/**"
  # release-please が生成する CHANGELOG は整形をツール側が決めるため lint 対象外にする
  # （バージョン見出し直後に空行を 2 つ挿入し MD012 に必ず違反する）
  - "CHANGELOG.md"
  # .kiro 配下は steering だけ lint 対象にし、それ以外のディレクトリは除外する
  - ".kiro/agents/**"
  - ".kiro/aidlc-common/**"
  - ".kiro/hooks/**"
  - ".kiro/knowledge/**"
  - ".kiro/scopes/**"
  - ".kiro/sensors/**"
  - ".kiro/settings/**"
  - ".kiro/skills/**"
  - ".kiro/tools/**"
