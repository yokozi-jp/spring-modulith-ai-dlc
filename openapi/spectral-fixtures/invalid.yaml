# .spectral.yaml の違反例。各ルールの違反を含み、それ以外は合格例と同じ形にする。期待する違反は invalid.expected が全件を持つ。
# task api-lint-rules-test が、違反ごとのルール名と JSON パスの組を invalid.expected と過不足なく突き合わせる。
# openapi-version-3-1（パッチ版がない。oas3-schema も同じ場所を報告する）
openapi: "3.1"
info:
  title: Demo API
  description: Demo アプリケーションの HTTP API
  version: 0.1.0
tags:
  - name: sample-order
    description: サンプル注文の API
  # operation-singular-tag と tag-name-format（-controller で終わる）
  - name: order-controller
    description: 注文の Controller
  # tag-name-format（kebab-case でない）
  - name: Orders
    description: 注文の API
  # tag-description
  - name: sample-invoice
# operation-security（文書の既定の security がない。全 operation が違反になるので、operation を足したら invalid.expected にも足す。
# security を自分で持つ operation は違反にならない）
paths:
  /api/v1/sample-orders:
    get:
      # operation-singular-tag
      tags:
        - sample-order
        - order-controller
      summary: サンプル注文を一覧する。
      description: サンプル注文を一覧する。<p>新しい順に返す。
      operationId: listSampleOrders
      parameters:
        # instant-property-date-time（クエリの引数に format がない）
        - name: shippedAt
          in: query
          description: 出荷した絶対時刻の下限
          schema:
            type: string
        # calendar-date-property-full-date（クエリの引数が date でない）
        - name: closedDate
          in: query
          description: 締め日の暦日
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: サンプル注文の一覧
    post:
      tags:
        - sample-order
      summary: サンプル注文を受け付ける。
      # operation-description（description がない）と idempotency-key-required（parameters がない）
      operationId: placeSampleOrder
      requestBody:
        description: 受け付けるサンプル注文
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleOrderRequest"
        required: true
      responses:
        "201":
          description: サンプル注文を受け付けた
  /api/v1/sample-orders/{sampleOrderId}:
    get:
      tags:
        - sample-order
      summary: サンプル注文を 1 件取得する。
      description: サンプル注文を 1 件取得する。<p>取り消し済みの注文も返す。
      operationId: findSampleOrderById
      parameters:
        # oas3-parameter-description と public-id-uuid（format: uuid がない）
        - name: sampleOrderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: サンプル注文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleOrderResponse"
        # error-response-problem-detail（application/problem+json でない）
        "404":
          description: サンプル注文が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        # error-response-problem-detail（4XX も対象）
        4XX:
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  # path-params（{sampleOrderId} と同じ形のパス。spectral:oas の検出で、固有の規則ではない）
  /api/v1/sample-orders/{code}:
    delete:
      tags:
        - sample-order
      summary: サンプル注文を取り消す。
      description: サンプル注文を取り消す。<p>取り消し済みなら何もしない。
      operationId: cancelSampleOrder
      parameters:
        # public-id-uuid（パスの引数が uuid でない）
        - name: code
          in: path
          description: サンプル注文の番号
          required: true
          schema:
            type: string
        # query-parameter-get-only（DELETE の lockNo 以外）
        - name: force
          in: query
          description: 強制するか
          schema:
            type: boolean
        # idempotency-key-required（components の IdempotencyKey を参照せず、inline で書く）
        - name: Idempotency-Key
          in: header
          description: 冪等性キー
          required: true
          schema:
            type: string
      responses:
        "204":
          description: サンプル注文を取り消した
  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: 注文を一覧する。
      description: 注文を一覧する。<p>新しい順に返す。
      operationId: listOrders
      parameters:
        # public-id-uuid（クエリの引数に format: uuid がない）
        - name: customerId
          in: query
          description: 注文した顧客の ID
          schema:
            type: string
      responses:
        "200":
          description: 注文の一覧
  /api/v1/sample-payments:
    get:
      # operation-tag-defined
      tags:
        - sample-payment
      summary: サンプル支払いを一覧する。
      description: サンプル支払いを一覧する。<p>新しい順に返す。
      operationId: listSamplePayments
      security: []
      responses:
        "200":
          description: サンプル支払いの一覧
  # path-kebab-case（snake_case）、no-top-level-array-response
  /api/v1/sample_items:
    get:
      tags:
        - sample-order
      summary: サンプル品目を一覧する。
      description: サンプル品目を一覧する。<p>配列をそのまま返す。
      operationId: listSampleItems
      responses:
        "200":
          description: サンプル品目の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  # path-kebab-case-resource（末尾が camelCase の GET）
  /api/v1/sampleTags:
    get:
      tags:
        - sample-order
      summary: サンプルタグを一覧する。
      description: サンプルタグを一覧する。<p>新しい順に返す。
      operationId: list_sample_tags # operation-id-naming
      responses:
        "200":
          description: サンプルタグの一覧
  /api/v1/sample-notes:
    post:
      tags:
        - sample-order
      summary: サンプル備考を追加する。
      description: サンプル備考を追加する。<p>在庫は変えない。
      operationId: addSampleNote
      # idempotency-key-required（Idempotency-Key を参照しない）
      parameters:
        # query-parameter-get-only（POST）
        - name: draft
          in: query
          description: 下書きにするか
          schema:
            type: boolean
      responses:
        "201":
          description: サンプル備考を追加した
          headers:
            Location:
              description: 追加したサンプル備考の URI
              schema:
                type: string
                format: uri-reference
  /api/v1/sample-labels:
    get:
      # operation-tags（tags がない）と operation-operationId（operationId がない）
      summary: サンプルラベルを一覧する。
      description: サンプルラベルを一覧する。<p>新しい順に返す。
      responses:
        "200":
          description: サンプルラベルの一覧
  /api/v1/sample-memos:
    get:
      tags:
        - sample-order
      summary: サンプルメモを一覧する。
      description: サンプルメモを一覧する。<p>新しい順に返す。
      operationId: listSampleMemos
      # operation-success-response（2xx がない）
      responses:
        default:
          description: サンプルメモの一覧
  # path-api-version（/api/ の次の区間がバージョンでない）。security は文書の既定がないので operation-security も報告される
  /api/sample-unversioned:
    get:
      tags:
        - sample-order
      summary: バージョンのないサンプルを一覧する。
      description: バージョンのないサンプルを一覧する。<p>新しい順に返す。
      operationId: listSampleUnversioned
      responses:
        "200":
          description: サンプルの一覧
components:
  # common-problem-detail-schema（ValidationProblem を定義しない）
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 の Problem Details
      properties:
        # problem-type-uri-reference（相対 URI を許さない uri）
        type:
          type: string
          format: uri
          description: Problem type の安定した識別 URI
          example: about:blank
        title:
          type: string
          description: Problem type の短い説明
        status:
          type: integer
          format: int32
          description: 実際の HTTP status code
      # problem-detail-required-fields（status がない）
      required:
        - type
        - title
    SampleOrderRequest:
      type: object
      description: サンプル注文の受け付けの要求
      properties:
        # schema-property-example（文字列）と public-id-uuid（ID の名前で format がない）
        customerId:
          type: string
          description: 顧客の ID
        # schema-property-example（3.1 の nullable）
        quantity:
          type:
            - integer
            - "null"
          format: int32
          description: 数量
        # schema-property-description
        giftWrap:
          type: boolean
      required:
        - customerId
        - giftWrap
    SampleOrderResponse:
      type: object
      description: サンプル注文
      properties:
        # public-id-uuid（format がない）
        sampleOrderId:
          type: string
          description: サンプル注文の ID
          example: SO-0001
        # public-id-uuid（数値の ID）
        orderId:
          type: integer
          format: int64
          description: 注文の ID
          example: 1
        # public-id-uuid（数値の ID の配列）
        productIds:
          type: array
          description: 注文した商品の ID
          items:
            type: integer
            format: int64
        # instant-property-date-time（format がない）
        placedAt:
          type: string
          description: 注文を受け付けた絶対時刻
          example: 2023-09-29T15:00:00Z
        # calendar-date-property-full-date（format が date でない）
        deliveryDate:
          type: string
          format: date-time
          description: 届け日の暦日
          example: 2023-09-30T00:00:00Z
        # instant-property-date-time（type が string でない）
        receivedAt:
          type: integer
          format: int64
          description: 受け取った絶対時刻の UNIX 時刻
          example: 1695999600
      required:
        - sampleOrderId
  # common-problem-responses（ConflictProblem などの共通 response がない）
  responses:
    # bad-request-validation-problem（ValidationProblem を参照しない）
    BadRequestProblem:
      description: 要求の形式または入力値が正しくない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnauthorizedProblem:
      description: 認証されていない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ForbiddenProblem:
      description: 操作の権限がない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    # problem-response-content（ProblemDetail を参照しない）
    NotFoundProblem:
      description: 対象のリソースが存在しない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/SampleOrderResponse"
    InternalServerErrorProblem:
      description: サーバーの内部エラー
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
