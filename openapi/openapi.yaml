openapi: 3.1.0
info:
  description: Demo アプリケーションの HTTP API
  title: Demo API
  version: 0.2.0
servers:
- description: 現在のオリジン
  url: /
paths: {}
components:
  responses:
    BadRequestProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
      description: 要求の形式または入力値が正しくない
    ConflictProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: リソースの現在の状態と競合する
    ForbiddenProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: 操作の権限がない
    InternalServerErrorProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: サーバーの内部エラー
    NotFoundProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: 対象のリソースが存在しない
    UnauthorizedProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: 認証されていない
      headers:
        WWW-Authenticate:
          description: 認証の challenge。ブラウザの Cookie セッションを表す独自 scheme（ADR-059）
          required: true
          schema:
            type: string
            example: Session realm="demo"
    UnprocessableContentProblem:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: 業務規則に反するため処理できない
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 の Problem Details
      properties:
        detail:
          type: string
          description: この失敗に固有の、人が読むための説明
        instance:
          type: string
          format: uri-reference
          description: 失敗発生を識別する URI
        status:
          type: integer
          format: int32
          description: 実際の HTTP status code
        title:
          type: string
          description: Problem type の短い説明
        type:
          type: string
          format: uri-reference
          description: Problem type の識別 URI。about:blank かパスを全部書いた相対 URI
          example: about:blank
      required:
      - status
      - title
      - type
    ValidationError:
      type: object
      description: 入力検証の誤り
      properties:
        detail:
          type: string
          description: 利用者向けの誤りの説明。入力値を含まない
          example: この項目は必須です。
        pointer:
          type: string
          description: 誤りのある入力の位置を示す RFC 6901 の JSON Pointer
          example: /items/0/name
      required:
      - detail
      - pointer
    ValidationProblem:
      allOf:
      - $ref: "#/components/schemas/ProblemDetail"
      - type: object
        properties:
          errors:
            type: array
            description: 入力検証の誤り。type が /problems/validation-error のときだけ必ず含む
            items:
              $ref: "#/components/schemas/ValidationError"
          type:
            type: string
            format: uri-reference
            description: 入力検証エラーなら /problems/validation-error。それ以外の 400 は about:blank
            example: /problems/validation-error
      description: 400 の Problem Details。type が /problems/validation-error なら入力検証エラーで、errors
        に誤りのある入力の位置と説明を持つ
