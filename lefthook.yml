# ---------------------------------------------------------------------------
# 実運用設定
# ---------------------------------------------------------------------------

# lefthook の版の表示、skip の行、EXECUTE の行を省く。
# job の出力は残す。adr-check の注意喚起は成功の扱いで出るため、成功した job の出力も消さない。
# 全部を出すときは LEFTHOOK_OUTPUT=meta,summary,success,failure,execution,execution_out,execution_info,skips を付ける。
output:
  - summary
  - failure
  - execution_out

# コミットメッセージを Conventional Commits 規約で検証（commitlint）
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    # ステージ済みの変更をシークレットスキャン（Betterleaks）
    - name: betterleaks-secret-scan
      run: task scan-secrets

    # api-contract-check は src/api/generated を再生成し、frontend-check は src を型検査する。
    # 同時に走ると生成途中のファイルを型検査するため、piped で API の検査を先に順番に実行する。
    - name: frontend-and-api
      group:
        piped: true
        jobs:
          # OpenAPI 契約か Orval の入力にステージ済み変更があるとき、DB を使わずに検査する（ADR-052）。
          # コミット済み契約の Spectral 検査と、Orval で再生成した API client の差分なしを確かめる。
          # docker が無い環境では Spectral をスキップする（最終担保は CI に任せる）。
          - name: api-contract-check
            glob:
              - "openapi/**"
              - ".spectral.yaml"
              - "frontend/orval.config.ts"
              - "frontend/package.json"
              - "frontend/src/api/generated/**"
            run: |
              echo "{staged_files}" >/dev/null
              if command -v docker >/dev/null 2>&1; then
                task api-lint
              else
                echo "docker が無いため Spectral をスキップします（CI で検査されます）。" >&2
              fi
              task api-client-check
            fail_text: "OpenAPI契約またはAPI clientの検査に失敗しました。task api-gen で再生成し、差分をコミットしてください。"

          # frontend にステージ済み変更があるとき、作業ツリーを書き換えずformat、lint、型を検査する。
          # desc だけの変更でも重い fe-check が走るため、Taskfile.yml は glob に入れない。
          # Taskfile の誤りは Frontend CI の fe-verify が検出する。
          - name: frontend-check
            glob:
              - "frontend/**"
            run: |
              echo "{staged_files}" >/dev/null
              task fe-check
            fail_text: "Frontendの静的検査に失敗しました。task fe-checkで再実行してください。"

    # ステージ済みの Dockerfile をベストプラクティス検査（hadolint）
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: hadolint
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.Dockerfile"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため hadolint をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -i -v "$PWD":/repo -w /repo \
          hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
          hadolint {staged_files}

    # ステージ済みの Dockerfile を Docker 公式チェック（BuildKit のベストプラクティス）
    # ビルドはせず --check のみ。docker が無い環境ではスキップ。
    - name: docker-build-check
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.Dockerfile"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため docker build --check をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        for dockerfile in {staged_files}; do
          echo "checking: $dockerfile"
          docker build --check -f "$dockerfile" "$(dirname "$dockerfile")" || exit 1
        done

    # ステージ済みの Compose ファイルの構文・参照・変数展開を検証
    # docker が無い環境ではスキップ。
    - name: compose-config
      glob:
        - "**/compose.{yml,yaml}"
        - "**/compose-test.{yml,yaml}"
        - "**/docker-compose.{yml,yaml}"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため docker compose config をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        # compose-test.yml の env_file が参照する .env.test は Git 除外のため、無ければ .env.test.example からコピーする。
        [ -f .env.test ] || cp .env.test.example .env.test
        for composefile in {staged_files}; do
          echo "validating: $composefile"
          docker compose --env-file .env.example -f "$composefile" config --quiet || exit 1
        done

    # ステージ済みの Markdown を Lint（markdownlint-cli2）
    # 除外設定は .markdownlint-cli2.yaml の ignores に従う。
    - name: markdownlint
      glob: "*.md"
      run: npx --yes markdownlint-cli2 {staged_files}

    # docs、steering、Taskfile、README、adr-lint、ruleset、workflow にステージ済み変更があるとき、OKF v0.2 バンドルの適合、
    # 内部リンク、steering → docs の境界、ADR の整合、ruleset の必須チェックと workflow の名前の一致、Taskfile と利用文書の同期候補を検証（task okf-check）。
    # iwe が無い環境は OKF 部分をタスク側でスキップ（最終担保は CI の okf-validate に任せる）。
    - name: okf-check
      glob:
        - "docs/*.md"
        - "docs/**/*.md"
        - "docs/.iwe/**"
        - ".kiro/steering/**"
        - "Taskfile.yml"
        - "README.md"
        - "tooling/adr-lint/**"
        - ".github/rulesets/**"
        - "tooling/ruleset-check/**"
        - ".github/workflows/**"
      run: |
        echo "{staged_files}" >/dev/null
        task okf-check
      fail_text: "OKF バンドルの検証に失敗しました。task okf-check で再実行してください。"

    # スキルの実体、.kiro 以下（Kiro 用リンク、kiro/install.sh が入れたファイル）、lock、検査にステージ済み変更があるとき、記録との整合を検証（task skills-check）。
    - name: skills-check
      glob:
        - ".agents/skills/**"
        - ".kiro/**"
        - "skills-lock.json"
        - "tooling/skills-check/**"
      run: |
        echo "{staged_files}" >/dev/null
        task skills-check
      fail_text: "スキルの整合の検証に失敗しました。task skills-check で再実行してください。"

    # Taskfile、フック、ワークフロー、その検査にステージ済み変更があるときに検証（task lint-taskfile）。
    - name: lint-taskfile
      glob:
        - "Taskfile.yml"
        - "lefthook.yml"
        - ".github/workflows/*.{yml,yaml}"
        - "tooling/taskfile-cleanup/**"
        - "tooling/task-calls/**"
      run: |
        echo "{staged_files}" >/dev/null
        task lint-taskfile
      fail_text: "Taskfileの検証に失敗しました。task lint-taskfile で再実行してください。"

# すべての job を順番に実行し、失敗した時点で止める。
# 並列に走らせると、be-lint、be-test、frontend-test-build の Gradle と Vitest が CPU を取り合い、
# ArchUnit の読み込みや時間待ちのテストが遅くなり、外れる。軽い検査を先に置き、失敗を早く返す。
# backend のイメージは Docker CI（hadolint.yml）の backend-image が PR ごとに実ビルドする。
pre-push:
  piped: true
  jobs:
    # push 前に、判断が絡む変更へ ADR が伴うかを確認（ナッジ）
    # 既定は非ブロッキング（気づかせるだけ）。ADR_STRICT=1 でブロック、ADR_ACK=1 で抑制。
    # ローカルと同じ判定を task adr-check に集約している。
    - name: adr-check
      run: task adr-check

    # push 前に現在のブランチから辿れる履歴をシークレットスキャン（Betterleaks）
    - name: betterleaks-history-scan
      run: task scan-secrets-all

    # frontend に変更があるpushのとき、テストと本番ビルドを実行する。
    # frontend-check と同じく Taskfile.yml は glob に入れない。
    # CI の fe-verify は FE_TEST_ARGS を渡さないため、この引数を足した経路の誤りは検出しない。
    - name: frontend-test-build
      # ブランチが main から変えたファイル。run の {files} で参照し、glob で絞る。
      # 組み込みの {push_files} は @{push} か origin/HEAD との差分を使い、rebase 後や新しいブランチでは
      # 分岐後に main へ入った変更も含むため、触っていない backend の検査まで走る。
      # origin/main が無く merge-base を取れないときは、安全側に倒して全ファイルを対象にする。
      # 以降の job は同じ値を *push-files で参照する。
      files: &push-files >-
        git diff --name-only origin/main...HEAD 2>/dev/null ||
        (echo "origin/main との merge-base を取れないため、全ファイルを pre-push の検査の対象にします。" >&2 && git ls-files)
      glob:
        - "frontend/**"
      run: |
        echo "{files}" >/dev/null
        task fe-test-build FE_TEST_ARGS="--reporter=dot --coverage.reporter=json-summary"
      fail_text: "Frontendのテストまたはビルドに失敗しました。task fe-test-buildで再実行してください。"

    # backend に変更がある push のときだけ Lint（Spotless + PMD + SpotBugs）
    # Gradle は重いため pre-commit ではなく pre-push で実行する。
    - name: be-lint
      # lefthook の既定の照合では ** が 1 階層以上にしか一致しないため、backend 直下の build.gradle と
      # settings.gradle を別のパターンで拾う。
      glob:
        - "backend/*.gradle"
        - "backend/**/*.{java,gradle}"
      files: *push-files
      run: |
        echo "{files}" >/dev/null
        cd backend && ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

    # backend に変更がある push のときだけテスト実行（カバレッジ検証含む）
    # 開発用 .env / 開発 DB には触れず、task test で実行する。rollback の検証は compose-test の PostgreSQL、
    # テストはテストの JVM ごとに起動するコンテナを使う（ADR-085）。
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: be-test
      # lefthook の既定の照合では ** が 1 階層以上にしか一致しないため、backend 直下の build.gradle と
      # settings.gradle を別のパターンで拾う。
      glob:
        - "backend/*.gradle"
        - "backend/**/*.{java,gradle}"
      files: *push-files
      run: |
        echo "{files}" >/dev/null
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため task test をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        task test

    # GitHub Actions ワークフローに変更がある push のときだけ Lint（actionlint）
    # glob を効かせるため run 内で {files} を参照する。
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      files: *push-files
      run: |
        echo "{files}" >/dev/null
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため actionlint をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -v "$PWD":/repo -w /repo \
          rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
          -color

    # GitHub Actions ワークフローに変更がある push のときだけセキュリティ解析（zizmor）
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      files: *push-files
      run: |
        echo "{files}" >/dev/null
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため zizmor をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -v "$PWD":/repo -w /repo \
          ghcr.io/zizmorcore/zizmor:latest .github/workflows/
