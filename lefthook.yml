# ---------------------------------------------------------------------------
# 実運用設定
# ---------------------------------------------------------------------------

# コミットメッセージを Conventional Commits 規約で検証（commitlint）
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    # ステージ済みの変更をシークレットスキャン（Betterleaks）
    # betterleaks が PATH に無い場合は go install 先 ($HOME/go/bin) にフォールバック
    - name: betterleaks-secret-scan
      run: |
        export PATH="$PATH:$HOME/go/bin"
        betterleaks git --staged --no-banner --redact

    # ステージ済みの Dockerfile をベストプラクティス検査（hadolint）
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: hadolint
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.Dockerfile"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため hadolint をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -i -v "$PWD":/repo -w /repo \
          hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
          hadolint {staged_files}

    # ステージ済みの Dockerfile を Docker 公式チェック（BuildKit のベストプラクティス）
    # ビルドはせず --check のみ。docker が無い環境ではスキップ。
    - name: docker-build-check
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.Dockerfile"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため docker build --check をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        for dockerfile in {staged_files}; do
          echo "checking: $dockerfile"
          docker build --check -f "$dockerfile" "$(dirname "$dockerfile")" || exit 1
        done

    # ステージ済みの Compose ファイルの構文・参照・変数展開を検証
    # docker が無い環境ではスキップ。
    - name: compose-config
      glob:
        - "**/compose.{yml,yaml}"
        - "**/docker-compose.{yml,yaml}"
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため docker compose config をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        for composefile in {staged_files}; do
          echo "validating: $composefile"
          docker compose -f "$composefile" config --quiet || exit 1
        done

    # ステージ済みの Markdown を Lint（markdownlint-cli2）
    # 除外設定は .markdownlint-cli2.yaml の ignores に従う。
    - name: markdownlint
      glob: "*.md"
      run: npx --yes markdownlint-cli2 {staged_files}

pre-push:
  parallel: true
  jobs:
    # push 前にリポジトリ全体（履歴含む）をシークレットスキャン（Betterleaks）
    # betterleaks が PATH に無い場合は go install 先 ($HOME/go/bin) にフォールバック
    - name: betterleaks-full-scan
      run: |
        export PATH="$PATH:$HOME/go/bin"
        betterleaks git . --no-banner --redact --git-workers=16

    # backend に変更がある push のときだけ Lint（Spotless + PMD + SpotBugs）
    # Gradle は重いため pre-commit ではなく pre-push で実行する。
    - name: be-lint
      glob: "backend/**/*.{java,gradle}"
      run: |
        echo "{push_files}" >/dev/null
        cd backend && ./gradlew spotlessCheck pmdMain spotbugsMain

    # backend に変更がある push のときだけテスト実行（カバレッジ検証含む）
    - name: be-test
      glob: "backend/**/*.{java,gradle}"
      run: |
        echo "{push_files}" >/dev/null
        cd backend && ./gradlew test

    # GitHub Actions ワークフローに変更がある push のときだけ Lint（actionlint）
    # glob を効かせるため run 内で {push_files} を参照する。
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        echo "{push_files}" >/dev/null
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため actionlint をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -v "$PWD":/repo -w /repo \
          rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
          -color

    # GitHub Actions ワークフローに変更がある push のときだけセキュリティ解析（zizmor）
    # docker が無い環境ではスキップ（最終担保は CI に任せる）。
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        echo "{push_files}" >/dev/null
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker が無いため zizmor をスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        docker run --rm -v "$PWD":/repo -w /repo \
          ghcr.io/zizmorcore/zizmor:latest .github/workflows/
