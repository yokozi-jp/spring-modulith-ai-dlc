# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # 新しいリリースを取り込むまで最低 7 日待つ（リリース直後の不正パッケージ対策）
    cooldown:
      default-days: 7
    ignore:
      # opentelemetry-logback-appender-1.0 は Spring Boot が管理する OpenTelemetry
      # コア（現状 1.62.0）と歩調を合わせる必要がある。Boot の管理コアより先行して
      # 上げると、instrumentation-api が新しい SDK 前提のままコアが 1.62.0 に固定され、
      # ランタイムで API 不整合（NoSuchMethodError / NoClassDefFoundError）を起こす。
      # そのため Dependabot の自動更新は無視し、Boot の管理 OTel コアが上がったときに
      # 対応するバージョンへ手動で同時に上げる。
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # 新しいリリースを取り込むまで最低 7 日待つ（リリース直後の不正パッケージ対策）
    cooldown:
      default-days: 7

  # GitHub Actions のワークフローで使うアクションのバージョン更新。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 新しいリリースを取り込むまで最低 7 日待つ（リリース直後の不正パッケージ対策）
    cooldown:
      default-days: 7

  # Dockerfile の FROM イメージのバージョン更新（backend/Dockerfile）。
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # 新しいリリースを取り込むまで最低 7 日待つ（リリース直後の不正パッケージ対策）
    cooldown:
      default-days: 7
    ignore:
      # Java は LTS の Corretto 25 に固定する。26 以降は非 LTS のため、
      # メジャー更新（25 → 26 等）は無視し、25 系のマイナー/パッチ更新のみ受け取る。
      # 次の LTS へ上げるときはこの ignore を外して意図的に対応する。
      - dependency-name: "amazoncorretto"
        update-types: ["version-update:semver-major"]

  # ローカル開発用 Compose のイメージを更新する。
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # 新しいリリースを取り込むまで最低 7 日待つ（リリース直後の不正パッケージ対策）
    cooldown:
      default-days: 7
