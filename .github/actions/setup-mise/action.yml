name: Set up mise tools
description: mise.toml の道具を mise.lock の版と checksum で入れ、mise の shims を PATH に通す（ADR-090）。
inputs:
  tools:
    description: mise install に渡す道具。ジョブが使う道具だけを入れる。
    default: task
runs:
  using: composite
  steps:
    # 後の step の shims も、lock に無い版を入れずに止める。
    - name: Refuse versions missing from mise.lock
      shell: bash
      run: echo "MISE_LOCKED=1" >> "$GITHUB_ENV"
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        version: 2026.11.9
        install_args: ${{ inputs.tools }}
        # 復元したキャッシュは mise.lock と照合されないため使わない。
        cache: false
