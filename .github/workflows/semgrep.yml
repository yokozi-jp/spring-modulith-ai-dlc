name: Static Analysis (Semgrep) 🔎

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SARIF を GitHub Code Scanning にアップロードするため security-events: write が必要。
permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Run Semgrep 🔎
    runs-on: ubuntu-latest
    # メトリクス送信を無効化し、外部への通信を行わない。
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Semgrep OSS（コミュニティエディション）をバージョン固定で導入する。
      - name: Install Semgrep
        run: pip install semgrep==1.175.0

      # Repository固有の禁止規則は検出時にCIを失敗させる。
      - name: Enforce repository security rules
        run: |
          semgrep --test --config .semgrep/rules .semgrep/tests
          semgrep scan \
            --config .semgrep/rules \
            --error \
            --metrics off \
            --disable-version-check

      # コミュニティ規則はSARIFへ出力し、結果をSecurityタブで確認する。
      # .kiro/ と aidlc/ はAI-DLCフレームワークの領域のため対象外にする。
      - name: Run semgrep scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/typescript \
            --config p/dockerfile \
            --config p/secrets \
            --exclude .kiro \
            --exclude aidlc \
            --exclude .semgrep/tests \
            --sarif \
            --output semgrep.sarif \
            --metrics off \
            --disable-version-check

      # 検出結果を GitHub Code Scanning にアップロードする。
      # スキャンが失敗しても、生成済みの SARIF は必ずアップロードする。
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
