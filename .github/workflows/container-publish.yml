name: Publish signed backend image 📦

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "ECRへ公開するため publish と入力"
        required: true
        type: string

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build, sign, and attest backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate publish request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "publish"
          test -n "$AWS_REGION"
          test -n "$AWS_PUBLISH_ROLE_ARN"
          test -n "$ECR_REPOSITORY"
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "公開を許可していないrefです: $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          role-session-name: gha-container-publish-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build and push image once
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          sbom: true
          provenance: false

      - name: Generate signed SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # 個人所有リポジトリでは linked artifact の storage record API を利用できない。
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image digest with GitHub OIDC
        env:
          IMAGE_NAME: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Verify signature and provenance before publishing result
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/container-publish.yml@$GITHUB_REF"
          cosign verify \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container-publish.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --bundle-from-oci

      - name: Write publication summary
        env:
          IMAGE_NAME: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Signed backend image"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Source ref: $GITHUB_REF"
            echo "- Image: $IMAGE_NAME@$IMAGE_DIGEST"
            echo "- Signature: Sigstore keyless"
            echo "- Provenance: SLSA v1 artifact attestation"
          } >> "$GITHUB_STEP_SUMMARY"
