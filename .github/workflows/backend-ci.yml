name: Backend CI (Gradle) ☕

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - ".env.test"
      - "Taskfile.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - ".env.test"
      - "Taskfile.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Spotless + PMD + SpotBugs) ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless の ratchetFrom 'origin/main' が差分計算に origin/main を必要とするため、
          # 全履歴・全ブランチを取得してリモート追跡参照 origin/main を解決可能にする。
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # OSS（MIT）のキャッシュ実装を明示的に使う（Enhanced Caching の商用条項を避ける）。
          cache-provider: basic

      - name: Run Spotless, PMD, SpotBugs
        working-directory: backend
        run: ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

  test:
    name: Test & Coverage ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # ローカルの task test と同じ隔離スタック（PostgreSQL 5433 / Redis 6380）を使う。
      # docker/compose-test.yml と .env.test を共用し、ローカルと CI の乖離を防ぐ。
      - name: Start test dependencies
        run: docker compose -f docker/compose-test.yml up -d --wait

      - name: Verify migrations, rollback, reapply, and schema tag
        run: task be-verify-migrations

      - name: Migrate test database and run tests
        run: task be-test

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml down --volumes --remove-orphans

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      # ArchitectureMetricsReportTest が生成する package by feature 単位の
      # アーキテクチャ指標レポート。合否判定ではなく推移の可視化に使う。
      - name: Upload architecture metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-metrics
          path: backend/build/reports/architecture-metrics/
          retention-days: 14


  mutation:
    if: github.event_name == 'workflow_dispatch'
    name: Mutation Testing ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run mutation tests
        run: task mutation-test

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 14
