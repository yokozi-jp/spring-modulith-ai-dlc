name: Backend CI (Gradle) ☕

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "openapi/**"
      - ".spectral.yaml"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - ".env.test"
      - "Taskfile.yml"
      - ".github/workflows/backend-ci.yml"
  # PR ではパスフィルタで workflow 自体をスキップしない。スキップすると
  # check run が生成されず、必須チェックが "Expected" のまま PR が永久に
  # マージ不能になる。代わりに全 PR で起動し、下の changes ジョブで判定して
  # 重いジョブを条件付き実行する（skipped は必須チェックで success 扱い）。
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # backend 関連パスが変わったかを判定する。push（main）では常に true とし、
  # PR では base ブランチとの diff で判定する。重いジョブはこの出力に依存する。
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 0 で取得済みの base と比較する。差分取得に失敗した場合は
          # CI を実行する側へ倒し、検出失敗をテストのスキップとして扱わない。
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したためバックエンド CI を実行します。" >&2
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # backend-ci.yml の push パスフィルタと同じ集合で判定する。
          if grep -Eq '^(backend/|openapi/|docker/initdb/|\.spectral\.yaml$|docker/compose-test\.yml$|\.env\.test$|Taskfile\.yml$|\.github/workflows/backend-ci\.yml$)' \
            <<< "$changed_files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (Spotless + PMD + SpotBugs) ☕
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless の ratchetFrom 'origin/main' が差分計算に origin/main を必要とするため、
          # 全履歴・全ブランチを取得してリモート追跡参照 origin/main を解決可能にする。
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # OSS（MIT）のキャッシュ実装を明示的に使う（Enhanced Caching の商用条項を避ける）。
          cache-provider: basic

      - name: Run Spotless, PMD, SpotBugs
        working-directory: backend
        run: ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

  test:
    name: Test & Coverage ☕
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # ローカルの task test と同じ隔離スタック（PostgreSQL 5433 / Redis 6380）を使う。
      # docker/compose-test.yml と .env.test を共用し、ローカルと CI の乖離を防ぐ。
      - name: Start test dependencies
        run: docker compose -f docker/compose-test.yml up -d --wait

      - name: Verify migrations, rollback, reapply, and schema tag
        run: task be-verify-migrations

      - name: Migrate test database and run tests
        run: task be-test

      - name: Generate, lint, and check OpenAPI contract
        run: task be-openapi-check

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml down --volumes --remove-orphans

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      # ArchitectureMetricsReportTest が生成する package by feature 単位の
      # アーキテクチャ指標レポート。合否判定ではなく推移の可視化に使う。
      - name: Upload architecture metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-metrics
          path: backend/build/reports/architecture-metrics/
          retention-days: 14


  mutation:
    if: github.event_name == 'workflow_dispatch'
    name: Mutation Testing ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run mutation tests
        run: task mutation-test

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 14
