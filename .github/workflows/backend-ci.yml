name: Backend CI (Gradle) ☕

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "openapi/**"
      - ".spectral.yaml"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - "docker/wiremock/**"
      - ".env.test.example"
      - "Taskfile.yml"
      - ".github/workflows/backend-ci.yml"
  # PR ではパスフィルタで workflow 自体をスキップしない。スキップすると
  # check run が生成されず、必須チェックが "Expected" のまま PR が永久に
  # マージ不能になる。代わりに全 PR で起動し、下の changes ジョブで判定して
  # 重いジョブを条件付き実行する（skipped は必須チェックで success 扱い）。
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # backend 関連パスが変わったかを判定する。push（main）では常に true とし、
  # PR では base ブランチとの diff で判定する。重いジョブはこの出力に依存する。
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 0 で取得済みの base と比較する。差分取得に失敗した場合は
          # CI を実行する側へ倒し、検出失敗をテストのスキップとして扱わない。
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したためバックエンド CI を実行します。" >&2
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # backend-ci.yml の push パスフィルタと同じ集合で判定する。
          if grep -Eq '^(backend/|openapi/|docker/initdb/|docker/wiremock/|\.spectral\.yaml$|docker/compose-test\.yml$|\.env\.test\.example$|Taskfile\.yml$|\.github/workflows/backend-ci\.yml$)' \
            <<< "$changed_files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (Spotless + PMD + SpotBugs) ☕
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless の ratchetFrom 'origin/main' が差分計算に origin/main を必要とするため、
          # 全履歴・全ブランチを取得してリモート追跡参照 origin/main を解決可能にする。
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Gradle User Home は setup-gradle では扱わず、直下の actions/cache で復元と保存をする。
          # MIT の範囲に収め、Enhanced Caching（gradle-actions-caching）は使わない。
          # basic は restore-keys を持たず、ビルドファイルの変更で全依存を取り直すため外す（ADR-063）。
          cache-provider: external

      # key の hash が変わっても、同じ lint ジョブの直近の main の cache を restore-keys で復元する。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lint-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-lint-

      - name: Run Spotless, PMD, SpotBugs
        working-directory: backend
        run: ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

      # PR は cache を書かない。
      # 既存の key は上書きされないため、main の完全一致しなかった run だけが保存する。
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  test:
    name: Test & Coverage ☕
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # cache の扱いは lint ジョブと同じ（ADR-063）。
          cache-provider: external

      # lint ジョブと同じ方式で、test の直近の main の cache を復元する。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # ローカルの task test と同じ隔離スタック（PostgreSQL 5433 / Redis 6380）を使う。
      # docker/compose-test.yml と .env.test.example を共用し、ローカルと CI の乖離を防ぐ。
      # .env.test は Git 除外のため、.env.test.example からコピーして作る。
      - name: Create test env file
        run: cp .env.test.example .env.test

      - name: Start test dependencies
        run: docker compose -f docker/compose-test.yml up -d --wait

      - name: Verify migrations, rollback, reapply, and schema tag
        run: task be-verify-migrations

      - name: Migrate test database and run tests
        run: task be-test

      - name: Lint OpenAPI contract and check drift
        run: task be-openapi-check

      # 保存の条件は lint ジョブと同じ（ADR-063）。
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml down --volumes --remove-orphans

      # task e2e と共有する Compose project のコンテナと volume が、後片付けの後に残っていないことを確かめる。
      - name: Check no compose-test leftovers
        if: always()
        run: task test-deps-leftover-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      # ArchitectureMetricsReportTest が生成する package by feature 単位の
      # アーキテクチャ指標レポート。合否判定ではなく推移の可視化に使う。
      - name: Upload architecture metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-metrics
          path: backend/build/reports/architecture-metrics/
          retention-days: 14


  mutation:
    if: github.event_name == 'workflow_dispatch'
    name: Mutation Testing ☕
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # cache の扱いは lint ジョブと同じ（ADR-063）。
          cache-provider: external

      # mutation は workflow_dispatch だけで動くため、test ジョブの cache を読み取り専用で復元し、保存はしない。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run mutation tests
        run: task mutation-test

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 14
