name: Backend CI (Gradle) ☕

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "openapi/**"
      - ".spectral.yaml"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - "docker/wiremock/**"
      - ".env.test.example"
      - "Taskfile.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-mise/**"
      - "tooling/session-sql-lint/**"
      - ".github/workflows/backend-ci.yml"
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # backend 関連パスが変わったかを判定する。push（main）では常に true とし、
  # PR では base ブランチとの diff で判定する。重いジョブはこの出力に依存する。
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash tooling/ci-changes/changed.sh \
            'backend/**' \
            'openapi/**' \
            'docker/initdb/**' \
            'docker/wiremock/**' \
            '.spectral.yaml' \
            'docker/compose-test.yml' \
            '.env.test.example' \
            'Taskfile.yml' \
            'mise.toml' \
            'mise.lock' \
            '.github/actions/setup-mise/**' \
            'tooling/session-sql-lint/**' \
            '.github/workflows/backend-ci.yml'

  lint:
    name: Lint (Spotless + PMD + SpotBugs) ☕
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless の ratchetFrom 'origin/main' が差分計算に origin/main を必要とするため、
          # 全履歴・全ブランチを取得してリモート追跡参照 origin/main を解決可能にする。
          fetch-depth: 0

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          tools: task java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Gradle User Home は setup-gradle では扱わず、直下の actions/cache で復元と保存をする。
          # MIT の範囲に収め、Enhanced Caching（gradle-actions-caching）は使わない。
          # basic は restore-keys を持たず、ビルドファイルの変更で全依存を取り直すため外す（ADR-063）。
          cache-provider: external

      # key の hash が変わっても、同じ lint ジョブの直近の main の cache を restore-keys で復元する。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lint-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-lint-

      - name: Run Spotless, PMD, SpotBugs
        working-directory: backend
        run: ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

      # PgBouncer のトランザクションモードや RDS Proxy の後ろで壊れるセッションの SQL を検出する。
      - name: Check session-level SQL
        run: task lint-session-sql

      # 削除した識別子が backend/src に残っていないかを検査する。okf-validate は backend/src の変更で起動しない。
      - name: Check removed names
        run: bash tooling/removed-names/check.sh

      # PR は cache を書かない。
      # 既存の key は上書きされないため、main の完全一致しなかった run だけが保存する。
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  test:
    name: Test & Coverage ☕
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          tools: task java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # cache の扱いは lint ジョブと同じ（ADR-063）。
          cache-provider: external

      # lint ジョブと同じ方式で、test の直近の main の cache を復元する。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      # rollback の検証はローカルの task test と同じく compose の PostgreSQL 5433 を使う。
      # テストは fork ごとに Testcontainers の PostgreSQL、Redis と WireMock を起動する（ADR-085）。
      # .env.test は Git 除外のため、.env.test.example からコピーして作る。
      - name: Create test env file
        run: cp .env.test.example .env.test

      - name: Start PostgreSQL for migration verification
        run: docker compose -f docker/compose-test.yml up -d --wait postgres

      - name: Verify migrations, rollback, reapply, and schema tag
        run: task be-verify-migrations

      - name: Run tests and verify coverage
        run: task be-test

      - name: Lint OpenAPI contract and check drift
        run: task be-openapi-check

      # 保存の条件は lint ジョブと同じ（ADR-063）。
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml down --volumes --remove-orphans

      # task e2e と共有する Compose project のコンテナと volume が、後片付けの後に残っていないことを確かめる。
      - name: Check no compose-test leftovers
        if: always()
        run: task test-deps-leftover-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      # ArchitectureMetricsReportTest が生成する package by feature 単位の
      # アーキテクチャ指標レポート。合否判定ではなく推移の可視化に使う。
      - name: Upload architecture metrics report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-metrics
          path: backend/build/reports/architecture-metrics/
          retention-days: 14
