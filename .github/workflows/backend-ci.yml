name: Backend CI (Gradle) ☕

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - ".env.test"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - ".env.test"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Spotless + PMD + SpotBugs) ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless の ratchetFrom 'origin/main' が差分計算に origin/main を必要とするため、
          # 全履歴・全ブランチを取得してリモート追跡参照 origin/main を解決可能にする。
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # OSS（MIT）のキャッシュ実装を明示的に使う（Enhanced Caching の商用条項を避ける）。
          cache-provider: basic

      - name: Run Spotless, PMD, SpotBugs
        working-directory: backend
        run: ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

  test:
    name: Test & Coverage ☕
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # ローカルの make test と同じ隔離スタック（PostgreSQL 5433 / Redis 6380）を使う。
      # docker/compose-test.yml と .env.test を共用し、ローカルと CI の乖離を防ぐ。
      - name: Start test dependencies
        run: docker compose -f docker/compose-test.yml up -d --wait

      - name: Run tests
        working-directory: backend
        env:
          # application.yaml は全プレースホルダにデフォルトを持たないため、
          # .env.test（非機密ダミー）を Spring 設定として読み込ませる。
          SPRING_CONFIG_IMPORT: "optional:file:../.env.test[.properties]"
        run: ./gradlew test

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml down --volumes --remove-orphans

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      # ArchitectureMetricsReportTest が生成する package by feature 単位の
      # アーキテクチャ指標レポート。合否判定ではなく推移の可視化に使う。
      - name: Upload architecture metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-metrics
          path: backend/build/reports/architecture-metrics/
          retention-days: 14
