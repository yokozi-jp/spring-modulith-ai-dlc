name: Check OpenTelemetry Collector config 🔭

on:
  push:
    branches: ["main"]
    paths:
      - "docker/otel-collector/**"
      - "docker/compose.yml"
      - ".env.example"
      - "Taskfile.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-mise/**"
      - ".github/workflows/otel-collector.yml"
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: otel-collector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect OpenTelemetry Collector changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash tooling/ci-changes/changed.sh \
            'docker/otel-collector/**' \
            'docker/compose.yml' \
            '.env.example' \
            'Taskfile.yml' \
            'mise.toml' \
            'mise.lock' \
            '.github/actions/setup-mise/**' \
            '.github/workflows/otel-collector.yml'

  otel-collector-check:
    name: Run task otel-collector-check 🔭
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise

      # 禁止値を含む OTLP データを Collector に流し、出口に残らないことを確かめる。
      - name: Check Collector config
        run: task otel-collector-check
