name: Check OpenTelemetry Collector config 🔭

on:
  push:
    branches: ["main"]
    paths:
      - "docker/otel-collector/**"
      - "docker/compose.yml"
      - "Taskfile.yml"
      - ".github/workflows/otel-collector.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "docker/otel-collector/**"
      - "docker/compose.yml"
      - "Taskfile.yml"
      - ".github/workflows/otel-collector.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  otel-collector-check:
    name: Run task otel-collector-check 🔭
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # 禁止値を含む OTLP データを Collector に流し、出口に残らないことを確かめる。
      - name: Check Collector config
        run: task otel-collector-check
