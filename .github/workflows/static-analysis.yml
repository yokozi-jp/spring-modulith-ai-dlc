name: Static Analysis 🔎

on:
  push:
    branches: ["main"]
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep 🔎
    runs-on: ubuntu-latest
    # SARIF を GitHub Code Scanning にアップロードするため、このjobだけに付与する。
    permissions:
      contents: read
      security-events: write
    # メトリクス送信を無効化し、外部への通信を行わない。
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Semgrep OSS（コミュニティエディション）をバージョン固定で導入する。
      - name: Install Semgrep
        run: pip install semgrep==1.175.0

      # SARIF を出力する。検出があってもここでは失敗させず、
      # 結果は Code Scanning（Security タブ）で確認する。
      # .kiro/ は Kiro 設定・ツールの領域のため対象外にする。
      - name: Run semgrep scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/typescript \
            --config p/dockerfile \
            --config p/secrets \
            --exclude .kiro \
            --sarif \
            --output semgrep.sarif \
            --metrics off \
            --disable-version-check

      # Semgrep は nosemgrep で抑止した検出も suppressions 付きで SARIF に残すが、
      # Code Scanning は suppressions を読まずアラートを開いたままにするため、送る前に除く。
      # 抑止の妥当性は nosemgrep コメントの理由をコードレビューで確かめる。
      - name: Drop suppressed findings from SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' \
            semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif

      # 検出結果を GitHub Code Scanning にアップロードする。
      # スキャンが失敗しても、生成済みの SARIF は必ずアップロードする。
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          # 呼ばれると自動の category が ci.yml:semgrep になり、main の構成と別になる。main の既存の category に固定する（ADR-087）。
          category: .github/workflows/static-analysis.yml:semgrep

  duplicates:
    name: Check duplicate code, lefthook globs and lefthook install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check duplicate code
        run: task lint-duplicates

      - name: Check lefthook globs
        run: task lint-lefthook

      # npm の prepare（prepare.mjs）が main の worktree の lefthook で hook を入れることを、一時の git リポジトリで検査する。
      - name: Test lefthook install from worktrees
        run: task lefthook-install-test

  taskfile:
    name: Check Taskfile and scratch-git sourcing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise

      - name: Check Taskfile
        run: task lint-taskfile

      - name: Check scratch-git sourcing in self-tests
        run: task lint-scratch-git

  # 振る舞いのテストだが、常に動く workflow に置き、Pull Request ごとに必ず check run を出す（ADR-087）。
  agent-git-test:
    name: Run task agent-git-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise

      # agent-commit、agent-push、agent-wait の本体を、フックを止めておける一時の git リポジトリで検査する。
      - name: Test agent git tasks
        run: task agent-git-test
