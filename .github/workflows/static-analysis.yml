name: Static Analysis 🔎

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep 🔎
    runs-on: ubuntu-latest
    # SARIF を GitHub Code Scanning にアップロードするため、このjobだけに付与する。
    permissions:
      contents: read
      security-events: write
    # メトリクス送信を無効化し、外部への通信を行わない。
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Semgrep OSS（コミュニティエディション）をバージョン固定で導入する。
      - name: Install Semgrep
        run: pip install semgrep==1.175.0

      # SARIF を出力する。検出があってもここでは失敗させず、
      # 結果は Code Scanning（Security タブ）で確認する。
      # .kiro/ と aidlc/ は AI-DLC フレームワークの領域のため対象外にする。
      - name: Run semgrep scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/typescript \
            --config p/dockerfile \
            --config p/secrets \
            --exclude .kiro \
            --exclude aidlc \
            --sarif \
            --output semgrep.sarif \
            --metrics off \
            --disable-version-check

      # 検出結果を GitHub Code Scanning にアップロードする。
      # スキャンが失敗しても、生成済みの SARIF は必ずアップロードする。
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif

  duplicates:
    name: Check duplicate code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check duplicate code
        run: task lint-duplicates
