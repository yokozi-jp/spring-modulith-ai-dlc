name: Dependabot auto-merge

# Dependabot の patch/minor 更新に auto-merge を設定する。必須チェックが
# すべて通った時点で GitHub が squash マージする。major はグループ外の個別 PR
# として出るため、ここでは auto-merge を付けず人が判断する（ADR-021）。

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge for patch/minor
    # Dependabot が作成した PR に限定する。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # squash マージのため
      pull-requests: write # auto-merge の有効化のため
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # patch と minor だけを許可リストで auto-merge の対象にする。
      # 判定不能なバージョンやダイジェストのみの更新は人の判断に回す。
      - name: Enable auto-merge for patch/minor
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "$PR_URL"
