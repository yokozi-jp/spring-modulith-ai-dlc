name: CI

# pull_request で動く検査を reusable workflow として呼び、集約ジョブ gate（check 名 CI gate）が結果を 1 つにまとめる。
# ruleset の必須チェックは CI gate を中心にする。理由と移行の手順は docs/adr/ADR-087 にある。
# ここに足したジョブは gate の needs にも足す。足し忘れは check-gate が検出する。
on:
  pull_request:
    branches: ["**"]

# 呼ばれる workflow の group には、ファイル名の stem を付ける。付けないと、呼ばれた workflow どうしの group が重なって取り消し合う（ADR-087）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# uses は ./ の形で書く。zizmor の self-repository は $/ を勧めるが、actionlint（1.7.12）がまだ受け付けない（rhysd/actionlint#732）。
jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read

  docker:
    name: Docker
    uses: ./.github/workflows/hadolint.yml
    permissions:
      contents: read

  actionlint:
    name: Actionlint
    uses: ./.github/workflows/actionlint.yml
    permissions:
      contents: read

  betterleaks:
    name: Betterleaks
    uses: ./.github/workflows/betterleaks.yml
    permissions:
      contents: read

  compose:
    name: Compose
    uses: ./.github/workflows/compose-config.yml
    permissions:
      contents: read

  dast:
    name: DAST
    uses: ./.github/workflows/dast.yml
    permissions:
      contents: read
      security-events: write

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml
    permissions:
      contents: read

  markdownlint:
    name: Markdownlint
    uses: ./.github/workflows/markdownlint.yml
    permissions:
      contents: read

  okf:
    name: OKF
    uses: ./.github/workflows/okf-validate.yml
    permissions:
      contents: read

  otel:
    name: OTel Collector
    uses: ./.github/workflows/otel-collector.yml
    permissions:
      contents: read

  skills:
    name: Skills
    uses: ./.github/workflows/skills-check.yml
    permissions:
      contents: read

  static-analysis:
    name: Static analysis
    uses: ./.github/workflows/static-analysis.yml
    permissions:
      contents: read
      security-events: write

  trivy:
    name: Trivy
    uses: ./.github/workflows/trivy.yml
    permissions:
      contents: read
      security-events: write

  zizmor:
    name: zizmor
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  check-gate:
    name: Check CI gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Check that CI gate covers every pull_request workflow
        run: task ci-gate-check

  gate:
    name: CI gate
    # always() を付けないと、needs のどれかが失敗や skip のときに gate 自体が skip され、GitHub は skip を成功として扱う。
    if: always()
    needs:
      - backend
      - docker
      - actionlint
      - betterleaks
      - compose
      - dast
      - frontend
      - markdownlint
      - okf
      - otel
      - skills
      - static-analysis
      - trivy
      - zizmor
      - check-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash tooling/ci-gate-check/gate.sh <<< "$NEEDS"
