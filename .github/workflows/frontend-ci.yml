name: Frontend CI (Vite+)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "openapi/**"
      - "Taskfile.yml"
      - ".github/workflows/frontend-ci.yml"
  # 必須チェックにしても対象外PRがExpectedのまま残らないよう、PRでは常に起動し、
  # changesジョブでFrontend検証の要否を判定する。
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したためFrontend CIを実行します。" >&2
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(frontend/|openapi/|Taskfile\.yml$|\.github/workflows/frontend-ci\.yml$)' \
            <<< "$changed_files"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.node-version"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-verify

      - name: Check route tree is up to date
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-route-tree-check

      - name: Check generated API client is up to date
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task api-client-check

      - name: Diagnose React
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-doctor

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
