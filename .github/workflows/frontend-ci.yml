name: Frontend CI (Vite+)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "openapi/**"
      - "Taskfile.yml"
      - ".github/workflows/frontend-ci.yml"
  # 必須チェックにしても対象外PRがExpectedのまま残らないよう、PRでは常に起動し、
  # changesジョブでFrontend検証の要否を判定する。
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したためFrontend CIを実行します。" >&2
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(frontend/|openapi/|Taskfile\.yml$|\.github/workflows/(frontend-ci|ci)\.yml$)' \
            <<< "$changed_files"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.node-version"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up mise tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          MISE_LOCKED: "1"
        with:
          version: 2026.11.9
          install_args: task
          cache: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-verify

      - name: Check route tree is up to date
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-route-tree-check

      - name: Check generated API client is up to date
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task api-client-check

      - name: Diagnose React
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task fe-doctor

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
