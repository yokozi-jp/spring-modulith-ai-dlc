name: DAST (OWASP ZAP) 🕷️

on:
  # 毎週月曜 03:17 UTC に active scan を実行する。リポジトリで初めての schedule（ADR-056）。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

# PR だけ実行中の run を取り消す。schedule の active scan を workflow_dispatch で止めないため（api-contract.yml と同じ）。
concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# SARIF を Code Scanning にアップロードする権限はジョブごとに付与する
# （ワークフロー全体に広く付与しない）。
permissions:
  contents: read

jobs:
  # DAST の対象が変わったかを判定する。PR 以外では常に true とし、
  # PR では base ブランチとの diff で判定する。
  changes:
    name: Detect DAST changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # docker/ は ZAP の plan と script（docker/zap/）と realm（docker/keycloak/）を含む。
        run: |
          bash tooling/ci-changes/changed.sh \
            'backend/**' \
            'frontend/**' \
            'docker/**' \
            '.env.test.example' \
            'Taskfile.yml' \
            '.github/workflows/dast.yml'

  passive:
    name: Run ZAP passive scan 🕷️
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.node-version"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Gradle User Home は setup-gradle では扱わず、直下の actions/cache で復元する（ADR-063）。
          # MIT の範囲に収め、Enhanced Caching（gradle-actions-caching）は使わない。
          cache-provider: external

      # DAST は push で動かないため、Backend CI の test ジョブの cache を読み取り専用で復元し、保存はしない。
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 検出ではタスクを失敗させない。失敗するのはスキャンが成立しない場合だけ（ADR-056）。
      - name: Run ZAP passive scan
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task scan-dast

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('build/dast/zap-passive.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/dast/zap-passive.sarif.json
          category: zap-passive

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-passive-report
          path: build/dast/
          if-no-files-found: warn
          retention-days: 14

  active:
    name: Run ZAP active scan 🕷️
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.node-version"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Gradle User Home は setup-gradle では扱わず、直下の actions/cache で復元する（ADR-063）。
          # MIT の範囲に収め、Enhanced Caching（gradle-actions-caching）は使わない。
          cache-provider: external

      # DAST は push で動かないため、Backend CI の test ジョブの cache を読み取り専用で復元し、保存はしない。
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 検出ではタスクを失敗させない。失敗するのはスキャンが成立しない場合だけ（ADR-056）。
      - name: Run ZAP active scan
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task scan-dast-active

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('build/dast/zap-active.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/dast/zap-active.sarif.json
          category: zap-active

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-active-report
          path: build/dast/
          if-no-files-found: warn
          retention-days: 14
