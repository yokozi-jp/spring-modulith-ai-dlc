# CodeQL を advanced setup（コミット済みワークフロー）で管理する（ADR-083）。
# default setup から移行し、Java の build-mode を明示する。
# このワークフローを有効にする前に、GitHub 側の Code scanning default setup を
# 無効化する。両方を残すと同じ言語の解析が二重になる。
name: CodeQL 🛡️

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  # default setup と同じ水準で、週次でも解析する。
  schedule:
    - cron: "31 4 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}) 🛡️
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # SARIF を Code Scanning にアップロードするため、このジョブだけに付与する。
      security-events: write
      contents: read
      # プライベートリポジトリで upload-sarif が workflow run 情報を読むのに必要。
      actions: read
      # Gradle が GitHub Packages の依存を解決する場合に備える。
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ビルド不要の言語はビルドレスで抽出する。
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Java は autobuild で Gradle をビルドして解析し、精度を上げる（ADR-083）。
          - language: java-kotlin
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java の autobuild は ~/.m2/toolchains.xml か runner の JDK 25 を使い、JAVA_HOME を見ないため、
      # mise の Java は入れない。どちらも Java 25 でコンパイルする。

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
