name: E2E tests 🎭

on:
  workflow_dispatch:
  # 必須チェックにしないため、PR では path filter で起動を絞る（ADR-057）。
  # docker/initdb/** と .env.test.example（task e2e が .env.test へコピーする）は compose-test がマウントまたは参照する入力として含める。
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - "docker/keycloak/**"
      - ".env.test.example"
      - "Taskfile.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Run E2E tests 🎭
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.node-version"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Gradle User Home は setup-gradle では扱わず、直下の actions/cache で復元する（ADR-063）。
          # MIT の範囲に収め、Enhanced Caching（gradle-actions-caching）は使わない。
          cache-provider: external

      # E2E は push で動かないため、Backend CI の test ジョブの cache を読み取り専用で復元し、保存はしない。
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-test-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-test-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # CI=true のため、task e2e は E2E_KEEP_ENV にかかわらず後片付けする。
      - name: Run E2E tests
        run: PATH="$GITHUB_WORKSPACE/frontend/node_modules/.bin:$PATH" task e2e

      # storageState（frontend/e2e/.auth/）は対象の外にあり、念のため除外も指定する。
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            !frontend/e2e/.auth/
          if-no-files-found: ignore
          retention-days: 14
