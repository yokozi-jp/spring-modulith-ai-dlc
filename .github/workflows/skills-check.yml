name: Validate skills lock 🧩

on:
  push:
    branches: ["main"]
    paths:
      - ".agents/skills/**"
      - ".kiro/**"
      - "skills-lock.json"
      - "tooling/skills-check/**"
  pull_request:
    branches: ["**"]
  # ci.yml から呼ばれる（docs/adr/ADR-087）。移行が終わるまでは pull_request でも単独で動き、二重に走る。
  workflow_call:

# 呼ばれると github.workflow が CI になる。group の前にファイル名の stem を付けて、呼ばれた workflow どうしが重ならないようにする（ADR-087）。
concurrency:
  group: skills-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # skills 関連パスが変わったかを判定する。PR では base ブランチとの diff で判定し、
  # 差分の取得に失敗したときは検査を実行する側へ倒す（docs/adr/ADR-087）。
  changes:
    name: Detect skills changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したため検査を実行します。" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '(^\.agents/skills/.*$|^\.kiro/.*$|^skills-lock\.json$|^tooling/skills-check/.*$)' \
            <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  skills-check:
    name: Run task skills-check 🧩
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # lock と実体とリンクの整合、上流のファイルが編集されていないことを検証する。
      - name: Validate skills lock
        run: task skills-check
