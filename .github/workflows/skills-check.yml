name: Validate skills lock 🧩

on:
  push:
    branches: ["main"]
    paths:
      - ".agents/skills/**"
      - ".kiro/skills/**"
      - "skills-lock.json"
      - "tooling/skills-check/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".agents/skills/**"
      - ".kiro/skills/**"
      - "skills-lock.json"
      - "tooling/skills-check/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skills-check:
    name: Run task skills-check 🧩
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # lock と実体とリンクの整合、上流のファイルが編集されていないことを検証する。
      - name: Validate skills lock
        run: task skills-check
