name: Validate skills lock 🧩

on:
  push:
    branches: ["main"]
    paths:
      - ".agents/skills/**"
      - ".kiro/**"
      - "skills-lock.json"
      - "tooling/skills-check/**"
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: skills-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect skills changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash tooling/ci-changes/changed.sh \
            '.agents/skills/**' \
            '.kiro/**' \
            'skills-lock.json' \
            'tooling/skills-check/**'

  skills-check:
    name: Run task skills-check 🧩
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up mise tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          MISE_LOCKED: "1"
        with:
          version: 2026.11.9
          install_args: task
          cache: false

      # lock と実体とリンクの整合、上流のファイルが編集されていないことを検証する。
      - name: Validate skills lock
        run: task skills-check
