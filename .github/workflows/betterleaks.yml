name: Secret Scan (betterleaks) 🔐

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  betterleaks:
    name: Run betterleaks 🔐
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴スキャンのため全コミットを取得する。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache: false

      - name: Install betterleaks
        run: go install github.com/betterleaks/betterleaks@latest

      # PR ではベースからの差分だけをスキャンして高速化する。
      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        run: |
          betterleaks git . --no-banner --redact \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # main への push では履歴全体をスキャンする。
      - name: Scan full history
        if: github.event_name == 'push'
        run: betterleaks git . --no-banner --redact --git-workers=16
