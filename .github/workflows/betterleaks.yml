name: Secret Scan (betterleaks) 🔐

on:
  push:
    branches: ["main"]
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

concurrency:
  group: betterleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    name: Run betterleaks 🔐
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴スキャンのため全コミットを取得する。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          tools: task betterleaks

      # PR ではベースからの差分だけをスキャンして高速化する。
      # main への push では BETTERLEAKS_LOG_OPTS が空になり、HEAD から辿れる履歴全体をスキャンする。
      # fetch-depth: 0 は他のブランチも取得するため、全 ref ではなく HEAD に限る。
      # 他のブランチのコミットは、その Pull Request の差分スキャンで検査する。
      - name: Scan secrets
        env:
          BETTERLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: task scan-secrets-all
