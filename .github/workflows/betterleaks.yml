name: Secret Scan (betterleaks) 🔐

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    name: Run betterleaks 🔐
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴スキャンのため全コミットを取得する。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # バージョンは versions.env の BETTERLEAKS_VERSION から読み、ローカルと CI を揃える。
      - name: Install betterleaks
        run: |
          . docs/local-env-setup/versions.env
          go install "github.com/betterleaks/betterleaks@${BETTERLEAKS_VERSION}"

      # PR ではベースからの差分だけをスキャンして高速化する。
      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        env:
          LOG_OPTS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: task scan-secrets-all

      # main への push では main の履歴全体をスキャンする。
      # fetch-depth: 0 は他のブランチも取得するため、HEAD から辿れるコミットに限る（task の既定値）。
      # 他のブランチのコミットは、その Pull Request の差分スキャンで検査する。
      - name: Scan full history
        if: github.event_name == 'push'
        run: task scan-secrets-all
