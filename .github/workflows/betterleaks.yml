name: Secret Scan (betterleaks) 🔐

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  # ci.yml から呼ばれる（docs/adr/ADR-087）。移行が終わるまでは pull_request でも単独で動き、二重に走る。
  workflow_call:

# 呼ばれると github.workflow が CI になる。group の前にファイル名の stem を付けて、呼ばれた workflow どうしが重ならないようにする（ADR-087）。
concurrency:
  group: betterleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    name: Run betterleaks 🔐
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴スキャンのため全コミットを取得する。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install betterleaks
        run: |
          . docs/local-env-setup/versions.env
          go install "github.com/betterleaks/betterleaks@${BETTERLEAKS_VERSION}"

      # PR ではベースからの差分だけをスキャンして高速化する。
      # main への push では BETTERLEAKS_LOG_OPTS が空になり、HEAD から辿れる履歴全体をスキャンする。
      # fetch-depth: 0 は他のブランチも取得するため、全 ref ではなく HEAD に限る。
      # 他のブランチのコミットは、その Pull Request の差分スキャンで検査する。
      - name: Scan secrets
        env:
          BETTERLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: task scan-secrets-all
