name: Vulnerability Scan (Trivy) 🛡️

on:
  push:
    branches: ["main"]
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SARIF を Code Scanning にアップロードする権限はジョブごとに付与する
# （ワークフロー全体に広く付与しない）。
permissions:
  contents: read

# Trivy の脆弱性 DB は Trivy 公式のミラーレジストリから取得する。
# Trivy 本体の版は SCAN_TRIVY_VERSION で明示する（docs/adr/ADR-097）。
# Taskfile の scan-vulns の aquasec/trivy と同じ版にそろえ、どちらも手で上げる。
# TRIVY_ で始めない（trivy-action が TRIVY_* を CLI の環境変数に渡す）。
env:
  SCAN_TRIVY_VERSION: v0.74.0
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1

jobs:
  # フロントエンド（pnpm）の依存脆弱性スキャン。
  # 依存を実際に解決（node_modules を生成）してからスキャンする。
  frontend:
    name: Trivy scan (frontend) 🛡️
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # ロックファイルどおりに依存を解決する（更新はしない）。
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 解決済みの依存を対象に脆弱性をスキャンする。
      # 検出があってもここでは失敗させず、結果は Code Scanning で確認する。
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.SCAN_TRIVY_VERSION }}
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # バックエンド（Gradle）の依存脆弱性スキャン。
  # Gradle が解決した正確なバージョンを CycloneDX SBOM に書き出し、それをスキャンする。
  backend:
    name: Trivy scan (backend) 🛡️
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "25"

      # 依存を解決して CycloneDX SBOM を生成する。
      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: ./gradlew cyclonedxBom --no-daemon

      # SBOM を対象に脆弱性をスキャンする。
      - name: Run Trivy SBOM scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.SCAN_TRIVY_VERSION }}
          scan-type: sbom
          scan-ref: backend/build/reports/cyclonedx/application.cdx.json
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
