name: Validate OKF bundle (iwe) 📚

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**/*.md"
      - "docs/.iwe/**"
      - ".kiro/steering/**"
      - "Taskfile.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-mise/**"
      - "README.md"
      - "tooling/adr-lint/**"
      - ".kiro/settings/mcp.json"
      - "tooling/iwe-mcp/**"
      - ".github/rulesets/**"
      - "tooling/ruleset-check/**"
      - "tooling/ruleset-sync/**"
      - ".github/workflows/**"
      - ".mise/**"
  # PR の検査は ci.yml から呼ばれて動く（docs/adr/ADR-087）。
  workflow_call:

concurrency:
  group: okf-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash tooling/ci-changes/changed.sh \
            'docs/**/*.md' \
            'docs/.iwe/**' \
            '.kiro/steering/**' \
            'Taskfile.yml' \
            'mise.toml' \
            'mise.lock' \
            '.github/actions/setup-mise/**' \
            'README.md' \
            'tooling/adr-lint/**' \
            '.kiro/settings/mcp.json' \
            'tooling/iwe-mcp/**' \
            '.github/rulesets/**' \
            'tooling/ruleset-check/**' \
            'tooling/ruleset-sync/**' \
            '.github/workflows/**' \
            '.mise/**'

  okf-validate:
    name: Run task okf-check 📚
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # npm: backend の iwe は Node.js で動く。
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          tools: task npm:@iwe-org/iwe

      - name: Validate OKF conformance
        env:
          DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: task okf-check
