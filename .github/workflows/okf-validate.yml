name: Validate OKF bundle (iwe) 📚

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**/*.md"
      - "docs/.iwe/**"
      - ".kiro/steering/**"
      - "Taskfile.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "docs/**/*.md"
      - "docs/.iwe/**"
      - ".kiro/steering/**"
      - "Taskfile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  okf-validate:
    name: Run task okf-check 📚
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: "3.53.1"
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      # docs/ を OKF v0.2 バンドルとして検証する（適合と孤立ドキュメント）。
      # バージョンは versions.env の IWE_VERSION から読み、ローカルと CI を揃える。
      # iwe はグローバル CLI ツールで pnpm workspace の lockfile 管理にそぐわないため、
      # adhoc-packages 監査を抑制する。
      - name: Install iwe
        run: | # zizmor: ignore[adhoc-packages]
          IWE_VERSION="$(grep '^IWE_VERSION=' docs/local-env-setup/versions.env | cut -d= -f2 | tr -d '"')"
          npm install -g "@iwe-org/iwe@${IWE_VERSION}"

      - name: Validate OKF conformance
        env:
          DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: task okf-check
