name: Lint Markdown (markdownlint-cli2) 📝

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: markdownlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Markdown changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          bash tooling/ci-changes/changed.sh \
            '**/*.md' \
            '.markdownlint-cli2.yaml'

  markdownlint:
    name: Run markdownlint-cli2 📝
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 除外設定は .markdownlint-cli2.yaml の ignores に従う（.kiro 配下は steering のみ対象）。
      # ローカル（task lint-md / lefthook）と同じ v0.23.2 のイメージを digest で固定する。
      - name: Run markdownlint-cli2
        run: |
          docker run --rm -v "$PWD":/workdir -w /workdir \
            davidanson/markdownlint-cli2:v0.23.2@sha256:839558fd0d36c46da0e01ea84fd1d20a2822b5a8a60c16dc9708f0bb7c9e903b \
            "**/*.md"
