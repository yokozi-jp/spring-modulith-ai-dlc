name: Validate Compose files 🐳

on:
  push:
    branches: ["main"]
    paths:
      - "**/compose.yml"
      - "**/compose.yaml"
      - "**/compose-test.yml"
      - "**/compose-test.yaml"
      - "**/docker-compose.yml"
      - "**/docker-compose.yaml"
      - ".env.example"
      - ".github/workflows/compose-config.yml"
  pull_request:
    branches: ["**"]
  # ci.yml から呼ばれる（docs/adr/ADR-087）。移行が終わるまでは pull_request でも単独で動き、二重に走る。
  workflow_call:

# 呼ばれると github.workflow が CI になる。group の前にファイル名の stem を付けて、呼ばれた workflow どうしが重ならないようにする（ADR-087）。
concurrency:
  group: compose-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compose 関連パスが変わったかを判定する。PR では base ブランチとの diff で判定し、
  # 差分の取得に失敗したときは検査を実行する側へ倒す（docs/adr/ADR-087）。
  changes:
    name: Detect Compose changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したため検査を実行します。" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '(^(.*/)?compose\.yml$|^(.*/)?compose\.yaml$|^(.*/)?compose-test\.yml$|^(.*/)?compose-test\.yaml$|^(.*/)?docker-compose\.yml$|^(.*/)?docker-compose\.yaml$|^\.env\.example$|^\.github/workflows/(compose-config|ci)\.yml$)' \
            <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  compose-config:
    name: Run docker compose config 🐳
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compose ファイルの構文・参照・変数展開を検証（起動はしない）。
      - name: docker compose config
        run: |
          # compose-test.yml の env_file が参照する .env.test は Git 除外のため、無ければ作る。
          [ -f .env.test ] || cp .env.test.example .env.test
          mapfile -t composefiles < <(git ls-files -z \
            '**/compose.yml' '**/compose.yaml' \
            '**/compose-test.yml' '**/compose-test.yaml' \
            '**/docker-compose.yml' '**/docker-compose.yaml' \
            'compose.yml' 'compose.yaml' \
            'compose-test.yml' 'compose-test.yaml' \
            'docker-compose.yml' 'docker-compose.yaml' \
            | tr '\0' '\n')
          if [ "${#composefiles[@]}" -eq 0 ]; then
            echo "Compose ファイルが見つからないため検証をスキップします。"
            exit 0
          fi
          status=0
          for composefile in "${composefiles[@]}"; do
            echo "validating: $composefile"
            docker compose --env-file "$GITHUB_WORKSPACE/.env.example" -f "$composefile" config --quiet || status=1
          done
          exit "$status"
