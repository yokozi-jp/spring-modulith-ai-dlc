name: Docker CI 🐳

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".hadolint.yaml"
      - ".github/workflows/hadolint.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".hadolint.yaml"
      - ".github/workflows/hadolint.yml"

permissions:
  contents: read

jobs:
  hadolint:
    name: Run hadolint 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 変更対象を問わずリポジトリ内の全 Dockerfile を検査する。
      - name: Run hadolint
        run: |
          mapfile -t dockerfiles < <(git ls-files -z \
            '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile' \
            | tr '\0' '\n')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つからないため hadolint をスキップします。"
            exit 0
          fi
          printf 'linting: %s\n' "${dockerfiles[@]}"
          docker run --rm -i -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint "${dockerfiles[@]}"

  docker-build-check:
    name: Run docker build --check 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker 公式のベストプラクティスチェック（ビルドはしない）。
      - name: docker build --check
        run: |
          mapfile -t dockerfiles < <(git ls-files -z \
            '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile' \
            | tr '\0' '\n')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つからないため docker build --check をスキップします。"
            exit 0
          fi
          status=0
          for dockerfile in "${dockerfiles[@]}"; do
            echo "checking: $dockerfile"
            docker build --check -f "$dockerfile" "$(dirname "$dockerfile")" || status=1
          done
          exit "$status"

  backend-image:
    name: Build and test backend image 🐳
    needs: [hadolint, docker-build-check]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --tag spring-modulith-backend:ci backend

      # CI の postgres サービスには initdb を差し込めないため、backend 起動前に demo スキーマを作る。
      - name: Create application schema
        run: |
          docker run --rm --network host \
            --env PGPASSWORD=demo \
            postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f \
            psql -h 127.0.0.1 -U demo -d demo \
            -c "CREATE SCHEMA IF NOT EXISTS demo AUTHORIZATION demo;"

      - name: Start backend container
        run: |
          docker run --detach --name backend-smoke --network host \
            --env-file .github/backend-smoke.env \
            spring-modulith-backend:ci

      - name: Wait for healthy backend
        run: |
          for attempt in {1..30}; do
            state="$(docker inspect --format '{{.State.Status}}' backend-smoke)"
            health="$(docker inspect --format '{{.State.Health.Status}}' backend-smoke)"
            echo "attempt=${attempt} state=${state} health=${health}"
            if [[ "$health" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$state" == "exited" || "$health" == "unhealthy" ]]; then
              docker logs backend-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs backend-smoke
          exit 1

      - name: Verify readiness response
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      - name: Show backend logs on failure
        if: failure()
        run: docker logs backend-smoke || true

      - name: Remove backend container
        if: always()
        run: docker rm --force backend-smoke || true
