name: Docker CI 🐳

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker/compose-test.yml"
      - "docker/initdb/**"
      - "docker/wiremock/**"
      - "docker/keycloak/**"
      - ".env.test.example"
      - ".hadolint.yaml"
      - ".github/workflows/hadolint.yml"
  # PR ではパスフィルタで workflow をスキップしない（必須チェックが
  # "Expected" のまま滞留するため）。全 PR で起動し、changes ジョブで
  # 判定して各ジョブを条件付き実行する（skipped は必須チェックで success 扱い）。
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docker 関連パスが変わったかを判定する。push（main）では常に true とし、
  # PR では base ブランチとの diff で判定する。各ジョブはこの出力に依存する。
  changes:
    name: Detect docker changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 0 で取得済みの base と比較する。差分取得に失敗した場合は
          # CI を実行する側へ倒し、検出失敗をイメージ検証のスキップとして扱わない。
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "差分取得に失敗したため Docker CI を実行します。" >&2
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # hadolint.yml の push パスフィルタと同じ集合で判定する。
          if grep -Eq '^(backend/|docker/compose-test\.yml$|docker/initdb/|docker/wiremock/|docker/keycloak/|\.env\.test\.example$|\.hadolint\.yaml$|\.github/workflows/hadolint\.yml$)' \
            <<< "$changed_files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  hadolint:
    name: Run hadolint 🐳
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 変更対象を問わずリポジトリ内の全 Dockerfile を検査する。
      - name: Run hadolint
        run: |
          mapfile -t dockerfiles < <(git ls-files -z \
            '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile' \
            | tr '\0' '\n')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つからないため hadolint をスキップします。"
            exit 0
          fi
          printf 'linting: %s\n' "${dockerfiles[@]}"
          docker run --rm -i -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint "${dockerfiles[@]}"

  docker-build-check:
    name: Run docker build --check 🐳
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker 公式のベストプラクティスチェック（ビルドはしない）。
      - name: docker build --check
        run: |
          mapfile -t dockerfiles < <(git ls-files -z \
            '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile' \
            | tr '\0' '\n')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つからないため docker build --check をスキップします。"
            exit 0
          fi
          status=0
          for dockerfile in "${dockerfiles[@]}"; do
            echo "checking: $dockerfile"
            docker build --check -f "$dockerfile" "$(dirname "$dockerfile")" || status=1
          done
          exit "$status"

  backend-image:
    name: Build and test backend image 🐳
    needs: [changes, hadolint, docker-build-check]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --tag spring-modulith-backend:ci backend

      # .env.test は Git 除外のため、.env.test.example からコピーして作る。
      - name: Create test env file
        run: cp .env.test.example .env.test

      # 通常テスト用の PostgreSQL / Redis に加え、backend-smoke profile の Keycloak を起動する。
      # backend-ci.yml と task test は profile を有効にしないため、Keycloak の起動コストを負わない。
      # スキーマ作成は compose-test の initdb が担うため、ここでの手動作成は不要。
      - name: Start backend smoke dependencies
        run: docker compose -f docker/compose-test.yml --profile backend-smoke up -d --wait

      - name: Start backend container
        run: |
          docker run --detach --name backend-smoke --network host \
            --env-file .env.test \
            spring-modulith-backend:ci

      - name: Wait for healthy backend
        run: |
          for attempt in {1..30}; do
            state="$(docker inspect --format '{{.State.Status}}' backend-smoke)"
            health="$(docker inspect --format '{{.State.Health.Status}}' backend-smoke)"
            echo "attempt=${attempt} state=${state} health=${health}"
            if [[ "$health" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$state" == "exited" || "$health" == "unhealthy" ]]; then
              docker logs backend-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs backend-smoke
          exit 1

      - name: Verify readiness response
        run: docker exec backend-smoke curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      - name: Show backend logs on failure
        if: failure()
        run: docker logs backend-smoke || true

      - name: Remove backend container
        if: always()
        run: docker rm --force backend-smoke || true

      - name: Stop backend smoke dependencies
        if: always()
        run: docker compose -f docker/compose-test.yml --profile backend-smoke down --volumes --remove-orphans
