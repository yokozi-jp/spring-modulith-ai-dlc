name: Lint Dockerfiles (hadolint) 🐳

on:
  push:
    branches: ["main"]
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.Dockerfile"
      - ".hadolint.yaml"
  pull_request:
    branches: ["**"]
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.Dockerfile"
      - ".hadolint.yaml"

permissions:
  contents: read

jobs:
  hadolint:
    name: Run hadolint 🐳
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 変更対象を問わずリポジトリ内の全 Dockerfile を検査する。
      - name: Run hadolint
        run: |
          mapfile -t dockerfiles < <(git ls-files -z \
            '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile' \
            | tr '\0' '\n')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つからないため hadolint をスキップします。"
            exit 0
          fi
          printf 'linting: %s\n' "${dockerfiles[@]}"
          docker run --rm -i -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint "${dockerfiles[@]}"
