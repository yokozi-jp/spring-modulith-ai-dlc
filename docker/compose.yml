name: spring-modulith-local

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      # ブートストラップは DDL とスキーマ所有を持つマイグレーション用ロール。
      POSTGRES_USER: ${MIGRATION_DB_USERNAME:?MIGRATION_DB_USERNAME is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/migration_db_password
      # initdb が作成する DML 限定のアプリロール（アプリはこの資格情報で接続する）。
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Liquibase管理専用スキーマとアプリロールだけを作る。モジュールスキーマはchangesetが作成する。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    secrets:
      - migration_db_password
      - db_password
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    # ローカル専用の使い捨て IdP（本番ではCognitoを使う想定）。127.0.0.1 のみに公開し
    # start-dev で動かすため、管理者資格情報は開発用の admin/admin を直書きする
    # （機密ではなく、上書きの必要もない）。
    command: ["start-dev", "--import-realm"]
    environment:
      TZ: UTC
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # realm が存在しない初回起動時だけ、ローカル用 client・role・user を投入する。
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  wiremock:
    # ローカル専用の決済代行の偽物。docker/wiremock/mappings の請求の成功のスタブを返す。
    # 失敗は管理 API（/__admin/mappings）で実行中に足す。本番は実際の決済代行の URL を注入する。
    image: wiremock/wiremock:3.13.2@sha256:d737d2de3664a7e1bf96f73a7bd48a0d47d61988f7ca88a6e51ea44b8c1f687d
    # JDK の HttpClient が平文の HTTP/2 へ upgrade すると、本文付きの POST が切れるため、平文の HTTP/2 を止める。
    command: ["--disable-banner", "--disable-http2-plain"]
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    entrypoint:
      - /bin/bash
      - -ec
      - |
        export GF_SECURITY_ADMIN_PASSWORD="$$(cat /run/secrets/grafana_admin_password)"
        exec /otel-lgtm/run-all.sh
    environment:
      TZ: UTC
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:?GRAFANA_HOST_PORT is required}:3000"
    volumes:
      - otel_lgtm_data:/data
    secrets:
      - grafana_admin_password
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # 可観測性データの唯一の出口。ログの属性を allowlist で絞ってから LGTM へ送る（本番と同じ設定）。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0-386@sha256:76fd04f2d75922e93e447381bafcd0b78d24f1c5cdcc13f424d9a16f0342c087
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    environment:
      # コンテナ間通信とホストからの送信を受けるため、全インターフェースで待ち受ける。
      OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT: 0.0.0.0:4318
      OTEL_COLLECTOR_FARO_HTTP_ENDPOINT: 0.0.0.0:12347
      # transform/frontend_logs が service.name をこの値で上書きする（ADR-068）。
      FRONTEND_OTEL_SERVICE_NAME: ${FRONTEND_OTEL_SERVICE_NAME:?FRONTEND_OTEL_SERVICE_NAME is required}
      OTEL_COLLECTOR_CSP_REPORT_HTTP_ENDPOINT: 0.0.0.0:12348
      # webhook_event は resource 属性を付けないので、transform/frontend_csp がこの 3 つを CSP の報告に付ける（ADR-068）。
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:?OTEL_SERVICE_NAMESPACE is required}
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?OTEL_DEPLOYMENT_ENVIRONMENT_NAME is required}
      # 正本は version.txt で、task compose-up が渡す。Task を通さない docker compose config でも解決できるよう既定値を持つ。
      FRONTEND_SERVICE_VERSION: ${FRONTEND_SERVICE_VERSION:-unknown}
    ports:
      # backend は全シグナルを OTLP/HTTP(4318)へ送るため、gRPC(4317)は公開しない。
      - "127.0.0.1:${OTEL_HTTP_PORT:?OTEL_HTTP_PORT is required}:4318"
      # ホストの Vite が /collect を転送する faro receiver（ADR-068）。ブラウザから直接は受けない。
      - "127.0.0.1:${OTEL_FARO_HTTP_PORT:?OTEL_FARO_HTTP_PORT is required}:12347"
      # ホストの Vite が /csp-report を転送する webhook_event receiver（ADR-068）。ブラウザから直接は受けない。
      - "127.0.0.1:${OTEL_CSP_REPORT_HTTP_PORT:?OTEL_CSP_REPORT_HTTP_PORT is required}:12348"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # イメージにシェルも HTTP クライアントもないため healthcheck を置けない。
    # 送信側の OTLP exporter が再送するので、起動直後の取りこぼしは許容する。
    depends_on:
      otel-lgtm:
        condition: service_healthy
    restart: unless-stopped

  backend:
    profiles: ["backend"]
    image: spring-modulith-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint:
      - /bin/bash
      - -ec
      - |
        export DB_PASSWORD="$$(cat /run/secrets/db_password)"
        exec java -jar app.jar
    environment:
      SERVER_PORT: "8080"
      # .env の DB_HOST/DB_PORT・OTLP endpoint はホスト起動用なので、
      # container 間通信では service 名と内部ポートへ置き換える。
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_POOL_MAXIMUM_SIZE: ${DB_POOL_MAXIMUM_SIZE:?DB_POOL_MAXIMUM_SIZE is required}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:?DB_POOL_CONNECTION_TIMEOUT_MS is required}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:?DB_LOCK_TIMEOUT_MS is required}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:?DB_STATEMENT_TIMEOUT_MS is required}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:?DB_IDLE_IN_TRANSACTION_TIMEOUT_MS is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SESSION_NAMESPACE: ${REDIS_SESSION_NAMESPACE:?REDIS_SESSION_NAMESPACE is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?SESSION_COOKIE_SECURE is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      # コンテナから issuer metadata を取得するため Compose の service 名を使う。
      OIDC_ISSUER_URI: http://keycloak:8080/realms/spring-modulith
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:?SPRINGDOC_ENABLED is required}
      # 決済代行はローカルの WireMock を Compose の service 名で呼ぶ。
      PAYMENT_GATEWAY_BASE_URL: http://wiremock:8080
      EVENT_PUBLICATION_RESUBMISSION_ENABLED: ${EVENT_PUBLICATION_RESUBMISSION_ENABLED:?EVENT_PUBLICATION_RESUBMISSION_ENABLED is required}
      EVENT_PUBLICATION_RESUBMISSION_WAIT_AGE: ${EVENT_PUBLICATION_RESUBMISSION_WAIT_AGE:?EVENT_PUBLICATION_RESUBMISSION_WAIT_AGE is required}
      EVENT_PUBLICATION_RESUBMISSION_INTERVAL: ${EVENT_PUBLICATION_RESUBMISSION_INTERVAL:?EVENT_PUBLICATION_RESUBMISSION_INTERVAL is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:?OTEL_SERVICE_NAME is required}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:?OTEL_SERVICE_NAMESPACE is required}
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:?OTEL_DEPLOYMENT_ENVIRONMENT_NAME is required}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:?MANAGEMENT_TRACING_SAMPLING_PROBABILITY is required}
    ports:
      - "127.0.0.1:${SERVER_PORT:?SERVER_PORT is required}:8080"
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  otel_lgtm_data:

secrets:
  migration_db_password:
    environment: MIGRATION_DB_PASSWORD
  db_password:
    environment: DB_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
