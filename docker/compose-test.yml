# テスト専用の依存スタック（PostgreSQL + Redis、バックエンドスモーク時のみ Keycloak）。
# 目的: 開発用スタック（docker/compose.yml）と隔離し、開発を止めずにテストを回す。
#   - プロジェクト名を分け（name: spring-modulith-test）、ネットワーク/コンテナを別空間にする。
#   - ホストポートを開発用とずらす（PostgreSQL 5433 / Redis 6380 / Keycloak 8081）。開発の 5432/6379/8080 と衝突しない。
#   - 名前付きボリュームを持たず使い捨て（down -v で毎回クリーン）。テストは常にまっさらな DB で走らせる。
#   - Keycloak は backend-smoke profile に限定し、通常の Gradle テストでは起動しない。
#   - backend と Keycloak は E2E 用の e2e profile でも起動する（task e2e、ADR-057）。
#   - テストに不要な OTEL LGTM は含めない。
#   - 開発用 compose と違い必須変数（${...:?}）や secret には依存せず、値を直書きして自己完結させる
#     （機密ではない demo/demo の使い捨て。接続情報は .env.test が Gradle・スモーク側へ渡す。.env.test は Git 除外で、.env.test.example からコピーして作る）。
name: spring-modulith-test

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: demo
      # ブートストラップは DDL・スキーマ所有のマイグレーションロール（.env.test の MIGRATION_DB_*）。
      POSTGRES_USER: demo_migration
      POSTGRES_PASSWORD: demo
      # initdb が作成する DML 限定のアプリロール（.env.test の DB_USERNAME/DB_PASSWORD）。
      DB_USERNAME: demo
      DB_PASSWORD: demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Liquibase管理専用スキーマを作り、modulithスキーマはchangesetに任せる。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # initdb 中の一時サーバは Unix ソケットだけで待ち受けるため、TCP を明示して除外する。
      # 最終サーバが TCP 接続を受け付けた時点では initdb スクリプトも完了している。
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    profiles: ["backend-smoke", "e2e"]
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      TZ: UTC
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # hostname v2：ブラウザ向けの URL と issuer を公開用の URL に固定する。
      # backend が service 名（keycloak:8080）で呼ぶ backchannel の endpoint だけを要求の Host から決める（ADR-057）。
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # 開発用と同じ realm を使い、実際の OIDC discovery をスモークテストする。
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # E2E 用の backend（e2e profile 限定、ADR-057）。既存の backend/Dockerfile でビルドする。
  # compose の network に置き、PostgreSQL、Redis、Keycloak へ service 名で接続する（.env.test の接続先を environment で上書きする）。
  # issuer は .env.test の公開用の URL（127.0.0.1:8081）のまま検査し、discovery だけを keycloak:8080 から読む（OIDC_DISCOVERY_URI）。
  # migration は task e2e が backend の起動前に be-migrate で適用する（ADR-005）。
  backend:
    profiles: ["e2e"]
    image: spring-modulith-backend:e2e
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env.test
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OIDC_DISCOVERY_URI: http://keycloak:8080/realms/spring-modulith/.well-known/openid-configuration
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
