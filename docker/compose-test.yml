# テスト専用の依存スタック（PostgreSQL + Redis、バックエンドスモーク時のみ Keycloak）。
# 目的: 開発用スタック（docker/compose.yml）と隔離し、開発を止めずにテストを回す。
#   - プロジェクト名を分け（name: spring-modulith-test）、ネットワーク/コンテナを別空間にする。
#   - ホストポートを開発用とずらす（PostgreSQL 5433 / Redis 6380 / Keycloak 8081）。開発の 5432/6379/8080 と衝突しない。
#   - 名前付きボリュームを持たず使い捨て（down -v で毎回クリーン）。テストは常にまっさらな DB で走らせる。
#   - Keycloak は backend-smoke profile に限定し、通常の Gradle テストでは起動しない。
#   - テストに不要な OTEL LGTM は含めない。
#   - 開発用 compose と違い必須変数（${...:?}）や secret には依存せず、値を直書きして自己完結させる
#     （機密ではない demo/demo の使い捨て。接続情報は .env.test が Gradle・スモーク側へ渡す）。
name: spring-modulith-test

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # 初回起動時に demo スキーマを作成する（開発用と同じ初期化スクリプトを再利用）。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # initdb 中の一時サーバは Unix ソケットだけで待ち受けるため、TCP を明示して除外する。
      # 最終サーバが TCP 接続を受け付けた時点では initdb スクリプトも完了している。
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    profiles: ["backend-smoke"]
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: ["start-dev", "--import-realm"]
    environment:
      TZ: UTC
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # 開発用と同じ realm を使い、実際の OIDC discovery をスモークテストする。
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
