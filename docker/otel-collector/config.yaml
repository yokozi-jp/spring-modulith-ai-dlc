# OpenTelemetry Collector の共通設定（ローカルと本番で共有する）。
# 可観測性データの出口をこの Collector に一本化し、ログの属性を許可したものだけに絞る。
# 規則の正文は docs/observability/conventions.md、判断は ADR-015 と ADR-043。
# 本番は exporters と各 pipeline の exporters を別ファイルで上書きし、processors は変えない。

receivers:
  otlp:
    protocols:
      http:
        # 既定は localhost（Fargate のサイドカー）。Compose はコンテナ間通信のため 0.0.0.0 に上書きする。
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-localhost:4318}
  # ブラウザの Faro SDK が同一オリジンの /collect から送るログ（ADR-068）。どのパスでも受ける。
  # 同一オリジンで受けるため CORS は設定しない（ADR-014）。
  faro:
    # 既定は localhost。Compose はホストの Vite から受けるため 0.0.0.0 に上書きする。
    endpoint: ${env:OTEL_COLLECTOR_FARO_HTTP_ENDPOINT:-localhost:12347}
    # Errors だけの既定のバッチ（最大 50 件）に十分な余裕を持たせた上限（1 MiB）。超えると 400 で捨てる。
    max_request_body_size: 1048576

processors:
  transform/log_attributes:
    log_statements:
      # ログ属性の allowlist。属性を足すときは docs/observability/conventions.md と同じ変更で直す。
      - keep_keys(log.attributes, ["exception.type", "exception.message", "exception.stacktrace", "http.response.status_code", "conflict.kind"])
  # フロントエンドのログは filter と transform の 2 段で守る。filter は種別の門番、transform は中身の洗浄で、
  # 2 つ揃って初めて意図した保護になる。/collect は認証なしで誰でも POST できる受け口（ADR-068）なので、
  # 自分たちの SDK が ErrorsInstrumentation だけでも、受け口に来る種別は信頼しない。
  # Errors だけの Faro は例外しか送らないが、攻撃者やバグのある別クライアントが log、event、measurement を
  # 直接送れる。それらを例外の記録にしないため、kind != "exception" をここで捨てる（defence in depth）。
  # WebVitals などの計装を足すときは、送る種類をここで許し、transform/frontend_logs に本文の文字列を足す。
  filter/frontend_exceptions:
    error_mode: silent
    logs:
      log_record:
        - log.attributes["kind"] != "exception"
  # フロントエンドのログ。faro receiver はメタデータを本文の logfmt に入れるため、keep_keys だけでは守れない。
  # 本文を解析して許可した値だけを属性へ移し、本文は固定の文字列に置き換える。
  # 属性を足すときは docs/observability/conventions.md と同じ変更で直す。
  transform/frontend_logs:
    # 解析に失敗した文は飛ばし、本文の置き換えと keep_keys で何も残さない側に倒す。
    # ignore は失敗の理由に本文を含めて Collector のログに出すため、silent にする。
    error_mode: silent
    log_statements:
      # logfmt は ' を引用符にしないが、ParseKeyValue は引用符として扱う。
      # 解析の間だけ U+0001 に置き換える。logfmt は制御文字をエスケープするので、本文に生の U+0001 は現れない。
      - replace_pattern(log.body, "'", "\u0001")
      - merge_maps(log.cache, ParseKeyValue(log.body), "upsert")
      - replace_all_patterns(log.cache, "value", "\u0001", "'")
      - set(log.attributes["exception.type"], log.cache["type"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["exception.message"], log.cache["value"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["exception.stacktrace"], log.cache["stacktrace"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["url.path"], URL(log.cache["page_url"])["url.path"]) where log.cache["page_url"] != nil
      # URL の query と fragment を消す。scheme の大文字と小文字は区別しない。1 つ目は stacktrace の frame の :行:列) を残す。
      # path は ( と ) を含んでよい（RFC 3986）。一致は https?:// から始まるので、frame の前の ( は含まない。
      # 値の中の \n のエスケープを食べないため、query の部分には \\ と \" 以外のバックスラッシュを含めない。
      - replace_all_patterns(log.attributes, "value", "(?i)(https?://[^\\s?#\\\\]*)[?#](?:[^\\s()\\\\]|\\\\\\\\)*(:\\d+:\\d+\\))", "$$1$$2")
      # 2 つ目は frame 以外の URL で、( と ) と \" も query として消す（例外のメッセージの ?token=a(b)c や ?q=\"x\"）。
      # ponytail: 空白か \n などのエスケープまでを query とみなすので、(see http://h/a?x=1) の閉じ括弧と、query に括弧を含む frame の :行:列) も消える。
      # 秘密を残すより表示の崩れを取る。崩れが問題になったら、frame 以外の URL の終わりを括弧の対応で決める文を足す。
      - replace_all_patterns(log.attributes, "value", "(?i)(https?://[^\\s?#\\\\]*)[?#](?:[^\\s\\\\]|\\\\\\\\|\\\\\")*", "$$1")
      - set(log.body, "Browser exception")
      # payload の meta.app は誰でも書けるので、service.name は Collector の値で上書きし、バックエンドの名前を名乗らせない。
      # ponytail: service.version、service.namespace、deployment.environment.name は payload の値のまま残り、版の数だけ resource が増えうる。
      # 公開の gateway を作るときに、Collector の環境変数で上書きする文を足す。
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      # ponytail: ParseKeyValue はエスケープを解かないため、stacktrace の改行は \n、引用符は \" の 2 文字のまま属性の値に残る。
      # 読みにくさが問題になったら、エスケープを解く文を足す。
      - keep_keys(log.attributes, ["exception.type", "exception.message", "exception.stacktrace", "url.path"])
  # フロントエンドの span も filter と transform の 2 段で守る。/collect は誰でも送れる（ADR-068）ので、送り手が書ける値を信頼しない。
  # span の event は例外のメッセージなどを持ちうるので、すべて捨てる。
  filter/frontend_span_events:
    error_mode: silent
    traces:
      spanevent:
        # 引用符を外すと YAML の bool になり、Collector が起動しない。
        - 'true'
  # フロントエンドの span。許可した属性だけを残し、送り手が自由に書ける名前、status の message、trace_state、scope を固定の値か空にする。
  # 属性を足すときは docs/observability/conventions.md と同じ変更で直す。
  transform/frontend_traces:
    # 解析に失敗した文は飛ばし、keep_keys で許可した属性以外を残さない側に倒す。
    error_mode: silent
    trace_statements:
      # url.full は残さず、URL の構文で path だけを取り出す。query と fragment を正規表現で消すより漏れがない。
      - delete_key(span.attributes, "url.path")
      - set(span.attributes["url.path"], URL(span.attributes["url.full"])["url.path"]) where span.attributes["url.full"] != nil
      # 計装の名前は method だけだが、/collect に直接送られた名前は自由な文字列になりうる。method は http.request.method に残る。
      - set(span.name, "Browser request")
      - set(span.status.message, "")
      - set(span.trace_state, "")
      # links とその属性も送り手が自由に書ける。ブラウザの計装は links を作らないので、すべて捨てる。
      - set(span.links, nil)
      - set(scope.name, "browser")
      - set(scope.version, "")
      - keep_keys(scope.attributes, [])
      # logs/frontend と同じく、service.name は Collector の値で上書きし、バックエンドの名前を名乗らせない。
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      # ponytail: http.request.method の値は payload のまま残り、送り手が任意の文字列を入れうる。
      # logs/frontend の exception.message と同じく、保存先の閲覧の制限とマスクで扱う。
      - keep_keys(span.attributes, ["http.request.method", "http.response.status_code", "url.path"])

exporters:
  # ローカルの Grafana OpenTelemetry LGTM。
  otlp_http/lgtm:
    endpoint: http://otel-lgtm:4318

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/log_attributes]
      exporters: [otlp_http/lgtm]
    # バックエンドの allowlist と混ぜないため、フロントエンドの pipeline を分ける。
    logs/frontend:
      receivers: [faro]
      processors: [filter/frontend_exceptions, transform/frontend_logs]
      exporters: [otlp_http/lgtm]
    traces:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
    traces/frontend:
      receivers: [faro]
      processors: [filter/frontend_span_events, transform/frontend_traces]
      exporters: [otlp_http/lgtm]
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
