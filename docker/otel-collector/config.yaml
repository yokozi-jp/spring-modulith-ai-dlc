# OpenTelemetry Collector の共通設定（ローカルと本番で共有する）。
# 可観測性データの出口をこの Collector に一本化し、ログの属性を許可したものだけに絞る。
# 規則の正文は docs/observability/conventions.md、判断は ADR-015 と ADR-043。
# 本番は exporters と各 pipeline の exporters を別ファイルで上書きし、processors は変えない。

receivers:
  otlp:
    protocols:
      http:
        # 既定は localhost（Fargate のサイドカー）。Compose はコンテナ間通信のため 0.0.0.0 に上書きする。
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-localhost:4318}
  # ブラウザの Faro SDK が同一オリジンの /collect から送るログ（ADR-068）。どのパスでも受ける。
  # 同一オリジンで受けるため CORS は設定しない（ADR-014）。
  faro:
    # 既定は localhost。Compose はホストの Vite から受けるため 0.0.0.0 に上書きする。
    endpoint: ${env:OTEL_COLLECTOR_FARO_HTTP_ENDPOINT:-localhost:12347}
    # Errors だけの既定のバッチ（最大 50 件）に十分な余裕を持たせた上限（1 MiB）。超えると 400 で捨てる。
    max_request_body_size: 1048576

processors:
  transform/log_attributes:
    log_statements:
      # ログ属性の allowlist。属性を足すときは docs/observability/conventions.md と同じ変更で直す。
      - keep_keys(log.attributes, ["exception.type", "exception.message", "exception.stacktrace", "http.response.status_code", "conflict.kind"])
  # faro receiver の logfmt 本文を解析し、型と値を検証した record だけへ Collector 内部の印を付ける。
  transform/frontend_validate:
    error_mode: silent
    log_statements:
      - delete_key(log.attributes, "frontend.accepted")
      - replace_pattern(log.body, "'", "\u0001")
      - merge_maps(log.cache, ParseKeyValue(log.body), "upsert")
      - replace_all_patterns(log.cache, "value", "\u0001", "'")
      - set(log.attributes["frontend.type"], log.cache["type"])
      - set(log.attributes["frontend.value"], log.cache["value"])
      - set(log.attributes["frontend.stacktrace"], log.cache["stacktrace"]) where log.cache["stacktrace"] != nil
      - set(log.attributes["frontend.session"], log.cache["session_id"])
      - set(log.attributes["frontend.view"], log.cache["view_name"]) where log.cache["view_name"] != nil
      - set(log.attributes["frontend.event_to_view"], log.cache["event_data_toView"]) where log.cache["event_data_toView"] != nil
      - set(log.attributes["frontend.lcp"], Double(log.cache["value_lcp"])) where Len(log.cache["value_lcp"]) >= 1 and Len(log.cache["value_lcp"]) <= 32 and IsMatch(log.cache["value_lcp"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.inp"], Double(log.cache["value_inp"])) where Len(log.cache["value_inp"]) >= 1 and Len(log.cache["value_inp"]) <= 32 and IsMatch(log.cache["value_inp"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.cls"], Double(log.cache["value_cls"])) where Len(log.cache["value_cls"]) >= 1 and Len(log.cache["value_cls"]) <= 32 and IsMatch(log.cache["value_cls"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "exception" and IsMatch(log.cache["session_id"], "^[a-km-zA-HJ-NP-Z0-9]{10}$$") and IsMatch(log.cache["type"], "^[A-Za-z_$$][A-Za-z0-9_$$.]{0,127}$$") and Len(log.cache["value"]) <= 8192 and (log.cache["stacktrace"] == nil or Len(log.cache["stacktrace"]) <= 65536)
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "event" and log.cache["event_name"] == "view_changed" and IsMatch(log.cache["session_id"], "^[a-km-zA-HJ-NP-Z0-9]{10}$$") and IsMatch(log.cache["event_data_toView"], "^/(?:logged-out)?$$")
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "measurement" and log.cache["type"] == "web-vitals" and IsMatch(log.cache["session_id"], "^[a-km-zA-HJ-NP-Z0-9]{10}$$") and IsMatch(log.cache["view_name"], "^/(?:logged-out)?$$") and ((log.attributes["frontend.lcp"] != nil and log.attributes["frontend.lcp"] >= 0 and log.cache["value_inp"] == nil and log.cache["value_cls"] == nil) or (log.cache["value_lcp"] == nil and log.attributes["frontend.inp"] != nil and log.attributes["frontend.inp"] >= 0 and log.cache["value_cls"] == nil) or (log.cache["value_lcp"] == nil and log.cache["value_inp"] == nil and log.attributes["frontend.cls"] != nil and log.attributes["frontend.cls"] >= 0))
  filter/frontend_logs:
    error_mode: silent
    logs:
      log_record:
        - log.attributes["frontend.accepted"] != "true"
  # 検証済みの候補だけから固定本文と最終属性を作る。
  transform/frontend_logs:
    error_mode: silent
    log_statements:
      - set(log.attributes["exception.type"], log.attributes["frontend.type"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["exception.message"], log.attributes["frontend.value"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["exception.stacktrace"], log.attributes["frontend.stacktrace"]) where log.attributes["kind"] == "exception" and log.attributes["frontend.stacktrace"] != nil
      - set(log.attributes["view.name"], log.attributes["frontend.view"]) where log.attributes["kind"] == "exception" and IsMatch(log.attributes["frontend.view"], "^/(?:logged-out)?$$")
      - set(log.attributes["url.path"], log.attributes["frontend.view"]) where log.attributes["kind"] == "exception" and IsMatch(log.attributes["frontend.view"], "^/(?:logged-out)?$$")
      - set(log.attributes["view.name"], log.attributes["frontend.event_to_view"]) where log.attributes["kind"] == "event"
      - set(log.attributes["view.name"], log.attributes["frontend.view"]) where log.attributes["kind"] == "measurement"
      - set(log.attributes["session.id"], log.attributes["frontend.session"])
      - set(log.attributes["telemetry.signal"], "exception") where log.attributes["kind"] == "exception"
      - set(log.attributes["telemetry.signal"], "view") where log.attributes["kind"] == "event"
      - set(log.attributes["telemetry.signal"], "web-vital") where log.attributes["kind"] == "measurement"
      - set(log.attributes["measurement.type"], "web-vitals") where log.attributes["kind"] == "measurement"
      - set(log.attributes["measurement.name"], "lcp") where log.attributes["frontend.lcp"] != nil
      - set(log.attributes["measurement.name"], "inp") where log.attributes["frontend.inp"] != nil
      - set(log.attributes["measurement.name"], "cls") where log.attributes["frontend.cls"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.lcp"]) where log.attributes["frontend.lcp"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.inp"]) where log.attributes["frontend.inp"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.cls"]) where log.attributes["frontend.cls"] != nil
      # stack frame の URL を先に置換し、行番号と列番号を残す。その後、一般の URL token 全体を置換する。
      - replace_all_patterns(log.attributes, "value", "(^|[^A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*:[^\\s\\\\]*)(:\\d+:\\d+\\))", "$$1[redacted-url]$$3") where log.attributes["kind"] == "exception"
      - replace_all_patterns(log.attributes, "value", "(^|[^A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*:[^\\s\\\\]+)", "$$1[redacted-url]") where log.attributes["kind"] == "exception"
      - replace_all_patterns(log.attributes, "value", "(^|[^A-Za-z0-9%/._~-])(/[^\\s\\\\]+)", "$$1[redacted-url]") where log.attributes["kind"] == "exception"
      - set(log.body, "Browser exception") where log.attributes["kind"] == "exception"
      - set(log.body, "Browser view") where log.attributes["kind"] == "event"
      - set(log.body, "Browser web vital") where log.attributes["kind"] == "measurement"
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - delete_key(resource.attributes, "service.namespace") where not IsMatch(resource.attributes["service.namespace"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "service.version") where not IsMatch(resource.attributes["service.version"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "deployment.environment.name") where not IsMatch(resource.attributes["deployment.environment.name"], "^[A-Za-z0-9._-]{1,64}$$")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      - keep_keys(log.attributes, ["telemetry.signal", "exception.type", "exception.message", "exception.stacktrace", "url.path", "view.name", "measurement.type", "measurement.name", "measurement.value", "session.id"])
  # フロントエンドの span も filter と transform の 2 段で守る。/collect は誰でも送れる（ADR-068）ので、送り手が書ける値を信頼しない。
  # span の event は例外のメッセージなどを持ちうるので、すべて捨てる。
  filter/frontend_span_events:
    error_mode: silent
    traces:
      spanevent:
        # 引用符を外すと YAML の bool になり、Collector が起動しない。
        - 'true'
  # フロントエンドの span。許可した属性だけを残し、送り手が自由に書ける名前、status の message、trace_state、scope を固定の値か空にする。
  # 属性を足すときは docs/observability/conventions.md と同じ変更で直す。
  transform/frontend_traces:
    # 解析に失敗した文は飛ばし、keep_keys で許可した属性以外を残さない側に倒す。
    error_mode: silent
    trace_statements:
      # URL は route template を安全に得られないため、最後の keep_keys ですべて削除する。
      - delete_key(span.attributes, "http.request.method") where not IsMatch(span.attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$$")
      - delete_key(span.attributes, "http.response.status_code") where span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599
      # 計装の名前は method だけだが、/collect に直接送られた名前は自由な文字列になりうる。method は http.request.method に残る。
      - set(span.name, "Browser request")
      - set(span.status.message, "")
      - set(span.trace_state, "")
      # links とその属性も送り手が自由に書ける。ブラウザの計装は links を作らないので、すべて捨てる。
      - set(span.links, nil)
      - set(scope.name, "browser")
      - set(scope.version, "")
      - keep_keys(scope.attributes, [])
      # logs/frontend と同じく、service.name は Collector の値で上書きし、バックエンドの名前を名乗らせない。
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      - keep_keys(span.attributes, ["http.request.method", "http.response.status_code"])

exporters:
  # ローカルの Grafana OpenTelemetry LGTM。
  otlp_http/lgtm:
    endpoint: http://otel-lgtm:4318

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/log_attributes]
      exporters: [otlp_http/lgtm]
    # バックエンドの allowlist と混ぜないため、フロントエンドの pipeline を分ける。
    logs/frontend:
      receivers: [faro]
      processors: [transform/frontend_validate, filter/frontend_logs, transform/frontend_logs]
      exporters: [otlp_http/lgtm]
    traces:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
    traces/frontend:
      receivers: [faro]
      processors: [filter/frontend_span_events, transform/frontend_traces]
      exporters: [otlp_http/lgtm]
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
