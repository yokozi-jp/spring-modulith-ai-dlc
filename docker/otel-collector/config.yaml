# OpenTelemetry Collector の共通設定（ローカルと本番で共有する）。
# 可観測性データの出口をこの Collector に一本化し、ログの属性を許可したものだけに絞る。
# 規則の正文は docs/observability/conventions.md、判断は ADR-015 と ADR-043。
# 本番は exporters と各 pipeline の exporters を別ファイルで上書きし、processors は変えない。

receivers:
  otlp:
    protocols:
      http:
        # 既定は localhost（Fargate のサイドカー）。Compose はコンテナ間通信のため 0.0.0.0 に上書きする。
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-localhost:4318}
  # ブラウザの Faro SDK が同一オリジンの /collect から送るログ（ADR-068）。どのパスでも受ける。
  # 同一オリジンで受けるため CORS は設定しない（ADR-014）。
  faro:
    # 既定は localhost。Compose はホストの Vite から受けるため 0.0.0.0 に上書きする。
    endpoint: ${env:OTEL_COLLECTOR_FARO_HTTP_ENDPOINT:-localhost:12347}
    # Errors だけの既定のバッチ（最大 50 件）に十分な余裕を持たせた上限（1 MiB）。超えると 400 で捨てる。
    max_request_body_size: 1048576
  # ブラウザが Reporting API で同一オリジンの /csp-report から送る CSP 違反の報告（ADR-068）。
  # 同一オリジンで受けるため CORS は設定しない（ADR-014）。
  webhook_event:
    # 既定は localhost。Compose はホストの Vite から受けるため 0.0.0.0 に上書きする。
    endpoint: ${env:OTEL_COLLECTOR_CSP_REPORT_HTTP_ENDPOINT:-localhost:12348}
    path: /csp-report
    # Chromium が送る Content-Type と完全一致しない request は 401 で捨てる（charset 付きも拒否する）。
    # 別オリジンのページが preflight なしで送れる text/plain の POST を受けないためである。
    required_header:
      key: Content-Type
      value: application/reports+json
    # 報告 1 件は約 800 バイト。1 回の POST で約 80 件まで受ける上限（64 KiB）。超えると 400 で捨てる。
    max_request_body_size: 65536

processors:
  transform/log_attributes:
    log_statements:
      # ログ属性の allowlist。属性を足すときは docs/observability/conventions.md と同じ変更で直す。
      - keep_keys(log.attributes, ["exception.type", "exception.message", "exception.stacktrace", "http.response.status_code", "conflict.kind"])
  # faro receiver の logfmt 本文を解析し、型と値を検証した record だけへ Collector 内部の印を付ける。
  transform/frontend_validate:
    error_mode: silent
    log_statements:
      - delete_key(log.attributes, "frontend.accepted")
      - delete_key(log.attributes, "frontend.session")
      - delete_key(log.attributes, "frontend.view")
      - replace_pattern(log.body, "'", "\u0001")
      - merge_maps(log.cache, ParseKeyValue(log.body), "upsert")
      - replace_all_patterns(log.cache, "value", "\u0001", "'")
      - set(log.attributes["frontend.type"], log.cache["type"])
      - set(log.attributes["frontend.value"], log.cache["value"])
      - set(log.attributes["frontend.stacktrace"], log.cache["stacktrace"]) where log.cache["stacktrace"] != nil
      # session ID の形式（Faro の genShortID が作る 10 文字）はここだけに書く。
      - set(log.attributes["frontend.session"], log.cache["session_id"]) where IsMatch(log.cache["session_id"], "^[a-km-zA-HJ-NP-Z0-9]{10}$$")
      - set(log.cache["route"], log.cache["view_name"]) where log.attributes["kind"] != "event"
      - set(log.cache["route"], log.cache["event_data_toView"]) where log.attributes["kind"] == "event"
      # route の allowlist はこの 1 行だけに書く。task fe-route-tree-check と task otel-collector-check が routeTree.gen.ts と照合する。
      - set(log.attributes["frontend.view"], log.cache["route"]) where IsMatch(log.cache["route"], "^(?:/|/logged-out|/orders/|/orders/[$$]orderId/|/orders/new)$$")
      - set(log.attributes["frontend.lcp"], Double(log.cache["value_lcp"])) where Len(log.cache["value_lcp"]) >= 1 and Len(log.cache["value_lcp"]) <= 32 and IsMatch(log.cache["value_lcp"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.inp"], Double(log.cache["value_inp"])) where Len(log.cache["value_inp"]) >= 1 and Len(log.cache["value_inp"]) <= 32 and IsMatch(log.cache["value_inp"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.cls"], Double(log.cache["value_cls"])) where Len(log.cache["value_cls"]) >= 1 and Len(log.cache["value_cls"]) <= 32 and IsMatch(log.cache["value_cls"], "^[0-9]+(?:\\.[0-9]+)?$$")
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "exception" and log.attributes["frontend.session"] != nil and IsMatch(log.cache["type"], "^[A-Za-z_$$][A-Za-z0-9_$$.]{0,127}$$") and Len(log.cache["value"]) <= 8192 and (log.cache["stacktrace"] == nil or Len(log.cache["stacktrace"]) <= 65536)
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "event" and log.cache["event_name"] == "view_changed" and log.attributes["frontend.session"] != nil and log.attributes["frontend.view"] != nil
      - set(log.attributes["frontend.accepted"], "true") where log.attributes["kind"] == "measurement" and log.cache["type"] == "web-vitals" and log.attributes["frontend.session"] != nil and log.attributes["frontend.view"] != nil and ((log.attributes["frontend.lcp"] != nil and log.attributes["frontend.lcp"] >= 0 and log.cache["value_inp"] == nil and log.cache["value_cls"] == nil) or (log.cache["value_lcp"] == nil and log.attributes["frontend.inp"] != nil and log.attributes["frontend.inp"] >= 0 and log.cache["value_cls"] == nil) or (log.cache["value_lcp"] == nil and log.cache["value_inp"] == nil and log.attributes["frontend.cls"] != nil and log.attributes["frontend.cls"] >= 0))
  filter/frontend_logs:
    error_mode: silent
    logs:
      log_record:
        - log.attributes["frontend.accepted"] != "true"
  # 検証済みの候補だけから固定本文と最終属性を作る。
  transform/frontend_logs:
    error_mode: silent
    log_statements:
      - set(log.attributes["exception.type"], log.attributes["frontend.type"]) where log.attributes["kind"] == "exception"
      - set(log.attributes["view.name"], log.attributes["frontend.view"]) where log.attributes["frontend.view"] != nil
      - set(log.attributes["session.id"], log.attributes["frontend.session"])
      - set(log.attributes["telemetry.signal"], "exception") where log.attributes["kind"] == "exception"
      - set(log.attributes["telemetry.signal"], "view") where log.attributes["kind"] == "event"
      - set(log.attributes["telemetry.signal"], "web-vital") where log.attributes["kind"] == "measurement"
      - set(log.attributes["measurement.type"], "web-vitals") where log.attributes["kind"] == "measurement"
      - set(log.attributes["measurement.name"], "lcp") where log.attributes["frontend.lcp"] != nil
      - set(log.attributes["measurement.name"], "inp") where log.attributes["frontend.inp"] != nil
      - set(log.attributes["measurement.name"], "cls") where log.attributes["frontend.cls"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.lcp"]) where log.attributes["frontend.lcp"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.inp"]) where log.attributes["frontend.inp"] != nil
      - set(log.attributes["measurement.value"], log.attributes["frontend.cls"]) where log.attributes["frontend.cls"] != nil
      # 例外の文字列だけを log.cache で置換し、view.name などの属性に置換を及ぼさない。
      - set(log.cache["exception.message"], log.attributes["frontend.value"]) where log.attributes["kind"] == "exception"
      - set(log.cache["exception.stacktrace"], log.attributes["frontend.stacktrace"]) where log.attributes["kind"] == "exception" and log.attributes["frontend.stacktrace"] != nil
      # 送り手が置いた退避用の制御文字を先に消す。
      - replace_all_patterns(log.cache, "value", "[\u0002\u0003]", "") where log.attributes["kind"] == "exception"
      # 同一オリジンのビルドのファイル名（/assets/<名前>.js:行:列）だけを退避する（ADR-068）。
      # hash 付きのファイル名は秘密を含まず、source map で行と列を戻すのに要る。origin は落とし、query か fragment を持つ URL は退避しない。
      - replace_all_patterns(log.cache, "value", "(^|[^A-Za-z0-9+.-])(?:[Hh][Tt][Tt][Pp][Ss]?://[^/\\s\\\\?#]+)?/assets/([\\w.-]+)\\.js:(\\d+):(\\d+)(\\)|\\s|$$)", "$$1\u0002$$2\u0003:$$3:$$4$$5") where log.attributes["kind"] == "exception"
      # stack frame の URL を先に置換し、行番号と列番号を残す。その後、一般の URL token 全体を置換する。
      - replace_all_patterns(log.cache, "value", "(^|[^A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*:[^\\s\\\\]*)(:\\d+:\\d+\\))", "$$1[redacted-url]$$3") where log.attributes["kind"] == "exception"
      - replace_all_patterns(log.cache, "value", "(^|[^A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*:[^\\s\\\\]+)", "$$1[redacted-url]") where log.attributes["kind"] == "exception"
      - replace_all_patterns(log.cache, "value", "(^|[^A-Za-z0-9%/._~-])(/[^\\s\\\\]+)", "$$1[redacted-url]") where log.attributes["kind"] == "exception"
      - replace_all_patterns(log.cache, "value", "\u0002([\\w.-]+)\u0003", "/assets/$$1.js") where log.attributes["kind"] == "exception"
      - merge_maps(log.attributes, log.cache, "upsert") where log.attributes["kind"] == "exception"
      - set(log.body, "Browser exception") where log.attributes["kind"] == "exception"
      - set(log.body, "Browser view") where log.attributes["kind"] == "event"
      - set(log.body, "Browser web vital") where log.attributes["kind"] == "measurement"
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - delete_key(resource.attributes, "service.namespace") where not IsMatch(resource.attributes["service.namespace"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "service.version") where not IsMatch(resource.attributes["service.version"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "deployment.environment.name") where not IsMatch(resource.attributes["deployment.environment.name"], "^[A-Za-z0-9._-]{1,64}$$")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      - keep_keys(log.attributes, ["telemetry.signal", "exception.type", "exception.message", "exception.stacktrace", "view.name", "measurement.type", "measurement.name", "measurement.value", "session.id"])
  # webhook_event の本文（application/reports+json の配列の文字列）を解析する。解析できなければ文字列のまま残り、検証で捨てる。
  transform/frontend_csp_parse:
    error_mode: silent
    log_statements:
      - set(log.body, ParseJSON(log.body)) where IsString(log.body)
  # 1 回の POST が持つ複数の報告を、報告ごとの record に分ける。Slice でない本文はそのまま通り、検証で捨てる。
  unroll/frontend_csp: {}
  # csp-violation の型と値を検証した record だけへ Collector 内部の印を付ける。
  # deprecation、intervention、crash などの他の型と、旧形式の report-uri の本文には印が付かない。
  transform/frontend_csp_validate:
    error_mode: silent
    log_statements:
      - delete_key(log.attributes, "frontend.accepted")
      - set(log.attributes["frontend.accepted"], "true") where IsMap(log.body) and log.body["type"] == "csp-violation" and IsMap(log.body["body"]) and IsMatch(log.body["body"]["effectiveDirective"], "^[a-z-]{1,64}$$") and IsMatch(log.body["body"]["disposition"], "^(enforce|report)$$")
  filter/frontend_csp:
    error_mode: silent
    logs:
      log_record:
        - log.attributes["frontend.accepted"] != "true"
  # 検証済みの報告から固定本文と最終属性を作る。文書の URL は残さず、blockedURL は origin か scheme かキーワードまで縮約する。
  # 属性を足すときは docs/observability/conventions.md と同じ変更で直す。
  transform/frontend_csp:
    error_mode: silent
    log_statements:
      - set(log.cache["blocked"], log.body["body"]["blockedURL"]) where IsString(log.body["body"]["blockedURL"]) and Len(log.body["body"]["blockedURL"]) <= 8192
      - set(log.cache["source"], log.body["body"]["sourceFile"]) where IsString(log.body["body"]["sourceFile"]) and Len(log.body["body"]["sourceFile"]) <= 8192
      # inline、eval、data などのキーワードはそのまま残す。
      - set(log.attributes["csp.blocked"], log.cache["blocked"]) where IsMatch(log.cache["blocked"], "^[a-z-]{1,32}$$")
      # 階層を持つ URL は scheme と host と port だけにし、userinfo、path、path parameter、query、fragment を落とす。
      # authority の全体が hostname か角括弧の IPv6 と数値の port に一致しなければ残さない。@ を重ねた URL と数値でない port は落とす。
      # \ は WHATWG URL と同じく path の始まりとみなすので、\@ で区切りをごまかした URL は \ の前の host になる。
      - set(log.cache["origin"], ExtractPatterns(log.cache["blocked"], "^(?P<scheme>[A-Za-z][A-Za-z0-9+.-]*://)(?:[^/?#@\\s\\\\]*@)?(?P<authority>(?:[A-Za-z0-9.-]+|\\[[0-9A-Fa-f:.]+\\])(?::[0-9]{1,5})?)(?:[/?#;\\\\]|$$)"))
      - set(log.attributes["csp.blocked"], Concat([log.cache["origin"]["scheme"], log.cache["origin"]["authority"]], "")) where log.attributes["csp.blocked"] == nil and log.cache["origin"]["authority"] != nil
      # data: のような階層を持たない URL は scheme だけを残す。authority が不正な階層 URL を scheme に縮約しない。
      - set(log.attributes["csp.blocked"], ExtractPatterns(log.cache["blocked"], "^(?P<scheme>[A-Za-z][A-Za-z0-9+.-]*):")["scheme"]) where log.attributes["csp.blocked"] == nil and not IsMatch(log.cache["blocked"], "^[A-Za-z][A-Za-z0-9+.-]*://")
      - set(log.attributes["csp.blocked"], ConvertCase(log.attributes["csp.blocked"], "lower")) where log.attributes["csp.blocked"] != nil
      # 長すぎる origin は送り手が任意の値を詰められるので残さない。
      - delete_key(log.attributes, "csp.blocked") where Len(log.attributes["csp.blocked"]) > 300
      # 違反した文書と同一オリジンの /assets/<名前>.js だけを、origin を落とした path で残す。query か fragment を持つ URL は残さない。
      # 別オリジンの同名の path を自分の asset と取り違えないためである。documentURL は比べるだけで属性に残さない。
      - set(log.cache["document_origin"], ConvertCase(ExtractPatterns(log.body["body"]["documentURL"], "^(?P<origin>[Hh][Tt][Tt][Pp][Ss]?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?)(?:[/?#;]|$$)")["origin"], "lower")) where IsString(log.body["body"]["documentURL"]) and Len(log.body["body"]["documentURL"]) <= 8192
      - set(log.cache["source_match"], ExtractPatterns(log.cache["source"], "^(?P<origin>[Hh][Tt][Tt][Pp][Ss]?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?)(?P<path>/assets/[\\w.-]+\\.js)$$"))
      - set(log.attributes["code.file.path"], log.cache["source_match"]["path"]) where log.cache["document_origin"] != nil and ConvertCase(log.cache["source_match"]["origin"], "lower") == log.cache["document_origin"]
      - set(log.attributes["code.line.number"], Int(log.body["body"]["lineNumber"])) where IsDouble(log.body["body"]["lineNumber"]) and log.body["body"]["lineNumber"] >= 0 and log.body["body"]["lineNumber"] <= 2147483647
      - set(log.attributes["code.column.number"], Int(log.body["body"]["columnNumber"])) where IsDouble(log.body["body"]["columnNumber"]) and log.body["body"]["columnNumber"] >= 0 and log.body["body"]["columnNumber"] <= 2147483647
      - set(log.attributes["csp.directive"], log.body["body"]["effectiveDirective"])
      - set(log.attributes["csp.disposition"], log.body["body"]["disposition"])
      - set(log.attributes["telemetry.signal"], "csp-violation")
      - set(log.body, "Browser CSP violation")
      # webhook_event は resource 属性を付けない。logs/frontend と同じ 4 つを Collector の値で付ける。
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - set(resource.attributes["service.namespace"], "${env:OTEL_SERVICE_NAMESPACE:-}")
      - set(resource.attributes["service.version"], "${env:FRONTEND_SERVICE_VERSION:-unknown}")
      - set(resource.attributes["deployment.environment.name"], "${env:OTEL_DEPLOYMENT_ENVIRONMENT_NAME:-}")
      - delete_key(resource.attributes, "service.namespace") where not IsMatch(resource.attributes["service.namespace"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "service.version") where not IsMatch(resource.attributes["service.version"], "^[A-Za-z0-9._-]{1,64}$$")
      - delete_key(resource.attributes, "deployment.environment.name") where not IsMatch(resource.attributes["deployment.environment.name"], "^[A-Za-z0-9._-]{1,64}$$")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      # receiver が付ける scope の属性（source、receiver）は traces/frontend と同じく消す。
      - keep_keys(scope.attributes, [])
      - keep_keys(log.attributes, ["telemetry.signal", "csp.directive", "csp.disposition", "csp.blocked", "code.file.path", "code.line.number", "code.column.number"])
  # フロントエンドの span も filter と transform の 2 段で守る。/collect は誰でも送れる（ADR-068）ので、送り手が書ける値を信頼しない。
  # span の event は例外のメッセージなどを持ちうるので、すべて捨てる。
  filter/frontend_span_events:
    error_mode: silent
    traces:
      spanevent:
        # 引用符を外すと YAML の bool になり、Collector が起動しない。
        - 'true'
  # フロントエンドの span。許可した属性だけを残し、送り手が自由に書ける名前、status の message、trace_state、scope を固定の値か空にする。
  # 属性を足すときは docs/observability/conventions.md と同じ変更で直す。
  transform/frontend_traces:
    # 解析に失敗した文は飛ばし、keep_keys で許可した属性以外を残さない側に倒す。
    error_mode: silent
    trace_statements:
      # URL は route template を安全に得られないため、最後の keep_keys ですべて削除する。
      - delete_key(span.attributes, "http.request.method") where not IsMatch(span.attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$$")
      - delete_key(span.attributes, "http.response.status_code") where span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599
      # 計装の名前は method だけだが、/collect に直接送られた名前は自由な文字列になりうる。method は http.request.method に残る。
      - set(span.name, "Browser request")
      - set(span.status.message, "")
      - set(span.trace_state, "")
      # links とその属性も送り手が自由に書ける。ブラウザの計装は links を作らないので、すべて捨てる。
      - set(span.links, nil)
      - set(scope.name, "browser")
      - set(scope.version, "")
      - keep_keys(scope.attributes, [])
      # logs/frontend と同じく、service.name は Collector の値で上書きし、バックエンドの名前を名乗らせない。
      - set(resource.attributes["service.name"], "${env:FRONTEND_OTEL_SERVICE_NAME:-demo-web}")
      - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name"])
      - keep_keys(span.attributes, ["http.request.method", "http.response.status_code"])

exporters:
  # ローカルの Grafana OpenTelemetry LGTM。
  otlp_http/lgtm:
    endpoint: http://otel-lgtm:4318

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/log_attributes]
      exporters: [otlp_http/lgtm]
    # バックエンドの allowlist と混ぜないため、フロントエンドの pipeline を分ける。
    logs/frontend:
      receivers: [faro]
      processors: [transform/frontend_validate, filter/frontend_logs, transform/frontend_logs]
      exporters: [otlp_http/lgtm]
    # CSP 違反の報告。faro と本文の形式も allowlist も違うので、logs/frontend と分ける。
    logs/frontend_csp:
      receivers: [webhook_event]
      processors: [transform/frontend_csp_parse, unroll/frontend_csp, transform/frontend_csp_validate, filter/frontend_csp, transform/frontend_csp]
      exporters: [otlp_http/lgtm]
    traces:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
    traces/frontend:
      receivers: [faro]
      processors: [filter/frontend_span_events, transform/frontend_traces]
      exporters: [otlp_http/lgtm]
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/lgtm]
