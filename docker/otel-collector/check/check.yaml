# task otel-collector-check 用の上書き設定。
# config.yaml の processors はそのまま使い、出口だけをファイルに差し替える。

exporters:
  # バックエンドとフロントエンドで出口を分け、それぞれ別の jq で検査する。
  file/check:
    path: /out/backend.json
  file/check_frontend:
    path: /out/frontend.json
  file/check_frontend_csp:
    path: /out/frontend-csp.json

service:
  telemetry:
    logs:
      # 既定は同じ message の warn を 1 秒に 10 件までに間引く。間引くと、statement の失敗が見えなくなる。
      sampling:
        enabled: false
  pipelines:
    logs:
      exporters: [file/check]
    logs/frontend:
      exporters: [file/check_frontend]
    logs/frontend_csp:
      exporters: [file/check_frontend_csp]
    traces:
      exporters: [file/check]
    metrics:
      exporters: [file/check]
