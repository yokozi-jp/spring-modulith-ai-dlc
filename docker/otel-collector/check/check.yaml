# task otel-collector-check 用の上書き設定。
# config.yaml の processors はそのまま使い、出口だけをファイルに差し替える。

exporters:
  file/check:
    path: /out/telemetry.json
  # フロントエンドの出口は別のファイルにし、既存のバックエンドの jq の検査を変えない。
  file/check_frontend:
    path: /out/frontend.json

service:
  pipelines:
    logs:
      exporters: [file/check]
    logs/frontend:
      exporters: [file/check_frontend]
    traces:
      exporters: [file/check]
    metrics:
      exporters: [file/check]
