# task otel-collector-check 用の上書き設定。
# config.yaml の processors はそのまま使い、出口だけをファイルに差し替える。

exporters:
  # バックエンドとフロントエンドで出口を分け、それぞれ別の jq で検査する。
  file/check:
    path: /out/backend.json
  file/check_frontend:
    path: /out/frontend.json
  file/check_frontend_traces:
    path: /out/frontend-traces.json

service:
  pipelines:
    logs:
      exporters: [file/check]
    logs/frontend:
      exporters: [file/check_frontend]
    traces:
      exporters: [file/check]
    traces/frontend:
      exporters: [file/check_frontend_traces]
    metrics:
      exporters: [file/check]
