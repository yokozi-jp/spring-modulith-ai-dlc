/*
 * DBマイグレーションとjOOQコード生成
 *
 * このスクリプトは build.gradle から apply from で読み込む。アプリのビルド定義
 * （依存・品質ツール）と、DB運用のワークフロー定義（マイグレーション・切り戻し・
 * コード生成）を分離し、build.gradle を肥大化させないために切り出している。
 *
 * 通常のビルドとアプリケーション起動はDBを変更せず、DBにも接続しない。
 * migrateDatabase と jooqCodegen は個別に実行でき、migrateAndGenerateJooq を明示した場合だけ
 * Liquibase updateの完了後に最新スキーマからjOOQコードを生成する。
 *
 * 本番ではMIGRATION_DB_*とCODEGEN_DB_*を専用資格情報として注入できる。
 * ローカルでは既存のDB_*へフォールバックするが、ユーザー名とパスワードに既定値は持たせない。
 */
def databaseHost = System.getenv('DB_HOST') ?: 'localhost'
def databasePort = System.getenv('DB_PORT') ?: '5432'
def databaseName = System.getenv('DB_NAME') ?: 'demo'
def defaultDatabaseUrl = System.getenv('DB_URL') ?: "jdbc:postgresql://${databaseHost}:${databasePort}/${databaseName}"
def defaultDatabaseSchema = System.getenv('DB_SCHEMA') ?: 'demo'

def migrationDatabaseUrl = System.getenv('MIGRATION_DB_URL') ?: defaultDatabaseUrl
def migrationDatabaseUsername = System.getenv('MIGRATION_DB_USERNAME') ?: System.getenv('DB_USERNAME') ?: ''
def migrationDatabasePassword = System.getenv('MIGRATION_DB_PASSWORD') ?: System.getenv('DB_PASSWORD') ?: ''
def migrationDatabaseSchema = System.getenv('MIGRATION_DB_SCHEMA') ?: defaultDatabaseSchema

def codegenDatabaseUrl = System.getenv('CODEGEN_DB_URL') ?: migrationDatabaseUrl
def codegenDatabaseUsername = System.getenv('CODEGEN_DB_USERNAME') ?: migrationDatabaseUsername
def codegenDatabasePassword = System.getenv('CODEGEN_DB_PASSWORD') ?: migrationDatabasePassword
def codegenDatabaseSchema = System.getenv('CODEGEN_DB_SCHEMA') ?: migrationDatabaseSchema

def requireDatabaseCredentials = { String operation, String username, String password ->
    if (username.isBlank() || password.isBlank()) {
        throw new IllegalArgumentException(
            "${operation}にはDB資格情報が必要です。" +
            'MIGRATION_DB_USERNAME/MIGRATION_DB_PASSWORD、CODEGEN_DB_USERNAME/CODEGEN_DB_PASSWORD、' +
            'またはDB_USERNAME/DB_PASSWORDを環境変数で指定してください。'
        )
    }
}

def currentDatabaseSchemaTag = providers.gradleProperty('databaseSchemaTag').get().trim()
def changelogFiles = fileTree('src/main/resources/db/changelog/changesets') {
    include '*.yaml'
}.files.sort { left, right -> left.name <=> right.name }
def explicitLiquibaseTag = findProperty('liquibaseTag')?.toString()?.trim()
def selectedLiquibaseTag = explicitLiquibaseTag ?: currentDatabaseSchemaTag
if (!hasProperty('liquibaseTag')) {
    // Liquibase Gradle pluginへ現在のスキーマタグを既定値として渡す。
    ext.liquibaseTag = selectedLiquibaseTag
}
def rollbackConfirmationProvider = providers.gradleProperty('confirmRollback')
def liquibaseTagPattern = ~/[A-Za-z0-9][A-Za-z0-9._-]{0,127}/

def validateLiquibaseTag = { String operation, String tagValue ->
    if (tagValue == null || tagValue.isEmpty()) {
        throw new IllegalArgumentException(
            "${operation}にはLiquibaseタグが必要です。"
        )
    }
    if (!(tagValue ==~ liquibaseTagPattern)) {
        throw new IllegalArgumentException(
            'Liquibaseタグは英数字で始まる128文字以内の英数字、ピリオド、アンダースコア、ハイフンにしてください。'
        )
    }
    tagValue
}

def requireExplicitRollbackTag = { String operation ->
    if (explicitLiquibaseTag == null || explicitLiquibaseTag.isEmpty()) {
        throw new IllegalArgumentException(
            "${operation}には-PliquibaseTag=<tag>が必要です。" +
            '本番では直前に成功したデプロイのスキーマタグをデプロイ履歴から指定してください。'
        )
    }
    validateLiquibaseTag(operation, explicitLiquibaseTag)
}

def requireRollbackConfirmation = {
    if (!'true'.equalsIgnoreCase(rollbackConfirmationProvider.orNull)) {
        throw new IllegalArgumentException(
            '切り戻しを実行するにはrollbackSqlとバックアップを確認してから-PconfirmRollback=trueを指定してください。'
        )
    }
}

liquibase {
    activities {
        main {
            changelogFile 'db/changelog/db.changelog-master.yaml'
            searchPath 'src/main/resources'
            url migrationDatabaseUrl
            username migrationDatabaseUsername
            password migrationDatabasePassword
            defaultSchemaName migrationDatabaseSchema
        }
    }
    runList = 'main'
}

jooq {
    // 公式プラグインとコード生成器をSpring Boot 4.1.1 BOMのjOOQ 3.21.7に一致させる。
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = codegenDatabaseUrl
            user = codegenDatabaseUsername
            password = codegenDatabasePassword
        }
        generator {
            name = 'org.jooq.codegen.JavaGenerator'
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = codegenDatabaseSchema
                includes = '.*'
                excludes = '(?i:DATABASECHANGELOG|DATABASECHANGELOGLOCK)'
                outputSchemaToDefault = true
                forcedTypes {
                    forcedType {
                        // PostgreSQLのtimestamptzを絶対時刻として扱い、アプリケーション型をInstantへ統一する。
                        name = 'INSTANT'
                        includeTypes = '(?i:TIMESTAMP WITH TIME ZONE|TIMESTAMPTZ)'
                    }
                }
            }
            generate {
                generatedAnnotation = true
                nullableAnnotation = true
                nullableAnnotationType = 'org.jspecify.annotations.Nullable'
                nonnullAnnotation = true
                nonnullAnnotationType = 'org.jspecify.annotations.NonNull'
            }
            target {
                packageName = 'com.example.demo.jooq'
                // 生成コードをコミットし、リリースビルドを稼働DBから独立させる。
                directory = 'src/generated/jooq'
                clean = true
            }
        }
    }
}

// 生成コードをコミット済みソースとして扱うことを明示し、プラグインの自動登録だけに依存しない。
sourceSets {
    main {
        java {
            srcDir 'src/generated/jooq'
        }
    }
}

dependencies {
    liquibaseRuntime 'org.liquibase:liquibase-core:5.0.4'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
}

def configureLiquibaseDatabaseTask = { task, String operation ->
    task.group = 'database migration'
    task.doFirst {
        requireDatabaseCredentials(operation, migrationDatabaseUsername, migrationDatabasePassword)
    }
}

tasks.named('update') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseマイグレーション')
    description = 'changelogの未適用changesetをすべて適用します（検証用途）。'
}

tasks.named('updateToTag') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseスキーママイグレーション')
    description = "changelogをスキーマタグ${currentDatabaseSchemaTag}まで適用します。"
    doFirst {
        validateLiquibaseTag('Liquibaseスキーママイグレーション', selectedLiquibaseTag)
    }
}

tasks.named('updateTestingRollback') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase rollback検証')
    description = '使い捨てDBでupdate、rollback、再updateを順序実行します。'
}

tasks.named('tag') {
    group = 'database migration'
    description = '命令的タグ付与は禁止されています。changelogのtagDatabase changesetを使用してください。'
    doFirst {
        throw new IllegalArgumentException(
            '命令的なLiquibase tagは使用しません。連番changelogへtagDatabase changesetを追加してください。'
        )
    }
}

tasks.named('tagExists') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseスキーマタグ情報表示')
    description = '選択されたタグの存在を表示します（終了コードは存在判定に使用しません）。'
    doFirst {
        validateLiquibaseTag('Liquibaseスキーマタグ情報表示', selectedLiquibaseTag)
    }
}

def validateRollbackTarget = tasks.register('validateRollbackTarget') {
    group = 'database migration'
    description = 'DB接続前に切り戻し対象タグと資格情報を検証します。'
    doLast {
        requireDatabaseCredentials('Liquibase切り戻し', migrationDatabaseUsername, migrationDatabasePassword)
        requireExplicitRollbackTag('Liquibase切り戻し')
    }
}

def validateCurrentSchemaTag = tasks.register('validateCurrentSchemaTag') {
    group = 'database migration'
    description = 'DB接続前にGit管理された現在のスキーマタグを検証します。'
    doLast {
        requireDatabaseCredentials('Liquibaseスキーママイグレーション', migrationDatabaseUsername, migrationDatabasePassword)
        validateLiquibaseTag('Liquibaseスキーママイグレーション', selectedLiquibaseTag)
        if (selectedLiquibaseTag != currentDatabaseSchemaTag) {
            throw new IllegalArgumentException(
                "migrateDatabaseは現在のスキーマタグ${currentDatabaseSchemaTag}だけを適用します。" +
                '切り戻しにはrollbackDatabaseを使用してください。'
            )
        }
        def tagDeclaration = "tag: ${currentDatabaseSchemaTag}"
        def filesDeclaringCurrentTag = changelogFiles.findAll { changelogFile ->
            changelogFile.readLines('UTF-8').any { line -> line.trim() == tagDeclaration }
        }
        if (filesDeclaringCurrentTag.size() != 1 || changelogFiles.last() != filesDeclaringCurrentTag[0]) {
            throw new IllegalArgumentException(
                "現在のスキーマタグ${currentDatabaseSchemaTag}は連番changelogの末尾に一度だけ宣言してください。"
            )
        }
    }
}

def validateRollbackExecution = tasks.register('validateRollbackExecution') {
    group = 'database migration'
    description = 'DB接続前に切り戻し対象タグ、資格情報、明示確認を検証します。'
    doLast {
        requireDatabaseCredentials('Liquibase切り戻し', migrationDatabaseUsername, migrationDatabasePassword)
        requireExplicitRollbackTag('Liquibase切り戻し')
        requireRollbackConfirmation()
    }
}

/*
 * LiquibaseのtagExistsコマンドは、タグが存在しなくても終了コード0を返す。
 * リリースゲートでは終了コードへ依存せず、DATABASECHANGELOGを直接照会して存在を保証する。
 * JDBCドライバは既存のjooqCodegen構成から読み込み、通常ビルドの実行時クラスパスへ追加しない。
 * 生JDBCの照会ロジックは buildSrc の AssertSchemaTagExistsTask（型付きタスク）に置く。
 */
def schemaTagVerificationClasspath = configurations.jooqCodegen
def assertSchemaTagExists = tasks.register('assertSchemaTagExists', migration.AssertSchemaTagExistsTask) {
    group = 'database migration'
    description = 'DATABASECHANGELOGを直接照会し、選択されたタグが存在しなければ失敗します。'
    driverClasspath.from(schemaTagVerificationClasspath)
    jdbcUrl.set(migrationDatabaseUrl)
    username.set(migrationDatabaseUsername)
    password.set(migrationDatabasePassword)
    schema.set(migrationDatabaseSchema)
    tag.set(selectedLiquibaseTag)
    doFirst {
        requireDatabaseCredentials('Liquibaseスキーマタグ存在確認', migrationDatabaseUsername, migrationDatabasePassword)
        validateLiquibaseTag('Liquibaseスキーマタグ存在確認', selectedLiquibaseTag)
    }
}

tasks.named('updateToTag') {
    mustRunAfter validateCurrentSchemaTag
}

assertSchemaTagExists.configure {
    mustRunAfter tasks.named('updateToTag'), tasks.named('updateTestingRollback')
    mustRunAfter validateCurrentSchemaTag, validateRollbackTarget, validateRollbackExecution
}

tasks.named('rollbackSql') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase切り戻しSQL生成')
    description = 'DBを変更せず、明示したタグまでの切り戻しSQLを生成します。'
    doFirst {
        requireExplicitRollbackTag('Liquibase切り戻しSQL生成')
    }
    mustRunAfter assertSchemaTagExists
}

tasks.named('rollback') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase切り戻し')
    description = '明示確認後に指定タグより後のchangesetを切り戻します。'
    doFirst {
        requireExplicitRollbackTag('Liquibase切り戻し')
        requireRollbackConfirmation()
    }
    mustRunAfter assertSchemaTagExists
}

def migrateDatabase = tasks.register('migrateDatabase') {
    group = 'database migration'
    description = "スキーマタグ${currentDatabaseSchemaTag}まで適用し、タグを確認します。"
    dependsOn validateCurrentSchemaTag, tasks.named('updateToTag'), assertSchemaTagExists
}

tasks.named('jooqCodegen') {
    group = 'jOOQ code generation'
    description = '現在のDBスキーマからjOOQソースを生成します（マイグレーションは実行しません）。'
    mustRunAfter migrateDatabase, tasks.named('updateToTag'), assertSchemaTagExists
    doFirst {
        requireDatabaseCredentials('jOOQコード生成', codegenDatabaseUsername, codegenDatabasePassword)
    }
}

tasks.register('migrateAndGenerateJooq') {
    group = 'database migration'
    description = 'スキーマタグまで適用してからjOOQソースを生成します。'
    dependsOn migrateDatabase, tasks.named('jooqCodegen')
}

def verifyDatabaseMigrations = tasks.register('verifyDatabaseMigrations') {
    group = 'verification'
    description = '使い捨てDBで全changesetのupdate、rollback、再updateと現在タグの存在を検証します。'
    dependsOn tasks.named('updateTestingRollback'), assertSchemaTagExists
}

tasks.named('test') {
    mustRunAfter verifyDatabaseMigrations
}

tasks.register('checkCurrentSchemaTag') {
    group = 'database migration'
    description = "現在のスキーマタグ${currentDatabaseSchemaTag}の存在を確認します。"
    dependsOn validateCurrentSchemaTag, assertSchemaTagExists
}

tasks.register('checkRollbackTag') {
    group = 'database migration'
    description = '明示した切り戻し対象タグの存在を確認します。'
    dependsOn validateRollbackTarget, assertSchemaTagExists
}

tasks.register('previewDatabaseRollback') {
    group = 'database migration'
    description = '明示したタグの存在確認後に切り戻しSQLを生成します（DBは変更しません）。'
    dependsOn validateRollbackTarget, assertSchemaTagExists, tasks.named('rollbackSql')
}

tasks.register('rollbackDatabase') {
    group = 'database migration'
    description = '明示したタグの存在確認後に切り戻します（confirmRollback=true必須）。'
    dependsOn validateRollbackExecution, assertSchemaTagExists, tasks.named('rollback')
}
