# このファイルの方針:
#   環境変数（DB/Redis など）の参照にはデフォルト値を設定しない。
#   設定漏れをアプリ起動時に検知しやすくするため（未設定なら起動に失敗させる）。

# コンソールは収集基盤やコンテナランタイムが解釈できる ECS JSON で出力する。
# traceId / spanId は Micrometer Tracing が設定する MDC から追加される。
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${OTEL_SERVICE_NAME}
        environment: ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME}

spring:
  application:
    name: demo

  # ローカル: リポジトリルートの .env で環境変数を定義する。
  #   task be-run は backend/ を作業ディレクトリに起動するため、参照先は ../.env。
  # STG/本番: ECS タスク定義の environment / secrets で環境変数を注入する（.env は無いので optional）。
  config:
    import: optional:file:../.env[.properties]

  # API と Bean Validation の文言を ResourceBundle から解決する。
  # 実行ホストの locale へ fallback させず、Accept-Language と既定の日本語だけで決定する。
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Spring MVC の標準例外を RFC 9457 Problem Details で返す。
  mvc:
    problemdetails:
      enabled: true

  # 仮想スレッドを有効化し、待機中のリクエストが占有するプラットフォームスレッドを減らす。
  # Java 25 では synchronized による pinning は JEP 491 で解消済み。
  # native 呼び出しなどの残る pinning は、外部連携追加時の JFR 負荷スモークで確認する。
  threads:
    virtual:
      enabled: true

  # DB
  datasource:
    # ホスト起動では localhost、Compose の backend profile では postgres サービスを指す。
    # URL 全体でなく部品（DB_HOST/DB_PORT/DB_NAME）から組み立て、公開ポートと二重管理しない。
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB の接続予算から環境ごとに算出する。仮想スレッド数からは決めない。
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE}
      # pool 枯渇時にリクエストを無期限に待たせず、上位の時間予算内で失敗させる。
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
      # minimum-idle は未指定とし、HikariCP の固定サイズ pool の既定動作を使う。
      # モジュールスキーマ名は環境差を持たないアーキテクチャ上の固定値。
      schema: modulith
      # 新しい物理接続ごとにDBセッションの日時解釈と表示をUTCへ固定する。
      connection-init-sql: SET TIME ZONE 'UTC'

  # DBマイグレーションはアプリ起動から分離済み（spring-boot-starter-liquibase を依存に持たず、
  # 起動時の自動実行は起こらない）。変更は ./gradlew migrateDatabase などの明示コマンドで適用する。

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  session:
    data:
      redis:
        namespace: ${REDIS_SESSION_NAMESPACE}

  # OIDC Client: Authorization Code Flow を使用するサーバーサイド Web クライアント。
  # PKCE は SecurityConfig で認可リクエストごとに S256 の challenge を付与する。
  security:
    oauth2:
      client:
        registration:
          web:
            provider: oidc
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}

  # Jackson（JSON シリアライズ/デシリアライズ）: Spring Boot 4 のデフォルトである Jackson 3 を使う。
  # 自動構成された JsonMapper をプロパティで調整する（独自 Bean で丸ごと差し替えない）。
  jackson:
    # Jackson の日時フォーマット時に使用するコンテキスト TZ を UTC に固定する
    # 絶対時刻の API モデルには原則 Instant を使用する
    time-zone: UTC
    # null のプロパティは出力しない（レスポンスを軽くする）
    default-property-inclusion: non_null
    # 日付・時刻関連（Jackson 3 では SerializationFeature でなく DateTimeFeature）
    datatype:
      datetime:
        # 日付・時刻を数値でなく ISO-8601 文字列で出力する（[2025,9,5,...] を防ぐ）
        write-dates-as-timestamps: false
        # 期間（Duration）も数値でなく ISO-8601 文字列で出力する
        write-durations-as-timestamps: false
    deserialization:
      # 未知のプロパティが来ても失敗させない（API の後方互換を保ちやすい）
      fail-on-unknown-properties: false
      # null を java プリミティブに代入しようとしたら失敗させる（不正データの早期検知）
      fail-on-null-for-primitives: true

  # Spring Modulith
  modulith:
    # 起動時にモジュール間の依存違反を検証し、違反があれば起動を失敗させる。
    runtime:
      verification-enabled: true
    events:
      # 完了したイベント出版レコードをアーカイブへ移し、調査可能な履歴を保持する。
      completion-mode: archive
      jdbc:
        # Spring Modulith が所有する共有インフラを業務モジュールのスキーマから分離する。
        schema: modulith
        # テーブル作成は Liquibase に一本化する。
        schema-initialization:
          enabled: false
      # 外部ブローカーへのイベント配信を導入するまで無効にする。
      externalization:
        enabled: false
      # 複数インスタンスでの競合を避けるため、起動時には自動再配信しない。
      republish-outstanding-events-on-restart: false

  # グレースフルシャットダウン（Spring Boot 4 ではデフォルトで有効）の待ち時間。
  # 処理中リクエストの完了を待つ上限。ECS の stopTimeout はこの値より大きくすること。
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 外部 client は依存先ごとに名前付き instance を定義し、client adapter の境界で適用する。
# 現在の PostgreSQL、Redis、OIDC 通信へは自動適用されない。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      # 非冪等処理を重複実行しないよう、明示しない retry は無効にする。
      default:
        max-attempts: 1
      # GET などの冪等な操作だけ、名前付き instance から base-config として継承する。
      idempotent:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
        cancel-running-future: true

# 組み込みサーバ（Tomcat）
server:
  # 待ち受けポート。環境ごとに指定する。
  port: ${SERVER_PORT}
  # ALB などプロキシ配下で X-Forwarded-* を解釈し、元のスキーム/ホスト/IP を復元する。
  # ローカルはヘッダが付かないため透過的（全環境共通で可）。
  forward-headers-strategy: framework
  servlet:
    session:
      # URL rewriting を無効化し、セッション ID は Cookie だけで送受信する。
      tracking-modes: cookie
      cookie:
        # アプリケーションが管理するセッション Cookie であることを明示する。
        name: APP_SESSION
        # JavaScript から Cookie を読めなくする（XSS によるセッション窃取対策）
        http-only: true
        # HTTPS 経由でのみ Cookie を送る。本番/STG は true、ローカル（HTTP）は false。
        secure: ${SESSION_COOKIE_SECURE}
        # クロスサイトでの Cookie 送信を制限する（CSRF 対策）
        same-site: lax

# Actuator: 監視・ヘルスチェック用エンドポイント
# ローカル・本番（ECS）共通。ECS/ALB のヘルスチェックは /actuator/health/readiness を使う。
management:
  endpoints:
    web:
      exposure:
        # OTLP は push 方式なので、Web には health だけを露出する。
        include: health
  endpoint:
    health:
      # 認証状態にかかわらず、DB や Redis などのコンポーネント詳細を公開しない。
      show-details: never
      # ECS と通常の Docker でも liveness/readiness の health group を有効にする。
      probes:
        enabled: true
  # OpenTelemetry の出力先（spring-boot-starter-opentelemetry）。
  # メトリクスは Micrometer の OTLP レジストリ（management.otlp.metrics）、
  # トレース・ログは OpenTelemetry SDK（management.opentelemetry.*）が別プロパティ体系で担う。
  # 3 シグナルとも標準環境変数 OTEL_EXPORTER_OTLP_ENDPOINT の OTLP/HTTP URL を基点にする。
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
  opentelemetry:
    resource-attributes:
      "[service.name]": ${OTEL_SERVICE_NAME}
      "[deployment.environment.name]": ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  tracing:
    sampling:
      # ローカルは 1.0、本番はトラフィック量と保存コストに応じて引き下げる。
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

# API ドキュメント（springdoc-openapi / Swagger UI）
# 有効/無効は環境変数で切り替える。本番は false、ローカル/STG は必要に応じて true。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
    # Spectralとクライアント生成が解釈する契約版を明示する。
    version: openapi-3-1
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}
