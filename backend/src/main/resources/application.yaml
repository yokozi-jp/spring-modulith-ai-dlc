# このファイルの方針:
#   環境変数（DB など）の参照にはデフォルト値を設定しない。
#   設定漏れをアプリ起動時に検知しやすくするため（未設定なら起動に失敗させる）。

# コンソールは収集基盤やコンテナランタイムが解釈できる ECS JSON で出力する。
# traceId / spanId は Micrometer Tracing が設定する MDC から追加される。
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${OTEL_SERVICE_NAME}
        environment: ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME}
  # 405 で基底クラスが出す WARN を抑える。405 は ApiExceptionHandler が INFO で記録する。
  level:
    org.springframework.web.servlet.PageNotFound: error

spring:
  application:
    name: demo

  # ローカル: リポジトリルートの .env で環境変数を定義する。
  #   task be-run は backend/ を作業ディレクトリに起動するため、参照先は ../.env。
  # STG/本番: ECS タスク定義の environment / secrets で環境変数を注入する（.env は無いので optional）。
  config:
    import: optional:file:../.env[.properties]

  # API と Bean Validation の文言を ResourceBundle から解決する。
  # 実行ホストの locale へ fallback させず、Accept-Language と既定の日本語だけで決定する。
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Spring MVC の標準例外を RFC 9457 Problem Details で返す。
  mvc:
    problemdetails:
      enabled: true

  # 仮想スレッドを有効化し、待機中のリクエストが占有するプラットフォームスレッドを減らす。
  # Java 25 では synchronized による pinning は JEP 491 で解消済み。
  # native 呼び出しなどの残る pinning は、外部連携追加時の JFR 負荷スモークで確認する。
  threads:
    virtual:
      enabled: true

  # @Async の Listener へ発行元の trace を引き継ぐ（docs/integration/async-observability.md）。
  # 利用者の認証も伝わるが、Listener の中の書き込みの *_by は認証を使わず pgm_cd にする（ADR-051）。
  task:
    execution:
      propagate-context: true
      # 非同期の Listener の同時実行数の上限（docs/integration/async-flow-control.md）。
      # Listener は DB 接続を使い、決済代行を待つ間も接続を持つため、同期リクエストの接続を残すよう、
      # 最小の pool（テストの DB_POOL_MAXIMUM_SIZE=4）の半分にする。DemoApplicationTest が pool の半分以下であることを確かめる。
      # ponytail: 上限に達すると SimpleAsyncTaskExecutor は、コミットの後に Listener を投入する要求のスレッドを、接続を持ったまま待たせる。
      # 負荷試験で本番の pool の大きさが決まったら、pool から導いた環境変数にする。
      simple:
        concurrency-limit: 2

  # DB
  datasource:
    # ホスト起動では localhost、Compose の backend profile では postgres サービスを指す。
    # URL 全体でなく部品（DB_HOST/DB_PORT/DB_NAME）から組み立て、公開ポートと二重管理しない。
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB の接続予算から環境ごとに算出する。仮想スレッド数からは決めない。
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE}
      # pool 枯渇時にリクエストを無期限に待たせず、上位の時間予算内で失敗させる。
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
      # minimum-idle は未指定とし、HikariCP の固定サイズ pool の既定動作を使う。
      # モジュールスキーマ名は環境差を持たないアーキテクチャ上の固定値。
      schema: modulith
      # 新しい物理接続ごとに、DBセッションの日時解釈と表示をUTCへ固定し、
      # ロック待ち、文の実行、トランザクション中の待機の上限（ミリ秒）を設定する（ADR-055）。
      # 値は起動時に検証しない。三つとも 1 以上にする（0 は上限なしになる）。
      # lock_timeout < statement_timeout <= connection-timeout にする。postgresql.conf では設定しない。
      connection-init-sql: >-
        SET TIME ZONE 'UTC';
        SET lock_timeout = ${DB_LOCK_TIMEOUT_MS};
        SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS};
        SET idle_in_transaction_session_timeout = ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS}

  # DBマイグレーションはアプリ起動から分離済み（spring-boot-starter-liquibase を依存に持たず、
  # 起動時の自動実行は起こらない）。変更は ./gradlew migrateDatabase などの明示コマンドで適用する。

  # セッションは modulith スキーマの表に保存する（ADR-111）。表は Liquibase で作り、起動時には作らない。
  session:
    jdbc:
      table-name: modulith.spring_session
      initialize-schema: never

  # OIDC Client: Authorization Code Flow を使用するサーバーサイド Web クライアント。
  # PKCE は SecurityConfig で認可リクエストごとに S256 の challenge を付与する。
  security:
    oauth2:
      client:
        registration:
          web:
            provider: oidc
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}

  # 送信 HTTP クライアントの共通設定。Boot の RestClient.Builder を使う Client すべてに効く。
  http:
    clients:
      # 自分の値を持たない Boot の RestClient の既定。今は IdP のトークンの取得と、E2E の OIDC discovery が使う。
      # ログインは利用者が待つが、トランザクションの外なので、read-timeout は決済代行（2s）より長く 5s にする。
      # 決済代行は自分の値で上書きする。メールは AWS SDK の HTTP クライアントなので、この値を使わない。
      connect-timeout: 1s
      read-timeout: 5s
      # request factory を JDK の HttpClient に固定する（classpath にほかのクライアントがあっても変わらない）
      imperative:
        factory: jdk
      # リダイレクトを辿らない。設定にない URL へ請求や discovery を送り直さない
      redirects: dont-follow
  # Jackson（JSON シリアライズ/デシリアライズ）: Spring Boot 4 のデフォルトである Jackson 3 を使う。
  # 自動構成された JsonMapper をプロパティで調整する（独自 Bean で丸ごと差し替えない）。
  jackson:
    # Jackson の日時フォーマット時に使用するコンテキスト TZ を UTC に固定する
    # 絶対時刻の API モデルには原則 Instant を使用する
    time-zone: UTC
    # 寛容な読み取りを止める。LocalDate が "2023-09-29T15:00:00Z" のような時刻つきの文字列を
    # 2023-09-29 として受けると、東京の 9 月 30 日がずれる（docs/datetime/timezone-conventions.md）
    default-leniency: false
    # null のプロパティは出力しない（レスポンスを軽くする）
    default-property-inclusion: non_null
    # 日付・時刻関連（Jackson 3 では SerializationFeature でなく DateTimeFeature）
    datatype:
      datetime:
        # 日付・時刻を数値でなく ISO-8601 文字列で出力する（[2025,9,5,...] を防ぐ）
        write-dates-as-timestamps: false
        # 期間（Duration）も数値でなく ISO-8601 文字列で出力する
        write-durations-as-timestamps: false
    deserialization:
      # 未知のプロパティが来ても失敗させない（API の後方互換を保ちやすい）
      fail-on-unknown-properties: false
      # null を java プリミティブに代入しようとしたら失敗させる（不正データの早期検知）
      fail-on-null-for-primitives: true

  # Spring Modulith
  modulith:
    # 起動時にモジュール間の依存違反を検証し、違反があれば起動を失敗させる。
    runtime:
      verification-enabled: true
    events:
      # 完了したイベント出版レコードをアーカイブへ移し、調査可能な履歴を保持する。
      completion-mode: archive
      # 完了の記録を、リスナーのトランザクションの後の新しいトランザクションで行う（Spring Modulith 2.1 までの振る舞い、ADR-121）。
      # 2.2 の既定の in-listener はリスナーのトランザクションの中で記録し、モジュールのロール（ADR-094）が持たない modulith の表の権限を要する。
      completion: in-interceptor
      jdbc:
        # Spring Modulith が所有する共有インフラを業務モジュールのスキーマから分離する。
        schema: modulith
        # テーブル作成は Liquibase に一本化する。
        schema-initialization:
          enabled: false
      # 外部ブローカーへのイベント配信を導入するまで無効にする。
      externalization:
        enabled: false
      # 複数インスタンスでの競合を避けるため、起動時には自動再配信しない。
      republish-outstanding-events-on-restart: false
      # 落ちたまま PUBLISHED、PROCESSING、RESUBMITTED に残った出版を FAILED に戻す組み込みの Staleness Monitor は使わない（ADR-079）。
      # spring.modulith.events.staleness の閾値（published、processing、resubmitted）を書かなければ、StalenessMonitorConfiguration は読み込まれても定期のタスクを足さない。
      # 閾値を書くと起動に失敗する（EventPublicationResubmissionConfig.StalenessMonitorProperties）。
      # 同じ処理は、定期の再投入と手での 1 回の再投入が ShedLock のロックの中で、再投入の前に 1 文の UPDATE で行う（StalePublications）。
      # 閾値は event-publication.resubmission の wait-age（PUBLISHED）と in-flight-staleness（PROCESSING と RESUBMITTED）である。
      # 最初の配信が concurrency-limit の空きを待つ間に wait-age を過ぎた出版は重ねて再投入しうる。リスナーの冪等性に頼る。
      # 再投入の回数の上限。この回数目の再投入で失敗した出版を ABANDONED にして archive へ移す（ADR-079）。
      # Spring Modulith は失敗した試行の前に読んだ completion_attempts と比べ、最初の配信と 1 回目の再投入をどちらも 1 と比べるため、2 以上にする。
      # 定期の再投入もこの値を超えた出版を再投入しない。2 未満なら起動に失敗する。
      resubmission:
        abandon-after-attempts: 5
    # Moments は使わない。既定で有効なまま残すと @EnableScheduling を常に足し、
    # event-publication.resubmission.enabled=false でも定期の再投入が動く（ADR-079）。
    moments:
      enabled: false

  # グレースフルシャットダウン（Spring Boot 4 ではデフォルトで有効）の待ち時間。
  # 処理中リクエストの完了を待つ上限。ECS の stopTimeout はこの値より大きくすること。
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 失敗したイベント出版の再投入（ADR-079）。
event-publication:
  resubmission:
    # 定期の再投入（古い出版を FAILED に戻す処理を含む）を動かすか。テストは false にする。
    enabled: ${EVENT_PUBLICATION_RESUBMISSION_ENABLED}
    # 最初の失敗から 1 回目の再投入までの待ち時間で、2 回目からの待ち時間の基準。リスナーの処理時間より十分に長くする。
    # PUBLISHED の出版を古いとして FAILED に戻すまでの、出版の時刻からの時間も兼ねる。
    wait-age: ${EVENT_PUBLICATION_RESUBMISSION_WAIT_AGE}
    # PROCESSING と RESUBMITTED の出版を古いとして FAILED に戻すまでの、最後の出版か再投入の時刻からの時間。
    # 再投入の時刻から、executor の空きの待ちとリスナーの処理がそれぞれ lock-at-most-for まで続きうるため、lock-at-most-for の 2 倍より長くする。短いと起動に失敗する。
    in-flight-staleness: ${EVENT_PUBLICATION_RESUBMISSION_IN_FLIGHT_STALENESS}
    # 前の回の終わりから次の回までの間隔。ロックを持つ下限はこの半分にする。
    interval: ${EVENT_PUBLICATION_RESUBMISSION_INTERVAL}
    # 以下は環境で変えないため固定値にする。
    max-per-run: 100
    # ロックを持つ上限。1 回の実行（古い出版を FAILED に戻す処理と max-per-run 件の再投入。concurrency-limit の空きを待つ間も含む）の最長より十分に長くし、interval より長くする。
    # 再投入の候補を選ぶのは実行の開始からこの半分までで、古い出版を FAILED に戻す処理の時間もこの半分に入る。
    # in-flight-staleness はこの 2 倍より長くするため、変えたら in-flight-staleness も見直す。
    lock-at-most-for: PT10M
    # リスナーの再投入の方針。リスナーの on に @ResubmissionPolicy("<名前>") を付けて選び、付けなければ default にする。
    # n 回目の再投入の前に、最後の試行から min(wait-age × multiplier^(n-1), max-wait) だけ待つ。
    # 回数の上限の既定は spring.modulith.events.resubmission.abandon-after-attempts で、全リスナーに共通である。
    # 方針に abandon-after-attempts（1 以上、全体の値より小さい）を書くと、その方針のリスナーだけその回数で諦める。
    # 1 は最初の配信の失敗で ABANDONED にし、自動では再投入しない（冪等キーのない外部システムを呼ぶリスナー向け）。
    policies:
      default:
        multiplier: 2
        max-wait: PT1H
      payment:
        multiplier: 2
        max-wait: PT1H
  # 手での 1 回の再投入。対象（target）は起動のときだけ環境変数 EVENT_PUBLICATION_RESUBMIT_ONCE_TARGET で渡す。
  # 渡すと Web のサーバーと定期の実行を動かさず、再投入した出版の処理を待って終了コードを返す。
  resubmit-once:
    # 再投入した出版の処理が終わるのを待つ上限。
    completion-timeout: PT10M
  # 完了した出版の archive の行を保持期限で消す（ADR-120）。COMPLETED の行だけを消し、ABANDONED の行は残す。
  archive-retention:
    # 定期の削除を動かすか。テストは false にする。
    enabled: ${EVENT_PUBLICATION_ARCHIVE_RETENTION_ENABLED}
    # 以下は環境で変えないため固定値にする。
    # COMPLETED の行を残す期間。完了の時刻から測る。定期の再投入が archive を読み戻す期間（ADR-079）以下だと起動に失敗する。
    retention: P7D
    # 前の回の終わりから次の回までの間隔。
    interval: P1D

# 期限を過ぎた Idempotency-Key の行の掃除（ADR-126）。ロックは event-publication.resubmission と同じ ShedLock の表で取る。
idempotency-key:
  purge:
    # 定期の掃除を動かすか。テストは false にする。
    enabled: ${IDEMPOTENCY_KEY_PURGE_ENABLED}
    # 前の回の終わりから次の回までの間隔。ロックを持つ下限はこの半分にする。lock-at-most-for より短くする。
    interval: ${IDEMPOTENCY_KEY_PURGE_INTERVAL}
    # 以下は環境で変えないため固定値にする。
    # ロックを持つ上限。1 回の実行の最長より十分に長くし、interval より長くする。短いと起動に失敗する。
    lock-at-most-for: PT2H
    # 1 つの DELETE で消す行の上限。トランザクションを短く保ち、消し残しは同じ回で繰り返し消す。
    batch-size: 1000

# 決済代行の URL。既定値を置かず、未設定なら起動に失敗する。ローカルと E2E だけが WireMock を指す。
payment-gateway:
  base-url: ${PAYMENT_GATEWAY_BASE_URL}
  # ADR-019 の開始値。環境で変えないため固定値にする。
  # Listener はトランザクションの中で決済代行を呼ぶ（ADR-050）。Client は再試行せず 1 回だけ呼ぶ（ADR-079）ため、
  # 最悪の時間の connect-timeout + read-timeout を、どの環境でも DB_IDLE_IN_TRANSACTION_TIMEOUT_MS より短くする（ADR-055）。
  # DemoApplicationTest が確かめる。
  connect-timeout: 1s
  read-timeout: 2s

# メールの送信（ADR-125）。From のアドレスと表示名、SES の設定セット、送ってよい宛先に既定値を置かず、未設定なら起動に失敗する。
# リージョン（AWS_REGION）と、ローカルとテストの接続先と資格情報（AWS_ENDPOINT_URL_SESV2 など）は SesV2ClientConfig が読む。
mail-sender:
  from-address: ${MAIL_SENDER_FROM_ADDRESS}
  # UTF-8 で 45 バイト以下にする。RFC 2047 の 1 つの encoded-word に収めるためである。
  from-name: ${MAIL_SENDER_FROM_NAME}
  configuration-set: ${MAIL_SENDER_CONFIGURATION_SET}
  # 送ってよい宛先。カンマ区切りで、* は全許可、@example.com はドメイン、user@example.com はアドレス。本番は * にする。
  allowed-recipients: ${MAIL_SENDER_ALLOWED_RECIPIENTS}
  # ADR-019 の開始値。read-timeout は応答の読み取りと、SDK の呼び出し全体（apiCallTimeout）の両方の上限にする。
  connect-timeout: 1s
  read-timeout: 2s

# 外部 client は依存先ごとに名前付き instance を定義し、client adapter の境界で適用する。
# 現在の PostgreSQL、OIDC 通信へは自動適用されない。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      payment-gateway:
        base-config: default
        # 429 以外の 4xx は資格情報か契約の不備で、決済代行の不調ではないので失敗として数えない（ADR-072）。
        # 429 は一時障害なので数える。ignore-exceptions に HttpClientErrorException を書くと 429 まで無視するため、述語にする。
        ignore-exception-predicate: com.example.demo.payment.infrastructure.client.IgnoredClientErrorPredicate
      mail-sender:
        base-config: default
        # スロットリング以外の 4xx は SES の不調ではないので失敗として数えない（docs/mail/sending.md の「結果と失敗の扱い」）。
        ignore-exception-predicate: com.example.demo.mail.infrastructure.client.IgnoredSesClientErrorPredicate

# 組み込みサーバ（Tomcat）
server:
  # 待ち受けポート。環境ごとに指定する。
  port: ${SERVER_PORT}
  # ALB などプロキシ配下で X-Forwarded-* を解釈し、元のスキーム/ホスト/IP を復元する。
  # ローカルはヘッダが付かないため透過的（全環境共通で可）。
  request:
    header:
      forwarded:
        strategy: framework
  servlet:
    session:
      # 無操作の期間（ADR-135）。
      # spring.session.timeout は書かない（両方に書くと、どちらが効くか読み取りにくい）。
      timeout: 30m
      # URL rewriting を無効化し、セッション ID は Cookie だけで送受信する。
      tracking-modes: cookie
      cookie:
        # __Host- は Secure、Path=/、Domain なしを要求し、別の host からの書き込みを塞ぐ（ADR-119）。
        name: __Host-APP_SESSION
        # JavaScript から Cookie を読めなくする（XSS によるセッション窃取対策）
        http-only: true
        # __Host- の条件なので環境によらず true。localhost の HTTP は Chromium と Firefox が安全とみなす（ADR-066）。
        secure: true
        # クロスサイトでの Cookie 送信を制限する（CSRF 対策）
        same-site: lax

# アプリのセッション
app:
  session:
    # 操作を続けても、作ってから 8 時間たったセッションは切り、再ログインを求める。
    # 無操作の期間（server.servlet.session.timeout）だけでは、盗まれたセッションを使い続けられるため。
    max-lifetime: 8h

# Actuator: 監視・ヘルスチェック用エンドポイント
# ローカル・本番（ECS）共通。ECS/ALB のヘルスチェックは /actuator/health/readiness を使う。
management:
  observations:
    # 同梱の Grafana のダッシュボードと他の計装が引く OpenTelemetry の名前と属性にする（ADR-133）。
    conventions: open-telemetry
  metrics:
    distribution:
      slo:
        # bucket がないと OTLP は +Inf だけを送り、histogram_quantile が値を返さない。
        # 境界は OpenTelemetry の semantic conventions が推奨する値にする（ADR-133）。
        "[http.server.request.duration]": 5ms,10ms,25ms,50ms,75ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,7500ms,10s
  endpoints:
    web:
      exposure:
        # OTLP は push 方式なので、Web には health だけを露出する。
        include: health
  endpoint:
    health:
      # 認証状態にかかわらず、DB などのコンポーネント詳細を公開しない。
      show-details: never
      # ECS と通常の Docker でも liveness/readiness の health group を有効にする。
      probes:
        enabled: true
  # OpenTelemetry の出力先（spring-boot-starter-opentelemetry）。
  # メトリクスは Micrometer の OTLP レジストリ（management.otlp.metrics）、
  # トレース・ログは OpenTelemetry SDK（management.opentelemetry.*）が別プロパティ体系で担う。
  # 3 シグナルとも標準環境変数 OTEL_EXPORTER_OTLP_ENDPOINT の OTLP/HTTP URL を基点にする。
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        # semantic conventions の時間の単位は秒で、既定のミリ秒ではダッシュボードの名前と一致しない（ADR-133）。
        base-time-unit: seconds
  opentelemetry:
    resource-attributes:
      "[service.name]": ${OTEL_SERVICE_NAME}
      "[service.namespace]": ${OTEL_SERVICE_NAMESPACE}
      # bootJar の manifest の Implementation-Version から Spring Boot が解決する。
      # task be-run と Gradle のテストは jar から起動しないため値がなく、unknown にする。
      # 既定値は環境変数ではなく jar の版なので、環境変数に既定値を置かない方針の対象外である。
      "[service.version]": ${spring.application.version:unknown}
      "[deployment.environment.name]": ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME}
      # JVM の起動ごとに 1 つの UUID で、ログ、トレース、指標で同じ値になる（ADR-133）。
      # ダッシュボードはこの値の instance のラベルで系列を絞る。
      "[service.instance.id]": ${random.uuid}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  tracing:
    sampling:
      # ローカルは 1.0、本番はトラフィック量と保存コストに応じて引き下げる。
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

# API ドキュメント（springdoc-openapi / Swagger UI）
# 有効/無効は環境変数で切り替える。本番は false、ローカル/STG は必要に応じて true。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
    # Spectralとクライアント生成が解釈する契約版を明示する。
    version: openapi-3-1
  # コミットする契約の差分を安定させる。
  writer-with-order-by-keys: true
  # ControllerAdvice 由来の不正確な応答を全 operation に付けない。
  # 共通のエラー応答は OpenApiConfig で付ける。
  override-with-generic-response: false
  # produces を書かない handler の応答を */* でなく JSON として契約に書く。
  default-produces-media-type: application/json
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}
