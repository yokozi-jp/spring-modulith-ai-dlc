databaseChangeLog:
  - changeSet:
      id: 031-create-tenancy-idempotency-key-table
      author: system
      comment: >-
        tenancy モジュールに、Idempotency-Key と保存した CommandHandler の Result の表（t_idempotency_key）を作る（ADR-126、#540）。
        列とユニークインデックスは 029 の ordering の表と同じにする。
        tenancy のスキーマは RLS の外なので（ADR-107）、RLS も tenant_public_id の既定値も付けない。
        キーの表の文が tenant_public_id を書き、条件に入れる。
        権限は 014 の既定の権限（ALTER DEFAULT PRIVILEGES）で tenancy_module に付く。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_idempotency_key
            schemaName: tenancy
            remarks: 冪等性キー
            columns:
              - column:
                  name: idempotency_key_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  remarks: 冪等性キーID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_t_idempotency_key
              - column:
                  name: tenant_public_id
                  type: uuid
                  remarks: テナント公開ID
                  constraints:
                    nullable: false
              - column:
                  name: user_public_id
                  type: uuid
                  remarks: 利用者公開ID
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: uuid
                  remarks: 冪等性キー
                  constraints:
                    nullable: false
              - column:
                  name: payload_hash
                  type: bytea
                  remarks: ペイロードのハッシュ（操作の名前と Command の SHA-256）
                  constraints:
                    nullable: false
              # 業務の処理を終えるまで NULL で、同じトランザクションで Result を書く。commit した行は必ず Result を持つ。
              - column:
                  name: result_json
                  type: jsonb
                  remarks: 保存した Result（操作の Result の record の JSON。ADR-126）
              - column:
                  name: expires_at
                  type: timestamptz
                  remarks: 期限日時
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  remarks: 作成日時
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  remarks: 作成者
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  remarks: 作成プログラムコード
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  remarks: 作成トレースID
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  remarks: 更新日時
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  remarks: 更新者
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  remarks: 更新プログラムコード
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  remarks: 更新トレースID
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  remarks: ロック番号
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
                  remarks: データパッチ日時
              - column:
                  name: patched_by
                  type: varchar(64)
                  remarks: データパッチ作業者
              - column:
                  name: patched_id
                  type: integer
                  remarks: データパッチ課題番号
        - createIndex:
            indexName: uk_t_idempotency_key
            tableName: t_idempotency_key
            schemaName: tenancy
            unique: true
            columns:
              - column:
                  name: tenant_public_id
              - column:
                  name: user_public_id
              - column:
                  name: idempotency_key
      rollback:
        - dropTable:
            tableName: t_idempotency_key
            schemaName: tenancy
