      comment: >-
        業務の表と列に、日本語の論理名のコメント（COMMENT ON）を付ける（#575）。
        setTableRemarks と setColumnRemarks には自動の rollback がないため、空の remarks で消す。
        PostgreSQL は空の文字列のコメントを削除として扱う。
