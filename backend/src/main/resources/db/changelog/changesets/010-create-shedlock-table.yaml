databaseChangeLog:
  - changeSet:
      id: 010-create-shedlock-table
      author: system
      preConditions:
        - dbms:
            type: postgresql
      changes:
        # ShedLock のロックの表（ADR-075）。列は ShedLock の文書の PostgreSQL の DDL に合わせ、時刻だけを timestamptz にする（ADR-006）。
        # ロックの期限は DB の時刻で書き込み、比べるため、インスタンスの時計に依存しない。
        - createTable:
            tableName: shedlock
            schemaName: modulith
            columns:
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: shedlock_pkey
              - column:
                  name: lock_until
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - sql:
            sql: GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE modulith.shedlock TO "${appDatabaseUsername}";
      rollback:
        - dropTable:
            tableName: shedlock
            schemaName: modulith
