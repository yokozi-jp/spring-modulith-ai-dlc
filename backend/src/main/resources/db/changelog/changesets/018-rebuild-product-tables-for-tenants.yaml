databaseChangeLog:
  - changeSet:
      id: 018-rebuild-product-tables-for-tenants
      author: system
      comment: >-
        商品の表（m_product）を、テナントの列と行レベルセキュリティを持つ形に作り直す。
        本番にデータがないため、移行の手順を作らず表を作り直す（#377）。
        tenant_public_id の既定値は、トランザクションに設定したテナント（app.current_tenant）である。
        テナントを設定しないトランザクションでは、既定値とポリシーが current_setting のエラーで失敗する。
        権限は 012 の既定の権限（ALTER DEFAULT PRIVILEGES）でモジュールのロールに付く。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - dropTable:
            tableName: m_product
            schemaName: product
        - createTable:
            tableName: m_product
            schemaName: product
            columns:
              - column:
                  name: product_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_m_product
              - column:
                  name: tenant_public_id
                  type: uuid
                  defaultValueComputed: current_setting('app.current_tenant')::uuid
                  constraints:
                    nullable: false
              - column:
                  name: public_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: product_code
                  type: varchar(20)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: varchar(100)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_jpy
                  type: numeric(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: sales_status_typ
                  type: varchar(20)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
        - createIndex:
            indexName: uk_m_product
            tableName: m_product
            schemaName: product
            unique: true
            columns:
              - column:
                  name: tenant_public_id
              - column:
                  name: public_id
        - createIndex:
            indexName: uk_2_m_product
            tableName: m_product
            schemaName: product
            unique: true
            columns:
              - column:
                  name: tenant_public_id
              - column:
                  name: product_code
        - sql:
            sql: |
              ALTER TABLE product.m_product ENABLE ROW LEVEL SECURITY;
              ALTER TABLE product.m_product FORCE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON product.m_product AS PERMISSIVE FOR ALL TO PUBLIC USING (tenant_public_id = current_setting('app.current_tenant')::uuid);
      rollback:
        - dropTable:
            tableName: m_product
            schemaName: product
        - createTable:
            tableName: m_product
            schemaName: product
            columns:
              - column:
                  name: product_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_m_product
              - column:
                  name: public_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: product_code
                  type: varchar(20)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: varchar(100)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_jpy
                  type: numeric(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: sales_status_typ
                  type: varchar(20)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
        - createIndex:
            indexName: uk_m_product
            tableName: m_product
            schemaName: product
            unique: true
            columns:
              - column:
                  name: public_id
        - createIndex:
            indexName: uk_2_m_product
            tableName: m_product
            schemaName: product
            unique: true
            columns:
              - column:
                  name: product_code
