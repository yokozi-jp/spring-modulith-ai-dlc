databaseChangeLog:
  - changeSet:
      id: 029-create-membership-history-table
      author: system
      comment: >-
        所属（m_membership）の行を削除する前の内容を残す履歴の表 h_membership を作る（#609）。
        アプリケーションが、ChildWriter の削除と同じトランザクションで書く（トリガーは使わない）。
        m_membership の列（共通カラムを含む）は削除前の値のまま写し、退避の日時、者、プログラム、トレースを archived_* に持つ。
        所属を外した利用者やテナントの行が後から消えても残すため、外部キーは張らない。
        権限は 014 の既定の権限（ALTER DEFAULT PRIVILEGES）で tenancy_module に付く。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: h_membership
            schemaName: tenancy
            remarks: 所属履歴
            columns:
              - column:
                  name: membership_history_id
                  type: bigint
                  remarks: 所属履歴ID
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_h_membership
              - column:
                  name: membership_id
                  type: bigint
                  remarks: 削除した所属のID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  remarks: 利用者ID
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: bigint
                  remarks: テナントID
                  constraints:
                    nullable: false
              - column:
                  name: role_typ
                  type: varchar(10)
                  remarks: 役割区分
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  remarks: 作成日時
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  remarks: 作成者
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  remarks: 作成プログラムコード
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  remarks: 作成トレースID
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  remarks: 更新日時
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  remarks: 更新者
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  remarks: 更新プログラムコード
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  remarks: 更新トレースID
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  remarks: ロック番号
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
                  remarks: データパッチ日時
              - column:
                  name: patched_by
                  type: varchar(64)
                  remarks: データパッチ作業者
              - column:
                  name: patched_id
                  type: integer
                  remarks: データパッチ課題番号
              - column:
                  name: archived_at
                  type: timestamptz
                  remarks: 退避日時
                  constraints:
                    nullable: false
              - column:
                  name: archived_by
                  type: varchar(64)
                  remarks: 退避者
                  constraints:
                    nullable: false
              - column:
                  name: archived_pgm_cd
                  type: varchar(64)
                  remarks: 退避プログラムコード
                  constraints:
                    nullable: false
              - column:
                  name: archived_tx_id
                  type: varchar(32)
                  remarks: 退避トレースID
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: h_membership
            schemaName: tenancy
