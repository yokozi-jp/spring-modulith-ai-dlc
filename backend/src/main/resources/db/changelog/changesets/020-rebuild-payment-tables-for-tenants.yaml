databaseChangeLog:
  - changeSet:
      id: 020-rebuild-payment-tables-for-tenants
      author: system
      comment: >-
        決済の表（t_payment）を、テナントの列と行レベルセキュリティを持つ形に作り直す。
        本番にデータがないため、移行の手順を作らず表を作り直す（#377）。
        旧版のアプリは作り直した表を読み書きできず、schema-v8 以前への切り戻しは表を空で作り直す（docs/database/runbook-deploy-and-rollback.md）。
        権限は 012 の既定の権限（ALTER DEFAULT PRIVILEGES）でモジュールのロールに付く。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - dropTable:
            tableName: t_payment
            schemaName: payment
        - createTable:
            tableName: t_payment
            schemaName: payment
            columns:
              - column:
                  name: payment_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_t_payment
              - column:
                  name: tenant_public_id
                  type: uuid
                  defaultValueComputed: current_setting('app.current_tenant')::uuid
                  constraints:
                    nullable: false
              - column:
                  name: public_id
                  type: uuid
                  constraints:
                    nullable: false
              # 決済した注文（ordering.t_order.public_id）。モジュールの間に外部キーを作らない。
              - column:
                  name: order_public_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: charged_amount_jpy
                  type: numeric(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status_typ
                  type: varchar(10)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: gateway_payment_code
                  type: varchar(64)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
        - createIndex:
            indexName: uk_t_payment
            tableName: t_payment
            schemaName: payment
            unique: true
            columns:
              - column:
                  name: tenant_public_id
              - column:
                  name: public_id
        # 1 注文に決済記録は 1 件まで。並行の配信の二重の INSERT をこの索引が拒む。
        - createIndex:
            indexName: uk_2_t_payment
            tableName: t_payment
            schemaName: payment
            unique: true
            columns:
              - column:
                  name: tenant_public_id
              - column:
                  name: order_public_id
        - sql:
            sql: |
              ALTER TABLE payment.t_payment ENABLE ROW LEVEL SECURITY;
              ALTER TABLE payment.t_payment FORCE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON payment.t_payment AS PERMISSIVE FOR ALL TO PUBLIC USING (tenant_public_id = current_setting('app.current_tenant')::uuid);
      rollback:
        - dropTable:
            tableName: t_payment
            schemaName: payment
        - createTable:
            tableName: t_payment
            schemaName: payment
            columns:
              - column:
                  name: payment_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_t_payment
              - column:
                  name: public_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: order_public_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: charged_amount_jpy
                  type: numeric(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: gateway_payment_code
                  type: varchar(64)
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
              - column:
                  name: payment_status_typ
                  type: varchar(10)
                  defaultValue: ""
                  constraints:
                    nullable: false
        - createIndex:
            indexName: uk_t_payment
            tableName: t_payment
            schemaName: payment
            unique: true
            columns:
              - column:
                  name: public_id
        - createIndex:
            indexName: uk_2_t_payment
            tableName: t_payment
            schemaName: payment
            unique: true
            columns:
              - column:
                  name: order_public_id
