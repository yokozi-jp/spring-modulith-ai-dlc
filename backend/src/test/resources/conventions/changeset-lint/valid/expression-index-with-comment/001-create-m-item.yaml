databaseChangeLog:
  - changeSet:
      id: "001-create-m-item"
      author: system
      comment: "リリース直前で改修できないため、式インデックスを使う。"
      changes:
        - createTable:
            tableName: m_item
            schemaName: item
            columns:
              - column:
                  name: item_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_m_item
              - column:
                  name: item_code
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
        - createIndex:
            indexName: idx_1_m_item
            tableName: m_item
            schemaName: item
            columns:
              - column:
                  name: lower(item_code)
                  computed: true
