databaseChangeLog:
  - changeSet:
      id: "001-create-m-item"
      author: system
      changes:
        - createTable:
            tableName: m_item
            schemaName: item
            columns:
              - column:
                  name: item_id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_m_item
              - column:
                  name: tenant_public_id
                  type: uuid
                  defaultValueComputed: current_setting('app.current_tenant')::uuid
                  constraints:
                    nullable: false
              - column:
                  name: item_code
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_pgm_cd
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_tx_id
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: lock_no
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: patched_at
                  type: timestamptz
              - column:
                  name: patched_by
                  type: varchar(64)
              - column:
                  name: patched_id
                  type: integer
        - sql:
            sql: |
              ALTER TABLE item.m_item ENABLE ROW LEVEL SECURITY;
              ALTER TABLE item.m_item FORCE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON item.m_item AS PERMISSIVE FOR ALL TO PUBLIC USING (tenant_public_id = current_setting('app.current_tenant')::uuid);
      rollback:
        - dropTable:
            tableName: m_item
            schemaName: item
