databaseChangeLog:
  - changeSet:
      id: "012-grant-m-item"
      author: system
      changes:
        - sql:
            sql: |
              GRANT SELECT ON TABLE modulith.event_publication, item.m_item TO "${appDatabaseUsername}";
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON ALL TABLES IN SCHEMA item FROM item_module;
