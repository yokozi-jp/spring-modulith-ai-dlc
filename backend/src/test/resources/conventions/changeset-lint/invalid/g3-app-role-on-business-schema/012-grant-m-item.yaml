databaseChangeLog:
  - changeSet:
      id: "012-grant-m-item"
      author: system
      changes:
        - sql:
            sql: |
              GRANT SELECT ON TABLE item.m_item TO "${appDatabaseUsername}";
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON TABLE item.m_item FROM "${appDatabaseUsername}";
