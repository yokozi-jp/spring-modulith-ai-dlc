databaseChangeLog:
  - changeSet:
      id: "012-grant-m-item"
      author: system
      changes:
        - sql:
            sql: |
              ALTER DEFAULT PRIVILEGES IN SCHEMA item GRANT USAGE ON SEQUENCES TO item_module;
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON ALL TABLES IN SCHEMA item FROM item_module;
