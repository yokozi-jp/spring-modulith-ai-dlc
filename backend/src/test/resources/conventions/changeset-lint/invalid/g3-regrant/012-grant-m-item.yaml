databaseChangeLog:
  - changeSet:
      id: "012-grant-m-item"
      author: system
      changes:
        - sql:
            sql: |
              GRANT SELECT ON TABLE item.m_item TO item_module WITH GRANT OPTION;
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON ALL TABLES IN SCHEMA item FROM item_module;
