/*
 * Liquibase Gradle プラグインが apply 時に Liquibase 5.x のクラスを参照するため、
 * buildscript classpath に明示的に追加する（liquibaseRuntime はタスク実行時のみ有効）。
 */
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.4'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.6.1'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.13'
    id 'net.ltgt.errorprone' version '5.2.0'
    id 'org.liquibase.gradle' version '3.1.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.9'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.example'
version = '0.14.0' // x-release-please-version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// AWS の SDK は、Spring が spring.config.import で読む ../.env を見ない（ADR-124）。
// ホストで起動するときは、../.env の AWS_ で始まる変数を環境変数で渡す。
def awsDotEnv = providers.fileContents(layout.projectDirectory.file('../.env')).asText.map { text ->
    text.readLines().findAll { it.startsWith('AWS_') && it.contains('=') }.collectEntries { line ->
        def (key, value) = line.split('=', 2)
        [(key): value]
    }
}

tasks.named('bootRun') {
    // ホスト起動でもコンテナと同じJVMデフォルトタイムゾーンを使う。
    jvmArgs('-Duser.timezone=UTC')
    environment(awsDotEnv.getOrElse([:]))
}

// 開発用の代表データ（#114）。シーダーは src/test にあり、本番の jar と runtimeClasspath に入れない。
tasks.register('seedLocalData', JavaExec) {
    group = 'application'
    description = 'ローカルの業務データが空なら代表データを入れる（-PseedMode=auto|seed|reset）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.demo.LocalDataSeeder'
    args(providers.gradleProperty('seedMode').getOrElse('auto'))
    jvmArgs(
        '-Duser.timezone=UTC',
        '-Dorg.jooq.no-logo=true',
        '-Dorg.jooq.no-tips=true',
        // Spring を起動しないので logback-spring.xml は効かない。シーダー専用の構成を classpath から読む。
        '-Dlogback.configurationFile=local-data-seeder-logback.xml')
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2026.0.0")
    set('springModulithVersion', "2.2.0")
}

// 版の正本は compose-test.yml の image の tag（ADR-072、ADR-085）。Dependabot が image だけを上げても jar が追従する。
// backend/Dockerfile のビルドの文脈は backend/ だけでファイルが無い。イメージのビルドはテストを実行しないため、無いときは jar を足さない。
def composeTest = file('../docker/compose-test.yml')
def wiremockMatch = composeTest.exists() ? (composeTest.text =~ /image:\s*wiremock\/wiremock:([\d.]+)@/) : null
if (wiremockMatch != null && !wiremockMatch.find()) {
    throw new GradleException('docker/compose-test.yml に wiremock/wiremock:<版>@ の image が見つからない')
}

dependencies {
    // --- Web・API ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // RestClient.Builder の自動構成（計測と共通設定）。webmvc の starter には含まれない。
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- API ドキュメント（OpenAPI / Swagger UI）---
    // springdoc 3.x が Spring Boot 4 系対応（2.x は Boot 3 系）。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // Javadoc を OpenAPI の summary と description の正本にする（ADR-053）。
    // Spring BOM の管理外のため版を明示する。springdoc 3.1.1 が optional 依存にする版と同じ。
    // テストの scribe は、OpenAPI 生成を検証するサンプル Controller の Javadoc を記録する。
    implementation 'com.github.therapi:therapi-runtime-javadoc:0.16.0'
    annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.16.0'
    testAnnotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.16.0'

    // --- セキュリティ ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'

    // --- データアクセス ---
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    runtimeOnly 'org.postgresql:postgresql'
    jooqCodegen 'org.postgresql:postgresql'
    // 共通カラムの pgm_cd を、CommandHandler と Listener の呼び出しの間だけ束縛する（ADR-051）。
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // --- モジュラーモノリス ---
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    implementation 'org.springframework.modulith:spring-modulith-starter-insight'
    // 再投入の条件の関数で、出版のリスナーの ID（TargetEventPublication）を読む（ADR-079）。starter が実行時に入れる版をコンパイルにも使う。
    implementation 'org.springframework.modulith:spring-modulith-events-core'
    // 失敗したイベント出版の再投入を、DB の時刻で期限を決めるロックで 1 つのインスタンスに絞る（ADR-079）。
    // Spring BOM の管理外のため版を明示する。jOOQ は Spring Boot が管理する版に解決される。
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jooq:7.11.0'

    // --- 可観測性・メトリクス ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Spring Boot の BOM の opentelemetry-bom と対応する版（2.33.0 は api 1.67.0 を前提にする、Boot 4.2.0 の BOM は 1.68.0）。Boot を上げるときは同時に上げる。
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.33.0-alpha'

    // --- 耐障害性 ---
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // --- メールの送信（ADR-124）---
    // SES v2 の API で送る。版は dependencyManagement の AWS SDK の BOM が決める。
    // HTTP の Client は JDK の HttpURLConnection を使う url-connection-client にし、SDK が既定で入れる Apache と Netty の Client を外す。
    implementation('software.amazon.awssdk:sesv2') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // --- 開発支援 ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    // 非同期の条件の待ち（ADR-080）。spring-modulith-starter-test の推移的な依存に頼らず明示する。版は Spring Boot が管理する。
    testImplementation 'org.awaitility:awaitility'
    // JUnit Jupiter テスト内でプロパティ生成と反例の縮小を行う。
    testImplementation 'org.quicktheories:quicktheories:0.26'
    // ArchUnit の JUnit 5 連携（@AnalyzeClasses / @ArchTest）。
    // コア（com.tngtech.archunit:archunit）は spring-modulith-starter-test 経由で 1.4.2 が入るため、
    // JUnit 5 エンジンも同じ 1.4.2 に揃える。
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    // 開発用の代表データの生成値（#114）。シーダーだけが使う。Spring BOM の管理外のため版を明示する。
    testImplementation 'net.datafaker:datafaker:2.7.0'
    // 決済代行の結合テストの偽物。standalone は Jetty を shade 済みで Spring Boot の依存と衝突しない。
    // 版は docker/compose-test.yml の WireMock のイメージの tag から読み、jar とイメージを同じ版にする。Spring BOM の管理外。
    if (wiremockMatch != null) {
        testImplementation "org.wiremock:wiremock-standalone:${wiremockMatch.group(1)}"
    }
    // テストの JVM ごとに PostgreSQL、WireMock のコンテナを起動する（ADR-085）。版は Spring Boot が管理する。
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // テストのコンテナのイメージとコマンドを docker/compose-test.yml から読む（ADR-085）。版は Spring Boot が管理する。
    testImplementation 'org.yaml:snakeyaml'
    // テストの JVM が自分のコンテナへ changeset を適用する（ADR-085）。buildscript の版にそろえる。
    testImplementation 'org.liquibase:liquibase-core:5.0.4'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- 静的解析 (Error Prone + NullAway) ---
    // JSpecify: @NullMarked 等の null 安全性アノテーション（NullAway の JSpecifyMode で参照）
    implementation 'org.jspecify:jspecify:1.0.1'
    // TableWriter が付ける @CheckReturnValue の注釈。log4j-api 経由で 2.38.0 が推移的に入っているが、推移的な経路に頼らないよう明示する。
    // Spring BOM の管理外のため版を明示し、解決済みの版にそろえる。
    compileOnly 'com.google.errorprone:error_prone_annotations:2.52.0'
    errorprone 'com.google.errorprone:error_prone_core:2.52.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // AWS SDK for Java v2 の版をそろえる（ADR-124）。Spring BOM の管理外。
        mavenBom "software.amazon.awssdk:bom:2.59.2"
        // --- 脆弱性対応（Jackson BOM の推移的バージョン上書き） ---
        // jackson-databind の CVE-2026-68497 / CVE-2026-83557 / CVE-2026-19032 対応。
        // databind 単体ではなく BOM を上げ、core など同系列の版ずれを避ける。
        // Jackson 2.x 系（Spring Boot BOM 由来の 2.21.5）を 2.21.6 へ。
        mavenBom "com.fasterxml.jackson:jackson-bom:2.23.0"
        // Jackson 3.x 系（Spring Boot 4 / Modulith 由来の 3.1.5）を 3.1.6 へ。
        mavenBom "tools.jackson:jackson-bom:3.3.0"
    }
    dependencies {
        // --- 脆弱性対応（推移的依存のバージョン強制） ---
        // CVE-2026-0636（LDAP インジェクション）対応。
        dependency 'org.bouncycastle:bcprov-jdk18on:1.87'
    }
}

def openApiSpec = layout.projectDirectory.file('../openapi/openapi.yaml').asFile

// テストのコンテナへ適用するスキーマタグ（ADR-085）。-PtestAllChangesets を付けると、作りかけを含む全 changeset を適用する。
def testLiquibaseTag = providers.gradleProperty('testAllChangesets').isPresent()
    ? ''
    : providers.gradleProperty('databaseSchemaTag').get().trim()

// テストの設定（接続先以外）。開発用の ../.env でなく、テスト用の値を読ませる（ADR-085）。
// 無ければ task be-test などが .env.test.example から作る。-PtestEnvFile=<backend からの相対パス> で変える。
// 本番（UTC）とも業務（東京）とも違い、夏時間のあるタイムゾーンでテストを流す（ADR-109）。
def testJvmTimeZone = 'America/New_York'
def testEnvFile = layout.projectDirectory.file(providers.gradleProperty('testEnvFile').getOrElse('../.env.test')).asFile
def testSpringConfigImport = "file:${testEnvFile.absolutePath}[.properties]"
def missingTestEnvFile = "${testEnvFile} がありません。.env.test.example をコピーするか、task be-test を実行してください。"

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'user.timezone', testJvmTimeZone
    systemProperty 'test.liquibase.tag', testLiquibaseTag
    systemProperty 'spring.config.import', testSpringConfigImport
    doFirst { if (!testEnvFile.exists()) throw new GradleException(missingTestEnvFile) }
}

tasks.named('pitest') {
    doFirst { if (!testEnvFile.exists()) throw new GradleException(missingTestEnvFile) }
}

/*
 * テストとカバレッジ
 * JUnit Platform で実行し、JaCoCo でカバレッジレポート（HTML/XML）を生成する。
 * 全体と各クラスの branch と line の coverage が下限を下回ると jacocoTestCoverageVerification が失敗する（ADR-076）。
 * 検証は test ではなく check にぶら下げ、test --tests で一部だけを実行しても下限で失敗させない（ADR-085）。
 */
tasks.named('test') {
    // fork ごとに InfrastructureContainers がコンテナを起動し、DB を共有しない（ADR-085）。
    // ponytail: 既定はコア数の半分。fork ごとに JVM、PostgreSQL、WireMock のメモリを使うため、
    // メモリの少ない環境では -PtestForks=<n> で減らす。
    maxParallelForks = providers.gradleProperty('testForks').map { it as int }
        .getOrElse(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
    // テストのコンテナは compose のイメージとコマンド、初期化のスクリプトを読むため、変えたらテストをやり直す。
    inputs.file(layout.projectDirectory.file('../docker/compose-test.yml')).withPropertyName('testCompose')
    inputs.dir(layout.projectDirectory.dir('../docker/initdb')).withPropertyName('testInitdb')
    // 決済代行の結合テストは docker/wiremock のスタブを読むため、スタブを変えたらテストをやり直す。
    inputs.dir(layout.projectDirectory.dir('../docker/wiremock')).withPropertyName('wiremockStubs')
    // MailAddressTest はフロントエンドと共有する入力の表を読むため、表を変えたらテストをやり直す。
    inputs.file(layout.projectDirectory.file('../openapi/mail-address-cases.json')).withPropertyName('mailAddressCases')
    // SchemaInspectionTest は保持期限の一覧を読むため、一覧を変えたらテストをやり直す。
    inputs.file(layout.projectDirectory.file('../docs/database/table-retention-and-personal-data.md')).withPropertyName('retentionDocument')
    // -PopenapiExport=true のときだけ、OpenApiContractTest に契約を書き出させる（ADR-064）。
    // 契約だけを再生成するときは --tests com.example.demo.OpenApiContractTest で絞る（ADR-085）。
    // 出力に宣言しないと、build cache の復元時に契約が書かれず、drift 検査が素通りになる。
    if (providers.gradleProperty('openapiExport').isPresent()) {
        systemProperty 'openapi.output', openApiSpec.absolutePath
        outputs.file(openApiSpec)
    } else {
        // ApiContractCoverageTest はコミット済みの契約を読むため、契約を変えたらテストをやり直す（ADR-077）。
        inputs.file(openApiSpec).withPropertyName('openApiContract')
    }
}

jacoco {
    toolVersion = "0.8.15"
}

def jacocoExcludes = [
    '**/DemoApplication.class',
    '**/jooq/**'
]

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

     classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    // 全体と各クラスの下限。main の CI の実測（全体 branch 89.6%、line 98.4%、クラスの最小 branch 66.7%、line 71.4%）の少し下に置く（ADR-076）。
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.88
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
        rule {
            element = 'CLASS'
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

/*
 * PIT: 手書きプロダクションコードに変異を加え、既存テストの検出力を測る。
 * 高コストなので通常の test/verify から分離し、task mutation-test と Mutation Testing のワークフローで実行する。
 * スコアの閾値は置かず、結果はレポートで確かめる（ADR-076）。
 */
pitest {
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.2'
    // Spring Boot BOM がJUnit 6に揃えるlauncherを使い、プラグインの推測による1.x混入を防ぐ。
    addJUnitPlatformLauncher = false
    // PR では task be-mutation-test が差分のクラスを -PpitTargetClasses で渡す（ADR-076）。
    targetClasses = providers.gradleProperty('pitTargetClasses')
        .map { it.split(',').toList() }
        .getOrElse(['com.example.demo.*'])
    // PR では対象のクラスのパッケージ以下のテストを -PpitTargetTests で渡し、全体では全テストを使う。
    // 既定の targetTests は targetClasses と同じになり、差分のクラスに絞るとテストが選ばれないため、明示する。
    targetTests = providers.gradleProperty('pitTargetTests')
        .map { it.split(',').toList() }
        .getOrElse(['com.example.demo.*'])
    // ponytail: minion ごとにコンテナを起動するため並列にできるが、minion ごとの起動の時間とメモリを測ってから上げる（ADR-085）。
    threads = 1
    // 新しい minion は Spring のコンテキストを作り直し、coverage の計測時より遅い。
    // 既定の 1.25 倍と 4 秒ではその起動を TIMED_OUT とみなし、minion の再起動を繰り返すため広げる。
    timeoutFactor = 2.0
    timeoutConstInMillis = 30000
    // Springの配線はコンテキストキャッシュで誤検知しやすいため、業務ロジックだけを測る。
    excludedClasses = [
        'com.example.demo.DemoApplication',
        'com.example.demo.OpenTelemetryAppenderInitializer',
        'com.example.demo.SecurityConfig',
        'com.example.demo.jooq.*'
    ]
    failWhenNoMutations = false
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    jvmArgs = ["-Duser.timezone=${testJvmTimeZone}", "-Dtest.liquibase.tag=${testLiquibaseTag}", "-Dspring.config.import=${testSpringConfigImport}"]
}

/*
 * Spotless: コードフォーマット
 * Google Java Format を適用。origin/main から変えたファイルを、全体でチェックする。
 */
spotless {
    ratchetFrom 'origin/main'
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    java {
        targetExclude 'src/generated/**'
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
        formatAnnotations()
    }
}

/*
 * PMD: 静的解析
 * カスタムルールセットで潜在的なバグやコードの問題を検出する。
 */
pmd {
    toolVersion = '7.23.0'
    consoleOutput = true
    ignoreFailures = false
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

/*
 * SpotBugs: バグパターン検出
 * バイトコード解析により潜在的なバグを検出する。
 */
spotbugs {
    toolVersion = '4.9.8'
    ignoreFailures = false
    showStackTraces = true
    // 進捗は \r で上書きする数万文字の1行になり、tail で削れずログとエージェントの出力を埋めるため出さない。
    showProgress = false
    excludeFilter = file('config/spotbugs/exclusion-filter.xml')
}

// jOOQ生成コードは生成器の責任範囲なので、手書きコード向けの静的解析から除外する。
tasks.named('pmdMain') {
    exclude '**/jooq/**'
}

// テスト固有の診断性と待機方法は、プロダクションコード向け規則と分けて検査する。
// 生成コードを模すテスト用のjOOQテーブルも、生成コードと同じく除外する。
tasks.named('pmdTest') {
    ruleSetFiles = files("config/pmd/ruleset.xml", "config/pmd/test-ruleset.xml")
    exclude '**/jooq/**'
}

tasks.named('spotbugsMain') {
    classes = files(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude '**/jooq/**'
    })
}

tasks.named('spotbugsTest') {
    classes = files(sourceSets.test.output.classesDirs.asFileTree.matching {
        exclude '**/jooq/**'
    })
}

/*
 * Error Prone: コンパイル時バグ検出
 * NullAway による null 安全性チェック（テストコードでは無効）と
 * 未使用変数・タイムゾーン未指定の検出をエラーに昇格させる。
 *
 * null 安全性は JSpecify 標準に準拠する。
 * - NullAway:OnlyNullMarked=true で、@NullMarked が付いたコードだけを検査対象にする
 *   （AnnotatedPackages とは排他。パッケージ前方一致ではなく @NullMarked 起点に統一し、
 *   IDE・他ツールとの解釈を一致させる）。
 * - @NullMarked は各パッケージの package-info.java に付与する。
 * - RequireExplicitNullMarking:ERROR で @NullMarked/@NullUnmarked の付け忘れ
 *   （= 黙って @NullUnmarked 扱いになり無検査化する事故）をビルドで検出する。
 */
tasks.withType(JavaCompile).configureEach {
    // raw type の呼び出しを javac の警告に出す。IDE（JDT）だけが出していた警告をビルドでも見えるようにする。
    options.compilerArgs += ['-Xlint:rawtypes,unchecked']
    options.errorprone {
        error('NullAway')
        error('RequireExplicitNullMarking')
        error('UnusedVariable')
        error('JavaTimeDefaultTimeZone')
        error('JavaUtilDate')
        // docs/web-api/openapi-annotations.md は @Schema(requiredMode) を禁じ、プリミティブの required を @NotNull で出すと定める。
        // package-info の @SuppressWarnings は効かず、record ごとの抑制は DTO を足すたびに要るため、全体で無効にする。
        // 代わりにプリミティブへの @Nullable の誤りは検出されない。
        disable('NullablePrimitive')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
    if (name.toLowerCase().contains("test")) {
        options.errorprone {
            // テストコードには null 契約を強制しない。
            // RequireExplicitNullMarking は NullAway とは別チェッカーのため個別に無効化する。
            disable('NullAway')
            disable('RequireExplicitNullMarking')
        }
    }
}

/*
 * DBマイグレーションとjOOQコード生成のワークフロー定義は gradle/database.gradle に分離している。
 * build.gradle はアプリのビルド定義（依存・品質ツール）に集中させ、DB運用の
 * タスク群（マイグレーション・切り戻し・コード生成）はそちらへ切り出している。
 */
apply from: "$rootDir/gradle/database.gradle"
