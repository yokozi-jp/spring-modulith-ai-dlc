/*
 * Liquibase Gradle プラグインが apply 時に Liquibase 5.x のクラスを参照するため、
 * buildscript classpath に明示的に追加する（liquibaseRuntime はタスク実行時のみ有効）。
 */
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.4'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.4.1'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.11'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.liquibase.gradle' version '3.1.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('bootRun') {
    // ホスト起動でもコンテナと同じJVMデフォルトタイムゾーンを使う。
    jvmArgs('-Duser.timezone=UTC')
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
    set('springModulithVersion', "2.1.1")
}

dependencies {
    // --- Web・API ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- API ドキュメント（OpenAPI / Swagger UI）---
    // springdoc 3.x が Spring Boot 4 系対応（2.x は Boot 3 系）。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // --- セキュリティ ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // --- データアクセス ---
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    // --- モジュラーモノリス ---
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    implementation 'org.springframework.modulith:spring-modulith-starter-insight'

    // --- 可観測性・メトリクス ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Spring Boot 4.1.1 が管理する OpenTelemetry 1.62.0 と整合するバージョン。
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.28.1-alpha'

    // --- 耐障害性 ---
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // --- 開発支援 ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- 静的解析 (Error Prone + NullAway) ---
    // JSpecify: @NullMarked 等の null 安全性アノテーション（NullAway の JSpecifyMode で参照）
    implementation 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
    dependencies {
        // --- 脆弱性対応（推移的依存のバージョン強制） ---
        // Spring Boot 4.1.1 BOM が引く Tomcat に認証バイパス等の CVE が判明したため上書き。
        // CVE-2026-65182 / CVE-2026-65905 / CVE-2026-68525 対応。
        dependency 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
        dependency 'org.apache.tomcat.embed:tomcat-embed-el:11.0.25'
        dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'
        // CVE-2026-0636（LDAP インジェクション）対応。
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    }
}

/*
 * テストとカバレッジ
 * JUnit Platform で実行し、完了後に JaCoCo でカバレッジレポート（HTML/XML）を生成する。
 * ブランチカバレッジ 85% を下回るとビルド失敗にする。
 */
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
    finalizedBy jacocoTestCoverageVerification
}

jacoco {
    toolVersion = "0.8.15"
}

def jacocoExcludes = [
    '**/DemoApplication.class',
    '**/jooq/**'
]

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

     classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

/*
 * Spotless: コードフォーマット
 * Google Java Format を適用。origin/main からの差分のみチェックする。
 */
spotless {
    ratchetFrom 'origin/main'
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    java {
        targetExclude 'src/generated/**'
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
        formatAnnotations()
    }
}

/*
 * PMD: 静的解析
 * カスタムルールセットで潜在的なバグやコードの問題を検出する。
 */
pmd {
    toolVersion = '7.23.0'
    consoleOutput = true
    ignoreFailures = false
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

/*
 * SpotBugs: バグパターン検出
 * バイトコード解析により潜在的なバグを検出する。
 */
spotbugs {
    toolVersion = '4.9.8'
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    excludeFilter = file('config/spotbugs/exclusion-filter.xml')
}

/*
 * Error Prone: コンパイル時バグ検出
 * NullAway による null 安全性チェック（テストコードでは無効）と
 * 未使用変数・タイムゾーン未指定の検出をエラーに昇格させる。
 *
 * null 安全性は JSpecify 標準に準拠する。
 * - NullAway:OnlyNullMarked=true で、@NullMarked が付いたコードだけを検査対象にする
 *   （AnnotatedPackages とは排他。パッケージ前方一致ではなく @NullMarked 起点に統一し、
 *   IDE・他ツールとの解釈を一致させる）。
 * - @NullMarked は各パッケージの package-info.java に付与する。
 * - RequireExplicitNullMarking:ERROR で @NullMarked/@NullUnmarked の付け忘れ
 *   （= 黙って @NullUnmarked 扱いになり無検査化する事故）をビルドで検出する。
 */
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        error('NullAway')
        error('RequireExplicitNullMarking')
        error('UnusedVariable')
        error('JavaTimeDefaultTimeZone')
        error('JavaUtilDate')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
    if (name.toLowerCase().contains("test")) {
        options.errorprone {
            // テストコードには null 契約を強制しない。
            // RequireExplicitNullMarking は NullAway とは別チェッカーのため個別に無効化する。
            disable('NullAway')
            disable('RequireExplicitNullMarking')
        }
    }
}

/*
 * Liquibase: DBマイグレーション
 * Gradle タスク（update, rollback 等）から直接実行するための設定。
 * 接続情報は環境変数から取得し、未設定時はローカル開発用デフォルトを使用する。
 */
def liquibaseDbHost = System.getenv('DB_HOST') ?: 'localhost'
def liquibaseDbPort = System.getenv('DB_PORT') ?: '5432'
def liquibaseDbName = System.getenv('DB_NAME') ?: 'demo'
def liquibaseDbUrl = System.getenv('DB_URL') ?: "jdbc:postgresql://${liquibaseDbHost}:${liquibaseDbPort}/${liquibaseDbName}"
def liquibaseDbUsername = System.getenv('DB_USERNAME') ?: 'demo'
def liquibaseDbPassword = System.getenv('DB_PASSWORD') ?: 'demo'
def liquibaseDbSchema = System.getenv('DB_SCHEMA') ?: 'demo'

liquibase {
    activities {
        main {
            changelogFile 'db/changelog/db.changelog-master.yaml'
            searchPath 'src/main/resources'
            url liquibaseDbUrl
            username liquibaseDbUsername
            password liquibaseDbPassword
            defaultSchemaName liquibaseDbSchema
        }
    }
}

dependencies {
    liquibaseRuntime 'org.liquibase:liquibase-core:5.0.4'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
}
