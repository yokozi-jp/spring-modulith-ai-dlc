/*
 * Liquibase Gradle プラグインが apply 時に Liquibase 5.x のクラスを参照するため、
 * buildscript classpath に明示的に追加する（liquibaseRuntime はタスク実行時のみ有効）。
 */
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.4'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.4.1'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.11'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.liquibase.gradle' version '3.1.0'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('bootRun') {
    // ホスト起動でもコンテナと同じJVMデフォルトタイムゾーンを使う。
    jvmArgs('-Duser.timezone=UTC')
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
    set('springModulithVersion', "2.1.1")
}

dependencies {
    // --- Web・API ---
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- API ドキュメント（OpenAPI / Swagger UI）---
    // springdoc 3.x が Spring Boot 4 系対応（2.x は Boot 3 系）。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // --- セキュリティ ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // --- データアクセス ---
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    runtimeOnly 'org.postgresql:postgresql'
    jooqCodegen 'org.postgresql:postgresql'

    // --- モジュラーモノリス ---
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    implementation 'org.springframework.modulith:spring-modulith-starter-insight'

    // --- 可観測性・メトリクス ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Spring Boot 4.1.1 が管理する OpenTelemetry 1.62.0 と整合するバージョン。
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.28.1-alpha'

    // --- 耐障害性 ---
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // --- 開発支援 ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    // ArchUnit の JUnit 5 連携（@AnalyzeClasses / @ArchTest）。
    // コア（com.tngtech.archunit:archunit）は spring-modulith-starter-test 経由で 1.4.2 が入るため、
    // JUnit 5 エンジンも同じ 1.4.2 に揃える。
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- 静的解析 (Error Prone + NullAway) ---
    // JSpecify: @NullMarked 等の null 安全性アノテーション（NullAway の JSpecifyMode で参照）
    implementation 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
    dependencies {
        // --- 脆弱性対応（推移的依存のバージョン強制） ---
        // Spring Boot 4.1.1 BOM が引く Tomcat に認証バイパス等の CVE が判明したため上書き。
        // CVE-2026-65182 / CVE-2026-65905 / CVE-2026-68525 対応。
        dependency 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
        dependency 'org.apache.tomcat.embed:tomcat-embed-el:11.0.25'
        dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'
        // CVE-2026-0636（LDAP インジェクション）対応。
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    }
}

/*
 * テストとカバレッジ
 * JUnit Platform で実行し、完了後に JaCoCo でカバレッジレポート（HTML/XML）を生成する。
 * ブランチカバレッジ 85% を下回るとビルド失敗にする。
 */
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
    finalizedBy jacocoTestCoverageVerification
}

jacoco {
    toolVersion = "0.8.15"
}

def jacocoExcludes = [
    '**/DemoApplication.class',
    '**/jooq/**'
]

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

     classDirectories.setFrom(
        sourceSets.main.output.asFileTree.matching {
            exclude jacocoExcludes
        }
    )

    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

/*
 * Spotless: コードフォーマット
 * Google Java Format を適用。origin/main からの差分のみチェックする。
 */
spotless {
    ratchetFrom 'origin/main'
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    java {
        targetExclude 'src/generated/**'
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
        formatAnnotations()
    }
}

/*
 * PMD: 静的解析
 * カスタムルールセットで潜在的なバグやコードの問題を検出する。
 */
pmd {
    toolVersion = '7.23.0'
    consoleOutput = true
    ignoreFailures = false
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

/*
 * SpotBugs: バグパターン検出
 * バイトコード解析により潜在的なバグを検出する。
 */
spotbugs {
    toolVersion = '4.9.8'
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    excludeFilter = file('config/spotbugs/exclusion-filter.xml')
}

// jOOQ生成コードは生成器の責任範囲なので、手書きコード向けの静的解析から除外する。
tasks.named('pmdMain') {
    exclude '**/jooq/**'
}

tasks.named('spotbugsMain') {
    classes = files(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude '**/jooq/**'
    })
}

/*
 * Error Prone: コンパイル時バグ検出
 * NullAway による null 安全性チェック（テストコードでは無効）と
 * 未使用変数・タイムゾーン未指定の検出をエラーに昇格させる。
 *
 * null 安全性は JSpecify 標準に準拠する。
 * - NullAway:OnlyNullMarked=true で、@NullMarked が付いたコードだけを検査対象にする
 *   （AnnotatedPackages とは排他。パッケージ前方一致ではなく @NullMarked 起点に統一し、
 *   IDE・他ツールとの解釈を一致させる）。
 * - @NullMarked は各パッケージの package-info.java に付与する。
 * - RequireExplicitNullMarking:ERROR で @NullMarked/@NullUnmarked の付け忘れ
 *   （= 黙って @NullUnmarked 扱いになり無検査化する事故）をビルドで検出する。
 */
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        error('NullAway')
        error('RequireExplicitNullMarking')
        error('UnusedVariable')
        error('JavaTimeDefaultTimeZone')
        error('JavaUtilDate')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
    if (name.toLowerCase().contains("test")) {
        options.errorprone {
            // テストコードには null 契約を強制しない。
            // RequireExplicitNullMarking は NullAway とは別チェッカーのため個別に無効化する。
            disable('NullAway')
            disable('RequireExplicitNullMarking')
        }
    }
}

/*
 * DBマイグレーションとjOOQコード生成
 *
 * 通常のビルドとアプリケーション起動はDBを変更せず、DBにも接続しない。
 * migrateDatabase と jooqCodegen は個別に実行でき、migrateAndGenerateJooq を明示した場合だけ
 * Liquibase updateの完了後に最新スキーマからjOOQコードを生成する。
 *
 * 本番ではMIGRATION_DB_*とCODEGEN_DB_*を専用資格情報として注入できる。
 * ローカルでは既存のDB_*へフォールバックするが、ユーザー名とパスワードに既定値は持たせない。
 */
def databaseHost = System.getenv('DB_HOST') ?: 'localhost'
def databasePort = System.getenv('DB_PORT') ?: '5432'
def databaseName = System.getenv('DB_NAME') ?: 'demo'
def defaultDatabaseUrl = System.getenv('DB_URL') ?: "jdbc:postgresql://${databaseHost}:${databasePort}/${databaseName}"
def defaultDatabaseSchema = System.getenv('DB_SCHEMA') ?: 'demo'

def migrationDatabaseUrl = System.getenv('MIGRATION_DB_URL') ?: defaultDatabaseUrl
def migrationDatabaseUsername = System.getenv('MIGRATION_DB_USERNAME') ?: System.getenv('DB_USERNAME') ?: ''
def migrationDatabasePassword = System.getenv('MIGRATION_DB_PASSWORD') ?: System.getenv('DB_PASSWORD') ?: ''
def migrationDatabaseSchema = System.getenv('MIGRATION_DB_SCHEMA') ?: defaultDatabaseSchema

def codegenDatabaseUrl = System.getenv('CODEGEN_DB_URL') ?: migrationDatabaseUrl
def codegenDatabaseUsername = System.getenv('CODEGEN_DB_USERNAME') ?: migrationDatabaseUsername
def codegenDatabasePassword = System.getenv('CODEGEN_DB_PASSWORD') ?: migrationDatabasePassword
def codegenDatabaseSchema = System.getenv('CODEGEN_DB_SCHEMA') ?: migrationDatabaseSchema

def requireDatabaseCredentials = { String operation, String username, String password ->
    if (username.isBlank() || password.isBlank()) {
        throw new IllegalArgumentException(
            "${operation}にはDB資格情報が必要です。" +
            'MIGRATION_DB_USERNAME/MIGRATION_DB_PASSWORD、CODEGEN_DB_USERNAME/CODEGEN_DB_PASSWORD、' +
            'またはDB_USERNAME/DB_PASSWORDを環境変数で指定してください。'
        )
    }
}

def currentDatabaseSchemaTag = providers.gradleProperty('databaseSchemaTag').get().trim()
def changelogFiles = fileTree('src/main/resources/db/changelog/changesets') {
    include '*.yaml'
}.files.sort { left, right -> left.name <=> right.name }
def explicitLiquibaseTag = findProperty('liquibaseTag')?.toString()?.trim()
def selectedLiquibaseTag = explicitLiquibaseTag ?: currentDatabaseSchemaTag
if (!hasProperty('liquibaseTag')) {
    // Liquibase Gradle pluginへ現在の宣言的スキーマタグを既定値として渡す。
    ext.liquibaseTag = selectedLiquibaseTag
}
def rollbackConfirmationProvider = providers.gradleProperty('confirmRollback')
def liquibaseTagPattern = ~/[A-Za-z0-9][A-Za-z0-9._-]{0,127}/

def validateLiquibaseTag = { String operation, String tagValue ->
    if (tagValue == null || tagValue.isEmpty()) {
        throw new IllegalArgumentException(
            "${operation}にはLiquibaseタグが必要です。"
        )
    }
    if (!(tagValue ==~ liquibaseTagPattern)) {
        throw new IllegalArgumentException(
            'Liquibaseタグは英数字で始まる128文字以内の英数字、ピリオド、アンダースコア、ハイフンにしてください。'
        )
    }
    tagValue
}

def requireExplicitRollbackTag = { String operation ->
    if (explicitLiquibaseTag == null || explicitLiquibaseTag.isEmpty()) {
        throw new IllegalArgumentException(
            "${operation}には-PliquibaseTag=<tag>が必要です。" +
            '本番では直前に成功したデプロイのスキーマタグをデプロイ履歴から指定してください。'
        )
    }
    validateLiquibaseTag(operation, explicitLiquibaseTag)
}

def requireRollbackConfirmation = {
    if (!'true'.equalsIgnoreCase(rollbackConfirmationProvider.orNull)) {
        throw new IllegalArgumentException(
            '切り戻しを実行するにはrollbackSqlとバックアップを確認してから-PconfirmRollback=trueを指定してください。'
        )
    }
}

liquibase {
    activities {
        main {
            changelogFile 'db/changelog/db.changelog-master.yaml'
            searchPath 'src/main/resources'
            url migrationDatabaseUrl
            username migrationDatabaseUsername
            password migrationDatabasePassword
            defaultSchemaName migrationDatabaseSchema
        }
    }
    runList = 'main'
}

jooq {
    // 公式プラグインとコード生成器をSpring Boot 4.1.1 BOMのjOOQ 3.21.7に一致させる。
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = codegenDatabaseUrl
            user = codegenDatabaseUsername
            password = codegenDatabasePassword
        }
        generator {
            name = 'org.jooq.codegen.JavaGenerator'
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = codegenDatabaseSchema
                includes = '.*'
                excludes = '(?i:DATABASECHANGELOG|DATABASECHANGELOGLOCK)'
                outputSchemaToDefault = true
                forcedTypes {
                    forcedType {
                        // PostgreSQLのtimestamptzを絶対時刻として扱い、アプリケーション型をInstantへ統一する。
                        name = 'INSTANT'
                        includeTypes = '(?i:TIMESTAMP WITH TIME ZONE|TIMESTAMPTZ)'
                    }
                }
            }
            generate {
                generatedAnnotation = true
                nullableAnnotation = true
                nullableAnnotationType = 'org.jspecify.annotations.Nullable'
                nonnullAnnotation = true
                nonnullAnnotationType = 'org.jspecify.annotations.NonNull'
            }
            target {
                packageName = 'com.example.demo.jooq'
                // 生成コードをコミットし、リリースビルドを稼働DBから独立させる。
                directory = 'src/generated/jooq'
                clean = true
            }
        }
    }
}

// 生成コードをコミット済みソースとして扱うことを明示し、プラグインの自動登録だけに依存しない。
sourceSets {
    main {
        java {
            srcDir 'src/generated/jooq'
        }
    }
}

dependencies {
    liquibaseRuntime 'org.liquibase:liquibase-core:5.0.4'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
}

def configureLiquibaseDatabaseTask = { task, String operation ->
    task.group = 'database migration'
    task.doFirst {
        requireDatabaseCredentials(operation, migrationDatabaseUsername, migrationDatabasePassword)
    }
}

tasks.named('update') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseマイグレーション')
    description = 'changelogの未適用changesetをすべて適用します（検証用途）。'
}

tasks.named('updateToTag') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseスキーママイグレーション')
    description = "changelogを宣言済みスキーマタグ${currentDatabaseSchemaTag}まで適用します。"
    doFirst {
        validateLiquibaseTag('Liquibaseスキーママイグレーション', selectedLiquibaseTag)
    }
}

tasks.named('updateTestingRollback') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase rollback検証')
    description = '使い捨てDBでupdate、rollback、再updateを順序実行します。'
}

tasks.named('tag') {
    group = 'database migration'
    description = '命令的タグ付与は禁止されています。changelogのtagDatabase changesetを使用してください。'
    doFirst {
        throw new IllegalArgumentException(
            '命令的なLiquibase tagは使用しません。連番changelogへtagDatabase changesetを追加してください。'
        )
    }
}

tasks.named('tagExists') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibaseスキーマタグ情報表示')
    description = '選択されたタグの存在を表示します（終了コードは存在判定に使用しません）。'
    doFirst {
        validateLiquibaseTag('Liquibaseスキーマタグ情報表示', selectedLiquibaseTag)
    }
}

def validateRollbackTarget = tasks.register('validateRollbackTarget') {
    group = 'database migration'
    description = 'DB接続前に切り戻し対象タグと資格情報を検証します。'
    doLast {
        requireDatabaseCredentials('Liquibase切り戻し', migrationDatabaseUsername, migrationDatabasePassword)
        requireExplicitRollbackTag('Liquibase切り戻し')
    }
}

def validateCurrentSchemaTag = tasks.register('validateCurrentSchemaTag') {
    group = 'database migration'
    description = 'DB接続前にGit管理された現在のスキーマタグを検証します。'
    doLast {
        requireDatabaseCredentials('Liquibaseスキーママイグレーション', migrationDatabaseUsername, migrationDatabasePassword)
        validateLiquibaseTag('Liquibaseスキーママイグレーション', selectedLiquibaseTag)
        if (selectedLiquibaseTag != currentDatabaseSchemaTag) {
            throw new IllegalArgumentException(
                "migrateDatabaseは現在の宣言的スキーマタグ${currentDatabaseSchemaTag}だけを適用します。" +
                '切り戻しにはrollbackDatabaseを使用してください。'
            )
        }
        def tagDeclaration = "tag: ${currentDatabaseSchemaTag}"
        def filesDeclaringCurrentTag = changelogFiles.findAll { changelogFile ->
            changelogFile.readLines('UTF-8').any { line -> line.trim() == tagDeclaration }
        }
        if (filesDeclaringCurrentTag.size() != 1 || changelogFiles.last() != filesDeclaringCurrentTag[0]) {
            throw new IllegalArgumentException(
                "現在のスキーマタグ${currentDatabaseSchemaTag}は連番changelogの末尾に一度だけ宣言してください。"
            )
        }
    }
}

def validateRollbackExecution = tasks.register('validateRollbackExecution') {
    group = 'database migration'
    description = 'DB接続前に切り戻し対象タグ、資格情報、明示確認を検証します。'
    doLast {
        requireDatabaseCredentials('Liquibase切り戻し', migrationDatabaseUsername, migrationDatabasePassword)
        requireExplicitRollbackTag('Liquibase切り戻し')
        requireRollbackConfirmation()
    }
}

/*
 * LiquibaseのtagExistsコマンドは、タグが存在しなくても終了コード0を返す。
 * リリースゲートでは終了コードへ依存せず、DATABASECHANGELOGを直接照会して存在を保証する。
 * JDBCドライバは既存のjooqCodegen構成から読み込み、通常ビルドの実行時クラスパスへ追加しない。
 */
def schemaTagVerificationClasspath = configurations.jooqCodegen
def assertSchemaTagExists = tasks.register('assertSchemaTagExists') {
    group = 'database migration'
    description = 'DATABASECHANGELOGを直接照会し、選択されたタグが存在しなければ失敗します。'
    inputs.files(schemaTagVerificationClasspath)
        .withPropertyName('schemaTagVerificationClasspath')
        .withNormalizer(ClasspathNormalizer)
    doLast {
        requireDatabaseCredentials('Liquibaseスキーマタグ存在確認', migrationDatabaseUsername, migrationDatabasePassword)
        validateLiquibaseTag('Liquibaseスキーマタグ存在確認', selectedLiquibaseTag)

        def driverUrls = schemaTagVerificationClasspath.files.collect { driverFile ->
            driverFile.toURI().toURL()
        } as URL[]
        def driverClassLoader = new URLClassLoader(driverUrls, ClassLoader.getPlatformClassLoader())
        def connection
        def statement
        def resultSet
        try {
            def driver = driverClassLoader
                .loadClass('org.postgresql.Driver')
                .getDeclaredConstructor()
                .newInstance()
            def connectionProperties = new Properties()
            connectionProperties.setProperty('user', migrationDatabaseUsername)
            connectionProperties.setProperty('password', migrationDatabasePassword)
            connection = driver.connect(migrationDatabaseUrl, connectionProperties)
            if (connection == null) {
                throw new org.gradle.api.GradleException('PostgreSQL JDBCドライバがMIGRATION_DB_URLを処理できません。')
            }
            connection.setReadOnly(true)
            connection.setSchema(migrationDatabaseSchema)
            statement = connection.prepareStatement(
                'SELECT EXISTS (SELECT 1 FROM databasechangelog WHERE tag = ?)'
            )
            statement.setString(1, selectedLiquibaseTag)
            resultSet = statement.executeQuery()
            if (!resultSet.next() || !resultSet.getBoolean(1)) {
                throw new org.gradle.api.GradleException(
                    "スキーマ${migrationDatabaseSchema}のDATABASECHANGELOGに" +
                    "Liquibaseタグ${selectedLiquibaseTag}が存在しません。"
                )
            }
        } finally {
            resultSet?.close()
            statement?.close()
            connection?.close()
            driverClassLoader.close()
        }
    }
}

tasks.named('updateToTag') {
    mustRunAfter validateCurrentSchemaTag
}

assertSchemaTagExists.configure {
    mustRunAfter tasks.named('updateToTag'), tasks.named('updateTestingRollback')
    mustRunAfter validateCurrentSchemaTag, validateRollbackTarget, validateRollbackExecution
}

tasks.named('rollbackSql') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase切り戻しSQL生成')
    description = 'DBを変更せず、明示したタグまでの切り戻しSQLを生成します。'
    doFirst {
        requireExplicitRollbackTag('Liquibase切り戻しSQL生成')
    }
    mustRunAfter assertSchemaTagExists
}

tasks.named('rollback') {
    configureLiquibaseDatabaseTask(delegate, 'Liquibase切り戻し')
    description = '明示確認後に指定タグより後のchangesetを切り戻します。'
    doFirst {
        requireExplicitRollbackTag('Liquibase切り戻し')
        requireRollbackConfirmation()
    }
    mustRunAfter assertSchemaTagExists
}

def migrateDatabase = tasks.register('migrateDatabase') {
    group = 'database migration'
    description = "宣言済みスキーマタグ${currentDatabaseSchemaTag}まで適用し、タグを確認します。"
    dependsOn validateCurrentSchemaTag, tasks.named('updateToTag'), assertSchemaTagExists
}

tasks.named('jooqCodegen') {
    group = 'jOOQ code generation'
    description = '現在のDBスキーマからjOOQソースを生成します（マイグレーションは実行しません）。'
    mustRunAfter migrateDatabase, tasks.named('updateToTag'), assertSchemaTagExists
    doFirst {
        requireDatabaseCredentials('jOOQコード生成', codegenDatabaseUsername, codegenDatabasePassword)
    }
}

tasks.register('migrateAndGenerateJooq') {
    group = 'database migration'
    description = '宣言済みスキーマタグまで適用してからjOOQソースを生成します。'
    dependsOn migrateDatabase, tasks.named('jooqCodegen')
}

def verifyDatabaseMigrations = tasks.register('verifyDatabaseMigrations') {
    group = 'verification'
    description = '使い捨てDBで全changesetのupdate、rollback、再updateと現在タグの存在を検証します。'
    dependsOn tasks.named('updateTestingRollback'), assertSchemaTagExists
}

tasks.named('test') {
    mustRunAfter verifyDatabaseMigrations
}

tasks.register('checkCurrentSchemaTag') {
    group = 'database migration'
    description = "現在の宣言的スキーマタグ${currentDatabaseSchemaTag}の存在を確認します。"
    dependsOn validateCurrentSchemaTag, assertSchemaTagExists
}

tasks.register('checkRollbackTag') {
    group = 'database migration'
    description = '明示した切り戻し対象タグの存在を確認します。'
    dependsOn validateRollbackTarget, assertSchemaTagExists
}

tasks.register('previewDatabaseRollback') {
    group = 'database migration'
    description = '明示したタグの存在確認後に切り戻しSQLを生成します（DBは変更しません）。'
    dependsOn validateRollbackTarget, assertSchemaTagExists, tasks.named('rollbackSql')
}

tasks.register('rollbackDatabase') {
    group = 'database migration'
    description = '明示したタグの存在確認後に切り戻します（confirmRollback=true必須）。'
    dependsOn validateRollbackExecution, assertSchemaTagExists, tasks.named('rollback')
}
