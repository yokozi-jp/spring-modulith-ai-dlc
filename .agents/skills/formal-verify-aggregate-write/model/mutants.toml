# Code regressions for tooling/formal-verify/mutants.py (docs/agents/formal-verification.md).
# Each edit's old text must occur exactly once in AggregateWrite.tla when the edit is applied.

[[mutant]]
name = "children-before-root"
change = "JooqOrderRepository.update writes the lines before tableWriter.update"
config = "two-saves"
invariants = ["OnlyConflictErrors"]

[[mutant.edits]]
old = '''       THEN /\ w' = [w EXCEPT ![i].pc = "root"]'''
new = '''       THEN /\ w' = [w EXCEPT ![i].pc = "saved"]'''

[[mutant.edits]]
old = '''
  /\ w' = [w EXCEPT ![i].pc = "commit"]
  /\ UNCHANGED <<root, rootPend, child, childPend>>'''
new = '''
  /\ w' = [w EXCEPT ![i].pc = "root"]
  /\ UNCHANGED <<root, rootPend, child, childPend>>'''

[[mutant.edits]]
old = '''            /\ w' = [w EXCEPT ![i].pc = "saved"]'''
new = '''            /\ w' = [w EXCEPT ![i].pc = "commit"]'''

[[mutant]]
name = "unversioned-root"
change = "TableWriter.update bumps lock_no without comparing the expected version (lock_no = lock_no + 1)"
config = "two-saves"
invariants = ["NoLostUpdate"]

[[mutant.edits]]
old = '''
  /\ IF root.lock = w[i].expected
       THEN /\ rootPend' = [holder |-> i, lock |-> w[i].expected + 1, tag |-> i]'''
new = '''
  /\ IF TRUE
       THEN /\ rootPend' = [holder |-> i, lock |-> root.lock + 1, tag |-> i]'''

[[mutant]]
name = "no-delete-of-removed-lines"
change = "ChildWriter.replace drops the DELETE of the saved lines the aggregate no longer has"
config = "two-saves"
invariants = ["AggregateWhole"]

[[mutant.edits]]
old = '''![i].ops = deletes \o updates \o inserts'''
new = '''![i].ops = updates \o inserts'''

[[mutant]]
name = "unbumped-root"
change = "TableWriter.update compares lock_no but does not bump it (lock_no = expected)"
config = "two-saves"
invariants = ["NoLostUpdate"]

[[mutant.edits]]
old = '''
  /\ IF root.lock = w[i].expected
       THEN /\ rootPend' = [holder |-> i, lock |-> w[i].expected + 1, tag |-> i]'''
new = '''
  /\ IF root.lock = w[i].expected
       THEN /\ rootPend' = [holder |-> i, lock |-> w[i].expected, tag |-> i]'''
