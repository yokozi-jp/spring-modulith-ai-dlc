\* expect: InFlightNeverMarkedStale
\* Known finding, see SKILL.md. The settings of run-overruns-lock.cfg. One
\* instance's run lists a stale row and stalls past lock-at-most-for, the
\* other instance takes the expired lock, marks the row FAILED and resubmits
\* it, and the first run's markFailed then lands on the resubmitted delivery.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 2
  Multiplier = 2
  MaxWait = 4
  MaxResubmissions = 2
  InFlightStaleness = 7
  ListenerMax = 2
  QueueMax = 1
  RunMax = 4
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  InFlightNeverMarkedStale
