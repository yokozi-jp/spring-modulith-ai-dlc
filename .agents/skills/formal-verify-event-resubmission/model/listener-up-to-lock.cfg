\* expect: pass
\* The startup checks accept these settings. A listener run is as long as
\* lock-at-most-for, which the Javadoc of maxInFlightAge allows, but longer
\* than wait-age, which only a comment in application.yaml rules out.
\* Known finding, see SKILL.md.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 1
  Multiplier = 2
  MaxWait = 2
  MaxResubmissions = 2
  InFlightStaleness = 7
  ListenerMax = 3
  QueueMax = 0
  RunMax = 2
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDeliveryAtATime
  ResubmissionsCapped
  OneLockedRun
  InFlightNeverMarkedStale
