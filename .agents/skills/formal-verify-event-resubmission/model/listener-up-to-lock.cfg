\* expect: pass
\* The startup checks accept these settings. A listener run is as long as
\* lock-at-most-for, which the Javadoc of
\* isInFlightStalenessLongerThanTwiceLockAtMostFor allows, but longer than
\* wait-age, which the Javadoc of waitAge and application.yaml rule out.
\* InFlightNeverMarkedStale and OneDeliveryAtATime are findings under these
\* settings (late-stale-mark*.cfg), so this config checks the other promises.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 1
  Multiplier = 2
  MaxWait = 2
  MaxResubmissions = 2
  InFlightStaleness = 7
  ListenerMax = 3
  QueueMax = 0
  RunMax = 2
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ResubmissionsCapped
  OneLockedRun
