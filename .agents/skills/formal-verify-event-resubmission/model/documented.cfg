\* expect: pass
\* Settings that pass the startup checks, and the timing that the comments
\* in application.yaml assume: a listener run and its wait for a thread fit
\* in wait-age, a delivery waits for a thread less than wait-age, and a run is
\* shorter than lock-at-most-for.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 2
  Multiplier = 2
  MaxWait = 4
  MaxResubmissions = 2
  InFlightStaleness = 7
  ListenerMax = 2
  QueueMax = 1
  RunMax = 2
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDeliveryAtATime
  ResubmissionsCapped
  OneLockedRun
  InFlightNeverMarkedStale
