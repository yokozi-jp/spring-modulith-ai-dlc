\* expect: pass
\* As documented.cfg, but a run can last longer than lock-at-most-for (a stuck
\* DB call), so two instances can run at once and OneLockedRun is not checked.
\* The time budget in EventPublicationResubmitter.dueAt must still keep
\* the other promises. InFlightNeverMarkedStale is a finding
\* (run-overruns-lock-stale-mark.cfg).
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 2
  Multiplier = 2
  MaxWait = 4
  MaxResubmissions = 2
  PolicyAbandon = 2
  InFlightStaleness = 7
  ListenerMax = 2
  QueueMax = 1
  RunMax = 4
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDeliveryAtATime
  ResubmissionsCapped
