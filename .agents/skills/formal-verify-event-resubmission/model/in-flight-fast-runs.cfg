\* expect: pass
\* As documented.cfg without crashes, and each run reaches the row within the
\* time budget (half of lock-at-most-for). Then the stale check never
\* marks a delivery in flight, as the startup check on in-flight-staleness
\* promises.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 2
  Multiplier = 2
  MaxWait = 4
  MaxResubmissions = 2
  PolicyAbandon = 2
  InFlightStaleness = 7
  ListenerMax = 2
  QueueMax = 1
  RunMax = 1
  MaxCrashes = 0
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  InFlightNeverMarkedStale
