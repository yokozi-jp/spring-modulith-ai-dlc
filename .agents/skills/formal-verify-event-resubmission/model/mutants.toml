# Code regressions for tooling/formal-verify/mutants.py (docs/agents/formal-verification.md).
# Each edit's old text must occur exactly once in EventResubmission.tla when the edit is applied.

[[mutant]]
name = "no-time-budget"
change = "EventPublicationResubmitter.dueAt drops the lock-at-most-for / 2 budget from withFilter"
config = "run-overruns-lock"
invariants = ["ResubmissionsCapped", "OneDeliveryAtATime"]

[[mutant.edits]]
old = '''
                /\ now - inst[i].runStart <= Budget
'''
new = ''

[[mutant]]
name = "is-due-ignores-cap"
change = "ResubmissionPolicies.isDue drops the abandon-after-attempts cap (maxResubmissionsOf)"
config = "documented"
invariants = ["ResubmissionsCapped"]

[[mutant.edits]]
old = '''
                /\ inst[i].snapAttempts <= MaxDue
'''
new = ''

[[mutant]]
name = "lock-ignores-expiry"
change = "the lock provider takes the lock without lock_until <= now (or a second LockProvider bean)"
config = "documented"
invariants = ["OneLockedRun", "InFlightNeverMarkedStale"]

[[mutant.edits]]
old = '''  /\ IF lock.until <= now'''
new = '''  /\ IF TRUE'''

[[mutant]]
name = "staleness-from-publication-date"
change = "Spring Modulith back to 2.1.1: markStalePublicationsFailed measures from publication_date"
config = "in-flight-slow-runs"
invariants = ["InFlightNeverMarkedStale"]

[[mutant.edits]]
old = '''  /\ now > row.lastAttempt + Threshold(row.status)'''
new = '''  /\ now > Threshold(row.status)'''

# The real startup check rejects in-flight-staleness = 5, so the control keeps the base config's 7,
# the smallest value the check accepts. Only that constant differs between the control and the mutant.
[[mutant]]
name = "startup-check-too-weak"
change = "the startup check accepts in-flight-staleness shorter than a thread wait plus a listener run"
config = "delivery-up-to-twice-lock"
overrides = { InFlightStaleness = 5 }
control_overrides = {}
invariants = ["InFlightNeverMarkedStale"]

[[mutant.edits]]
old = '''       /\ InFlightStaleness > 2 * LockAtMostFor \* isInFlightStalenessLongerThanTwiceLockAtMostFor'''
new = '''       /\ InFlightStaleness > LockAtMostFor'''

[[mutant]]
name = "policy-one-resubmits-once"
change = "ResubmissionPolicies.maxResubmissions returns 1 for abandon-after-attempts: 1, so the job resubmits a crashed first delivery"
config = "policy-abandon-on-first"
invariants = ["NoResubmissionWhenAbandonOnFirst"]

[[mutant.edits]]
old = '''MaxDue == IF PolicyAbandon = 1 THEN 0 ELSE PolicyAbandon'''
new = '''MaxDue == PolicyAbandon'''
