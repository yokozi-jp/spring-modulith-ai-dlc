\* expect: pass
\* As in-flight-fast-runs.cfg, but a run can need more than the time budget
\* before it reaches the row (for example while it dispatches older FAILED
\* publications), so the row can wait for several runs. The stale check
\* measures from last_resubmission_date, so a delivery in flight
\* never becomes stale.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 2
  Multiplier = 2
  MaxWait = 4
  MaxResubmissions = 2
  PolicyAbandon = 2
  InFlightStaleness = 7
  ListenerMax = 2
  QueueMax = 1
  RunMax = 2
  MaxCrashes = 0
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  InFlightNeverMarkedStale
