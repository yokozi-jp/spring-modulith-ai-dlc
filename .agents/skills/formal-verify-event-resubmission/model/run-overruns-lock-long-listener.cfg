\* expect: OneDeliveryAtATime
\* Known finding, see SKILL.md. The settings of listener-up-to-lock.cfg, but a
\* run can last longer than lock-at-most-for as in run-overruns-lock.cfg.
\* After the late markFailed of run-overruns-lock-stale-mark.cfg, the delivery
\* outlasts the wait before the next resubmission, and the job resubmits it
\* while it runs.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 1
  Multiplier = 2
  MaxWait = 2
  MaxResubmissions = 2
  PolicyAbandon = 2
  InFlightStaleness = 7
  ListenerMax = 3
  QueueMax = 0
  RunMax = 4
  MaxCrashes = 1
  Horizon = 24
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDeliveryAtATime
