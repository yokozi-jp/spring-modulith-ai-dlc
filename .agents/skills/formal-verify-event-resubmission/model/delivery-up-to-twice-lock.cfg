\* expect: pass
\* A thread wait and a listener run each take up to lock-at-most-for, the
\* longest one delivery can take under the startup check. The first delivery
\* still waits less than wait-age, as application.yaml assumes.
CONSTANTS
  Interval = 2
  LockAtMostFor = 3
  WaitAge = 4
  Multiplier = 2
  MaxWait = 8
  MaxResubmissions = 2
  PolicyAbandon = 2
  InFlightStaleness = 7
  ListenerMax = 3
  QueueMax = 3
  RunMax = 2
  MaxCrashes = 0
  Horizon = 30
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneDeliveryAtATime
  ResubmissionsCapped
  OneLockedRun
  InFlightNeverMarkedStale
