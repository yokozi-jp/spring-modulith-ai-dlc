version: "3"

set: [errexit, nounset, pipefail]

vars:
  DOCKER: '{{.DOCKER | default "docker"}}'
  COMPOSE_ENV_FILE: '{{.COMPOSE_ENV_FILE | default ".env"}}'
  COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker/compose.yml"}}'
  TEST_ENV_FILE: '{{.TEST_ENV_FILE | default ".env.test"}}'
  TEST_COMPOSE_FILE: '{{.TEST_COMPOSE_FILE | default "docker/compose-test.yml"}}'
  DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG | default ""}}'
  CONFIRM_ROLLBACK: '{{.CONFIRM_ROLLBACK | default ""}}'
  CONFIRM_RESET: '{{.CONFIRM_RESET | default ""}}'

# 引数なしのtaskは安全なタスク一覧だけを表示する。
tasks:
  default:
    silent: true
    cmds:
      - task --list

  help:
    desc: 各タスクの一覧と説明を表示
    silent: true
    cmds:
      - task --list

  # Workflow
  dev:
    desc: 依存を起動してバックエンドを起動
    cmds:
      - task: compose-up
      - echo "依存を起動しました。初回またはchangeset追加後は task be-migrate を実行してください。"
      - task: be-run

  check:
    desc: バックエンドの静的解析で素早く確認
    cmds:
      - task: be-lint

  verify:
    desc: push前の静的解析と隔離テストを実行
    cmds:
      - task: be-lint
      - task: test

  # Release
  release-check:
    desc: release-please設定と版ファイルの一致を検証
    silent: true
    cmds:
      - |
        node --input-type=module <<'NODE'
        import { readFileSync } from "node:fs";

        const config = JSON.parse(readFileSync("release-please-config.json", "utf8"));
        const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
        const packageConfig = config.packages?.["."];
        const manifestVersion = manifest["."];
        const versionFile = readFileSync("version.txt", "utf8").trim();
        const buildFile = readFileSync("backend/build.gradle", "utf8");
        const buildVersion = buildFile.match(
          /^version = '([^']+)' \/\/ x-release-please-version$/m,
        )?.[1];
        const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
        const updatesBuild = packageConfig?.["extra-files"]?.some(
          ({ type, path }) => type === "generic" && path === "backend/build.gradle",
        );

        if (packageConfig?.["release-type"] !== "simple") {
          throw new Error('packages["."].release-type must be "simple"');
        }
        if (packageConfig?.["version-file"] !== "version.txt") {
          throw new Error('packages["."].version-file must be "version.txt"');
        }
        if (packageConfig?.["include-component-in-tag"] !== false) {
          throw new Error("release tags must use v<version> without a component prefix");
        }
        if (!updatesBuild) {
          throw new Error("backend/build.gradle must be a generic extra-file");
        }
        if (!semver.test(manifestVersion ?? "")) {
          throw new Error("manifest root version must be a stable semantic version");
        }
        if (manifestVersion !== versionFile || manifestVersion !== buildVersion) {
          throw new Error(
            `version mismatch: manifest=${manifestVersion}, version.txt=${versionFile}, build.gradle=${buildVersion}`,
          );
        }
        if (
          config["bootstrap-sha"] !== undefined &&
          !/^[0-9a-f]{40}$/.test(config["bootstrap-sha"])
        ) {
          throw new Error("bootstrap-sha must be a full 40-character commit SHA");
        }

        console.log(`Release configuration OK: v${manifestVersion}`);
        NODE

  e2e:
    desc: compose-testでbackendを起動し、Vite previewに対してPlaywrightのE2Eを実行して後片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        # compose の backend と Playwright が .env.test を固定で読むため、TEST_ENV_FILE の上書きには対応しない。
        # export すると Playwright の loadEnv で .env.test.local より優先されるため、SERVER_PORT を読むだけにする。
        . ./.env.test
        compose() { {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" --profile e2e "$@"; }
        keep_env=""
        if [ "${E2E_KEEP_ENV:-}" = "1" ] && [ -z "${CI:-}" ]; then keep_env="1"; fi
        # 前回 E2E_KEEP_ENV=1 で残した環境を破棄し、空の DB から始める。
        compose down --volumes --remove-orphans >/dev/null 2>&1 || true
        for port in 5173 "$SERVER_PORT"; do
          rc=0
          curl --silent --output /dev/null --max-time 2 "http://localhost:${port}/" || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "localhost:${port} は使用中です。開発用の Vite（5173）や Keycloak（${SERVER_PORT}）など、この port を使うプロセスを止めてから実行してください。" >&2
            exit 1
          fi
        done
        cleanup() {
          status=$?
          trap - EXIT
          keep=""
          if [ "$status" -ne 0 ]; then
            mkdir -p frontend/test-results
            compose logs --no-color backend > frontend/test-results/backend.log 2>&1 || true
            if [ -n "$keep_env" ] && [ -n "$(compose ps -aq 2>/dev/null)" ]; then keep="1"; fi
          fi
          cleanup_status=0
          # Task の shell では EXIT の trap の中の exit が後続の処理を止めないため、exit に頼らず分岐する。
          if [ -n "$keep" ]; then
            echo "E2E_KEEP_ENV=1 のため、compose-test のコンテナと volume を残しました。" >&2
            echo "  backend のログ：{{.DOCKER}} compose -f {{.TEST_COMPOSE_FILE}} --profile e2e logs backend" >&2
            echo "  （frontend/test-results/backend.log は pnpm e2e の再実行で消える）" >&2
            echo "  再実行：cd frontend && pnpm e2e" >&2
            echo "  片付け：{{.DOCKER}} compose -f {{.TEST_COMPOSE_FILE}} --profile e2e down --volumes --remove-orphans" >&2
          else
            compose down --volumes --remove-orphans || cleanup_status=$?
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT
        (cd frontend && vp install --frozen-lockfile && vp build --mode test && vp exec playwright install chromium)
        compose build backend
        compose up -d --wait postgres redis keycloak
        task be-migrate COMPOSE_ENV_FILE=.env.test
        compose up -d --wait backend
        # healthcheck はコンテナの中から確かめるため、preview の proxy と同じくホストから届くかを別に確かめる。
        if ! curl --fail --silent --show-error --max-time 5 "http://localhost:${SERVER_PORT}/actuator/health/readiness" >/dev/null; then
          echo "ホストから backend（localhost:${SERVER_PORT}）へ接続できません。frontend/test-results/backend.log の backend のログを確かめてください。" >&2
          exit 1
        fi
        (cd frontend && vp run e2e)

  # ADR
  adr-check:
    desc: 判断が絡む変更にADRが伴うかを確認
    silent: true
    cmds:
      - |
        base="${ADR_DIFF_BASE:-origin/main}"
        if ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "ADR check: 比較起点 $base が無いためスキップします。" >&2
          exit 0
        fi
        changed="$(git diff --name-only "$base"...HEAD)"
        if [ -z "$changed" ]; then exit 0; fi
        sig="$(printf '%s\n' "$changed" | grep -E '^(frontend/|backend/build\.gradle|backend/buildSrc/|backend/gradle/[^/]+\.gradle|backend/src/main/resources/application(-[^/]+)?\.yaml|backend/src/main/resources/db/changelog/|backend/src/main/java/com/example/demo/SecurityConfig\.java|docker/|infrastructure/|\.github/workflows/)' || true)"
        if [ -z "$sig" ]; then exit 0; fi
        adr="$(printf '%s\n' "$changed" | grep -E '^docs/adr/ADR-[0-9]+.*\.md$' || true)"
        if [ -n "$adr" ]; then exit 0; fi
        if [ "${ADR_ACK:-}" = "1" ]; then
          echo "ADR check: ADR_ACK=1 のため警告を抑制しました。" >&2
          exit 0
        fi
        echo "" >&2
        echo "⚠ ADR 未追加の可能性: 判断が絡む変更が含まれますが docs/adr/ の更新がありません。" >&2
        echo "  対象の変更:" >&2
        printf '    - %s\n' $sig >&2
        echo "  重要な設計判断なら docs/adr/ に ADR を追加してください（規約: docs/adr/conventions.md）。" >&2
        echo "  該当しない場合は ADR_ACK=1 を付けて再実行できます（例: ADR_ACK=1 git push）。" >&2
        echo "" >&2
        if [ "${ADR_STRICT:-}" = "1" ]; then exit 1; fi

  # docs と Taskfile の同期候補を警告する。
  lint-docs-sync:
    internal: true
    silent: true
    cmds:
      - |
        base="${DOCS_DIFF_BASE:-origin/main}"
        if ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "Docs sync check: 比較起点 $base が無いためスキップします。" >&2
          exit 0
        fi
        changed="$({ git diff --name-only "$base"...HEAD; git diff --name-only; git diff --cached --name-only; } | sort -u)"
        if ! printf '%s\n' "$changed" | grep -qx 'Taskfile.yml'; then exit 0; fi
        missing=""
        for doc in README.md docs/tooling/dev-workflow.md docs/tooling/lint-and-test.md; do
          if ! printf '%s\n' "$changed" | grep -qx "$doc"; then missing="${missing}    - ${doc}\n"; fi
        done
        if [ -z "$missing" ]; then exit 0; fi
        echo "" >&2
        echo "⚠ Taskfile.yml が変更されています。公開タスクの変更なら次の文書も同じ変更で更新してください。" >&2
        printf '%b' "$missing" >&2
        echo "  内部実装だけの変更なら対応は不要です（規約: docs/tooling/taskfile.md）。" >&2
        echo "" >&2

  # OKF（docs/ を Open Knowledge Format v0.2 バンドルとして検証）
  okf-check:
    desc: docs の OKF 適合、内部リンク、孤立ドキュメント、責務混在の見直し合図、steering との境界を検証
    silent: true
    dir: docs
    cmds:
      - task: lint-docs-sync
      - task: docs-boundary-check
      - |
        if ! command -v iwe >/dev/null 2>&1; then
          echo "OKF check: iwe が無いためスキップします（CI で検査されます）。" >&2
          exit 0
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "OKF check: jq が無いためリンクと孤立の検査をスキップします（CI で検査されます）。" >&2
          iwe schema validate
          exit 0
        fi
        iwe schema validate
        stats="$(iwe stats -f json)"
        broken="$(printf '%s' "$stats" | jq '[.brokenLinks[]? | select((.targetKey | startswith("../")) | not)] | length')"
        if [ "$broken" != "0" ]; then
          echo "" >&2
          echo "✗ docs/ 内のリンク切れが $broken 件あります。" >&2
          printf '%s' "$stats" | jq -r '.brokenLinks[]? | select((.targetKey | startswith("../")) | not) | "    - " + .sourceKey + " -> " + .targetKey' >&2
          exit 1
        fi
        orphans="$(printf '%s' "$stats" | jq '.orphans | length')"
        if [ "$orphans" != "0" ]; then
          echo "" >&2
          echo "⚠ 孤立ドキュメントが $orphans 件あります（どこからも参照されていません）。" >&2
          echo "  index.md などの目次からリンクして、グラフに接続してください。" >&2
          printf '%s' "$stats" | jq -r '.orphans[] | "    - " + .' >&2
          exit 1
        fi

  # steering → docs の一方向依存、frontmatter、文書責務の見直し合図を検査する（ADR-038）。
  # 依存方向、frontmatter、パスの実在は失敗、docs の250行超とsteeringの行数超過は警告にとどめる。
  docs-boundary-check:
    internal: true
    silent: true
    cmds:
      - |
        fail=0
        if grep -rnE '\]\([^)]*\.kiro/' --include='*.md' docs >&2; then
          echo "✗ docs/ から .kiro/ 配下へリンクしています。依存は steering → docs の一方向にしてください。" >&2
          fail=1
        fi
        if grep -nE '#\[\[file:docs/' .kiro/steering/*.md >&2; then
          echo "✗ steering が #[[file:docs/...]] で docs を展開しています。パスを文字列で書いてください。" >&2
          fail=1
        fi
        # ponytail: steering は常に .kiro/steering/ 直下にあるため、先頭の ../ を落としてリポジトリルート相対として解決する。
        missing="$(grep -oE '(^|[^A-Za-z0-9_./-])(\.\./)*docs/[A-Za-z0-9_./-]*' .kiro/steering/*.md \
          | sed -E 's#^([^:]*):[^d.]*(\.\./)*#\1:#; s#\.+$##' | sort -u \
          | while IFS=: read -r file path; do [ -e "$path" ] || echo "    - $file: $path"; done)"
        if [ -n "$missing" ]; then
          echo "✗ steering が存在しない docs/ のパスを指しています。" >&2
          echo "$missing" >&2
          fail=1
        fi
        if ! node --input-type=module <<'NODE'
        import { readdirSync, readFileSync } from "node:fs";

        const allowed = new Set(["always", "fileMatch", "manual", "auto"]);
        const errors = [];
        for (const file of readdirSync(".kiro/steering").filter((name) => name.endsWith(".md")).sort()) {
          const path = `.kiro/steering/${file}`;
          const lines = readFileSync(path, "utf8").replaceAll("\r\n", "\n").split("\n");
          if (lines[0] !== "---") continue;
          const end = lines.indexOf("---", 1);
          if (end < 0) {
            errors.push(`${path}: frontmatter の終端 --- がありません`);
            continue;
          }
          const frontmatter = lines.slice(1, end);
          const entry = (name) => {
            const index = frontmatter.findIndex((candidate) => candidate.startsWith(`${name}:`));
            return index < 0 ? undefined : {
              index,
              raw: frontmatter[index].slice(frontmatter[index].indexOf(":") + 1).trim(),
            };
          };
          const scalar = (item) => item?.raw.replace(/^(['"])(.*)\1$/, "$2");
          const quotedString = (raw) => /^(['"]).+\1$/.test(raw ?? "");
          const plainString = (raw) => Boolean(raw)
            && !/^[#\[{>|!&*]/.test(raw)
            && !/\s+#/.test(raw)
            && !/^(null|~|true|false|[-+]?\d+(\.\d+)?)$/i.test(raw);
          const stringValue = (raw) => quotedString(raw) || plainString(raw);
          const inclusionItem = entry("inclusion");
          const inclusion = scalar(inclusionItem) ?? "always";
          if ((inclusionItem && !stringValue(inclusionItem.raw)) || !allowed.has(inclusion)) {
            errors.push(`${path}: inclusion が不正です: ${inclusion || "(empty)"}`);
            continue;
          }
          const required = inclusion === "fileMatch"
            ? ["fileMatchPattern", "name", "description"]
            : inclusion === "auto" ? ["name", "description"] : [];
          for (const name of required) {
            const item = entry(name);
            const rest = item ? frontmatter.slice(item.index + 1) : [];
            const nextKey = rest.findIndex((line) => /^[A-Za-z][A-Za-z0-9_-]*:/.test(line));
            const nested = nextKey < 0 ? rest : rest.slice(0, nextKey);
            const blockValues = nested
              .filter((line) => /^\s+-\s+\S/.test(line))
              .map((line) => line.replace(/^\s+-\s+/, "").trim());
            const inlineList = /^\[.*\]$/.test(item?.raw ?? "")
              && item.raw.slice(1, -1).trim().length > 0;
            const valid = name === "fileMatchPattern"
              ? stringValue(item?.raw)
                || inlineList
                || (blockValues.length > 0 && blockValues.every(stringValue))
              : stringValue(item?.raw);
            if (!valid) errors.push(`${path}: ${inclusion} には文字列の ${name} が必要です`);
          }
        }
        if (errors.length > 0) {
          console.error(`✗ steering の frontmatter が不正です。\n${errors.map((error) => `    - ${error}`).join("\n")}`);
          process.exitCode = 1;
        }
        NODE
        then
          fail=1
        fi
        for f in $(find docs -name '*.md' ! -name 'index.md' -not -path '*/node_modules/*'); do
          n="$(wc -l < "$f")"
          if [ "$n" -gt 250 ]; then echo "⚠ $f は $n 行です（250行超）。行数だけで分割せず、1ファイル1責務とtypeと本文の一致を見直してください。" >&2; fi
        done
        total=0
        for f in .kiro/steering/*.md; do
          n="$(wc -l < "$f")"
          total=$((total + n))
          if [ "$n" -gt 150 ]; then echo "⚠ $f は $n 行です（目安 150 行以内）。" >&2; fi
        done
        if [ "$total" -gt 500 ]; then echo "⚠ steering の合計は $total 行です（目安 500 行以内）。" >&2; fi
        exit "$fail"


  # Setup
  setup:
    desc: 開発環境のセットアップスクリプトを順次実行
    dir: docs/local-env-setup
    cmds:
      - |
        ./00-setup-task.sh
        ./01-setup-java.sh
        ./02-setup-viteplus.sh
        ./03-setup-kiro.sh
        export PATH="$HOME/.local/bin:$PATH"
        ./04-setup-shell.sh
        ./05-setup-go-betterleaks.sh
        ./06-setup-iwe.sh

  # Frontend
  fe-format:
    desc: フロントエンドをOxfmtで整形
    dir: frontend
    cmds:
      - vp fmt

  fe-check:
    desc: フロントエンドのformat、Oxlint（Tailwindとshadcn規則を含む）、型を検査
    dir: frontend
    cmds:
      - vp check

  fe-doctor:
    desc: React固有のwarningとerrorをReact Doctorで検出
    dir: frontend
    cmds:
      - timeout 900s vp run react-doctor

  fe-knip:
    desc: フロントエンドの未参照ファイル、未使用export、未使用依存をKnipで検査
    dir: frontend
    # Knip は playwright.config.ts を読み込み、その先の e2e/environment.ts が .env.test を必須にする。
    deps: [_ensure-test-env]
    cmds:
      - vp run knip

  fe-coverage:
    desc: フロントエンドの全体branch coverage 85%を検証
    dir: frontend
    cmds:
      - vp test run --coverage

  fe-test-build:
    desc: フロントエンドの85% branch coverage、テスト、本番ビルドを実行
    dir: frontend
    cmds:
      - vp test run --coverage
      # ルートの .env で有効にしていても、既定の無効のビルドを検査する（ADR-068）。
      # vp run の script は cache しないので、環境変数がそのまま渡る。build を run.tasks に移すなら cache.env に FRONTEND_OTEL_* を足す。
      - FRONTEND_OTEL_ENABLED=false vp run build
      - |
        # grep は一致で 0、不一致で 1、対象がないなどの失敗で 2 を返す。1 以外は失敗にする。
        status=0
        grep -rqiE 'faro|grafana|opentelemetry' dist/assets || status=$?
        if [ "$status" -ne 1 ]; then
          echo "無効のビルドの bundle に Faro の SDK か OpenTelemetry JS が入っているか、dist/assets を検査できませんでした（grep の終了コード $status）。" >&2
          exit 1
        fi

  fe-verify:
    desc: フロントエンドの静的解析、未使用コード検査、テスト、ビルドを実行
    cmds:
      - task: fe-check
      - task: fe-knip
      - task: fe-test-build

  fe-route-tree-check:
    desc: ビルドで再生成したrouteTree.gen.tsがコミット済みの内容と一致するか検査
    dir: frontend
    cmds:
      - vp build
      - git diff --exit-code -- src/routeTree.gen.ts

  lint-duplicates:
    desc: フロントエンドとバックエンドの手書きコードの重複をjscpdで検査
    cmds:
      # ponytail: 導入時の重複率3.19%を3.2%で固定し、既存cloneの解消に合わせて閾値を下げる。
      - npm exec -- jscpd frontend/src frontend/lint frontend/vite.config.ts frontend/vite-config.test.ts backend/src/main/java backend/src/test/java

  # Backend
  be-run:
    desc: バックエンドをホスト上で起動
    dir: backend
    cmds:
      - ./gradlew bootRun

  # Database
  be-migrate:
    desc: 現在のスキーマタグまでマイグレーション
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew migrateDatabase

  be-migrate-dev:
    desc: 作りかけを含む全changesetを開発DBへ適用
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew update

  _ensure-test-env:
    internal: true
    status:
      - test -f .env.test
    cmds:
      - cp -n .env.test.example .env.test

  _require-migration-env:
    internal: true
    preconditions:
      - sh: 'test -n "${DB_URL:-}" || { test -n "${DB_HOST:-}" && test -n "${DB_PORT:-}" && test -n "${DB_NAME:-}"; }'
        msg: DB_URL、またはDB_HOST、DB_PORT、DB_NAMEを指定してください。
      - sh: 'test -n "${DB_USERNAME:-}"'
        msg: DB_USERNAMEを指定してください。
      - sh: 'test -n "${MIGRATION_DB_USERNAME:-}"'
        msg: MIGRATION_DB_USERNAMEを指定してください。
      - sh: 'test -n "${MIGRATION_DB_PASSWORD:-}"'
        msg: MIGRATION_DB_PASSWORDを指定してください。

  be-release-migrate:
    desc: 本番向けに現在のスキーマタグまでマイグレーション
    cmds:
      - task: _require-migration-env
      - task: _be-release-migrate

  _be-release-migrate:
    internal: true
    dir: backend
    cmds:
      - ./gradlew migrateDatabase

  be-schema-tag-check:
    desc: 現在のスキーマタグが対象DBへ適用済みか確認
    silent: true
    cmds:
      - |
        if [ -f "./{{.COMPOSE_ENV_FILE}}" ]; then
          set -a
          . "./{{.COMPOSE_ENV_FILE}}"
          set +a
        fi
        cd backend
        ./gradlew checkCurrentSchemaTag

  be-verify-migrations:
    desc: 使い捨てDBでマイグレーションとrollbackを検証
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        ./gradlew verifyDatabaseMigrations

  be-rollback-check:
    desc: 切り戻し対象タグが存在するか確認
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        cd backend
        ./gradlew checkRollbackTag -PliquibaseTag="$DB_ROLLBACK_TAG"

  be-rollback-preview:
    desc: DBを変更せず指定タグまでの切り戻しSQLを生成
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        mkdir -p backend/build/reports/liquibase
        cd backend
        ./gradlew previewDatabaseRollback \
          -PliquibaseTag="$DB_ROLLBACK_TAG" \
          -PliquibaseOutputFile=build/reports/liquibase/rollback-preview.sql

  be-rollback:
    desc: 明示確認付きで指定タグより後のchangesetを切り戻し
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
      CONFIRM_ROLLBACK: '{{.CONFIRM_ROLLBACK}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        if [ "$CONFIRM_ROLLBACK" != "yes" ]; then
          echo "切り戻すにはrollback previewとバックアップを確認し、CONFIRM_ROLLBACK=yesを指定してください。" >&2
          exit 1
        fi
        cd backend
        ./gradlew rollbackDatabase \
          -PliquibaseTag="$DB_ROLLBACK_TAG" \
          -PconfirmRollback=true

  be-generate-jooq:
    desc: 現在のDBスキーマからjOOQソースを生成
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew jooqCodegen

  be-refresh-jooq:
    desc: マイグレーション後の最新DBからjOOQソースを生成
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew migrateAndGenerateJooq

  # Backend quality
  be-format:
    desc: バックエンドのコードフォーマットを適用
    dir: backend
    cmds:
      - ./gradlew spotlessApply

  be-lint:
    desc: バックエンドの静的解析を実行
    dir: backend
    cmds:
      - ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest

  be-openapi-lint:
    desc: 依存起動済みのテストDBでOpenAPI 3.1契約をopenapi/openapi.yamlへ生成しSpectralで検査
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        SPRING_CONFIG_IMPORT="optional:file:../{{.TEST_ENV_FILE}}[.properties]" ./gradlew exportOpenApi
      - task: api-lint

  be-openapi-check:
    desc: 直前のbe-testが書き出したOpenAPI契約をSpectralで検査し、コミット済みの内容と一致するか検査（前提はbe-testの実行済み。単体ではdriftを検出できない）
    cmds:
      - task: api-lint
      - task: api-drift-check
        vars: { PATHS: openapi/openapi.yaml }

  be-test:
    desc: 依存起動済みのテストDBでマイグレーションとテストを実行し、OpenApiContractTestがopenapi/openapi.yamlを書き出す
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        SPRING_CONFIG_IMPORT="optional:file:../{{.TEST_ENV_FILE}}[.properties]" ./gradlew migrateDatabase test -PopenapiExport=true

  be-test-dev:
    desc: 作りかけを含むchangesetを適用してテスト
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        SPRING_CONFIG_IMPORT="optional:file:../{{.TEST_ENV_FILE}}[.properties]" ./gradlew update test

  be-mutation-test:
    desc: 依存起動済みのテストDBでPITミューテーションテストを実行
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        SPRING_CONFIG_IMPORT="optional:file:../{{.TEST_ENV_FILE}}[.properties]" ./gradlew migrateDatabase pitest

  test-deps-up:
    desc: テスト専用の依存スタックを起動
    deps: [_ensure-test-env]
    cmds:
      - '{{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait'

  test-deps-down:
    desc: テスト専用の依存スタックをボリュームごと停止
    deps: [_ensure-test-env]
    cmds:
      - '{{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans'

  test:
    desc: 隔離依存を起動してマイグレーション検証とテスト後に片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        cleanup() {
          status=$?
          trap - EXIT
          cleanup_status=0
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans || cleanup_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait
        task be-verify-migrations TEST_ENV_FILE="{{.TEST_ENV_FILE}}"
        task be-test TEST_ENV_FILE="{{.TEST_ENV_FILE}}"
        task api-lint

  test-dev:
    desc: 隔離依存を起動して作りかけを含むテスト後に片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        cleanup() {
          status=$?
          trap - EXIT
          cleanup_status=0
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans || cleanup_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait
        task be-test-dev TEST_ENV_FILE="{{.TEST_ENV_FILE}}"

  mutation-test:
    desc: 隔離依存を使ってバックエンドのPITミューテーションテストを実行
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        cleanup() {
          status=$?
          trap - EXIT
          cleanup_status=0
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans || cleanup_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait
        task be-verify-migrations TEST_ENV_FILE="{{.TEST_ENV_FILE}}"
        task be-mutation-test TEST_ENV_FILE="{{.TEST_ENV_FILE}}"

  be-sbom:
    desc: バックエンドのCycloneDX SBOMを生成
    dir: backend
    cmds:
      - ./gradlew cyclonedxBom

  # API contract（ADR-052）
  api-lint:
    desc: コミット済みのOpenAPI契約をSpectralで検査（DB不要）
    cmds:
      - |
        {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
          stoplight/spectral:6.16.3@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050 \
          lint openapi/openapi.yaml --ruleset .spectral.yaml

  # 作業ツリーを index と比べるため、pre-commit で再生成した結果がステージ済みの内容と同じなら通る。
  # 新しく生成された未追跡のファイルも差分として扱う。
  api-drift-check:
    internal: true
    requires:
      vars: [PATHS]
    cmds:
      - |
        status=0
        git diff --exit-code -- {{.PATHS}} || status=1
        untracked="$(git ls-files --others --exclude-standard -- {{.PATHS}})"
        if [ -n "$untracked" ]; then
          printf '未追跡の生成物:\n%s\n' "$untracked"
          status=1
        fi
        if [ "$status" -ne 0 ]; then
          echo "生成物がコミット済みの内容と一致しません。task api-gen を実行し、差分をコミットしてください。" >&2
          exit 1
        fi

  # 違反例は、違反ごとの「ルール名|JSON パス」が stylish 出力の同じ行に出ることを確かめる。
  # text 形式は JSON パスを出さないため、既定の stylish 形式を使う。
  api-lint-rules-test:
    desc: SpectralのルールをOpenAPIのfixture（合格例と違反例）で検査
    silent: true
    cmds:
      - |
        spectral() {
          {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
            stoplight/spectral:6.16.3@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050 \
            lint "$@" --ruleset .spectral.yaml
        }
        spectral openapi/spectral-fixtures/valid.yaml
        status=0
        output="$(spectral openapi/spectral-fixtures/invalid.yaml)" || status=$?
        if [ "$status" -eq 0 ]; then
          printf '%s\n' "$output"
          echo "違反例 invalid.yaml が Spectral の検査を通りました。" >&2
          exit 1
        fi
        missing=0
        while IFS='|' read -r rule path; do
          if ! printf '%s\n' "$output" | grep -F -- " $rule " | grep -qF -- " $path"; then
            echo "検出されなかった違反: $rule|$path" >&2
            missing=1
          fi
        done <<'EOF'
        operation-description|paths./api/sample-orders.post
        oas3-parameter-description|paths./api/sample-orders/{sampleOrderId}.get.parameters[0]
        tag-description|tags[3]
        operation-singular-tag|paths./api/sample-orders.get.tags
        tag-name-format|paths./api/sample-orders.get.tags[1]
        tag-name-format|paths./api/orders.get.tags[0]
        operation-tag-defined|paths./api/sample-payments.get.tags[0]
        schema-property-description|components.schemas.SampleOrderRequest.properties.giftWrap
        schema-property-example|components.schemas.SampleOrderRequest.properties.customerId
        schema-property-example|components.schemas.SampleOrderRequest.properties.quantity
        error-response-problem-detail|paths./api/sample-orders/{sampleOrderId}.get.responses[404]
        problem-response-content|components.responses.NotFoundProblem.content
        common-problem-detail-schema|components.schemas
        bad-request-validation-problem|components.responses.BadRequestProblem.content.application/problem+json.schema.$ref
        problem-type-uri-reference|components.schemas.ProblemDetail.properties.type.format
        EOF
        if [ "$missing" -ne 0 ]; then
          printf '%s\n' "$output"
          exit 1
        fi
        echo "Spectral のルールは合格例を通し、違反例の全件を検出しました。"

  api-client-gen:
    desc: コミット済みのOpenAPI契約からOrvalでAPI clientとMSW handlerを再生成（DB不要）
    dir: frontend
    cmds:
      - vp run orval

  api-client-check:
    desc: Orvalで再生成したAPI clientがコミット済みの内容と一致するか検査（DB不要）
    cmds:
      - task: api-client-gen
      - task: api-drift-check
        vars: { PATHS: frontend/src/api/generated }

  api-gen:
    desc: テスト用依存を起動し、OpenAPI契約の生成、Spectral検査、Orvalの再生成を実行して片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        cleanup() {
          status=$?
          trap - EXIT
          cleanup_status=0
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans || cleanup_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait
        task be-openapi-lint TEST_ENV_FILE="{{.TEST_ENV_FILE}}"
        task api-client-gen

  api-check:
    desc: api-genで再生成したOpenAPI契約とAPI clientがコミット済みの内容と一致するか検査
    deps: [_ensure-test-env]
    cmds:
      - task: api-gen
      - task: api-drift-check
        vars: { PATHS: openapi/openapi.yaml frontend/src/api/generated }

  # api-breaking-approved ラベルの PR では CI が API_BREAKING_APPROVED=true を渡し、結果を記録するだけにする。
  api-breaking:
    desc: baseブランチのOpenAPI契約と比べた破壊的変更をoasdiffで検査
    vars:
      BASE_REF: '{{.BASE_REF | default "main"}}'
    env:
      BASE_REF: '{{.BASE_REF}}'
    cmds:
      - |
        base="origin/$BASE_REF"
        if ! git cat-file -e "$base:openapi/openapi.yaml" 2>/dev/null; then
          echo "base に openapi/openapi.yaml がないため比較をとばします。"
          exit 0
        fi
        mkdir -p build
        git show "$base:openapi/openapi.yaml" > build/openapi-base.yaml
        fail_on=(--fail-on ERR)
        if [ "${API_BREAKING_APPROVED:-}" = "true" ]; then
          fail_on=()
          echo "api-breaking-approved ラベルがあるため、結果を記録して失敗にしません。PR 本文に理由を書いてください。"
        fi
        {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
          tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
          breaking build/openapi-base.yaml openapi/openapi.yaml "${fail_on[@]}"

  api-docs:
    desc: コミット済みのOpenAPI契約からRedocly CLIで静的HTMLの設計書を生成（build/api-docs/index.html）
    cmds:
      - mkdir -p build/api-docs
      - |
        {{.DOCKER}} run --rm -e REDOCLY_TELEMETRY=off -v "$PWD:/repo" -w /repo \
          redocly/cli:2.57.0@sha256:e320090ecd380878ff2aa671a928d5ac28fcbb7bb6230250d772790811125aea \
          build-docs openapi/openapi.yaml --output build/api-docs/index.html --disableGoogleFont

  # Compose and services
  compose-up:
    desc: ローカル依存サービスを起動
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" up -d --wait'

  compose-up-backend:
    desc: backendを含む全サービスをビルドして起動
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend up -d --build --wait'

  compose-down:
    desc: Composeサービスをnamed volumeを保持して停止
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend down'

  compose-ps:
    desc: Composeサービスの状態を表示
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend ps'

  compose-logs:
    desc: Composeサービスのログを追跡
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend logs --follow'

  keycloak-logs:
    desc: Keycloakのログを追跡
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" logs --follow keycloak'

  keycloak-reimport:
    desc: Keycloakデータだけを削除してrealmを再投入
    silent: true
    cmds:
      - |
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" create keycloak >/dev/null
        container_id="$({{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" ps -aq keycloak)"
        volume="$({{.DOCKER}} inspect "$container_id" | jq -r '.[0].Mounts | map(select(.Destination == "/opt/keycloak/data") | .Name) | first // empty')"
        if [ -z "$volume" ]; then
          echo "Keycloak data volume を特定できませんでした。" >&2
          exit 1
        fi
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" rm --stop --force keycloak
        {{.DOCKER}} volume rm "$volume"
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" up -d --wait keycloak
        echo "Keycloak realm を再投入しました。"

  oidc-check:
    desc: KeycloakのOIDC discoveryとPKCE S256対応を確認
    cmds:
      - |
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" exec -T keycloak /bin/bash -ec '
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf "GET /realms/spring-modulith/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n" >&3
          response="$(cat <&3)"
          printf "%s" "$response" | grep -q "200 OK"
          printf "%s" "$response" | grep -q "\"issuer\":\"http://localhost:8080/realms/spring-modulith\""
          printf "%s" "$response" | grep -q "\"S256\""'
        echo "OIDC discovery と PKCE S256 を確認しました。"
        echo "Login URL: http://localhost:18080/oauth2/authorization/web"

  otel-collector-check:
    desc: Collectorの設定が許可したログ属性だけを残すことを確認
    silent: true
    cmds:
      - |
        # このタスクは、Collector の config.yaml が「残してよい値だけを残し、漏れてはいけない値を捨てる」ことの回帰テストである。
        # allowlist は YAML の設定で、型検査もコンパイルも効かない。processor を 1 行、正規表現を 1 文字間違えると、
        # 個人情報や URL のトークンが保存先に流れ、一度書かれたログは取り消せない。だから設定を変えたら必ず流して確かめる。
        # 検証する内容の正文は docs/observability/conventions.md の「検証」節と ADR-068 にある（Taskfile は手順だけを持つ）。
        # 本物の Grafana を立てず、check/check.yaml で出口だけをファイルに差し替える。processor は config.yaml のまま使う。
        # 出口はバックエンド（backend.json）とフロントエンド（frontend.json）に分け、それぞれ別の jq で検査する。
        # 入力の fixture は check/fixtures/ に置き、backend.json は OTLP 形式、frontend.json は Faro の payload 形式である。
        # イメージは Compose の定義から取り、Dependabot の更新と揃える。
        image="$({{.DOCKER}} compose --env-file .env.example -f docker/compose.yml config --format json | jq -r '.services["otel-collector"].image')"
        out="$(mktemp -d)"
        chmod 777 "$out"
        container=""
        cleanup() {
          status=$?
          trap - EXIT
          if [ -n "$container" ]; then {{.DOCKER}} rm -f "$container" >/dev/null || true; fi
          rm -rf "$out"
          exit "$status"
        }
        trap cleanup EXIT
        container="$({{.DOCKER}} run -d -p 127.0.0.1::4318 -p 127.0.0.1::12347 \
          -e OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT=0.0.0.0:4318 \
          -e OTEL_COLLECTOR_FARO_HTTP_ENDPOINT=0.0.0.0:12347 \
          -v "$PWD/docker/otel-collector:/etc/otelcol-check:ro" -v "$out:/out" \
          "$image" --config /etc/otelcol-check/config.yaml --config /etc/otelcol-check/check/check.yaml)"
        address="$({{.DOCKER}} port "$container" 4318/tcp | head -n 1)"
        faro_address="$({{.DOCKER}} port "$container" 12347/tcp | head -n 1)"
        accepted=0
        for _ in $(seq 1 30); do
          if curl -fsS -o /dev/null -X POST -H "Content-Type: application/json" 2>/dev/null \
            --data-binary "@docker/otel-collector/check/fixtures/backend.json" "http://$address/v1/logs"; then
            accepted=1
            break
          fi
          sleep 1
        done
        if [ "$accepted" -ne 1 ]; then
          echo "Collector がログを受け付けませんでした。" >&2
          {{.DOCKER}} logs "$container" >&2
          exit 1
        fi
        for _ in $(seq 1 30); do
          if grep -qF 'resourceLogs' "$out/backend.json" 2>/dev/null; then break; fi
          sleep 1
        done
        if ! jq -e '
          def value($key): first(.attributes[]? | select(.key == $key) | .value.stringValue);
          any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["exception.message", "exception.stacktrace", "exception.type", "http.response.status_code"]
              and (first(.attributes[]? | select(.key == "http.response.status_code") | .value.intValue) == "500")
              and value("exception.type") == "java.lang.IllegalStateException"
              and value("exception.message") == "order failed"
              and (value("exception.stacktrace") | contains("OrderService.java:84"))
          )
        ' "$out/backend.json" >/dev/null; then
          echo "ログ属性が allowlist または期待値と一致しません。" >&2
          exit 1
        fi
        fail() {
          echo "$1" >&2
          {{.DOCKER}} logs "$container" >&2
          exit 1
        }
        # faro receiver の起動は OTLP より遅れうるので、202 になるまで送る。202 の後は再送しない（出口の記録が増えるため）。
        accepted=0
        for _ in $(seq 1 30); do
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            --data-binary "@docker/otel-collector/check/fixtures/frontend.json" "http://$faro_address/collect" || true)"
          if [ "$status" = "202" ]; then
            accepted=1
            break
          fi
          sleep 1
        done
        if [ "$accepted" -ne 1 ]; then fail "Collector の faro receiver が Faro の payload を受け付けませんでした。"; fi
        # 受け口の挙動。本文の {} は例外も log も持たないので、出口の記録を増やさない。
        status="$(curl -s -o /dev/null -w '%{http_code}' "http://$faro_address/collect")"
        if [ "$status" != "405" ]; then fail "faro receiver が GET に 405 を返しませんでした（$status）。"; fi
        status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: text/plain" --data-binary '{}' "http://$faro_address/collect")"
        if [ "$status" != "415" ]; then fail "faro receiver が text/plain の POST に 415 を返しませんでした（$status）。"; fi
        status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" --data-binary '{}' "http://$faro_address/any/path")"
        if [ "$status" != "202" ]; then fail "faro receiver が /collect 以外のパスの POST に 202 を返しませんでした（$status）。"; fi
        status="$(head -c 1100000 /dev/zero | tr '\0' ' ' \
          | curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data-binary @- "http://$faro_address/collect")"
        if [ "$status" != "400" ]; then fail "faro receiver が 1 MiB を超える本文に 400 を返しませんでした（$status）。"; fi
        for _ in $(seq 1 30); do
          if grep -qF 'resourceLogs' "$out/frontend.json" 2>/dev/null; then break; fi
          sleep 1
        done
        if [ ! -s "$out/frontend.json" ]; then fail "フロントエンドのログが出口に届きませんでした。"; fi
        if grep -qE 'secret-|person@example\.com|fixture-user-id|fixture-session-id|FixtureAgent' "$out/frontend.json"; then
          fail "フロントエンドのログに、許可していない値か URL の query か fragment が残りました。"
        fi
        # file exporter はバッチごとに一行を書くので -s で読む。
        if ! jq -s -e --arg apostrophe "can't" '
          def attr($key): first(.attributes[]? | select(.key == $key) | .value.stringValue);
          [.[].resourceLogs[]?] as $resources
          | [$resources[].scopeLogs[]?.logRecords[]?] as $records
          | ($resources | length) > 0
            and all($resources[]; .resource
              | attr("service.name") == "demo-web"
                and attr("service.namespace") == "demo"
                and attr("service.version") == "0.0.0-fixture"
                and attr("deployment.environment.name") == "local"
                # payload の meta.app に関わらず、resource 属性は許可した 4 つだけにする。
                and ([.attributes[]?.key] | sort) == ["deployment.environment.name", "service.name", "service.namespace", "service.version"])
            and ($records | length) == 5
            and all($records[];
              .body.stringValue == "Browser exception"
                and ([.attributes[]?.key] | sort) == ["exception.message", "exception.stacktrace", "exception.type", "url.path"]
                and attr("exception.type") == "Error"
                and attr("url.path") == "/orders/42")
            and any($records[];
              attr("exception.message") == "failed to load http://localhost:5173/api/orders"
                and (attr("exception.stacktrace") | contains("(http://localhost:5173/assets/index-abc.js:10:5)")))
            # query の除去が 1 行目の改行（\ と n の 2 文字）を食べていないこと。
            and any($records[]; attr("exception.stacktrace") | contains("http://localhost:5173/api/orders\\n  at render ("))
            and any($records[]; attr("exception.message") == $apostrophe)
            and any($records[]; attr("exception.message") == "bad http://localhost:5173/x tail")
            # scheme が大文字でも query を消し、log、event、measurement は捨てる（記録は例外の 5 件だけ）。
            and any($records[]; attr("exception.message") == "upper HTTPS://H/x tail")
            # path に括弧を含む URL でも query を消し、frame の :行:列) は残す。
            and any($records[]; attr("exception.message") == "paren https://example.test/a(b) tail"
              and (attr("exception.stacktrace") | contains("(http://localhost:5173/assets/a(b).js:1:2)")))
        ' "$out/frontend.json" >/dev/null; then
          fail "フロントエンドのログの属性、resource 属性、本文のいずれかが期待値と一致しません。"
        fi
        echo "Collector OK: 許可した属性だけを残し、Faro の payload から URL の query と許可していない値を消しました。"

  compose-reset:
    desc: 明示確認付きでComposeサービスと全データを削除
    env:
      CONFIRM_RESET: '{{.CONFIRM_RESET}}'
    cmds:
      - |
        if [ "$CONFIRM_RESET" != "yes" ]; then
          echo "全サービスのデータを削除して初期化します。実行するには CONFIRM_RESET=yes を指定してください（例: task compose-reset CONFIRM_RESET=yes）。" >&2
          exit 1
        fi
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend down --volumes --remove-orphans'

  # Security
  scan-secrets:
    desc: ステージ済みの変更をbetterleaksでスキャン
    cmds:
      - PATH="$PATH:$HOME/go/bin" betterleaks git --staged --no-banner --redact

  scan-secrets-all:
    desc: リポジトリ全体と現在のブランチの履歴をbetterleaksでスキャン
    cmds:
      - PATH="$PATH:$HOME/go/bin" betterleaks git . --no-banner --redact --git-workers=16 --log-opts=HEAD

  scan-dast:
    desc: 隔離した環境で認証付きのpassive scan（OWASP ZAP）を実行し、レポートをbuild/dastに出力
    cmds:
      - task: dast-run
        vars: { DAST_PLAN: passive }

  scan-dast-active:
    desc: 隔離した環境で認証付きのactive scan（OWASP ZAP）を実行し、レポートをbuild/dastに出力
    cmds:
      - task: dast-run
        vars: { DAST_PLAN: active }

  # DAST の本体（ADR-056）。依存、backend、vp preview、ZAP を起動し、失敗したときも片付ける。
  # 検出では失敗させず、起動、ログイン、CSRF の前提確認の失敗だけで失敗させる。
  # vp は PATH 上にある前提（CI は frontend/node_modules/.bin を PATH に足す）。
  dast-run:
    internal: true
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        zap_image="zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef"
        report_dir="$PWD/build/dast"
        preview_pid_file="$report_dir/preview.pid"
        compose() { {{.DOCKER}} compose -p spring-modulith-dast -f "{{.TEST_COMPOSE_FILE}}" --profile backend-smoke "$@"; }
        fail() { echo "✗ $1" >&2; exit 1; }

        # 4173 は preview、18081 は backend、18082 は ZAP の proxy、5433、6380、8081 は compose-test が使う。
        for port in 4173 18081 18082 5433 6380 8081; do
          rc=0
          curl --silent --output /dev/null --connect-timeout 1 "http://127.0.0.1:$port/" || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "✗ ポート $port が使用中のため DAST を開始できません。" >&2
            echo "  task test や前回の DAST が残っていないか確認してください（開発環境はこれらのポートを使いません）。" >&2
            exit 1
          fi
        done

        cleanup() {
          status=$?
          trap - EXIT
          cleanup_status=0
          if [ -s "$preview_pid_file" ]; then
            preview_pid="$(cat "$preview_pid_file")"
            # Task の組み込みの kill はプロセスグループを指定できないので、外部の kill を使う。
            env kill -TERM -- "-$preview_pid" 2>/dev/null || true
            rm -f "$preview_pid_file"
          fi
          {{.DOCKER}} logs spring-modulith-dast-backend >"$report_dir/backend.log" 2>&1 || true
          {{.DOCKER}} rm --force spring-modulith-dast-zap spring-modulith-dast-backend >/dev/null 2>&1 || true
          compose down --volumes --remove-orphans || cleanup_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$cleanup_status"
        }
        trap cleanup EXIT

        rm -rf "$report_dir" && mkdir -p "$report_dir" && chmod a+rwx "$report_dir"
        {{.DOCKER}} build --tag spring-modulith-backend:dast backend
        (cd frontend && vp build)
        compose up -d --wait

        {{.DOCKER}} run --detach --name spring-modulith-dast-backend --network host \
          --env-file "{{.TEST_ENV_FILE}}" --env SERVER_PORT=18081 \
          spring-modulith-backend:dast >/dev/null
        ready=0
        for attempt in $(seq 1 60); do
          if curl --fail --silent --output /dev/null http://127.0.0.1:18081/actuator/health/readiness; then ready=1; break; fi
          if [ -z "$({{.DOCKER}} ps --quiet --filter name=spring-modulith-dast-backend --filter status=running)" ]; then break; fi
          sleep 2
        done
        if [ "$ready" -ne 1 ]; then
          {{.DOCKER}} logs spring-modulith-dast-backend >&2 || true
          fail "backend が 18081 で ready になりませんでした。"
        fi

        # preview を別セッションで起動し、片付けでプロセスグループごと止める。
        # production mode は .env.test を読まないため、--mode test で .env.test の OIDC_ISSUER_URI を .env より優先させ、
        # CSP の form-action の IdP の origin を backend の issuer と揃える。
        setsid sh -c 'echo $$ >"$1"; cd frontend && SERVER_PORT=18081 exec vp preview --mode test --host 127.0.0.1 --port 4173' sh "$preview_pid_file" \
          >"$report_dir/preview.log" 2>&1 &
        for attempt in $(seq 1 30); do
          if curl --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
          sleep 1
        done
        # 未認証の /api/missing が 401 なら、preview の proxy が backend へ届いている。
        code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4173/api/missing || true)"
        if [ "$code" != "401" ]; then
          cat "$report_dir/preview.log" >&2 || true
          fail "preview 経由の GET /api/missing が 401 ではありません（$code）。"
        fi

        zap() {
          {{.DOCKER}} run --rm --name spring-modulith-dast-zap --network host \
            -v "$PWD/docker/zap:/zap/plans:ro" -v "$report_dir:/zap/wrk:rw" \
            "$zap_image" zap.sh -cmd -port 18082 -autorun "/zap/plans/$1.yaml"
        }
        if ! zap preflight; then
          fail "認証付きの前提確認に失敗しました。GET /api/missing（ログイン）と POST /api/missing（CSRF）がどちらも 404 になる必要があります。"
        fi

        # ZAP は警告があると 2 で終わる。検出では失敗させないので、0 と 2 だけを成功として扱う。
        zap_status=0
        zap "{{.DAST_PLAN}}" || zap_status=$?
        if [ "$zap_status" -eq 2 ]; then
          echo "ZAP が警告を報告しました。ログを確認してください。"
        elif [ "$zap_status" -ne 0 ]; then
          fail "ZAP の {{.DAST_PLAN}} plan が終了コード $zap_status で失敗しました。"
        fi
        # ZAP の生の SARIF は別名で受け取り、変換と検査を通ったものだけを CI がアップロードする名前で置く。
        # 途中で失敗しても、変換前の SARIF が Code Scanning へ送られない。
        raw_sarif="$report_dir/zap-{{.DAST_PLAN}}.raw.sarif.json"
        sarif="$report_dir/zap-{{.DAST_PLAN}}.sarif.tmp"
        test -s "$raw_sarif" || fail "SARIF が出力されていません。"
        # Code Scanning は http の URI を受け付けず、リポジトリ内のファイルの位置だけを受け付ける。
        # そのため、位置を実行した plan のファイルへ書き換え、元の URL はメッセージの末尾に残す。
        # URL のクエリとフラグメントは OAuth の state や code など実行ごとに変わるため、メッセージと fingerprint から外す。
        # 位置が同じでも別の警告として残るよう、fingerprint を rule、method、URL、evidence、attack、元のメッセージから作る。
        # ZAP は risk を level だけで表す（High は error、Medium は warning、Low は note、Informational は none）。
        # Informational は Code Scanning に送らず、HTML と JSON のレポートに残す。
        # GitHub は rule の security-severity で重大度を表示するため、level から付ける（GitHub Docs の SARIF support for code scanning）。
        jq --arg plan "docker/zap/{{.DAST_PLAN}}.yaml" '
          def to_plan: map(.physicalLocation.artifactLocation = {uri: $plan} | .physicalLocation.region.startLine //= 1);
          def sev: {error: "8.0", warning: "5.0", note: "2.0"}[. // "warning"];
          .runs[] |= (del(.artifacts, .originalUriBaseIds) | .results |= map(select((.level // "warning") != "none")
            | .locations[0] as $loc
            | (($loc.physicalLocation.artifactLocation.uri // .webRequest.target // "") | sub("[?#].*$"; "")) as $url
            | .partialFingerprints.primaryLocationLineHash = ([.ruleId, .webRequest.method // "", $url,
                ($loc.physicalLocation.region.snippet.text // ""), ($loc.properties.attack // ""), .message.text] | join("|"))
            | .message.text += "\nURL: \($url)"
            | .locations |= to_plan
            | if has("relatedLocations") then .relatedLocations |= to_plan else . end)
            | (reduce .results[] as $r ({}; .[$r.ruleId] = ([.[$r.ruleId], ($r.level | sev)] | map(select(.)) | max_by(tonumber)))) as $sev
            | .tool.driver.rules |= map(select($sev[.id]) | .properties["security-severity"] = $sev[.id] | .properties.tags = ["security"]))
        ' "$raw_sarif" >"$sarif" || fail "SARIF の変換に失敗しました。"
        jq -e '[.. | objects | .uri? | strings | select(test("^[A-Za-z][A-Za-z0-9+.-]*:"))] | length == 0' "$sarif" >/dev/null \
          || fail "SARIF に scheme 付きの URI が残っています。"
        jq -e '[.runs[].results[] | select((.level // "warning") == "none" or has("ruleIndex"))] | length == 0' "$sarif" >/dev/null \
          || fail "SARIF に Informational の結果か ruleIndex が残っています。"
        jq -e '[.runs[].results[] | select((.partialFingerprints.primaryLocationLineHash // "" | test("://[^|]*[?#]"))
            or (.message.text | test("\nURL: [^\n]*[?#]")))] | length == 0' "$sarif" >/dev/null \
          || fail "SARIF の fingerprint かメッセージの URL にクエリが残っています。"
        jq -e 'all(.runs[]; .tool.driver.name == "ZAP")' "$sarif" >/dev/null || fail "SARIF の tool 名が ZAP ではありません。"
        mv "$sarif" "$report_dir/zap-{{.DAST_PLAN}}.sarif.json"
        echo "DAST のレポートを $report_dir に出力しました。"

  # Lint and format
  lint-actions:
    desc: GitHub Actionsワークフローをactionlintで検査
    cmds:
      - |
        docker run --rm -v "$PWD":/repo -w /repo \
          rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
          -color

  lint-actions-security:
    desc: GitHub Actionsワークフローをzizmorで検査
    cmds:
      - |
        docker run --rm -v "$PWD":/repo -w /repo \
          ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 .github/workflows/

  lint-docker:
    desc: 全Dockerfileをhadolintで検査
    cmds:
      - |
        files="$(git ls-files '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile')"
        if [ -z "$files" ]; then
          echo "Dockerfile が見つかりません。"
        else
          printf 'linting: %s\n' $files
          docker run --rm -i -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint $files
        fi

  lint-docker-check:
    desc: 全Dockerfileをdocker build --checkで検査
    cmds:
      - |
        files="$(git ls-files '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile')"
        if [ -z "$files" ]; then
          echo "Dockerfile が見つかりません。"
        else
          for file in $files; do
            echo "checking: $file"
            docker build --check -f "$file" "$(dirname "$file")"
          done
        fi

  lint-compose:
    desc: 全Composeファイルの構文と変数展開を検証
    deps: [_ensure-test-env]
    cmds:
      - |
        files="$(git ls-files '**/compose.yml' '**/compose.yaml' '**/compose-test.yml' '**/compose-test.yaml' '**/docker-compose.yml' '**/docker-compose.yaml' 'compose.yml' 'compose.yaml' 'compose-test.yml' 'compose-test.yaml' 'docker-compose.yml' 'docker-compose.yaml')"
        if [ -z "$files" ]; then
          echo "Compose ファイルが見つかりません。"
        else
          for file in $files; do
            echo "validating: $file"
            docker compose --env-file .env.example -f "$file" config --quiet
          done
        fi

  lint-md:
    desc: Markdownをmarkdownlint-cli2で検査
    cmds:
      - npx --yes markdownlint-cli2 "**/*.md"

  lint-md-fix:
    desc: Markdownlintで安全に修正できる問題を修正
    cmds:
      - npx --yes markdownlint-cli2 --fix "**/*.md"

  lint-taskfile:
    desc: TaskfileをTask本体で解析しYAML構文とスキーマ構造を検証
    silent: true
    cmds:
      - |
        task --list-all >/dev/null
        echo "Taskfile OK: YAML構文とスキーマ構造の解析に成功しました。"

  lint-semgrep:
    desc: Semgrep OSSで静的解析
    cmds:
      - |
        docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD":/src -w /src \
          semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/typescript \
            --config p/dockerfile \
            --config p/secrets \
            --exclude .kiro \
            --error \
            --metrics off \
            --disable-version-check

  # Vulnerability scanning
  scan-vulns:
    desc: backendとfrontendの依存関係脆弱性を検査
    cmds:
      - task: scan-vulns-backend
      - task: scan-vulns-frontend

  scan-vulns-backend:
    desc: backendのCycloneDX SBOMをTrivyで検査
    cmds:
      - |
        (cd backend && ./gradlew cyclonedxBom)
        docker run --rm -v "$PWD/backend":/src -w /src \
          -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2 \
          -e TRIVY_JAVA_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-java-db:1 \
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
          sbom build/reports/cyclonedx/application.cdx.json \
            --ignore-unfixed

  scan-vulns-frontend:
    desc: frontendの解決済み依存関係をTrivyで検査
    cmds:
      - |
        (cd frontend && pnpm install --frozen-lockfile)
        docker run --rm -v "$PWD/frontend":/src -w /src \
          -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2 \
          -e TRIVY_JAVA_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-java-db:1 \
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
          fs . \
            --scanners vuln \
            --ignore-unfixed
