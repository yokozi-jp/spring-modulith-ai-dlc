version: "3"

set: [errexit, nounset, pipefail]

vars:
  DOCKER: '{{.DOCKER | default "docker"}}'
  COMPOSE_ENV_FILE: '{{.COMPOSE_ENV_FILE | default ".env"}}'
  COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker/compose.yml"}}'
  TEST_ENV_FILE: '{{.TEST_ENV_FILE | default ".env.test"}}'
  TEST_COMPOSE_FILE: '{{.TEST_COMPOSE_FILE | default "docker/compose-test.yml"}}'
  # frontend/ で vp run と vp exec が対象にする apps/web。名前が合わないときは、黙って何も実行せず失敗にする。
  FE_WEB: --filter @frontend/web --fail-if-no-match
  # frontend/ で vp run が対象にする packages/api。Orval の生成物と api-fetch、api-error の置き場。
  FE_API: --filter @frontend/api --fail-if-no-match
  DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG | default ""}}'
  CONFIRM_ROLLBACK: '{{.CONFIRM_ROLLBACK | default ""}}'
  CONFIRM_RESET: '{{.CONFIRM_RESET | default ""}}'
  CONFIRM_RULESET: '{{.CONFIRM_RULESET | default ""}}'
  # 空なら全体を、git の参照（origin/main など）なら、そこからの差分のクラスだけを PIT で変異させる。
  PIT_CHANGED_SINCE: '{{.PIT_CHANGED_SINCE | default ""}}'

# 引数なしのtaskは安全なタスク一覧だけを表示する。
tasks:
  default:
    silent: true
    cmds:
      - task --list

  help:
    desc: 各タスクの一覧と説明を表示
    silent: true
    cmds:
      - task --list

  # Workflow
  dev:
    desc: 依存を起動してバックエンドを起動
    cmds:
      - task: compose-up
      - echo "依存を起動しました。初回またはchangeset追加後は task be-migrate を実行してください。"
      - task: be-run

  check:
    desc: バックエンドの静的解析で素早く確認
    cmds:
      - task: lint-session-sql
      - task: lint-db-clock
      - task: be-lint

  verify:
    desc: push前の静的解析と隔離テストを実行
    cmds:
      - task: lint-session-sql
      - task: lint-db-clock
      - task: be-lint
      - task: test

  # Release
  release-check:
    desc: release-please設定と版ファイルの一致を検証
    silent: true
    cmds:
      - |
        node --input-type=module <<'NODE'
        import { readFileSync } from "node:fs";

        const config = JSON.parse(readFileSync("release-please-config.json", "utf8"));
        const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
        const packageConfig = config.packages?.["."];
        const manifestVersion = manifest["."];
        const versionFile = readFileSync("version.txt", "utf8").trim();
        const buildFile = readFileSync("backend/build.gradle", "utf8");
        const buildVersion = buildFile.match(
          /^version = '([^']+)' \/\/ x-release-please-version$/m,
        )?.[1];
        const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
        const updatesBuild = packageConfig?.["extra-files"]?.some(
          ({ type, path }) => type === "generic" && path === "backend/build.gradle",
        );

        if (packageConfig?.["release-type"] !== "simple") {
          throw new Error('packages["."].release-type must be "simple"');
        }
        if (packageConfig?.["version-file"] !== "version.txt") {
          throw new Error('packages["."].version-file must be "version.txt"');
        }
        if (packageConfig?.["include-component-in-tag"] !== false) {
          throw new Error("release tags must use v<version> without a component prefix");
        }
        if (!updatesBuild) {
          throw new Error("backend/build.gradle must be a generic extra-file");
        }
        if (!semver.test(manifestVersion ?? "")) {
          throw new Error("manifest root version must be a stable semantic version");
        }
        if (manifestVersion !== versionFile || manifestVersion !== buildVersion) {
          throw new Error(
            `version mismatch: manifest=${manifestVersion}, version.txt=${versionFile}, build.gradle=${buildVersion}`,
          );
        }
        if (
          config["bootstrap-sha"] !== undefined &&
          !/^[0-9a-f]{40}$/.test(config["bootstrap-sha"])
        ) {
          throw new Error("bootstrap-sha must be a full 40-character commit SHA");
        }

        console.log(`Release configuration OK: v${manifestVersion}`);
        NODE

  e2e:
    desc: compose-testでbackendを起動し、Vite previewに対してPlaywrightのE2Eを実行して後片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        export DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}"
        # slot の取得に失敗したら、$(...) の失敗を eval に隠さず止める。
        slot_env="$(bash tooling/test-slot/test-slot.sh acquire "{{.TEST_ENV_FILE}}" web)"
        eval "$slot_env"
        compose() { {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" --profile e2e "$@"; }
        keep_env=""
        if [ "${E2E_KEEP_ENV:-}" = "1" ] && [ -z "${CI:-}" ]; then keep_env="1"; fi
        # 本体と後片付けの終了コードの扱いは docs/tooling/taskfile.md の「後片付けと終了コード」を参照する。
        status=0
        (
          set -e
          task e2e-up DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}"
          (cd frontend && vp run {{.FE_WEB}} e2e)
        ) || status=$?
        cleanup_status=0
        keep=""
        # 成否にかかわらず backend のログを証拠に残す。秘密の値が入っていれば、テストの失敗と同じく扱う。
        collect_status=0
        task e2e-collect-logs DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}" LOG=frontend/apps/web/test-results/backend.log || collect_status=$?
        if [ "$status" -eq 0 ]; then status=$collect_status; fi
        if [ "$status" -ne 0 ]; then
          if [ -n "$keep_env" ] && [ -n "$(compose ps -aq 2>/dev/null)" ]; then keep="1"; fi
        fi
        if [ -n "$keep" ]; then
          echo "E2E_KEEP_ENV=1 のため、compose-test のコンテナと volume を残しました（slot $TEST_SLOT、Compose project $COMPOSE_PROJECT_NAME）。この slot は片付けるまで使えません。" >&2
          echo "  backend のログ：{{.DOCKER}} compose -p $COMPOSE_PROJECT_NAME -f {{.TEST_COMPOSE_FILE}} --profile e2e logs backend" >&2
          echo "  （frontend/apps/web/test-results/backend.log は vp run e2e の再実行で消える）" >&2
          echo "  再実行（この shell の環境を汚さないよう subshell で）：( eval \"\$(TEST_SLOT=$TEST_SLOT bash tooling/test-slot/test-slot.sh acquire .env.test web 2>/dev/null)\" && cd frontend && vp run {{.FE_WEB}} e2e )" >&2
          echo "  片付け：{{.DOCKER}} compose -p $COMPOSE_PROJECT_NAME -f {{.TEST_COMPOSE_FILE}} --profile e2e down --volumes --remove-orphans" >&2
        else
          compose down --volumes --remove-orphans || cleanup_status=$?
        fi
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        exit "$cleanup_status"

  # task e2e と .agents/skills/verify-demo/scripts/stack.sh が呼ぶ。
  e2e-up:
    desc: frontendとbackendをビルドし、compose-testの依存とbackendを起動してmigrationと代表データを入れる（片付けない）
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        # migration とシーダーはホストの Gradle で動く。JAVA_HOME があればそれを、なければ PATH の java を使う。
        if ! command -v "${JAVA_HOME:+$JAVA_HOME/bin/}java" >/dev/null 2>&1; then
          echo "Java が見つかりません（JAVA_HOME か PATH）。docs/local-env-setup/setup.md の手順で Corretto 25 を入れてください。" >&2
          exit 1
        fi
        # compose の backend と Playwright が .env.test を固定で読むため、TEST_ENV_FILE の上書きには対応しない。
        # slot が空きを確かめた後に、別のプロセスが取ったときのために、web と backend のポートをもう一度確かめる。
        export DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}"
        # slot の取得に失敗したら、$(...) の失敗を eval に隠さず止める。
        slot_env="$(bash tooling/test-slot/test-slot.sh acquire "{{.TEST_ENV_FILE}}" web)"
        eval "$slot_env"
        compose() { {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" --profile e2e "$@"; }
        for port in "$E2E_WEB_PORT" "$TEST_BACKEND_PORT"; do
          rc=0
          curl --silent --output /dev/null --max-time 2 "http://localhost:${port}/" || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "localhost:${port} は使用中です。この port を使うプロセスを止めてから実行してください。" >&2
            # 取った slot を返す。
            compose down --volumes --remove-orphans >/dev/null 2>&1 || true
            exit 1
          fi
        done
        (cd frontend && vp install --frozen-lockfile && vp exec {{.FE_WEB}} vp build --mode test && vp exec {{.FE_WEB}} playwright install chromium)
        compose build backend
        compose up -d --wait postgres keycloak wiremock
        task be-migrate COMPOSE_ENV_FILE="$TEST_ENV_FILE"
        # spec が読む商品と代表の注文を入れる（ADR-073）。slot の env ファイルは test の目印と loopback の DB_HOST と slot の DB_PORT を持つ。
        task be-seed COMPOSE_ENV_FILE="$TEST_ENV_FILE"
        compose up -d --wait backend
        # healthcheck はコンテナの中から確かめるため、preview の proxy と同じくホストから届くかを別に確かめる。
        if ! curl --fail --silent --show-error --max-time 5 "http://localhost:${TEST_BACKEND_PORT}/actuator/health/readiness" >/dev/null; then
          echo "ホストから backend（localhost:${TEST_BACKEND_PORT}）へ接続できません。{{.DOCKER}} compose -p $COMPOSE_PROJECT_NAME -f {{.TEST_COMPOSE_FILE}} --profile e2e logs backend で backend のログを確かめてください。" >&2
          exit 1
        fi

  e2e-collect-logs:
    desc: compose-testのbackendのログをLOGに書き、秘密の値、セッションのCookieの値、JWTの形の文字列が入っていれば失敗（task e2e-collect-logs LOG=<パス>）
    silent: true
    deps: [_ensure-test-env]
    requires:
      vars: [LOG]
    cmds:
      - |
        . ./.env.test
        mkdir -p "$(dirname "{{.LOG}}")"
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" --profile e2e logs --no-color backend > "{{.LOG}}" 2>&1 || true
        status=0
        for secret in "$OIDC_CLIENT_SECRET" "$E2E_PASSWORD"; do
          if [ -n "$secret" ] && grep -F -q -- "$secret" "{{.LOG}}"; then
            echo "{{.LOG}} に .env.test の OIDC_CLIENT_SECRET か E2E_PASSWORD の値が入っています。ログに出す値を確かめてください。" >&2
            status=1
          fi
        done
        # 値の一致では見つからない、セッションの Cookie の値と JWT の形（eyJ で始まる 3 つの base64url）も失敗にする。
        if grep -E -q '__Host-APP_SESSION=[^;[:space:]"]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "{{.LOG}}"; then
          echo "{{.LOG}} に __Host-APP_SESSION の Cookie の値か JWT の形の文字列が入っています。ログに出す値を確かめてください。" >&2
          status=1
        fi
        exit "$status"

  # ADR
  adr-check:
    desc: 判断が絡む変更にADRが伴うかを確認
    silent: true
    cmds:
      - |
        base="${ADR_DIFF_BASE:-origin/main}"
        if ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "ADR check: 比較起点 $base が無いためスキップします。" >&2
          exit 0
        fi
        changed="$(git diff --name-only "$base"...HEAD)"
        if [ -z "$changed" ]; then exit 0; fi
        sig="$(printf '%s\n' "$changed" | grep -E '^(frontend/|backend/build\.gradle|backend/buildSrc/|backend/gradle/[^/]+\.gradle|backend/src/main/resources/application(-[^/]+)?\.yaml|backend/src/main/resources/db/changelog/|backend/src/main/java/com/example/demo/SecurityConfig\.java|docker/|infrastructure/|\.github/workflows/)' || true)"
        # テスト、E2E、lint の fixture は判断を含まないので、frontend の変更から外す。
        sig="$(printf '%s\n' "$sig" | grep -vE '^frontend/(apps/[^/]+/(e2e|src/testing)/|lint/fixtures/|.*\.(test|spec)\.[cm]?[jt]sx?$)' || true)"
        if [ -z "$sig" ]; then exit 0; fi
        adr="$(printf '%s\n' "$changed" | grep -E '^docs/adr/ADR-[0-9]+.*\.md$' || true)"
        if [ -n "$adr" ]; then exit 0; fi
        if [ "${ADR_ACK:-}" = "1" ]; then
          echo "ADR check: ADR_ACK=1 のため警告を抑制しました。" >&2
          exit 0
        fi
        echo "" >&2
        echo "⚠ ADR 未追加の可能性: 判断が絡む変更が含まれますが docs/adr/ の更新がありません。" >&2
        echo "  対象の変更:" >&2
        printf '    - %s\n' $sig >&2
        echo "  重要な設計判断なら docs/adr/ に ADR を追加してください（規約: docs/adr/conventions.md）。" >&2
        echo "  日常的な実装選択、コード整形、自明に可逆な決定は ADR にしません（同じ規約の「ADR を作らないもの」）。" >&2
        echo "  該当しない場合は ADR_ACK=1 を付けて再実行できます（例: ADR_ACK=1 git push）。" >&2
        echo "" >&2
        if [ "${ADR_STRICT:-}" = "1" ]; then exit 1; fi

  # docs と Taskfile の同期候補を警告する。
  lint-docs-sync:
    internal: true
    silent: true
    cmds:
      - |
        base="${DOCS_DIFF_BASE:-origin/main}"
        if ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "Docs sync check: 比較起点 $base が無いためスキップします。" >&2
          exit 0
        fi
        changed="$({ git diff --name-only "$base"...HEAD; git diff --name-only; git diff --cached --name-only; } | sort -u)"
        if ! printf '%s\n' "$changed" | grep -qx 'Taskfile.yml'; then exit 0; fi
        missing=""
        for doc in README.md docs/tooling/dev-workflow.md docs/tooling/lint-and-test.md; do
          if ! printf '%s\n' "$changed" | grep -qx "$doc"; then missing="${missing}    - ${doc}\n"; fi
        done
        if [ -z "$missing" ]; then exit 0; fi
        echo "" >&2
        echo "⚠ Taskfile.yml が変更されています。公開タスクの変更なら次の文書も同じ変更で更新してください。" >&2
        printf '%b' "$missing" >&2
        echo "  内部実装だけの変更なら対応は不要です（規約: docs/tooling/taskfile.md）。" >&2
        echo "" >&2

  # OKF（docs/ を Open Knowledge Format v0.2 バンドルとして検証）
  okf-check:
    desc: docs の OKF 適合、内部リンク、孤立ドキュメント、責務混在の見直し合図、steering との境界を検証
    silent: true
    dir: docs
    preconditions:
      - sh: command -v iwe
        msg: iwe が無い。mise install --locked を実行する。
      - sh: command -v jq
        msg: jq が無い。mise install --locked を実行する。
    cmds:
      - task: lint-docs-sync
      - task: docs-boundary-check
      - task: adr-lint
      - task: removed-names-test
      - task: removed-names-check
      - task: ruleset-check
      - task: iwe-mcp-check
      - task: iwe-tools-check
      - |
        iwe schema validate
        stats="$(iwe stats -f json)"
        broken="$(printf '%s' "$stats" | jq '[.brokenLinks[]? | select((.targetKey | startswith("../")) | not)] | length')"
        if [ "$broken" != "0" ]; then
          echo "" >&2
          echo "✗ docs/ 内のリンク切れが $broken 件あります。" >&2
          printf '%s' "$stats" | jq -r '.brokenLinks[]? | select((.targetKey | startswith("../")) | not) | "    - " + .sourceKey + " -> " + .targetKey' >&2
          exit 1
        fi
        orphans="$(printf '%s' "$stats" | jq '.orphans | length')"
        if [ "$orphans" != "0" ]; then
          echo "" >&2
          echo "⚠ 孤立ドキュメントが $orphans 件あります（どこからも参照されていません）。" >&2
          echo "  index.md などの目次からリンクして、グラフに接続してください。" >&2
          printf '%s' "$stats" | jq -r '.orphans[] | "    - " + .' >&2
          exit 1
        fi

  # ADR の番号の重複、索引の行、索引と本文の状態と日付、リンクのラベルと宛先の番号を検査する（docs/adr/conventions.md）。
  # 検査の本体は tooling/adr-lint/adr-lint.mjs に置き、壊れた fixture に対する自己検査（test.sh）を先に実行する。
  # ponytail: okf-validate の paths は backend/src/** を含まないため、バックエンドの Javadoc だけを変える PR では CI が動かない。
  # 限界に当たったら paths に backend/src/** を足す。
  adr-lint:
    internal: true
    silent: true
    cmds:
      - bash tooling/adr-lint/test.sh
      - node tooling/adr-lint/adr-lint.mjs

  # 削除した識別子（tooling/removed-names/names.txt）が docs、.agents、backend/src に残っていないかを検査する。
  # 規約や skill に旧名が残ると、エージェントが写して、削除した API を呼ぶ。自己検査（test.sh）は removed-names-test が実行する。
  removed-names-check:
    internal: true
    silent: true
    cmds:
      - bash tooling/removed-names/check.sh

  # check.sh の自己検査。検査の道具を変える okf-check だけが実行する。
  removed-names-test:
    internal: true
    silent: true
    cmds:
      - bash tooling/removed-names/test.sh

  # .kiro/settings/mcp.json の iwe の起動コマンドが、作業ディレクトリごとに正しい iwe-mcp.sh を選ぶかを検査する（ADR-093）。
  iwe-mcp-check:
    internal: true
    silent: true
    cmds:
      - bash tooling/iwe-mcp/test.sh

  # iwec の全ツールが、残す読み取り系か mcp.json の disabledTools に入っているかを検査する。
  iwe-tools-check:
    internal: true
    silent: true
    cmds:
      - bash tooling/iwe-tools/test.sh
      - bash tooling/iwe-tools/check.sh

  # .github/rulesets/main.json の必須チェックを、branch-protection.md の一覧と workflow の name に突き合わせる。
  # ponytail: GitHub 上の ruleset との一致は CI で見ない。認証が要るため、比べるのは手元の task ruleset-diff で、限界に当たったら CI で API と比べる。
  ruleset-check:
    internal: true
    silent: true
    cmds:
      - bash tooling/ruleset-check/test.sh
      - bash tooling/ruleset-sync/test.sh
      - node tooling/ruleset-check/ruleset-check.mjs

  ruleset-diff:
    desc: GitHub 上の ruleset と .github/rulesets/main.json の差分を表示（認証済みの gh が必要）
    silent: true
    cmds:
      - node tooling/ruleset-sync/ruleset-sync.mjs diff

  ruleset-apply:
    desc: .github/rulesets/main.json を GitHub の ruleset へ反映（管理者の gh と CONFIRM_RULESET=yes が必要。反映前の控えを build/ruleset-backup/ に保存）
    silent: true
    env:
      CONFIRM_RULESET: '{{.CONFIRM_RULESET}}'
    cmds:
      - node tooling/ruleset-sync/ruleset-sync.mjs apply

  # steering → docs の一方向依存、frontmatter、文書責務の見直し合図を検査する（ADR-038）。
  # 依存方向、frontmatter、パスの実在は失敗、変更した docs の250行超とsteeringの行数超過は警告にとどめる。
  docs-boundary-check:
    internal: true
    silent: true
    cmds:
      - |
        fail=0
        if grep -rnE '\]\([^)]*\.kiro/' --include='*.md' docs >&2; then
          echo "✗ docs/ から .kiro/ 配下へリンクしています。依存は steering → docs の一方向にしてください。" >&2
          fail=1
        fi
        if grep -nE '#\[\[file:docs/' .kiro/steering/*.md >&2; then
          echo "✗ steering が #[[file:docs/...]] で docs を展開しています。パスを文字列で書いてください。" >&2
          fail=1
        fi
        # ponytail: steering は常に .kiro/steering/ 直下にあるため、先頭の ../ を落としてリポジトリルート相対として解決する。
        missing="$(grep -oE '(^|[^A-Za-z0-9_./-])(\.\./)*docs/[A-Za-z0-9_./-]*' .kiro/steering/*.md \
          | sed -E 's#^([^:]*):[^d.]*(\.\./)*#\1:#; s#\.+$##' | sort -u \
          | while IFS=: read -r file path; do [ -e "$path" ] || echo "    - $file: $path"; done)"
        if [ -n "$missing" ]; then
          echo "✗ steering が存在しない docs/ のパスを指しています。" >&2
          echo "$missing" >&2
          fail=1
        fi
        if ! node --input-type=module <<'NODE'
        import { readdirSync, readFileSync } from "node:fs";

        const allowed = new Set(["always", "fileMatch", "manual", "auto"]);
        const errors = [];
        for (const file of readdirSync(".kiro/steering").filter((name) => name.endsWith(".md")).sort()) {
          const path = `.kiro/steering/${file}`;
          const lines = readFileSync(path, "utf8").replaceAll("\r\n", "\n").split("\n");
          if (lines[0] !== "---") continue;
          const end = lines.indexOf("---", 1);
          if (end < 0) {
            errors.push(`${path}: frontmatter の終端 --- がありません`);
            continue;
          }
          const frontmatter = lines.slice(1, end);
          const entry = (name) => {
            const index = frontmatter.findIndex((candidate) => candidate.startsWith(`${name}:`));
            return index < 0 ? undefined : {
              index,
              raw: frontmatter[index].slice(frontmatter[index].indexOf(":") + 1).trim(),
            };
          };
          const scalar = (item) => item?.raw.replace(/^(['"])(.*)\1$/, "$2");
          const quotedString = (raw) => /^(['"]).+\1$/.test(raw ?? "");
          const plainString = (raw) => Boolean(raw)
            && !/^[#\[{>|!&*]/.test(raw)
            && !/\s+#/.test(raw)
            && !/^(null|~|true|false|[-+]?\d+(\.\d+)?)$/i.test(raw);
          const stringValue = (raw) => quotedString(raw) || plainString(raw);
          const inclusionItem = entry("inclusion");
          const inclusion = scalar(inclusionItem) ?? "always";
          if ((inclusionItem && !stringValue(inclusionItem.raw)) || !allowed.has(inclusion)) {
            errors.push(`${path}: inclusion が不正です: ${inclusion || "(empty)"}`);
            continue;
          }
          const required = inclusion === "fileMatch"
            ? ["fileMatchPattern", "name", "description"]
            : inclusion === "auto" ? ["name", "description"] : [];
          for (const name of required) {
            const item = entry(name);
            const rest = item ? frontmatter.slice(item.index + 1) : [];
            const nextKey = rest.findIndex((line) => /^[A-Za-z][A-Za-z0-9_-]*:/.test(line));
            const nested = nextKey < 0 ? rest : rest.slice(0, nextKey);
            const blockValues = nested
              .filter((line) => /^\s+-\s+\S/.test(line))
              .map((line) => line.replace(/^\s+-\s+/, "").trim());
            const inlineList = /^\[.*\]$/.test(item?.raw ?? "")
              && item.raw.slice(1, -1).trim().length > 0;
            const valid = name === "fileMatchPattern"
              ? stringValue(item?.raw)
                || inlineList
                || (blockValues.length > 0 && blockValues.every(stringValue))
              : stringValue(item?.raw);
            if (!valid) errors.push(`${path}: ${inclusion} には文字列の ${name} が必要です`);
          }
        }
        if (errors.length > 0) {
          console.error(`✗ steering の frontmatter が不正です。\n${errors.map((error) => `    - ${error}`).join("\n")}`);
          process.exitCode = 1;
        }
        NODE
        then
          fail=1
        fi
        # 250行超は、今回の変更で触れた文書だけを警告する。触れていない文書の警告は毎回出ても見直せないため。
        # 比較起点が無いときは、すべての文書を対象にする。
        base="${DOCS_DIFF_BASE:-origin/main}"
        changed=""
        if git rev-parse --verify --quiet "$base" >/dev/null; then
          changed="$({ git diff --name-only "$base"...HEAD; git diff --name-only; git diff --cached --name-only; } | sort -u)"
        fi
        for f in $(find docs -name '*.md' ! -name 'index.md' -not -path '*/node_modules/*'); do
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qx "$f"; then continue; fi
          n="$(wc -l < "$f")"
          if [ "$n" -gt 250 ]; then echo "⚠ $f は $n 行です（250行超）。行数だけで分割せず、1ファイル1責務とtypeと本文の一致を見直してください。" >&2; fi
        done
        total=0
        for f in .kiro/steering/*.md; do
          n="$(wc -l < "$f")"
          total=$((total + n))
          if [ "$n" -gt 150 ]; then echo "⚠ $f は $n 行です（目安 150 行以内）。" >&2; fi
        done
        if [ "$total" -gt 500 ]; then echo "⚠ steering の合計は $total 行です（目安 500 行以内）。" >&2; fi
        exit "$fail"


  # スキルの skills-lock.json、.agents/skills の実体、.kiro/skills のリンク、kiro/install.sh が入れたファイルの内容ハッシュを検査する。
  # 検査の本体は tooling/skills-check/skills-check.mjs に置き、壊れた木に対する自己検査（test.sh）を先に実行する。
  # 入れたファイルへの書き込みを止めるフック（.kiro/hooks/block-generated-writes.sh）も同じ記録を読むため、その自己検査もここで実行する。
  # エージェントの git commit と git push の直接実行を止めるフック（.kiro/hooks/block-agent-git.sh）の自己検査も同じ場所で実行する。
  # 手順の正文は docs/agents/skill-sources.md にある。
  skills-check:
    desc: スキルの skills-lock.json、.agents/skills の実体、.kiro/skills のリンク、kiro/install.sh が入れたファイルの内容ハッシュを検証
    silent: true
    cmds:
      - bash .kiro/hooks/block-generated-writes.test.sh
      - bash .kiro/hooks/block-agent-git.test.sh
      - bash tooling/skills-check/test.sh
      - node tooling/skills-check/skills-check.mjs
      # 検査の範囲に .agents があるが、okf-check は .agents の変更で起動しない。
      - task: removed-names-check

  # 検査の本体は tooling/ci-gate-check/ci-gate-check.py に置き、自己検査（test.sh）を先に実行する。
  # 理由と除外の一覧の扱いは docs/adr/ADR-087 にある。
  ci-gate-check:
    desc: ci.yml の CI gate が pull_request の検査を取りこぼしていないか検証
    silent: true
    cmds:
      - bash tooling/ci-gate-check/test.sh
      - bash tooling/ci-changes/test.sh
      - bash tooling/test-weakening/test.sh
      - python3 tooling/ci-gate-check/ci-gate-check.py

  # テストファイルの削除とテストケースの減少を警告する。止めず、TESTS_ACK=1 で抑える。
  test-weakening:
    desc: テストファイルの削除とテストケースの減少を警告
    silent: true
    cmds:
      - bash tooling/test-weakening/check.sh

  test-weakening-test:
    desc: test-weakening の自己検査
    silent: true
    cmds:
      - bash tooling/test-weakening/test.sh

  # CI の job は使う道具だけを入れるので、ほかの道具の版を上げて lock を作り直さない変更はここで止める（ADR-090）。
  mise-lock-check:
    desc: mise.toml の全ての道具の版が mise.lock に載ることを検証
    silent: true
    cmds:
      - MISE_DATA_DIR="$(mktemp -d)" mise install --locked --dry-run

  # 本体は tooling/agent-git/agent-git.sh、手順は docs/tooling/dev-workflow.md の「エージェントがcommitとpushをするとき」にある。
  # 呼んだディレクトリで動かし、commit のパスをそこからの相対で解釈する。
  # CLI_ARGS は Task が引数ごとにシェルの引用符を付けるので、空白を含むパスもそのまま渡る。
  agent-commit:
    desc: 渡したパスだけの git commit をバックグラウンドで開始（task agent-commit -- <メッセージのファイル> <パス>...）
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{shellQuote .ROOT_DIR}}/tooling/agent-git/agent-git.sh commit {{.CLI_ARGS}}

  agent-push:
    desc: このリポジトリの worktree で pre-push が動いていなければ、今のブランチの git push -u origin をバックグラウンドで開始
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{shellQuote .ROOT_DIR}}/tooling/agent-git/agent-git.sh push

  agent-wait:
    desc: agent-commit か agent-push の終わりを待ち、要約と終了コードを表示（task agent-wait [-- <実行のディレクトリ>]）
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{shellQuote .ROOT_DIR}}/tooling/agent-git/agent-git.sh wait {{.CLI_ARGS}}

  agent-git-test:
    desc: agent-commit、agent-push、agent-wait を、フックを止めておける一時の git リポジトリで自己検査
    silent: true
    cmds:
      - bash tooling/agent-git/test.sh

  test-slot-test:
    desc: test-slot.sh の slot の割り当て、待ち、回収を、偽の docker で自己検査し、realm の origin の数が slot の数と一致することを確認
    silent: true
    cmds:
      - bash tooling/test-slot/test.sh

  lefthook-install-test:
    desc: npmのprepare（prepare.mjs）がmainのworktreeのlefthookでhookを入れ、入れられなければ失敗することを、一時のgitリポジトリで検証
    silent: true
    cmds:
      - bash tooling/lefthook-install/test.sh

  # 検証スキルの check.sh と mutants.py の自己検査。手順の正文は docs/agents/formal-verification.md にある。
  formal-verify-test:
    desc: 検証スキルの check.sh と mutants.py を、小さな TLA+ のモデルで自己検査
    silent: true
    cmds:
      - bash tooling/formal-verify/test.sh

  formal-verify:
    desc: 検証スキル（.agents/skills/formal-verify-*）の同期コミット、全設定、全変異を検査（数分かかる）
    silent: true
    cmds:
      - |
        status=0
        for skill in .agents/skills/formal-verify-*/; do
          echo "== $skill"
          tooling/formal-verify/sync-check.sh "$skill" || status=1
          tooling/formal-verify/check.sh "$skill" || status=1
          tooling/formal-verify/mutants.py "$skill" || status=1
        done
        exit "$status"

  # Setup
  setup:
    desc: 開発環境のセットアップスクリプトを順次実行
    dir: docs/local-env-setup
    cmds:
      - |
        ./02-setup-viteplus.sh
        ./04-setup-shell.sh
        # エージェントは ~/.kiro/settings/ に書けないので、人が実行するこの Task で置く（docs/agents/skill-sources.md）。
        mkdir -p ~/.kiro/settings
        if [ ! -e ~/.kiro/settings/permissions.yaml ] && [ ! -e ~/.kiro/settings/permissions.json ]; then
          cp {{shellQuote .ROOT_DIR}}/.kiro/kiro-permissions.yaml ~/.kiro/settings/permissions.yaml
          echo "wrote ~/.kiro/settings/permissions.yaml"
        fi
        [ ! -e ~/.kiro/settings/permissions.yaml ] || diff {{shellQuote .ROOT_DIR}}/.kiro/kiro-permissions.yaml ~/.kiro/settings/permissions.yaml || true

  # Frontend
  fe-install:
    desc: フロントエンドの依存をインストール（初回と、package.jsonかpnpm-lock.yamlが変わったとき）
    dir: frontend
    cmds:
      - vp install

  fe-dev:
    desc: フロントエンドの開発サーバーを起動（APIとOIDCを同一オリジンでproxy）
    dir: frontend
    cmds:
      - vp run {{.FE_WEB}} dev

  fe-format:
    desc: フロントエンドをOxfmtで整形
    dir: frontend
    cmds:
      - vp fmt

  fe-check:
    desc: フロントエンドのformat、Oxlint（Tailwindとshadcn規則を含む）、型を検査
    dir: frontend
    cmds:
      - vp check
      # e2e の補助は、Playwright の外から Node が直接 import する（検証スキルの drive.mjs）。相対の import に拡張子がないと、ここでしか壊れない。
      - |
        E2E_USERNAME=check E2E_PASSWORD=check PAYMENT_GATEWAY_BASE_URL=http://127.0.0.1:1 \
          node --input-type=module -e 'for (const file of ["environment", "fixtures", "orders", "payment-gateway"]) await import(`./apps/web/e2e/${file}.ts`)'

  fe-knip:
    desc: フロントエンドの未参照ファイル、未使用export、未使用依存をKnipで検査
    dir: frontend
    # Knip は playwright.config.ts を読み込み、その先の e2e/environment.ts が .env.test を必須にする。
    deps: [_ensure-test-env]
    cmds:
      - vp run knip

  fe-coverage:
    desc: フロントエンドのテストと、全体と各ファイルのbranchとline coverageを検証
    dir: frontend
    silent: true
    vars:
      # Vitest へ足す引数。pre-push は成功の一覧と coverage の表を省くために使う（lefthook.yml）。
      FE_TEST_ARGS: '{{.FE_TEST_ARGS | default ""}}'
    cmds:
      # 本番ビルドと同じく React Compiler を有効にして、振る舞いを検証する（ADR-078）。
      # ルートの lint 設定のテストと、各 package のテストを実行する。
      - vp run --recursive test {{.FE_TEST_ARGS}}
      # coverage は Compiler を外して測る。Compiler が足す memo の分岐を分母に入れない。
      # 全体とファイルごとの下限は各 package の vite.config.ts の thresholds が検査する（ADR-076）。ルートの package は coverage を測らない。
      - FRONTEND_REACT_COMPILER=false vp run --filter '!frontend' --fail-if-no-match test --coverage {{.FE_TEST_ARGS}}

  fe-test-build:
    desc: フロントエンドのcoverage検証付きテストと本番ビルドを実行
    dir: frontend
    cmds:
      - task: fe-coverage
      # ルートの .env で有効にしていても、既定の無効のビルドを検査する（ADR-068）。
      # vp run の script は cache しないので、環境変数がそのまま渡る。build を run.tasks に移すなら cache.env に FRONTEND_OTEL_* を足す。
      - FRONTEND_OTEL_ENABLED=false vp run {{.FE_WEB}} build
      - |
        # grep は一致で 0、不一致で 1、対象がないなどの失敗で 2 を返す。1 以外は失敗にする。
        status=0
        grep -rqiE 'faro|grafana|opentelemetry|web.?vitals' apps/web/dist/assets || status=$?
        if [ "$status" -ne 1 ]; then
          echo "無効のビルドの bundle に Faro の SDK か OpenTelemetry JS が入っているか、apps/web/dist/assets を検査できませんでした（grep の終了コード $status）。" >&2
          exit 1
        fi

  fe-verify:
    desc: フロントエンドの静的解析、未使用コード検査、テスト、ビルドを実行
    cmds:
      - task: fe-check
      - task: fe-knip
      - task: fe-test-build

  fe-route-tree-check:
    desc: ビルドで再生成したrouteTree.gen.tsがコミット済みの内容と一致するか検査
    dir: frontend
    cmds:
      # tsc を挟まず、route plugin が routeTree.gen.ts を再生成するところまでを実行する。
      - vp exec {{.FE_WEB}} vp build
      - task: _frontend-view-allowlist-check
      - git diff --exit-code -- apps/web/src/routeTree.gen.ts

  lint-duplicates:
    desc: フロントエンドとバックエンドの手書きコードの重複をjscpdで検査
    cmds:
      # ponytail: 2.0%は、import文を比べない（.jscpd.jsonのignorePattern）方式での実測1.90%を通す値（ADR-106。ADR-074の4.0%を置き換えた）。import文はクラスの役割とテストの規約が求める定型で、共通化できない。import文を除いた重複が2.0%を超えたら、閾値を上げる前に重複を解消する。
      - npm exec -- jscpd frontend/apps frontend/packages frontend/lint frontend/vite.config.ts backend/src/main/java backend/src/test/java

  # PgBouncer のトランザクションモードや RDS Proxy の後ろで壊れる、セッションに状態を残す SQL を本番のコードから検出する。
  # 一覧は https://www.pgbouncer.org/features.html の「SQL feature map for pooling modes」で Transaction pooling が Never の機能である。
  # SET はここでは検出しない（docs/tooling/lint-and-test.md）。
  lint-session-sql:
    desc: バックエンドの本番のコードに、接続を多重化するプロキシの後ろで壊れるセッションの SQL がないか検査
    silent: true
    cmds:
      # 検出の式の自己検査。検出すべき文を逃すか、トランザクションの advisory lock や識別子やコメントを誤検出したら失敗する。
      - bash tooling/session-sql-lint/test.sh
      - bash tooling/session-sql-lint/session-sql-lint.sh .

  # DB の時計を読む文と、SQL で日時から暦日や境界を作る文を本番のコードから検出する（docs/datetime/timezone-conventions.md）。
  # jOOQ の DSL の呼び出しは DateTimeConventionsArchTest が止める。ここは文字列の SQL と changelog を見る。
  lint-db-clock:
    desc: バックエンドの本番のコードに、DB の時計を読む SQL や日時から暦日を作る SQL がないか検査
    silent: true
    cmds:
      # 検出の式の自己検査。検出すべき文を逃すか、識別子やコメントを誤検出したら失敗する。
      - bash tooling/db-clock-lint/test.sh
      - bash tooling/db-clock-lint/db-clock-lint.sh .

  # Backend
  be-run:
    desc: 業務データが空なら代表データを入れてから、バックエンドをホスト上で起動
    dir: backend
    # AWS の SDK は Spring が読む ../.env を見ないので、../.env を環境変数にして bootRun に渡す（ADR-125）。
    dotenv: ['../.env']
    cmds:
      # bootRun のアプリは常に ../.env を読むので、シードも .env に固定して接続先をそろえる。
      - task: _be-seed
        vars: { SEED_MODE: auto, SEED_ENV_FILE: .env }
      - ./gradlew bootRun

  be-seed:
    desc: ローカルの業務データが空のときだけ代表データを入れる
    cmds:
      - task: _be-seed
        vars: { SEED_MODE: seed, SEED_ENV_FILE: '{{.COMPOSE_ENV_FILE}}' }

  be-seed-reset:
    desc: 明示確認付きでローカルの業務データを消して代表データを入れ直す
    env:
      CONFIRM_RESET: '{{.CONFIRM_RESET}}'
    cmds:
      - |
        if [ "$CONFIRM_RESET" != "yes" ]; then
          echo "業務データ（product、ordering、payment）を削除して代表データを入れ直します。実行するには CONFIRM_RESET=yes を指定してください（例: task be-seed-reset CONFIRM_RESET=yes）。" >&2
          exit 1
        fi
      - task: _be-seed
        vars: { SEED_MODE: reset, SEED_ENV_FILE: '{{.COMPOSE_ENV_FILE}}' }

  # 環境の判定は持たない。ローカルかテストかは LocalDataSeeder が確かめる。
  _be-seed:
    internal: true
    dir: backend
    cmds:
      - |
        if [ ! -f "../{{.SEED_ENV_FILE}}" ]; then
          if [ "{{.SEED_MODE}}" = "auto" ]; then
            echo "{{.SEED_ENV_FILE}} がないため、代表データを入れません。" >&2
            exit 0
          fi
          echo "{{.SEED_ENV_FILE}} がありません。" >&2
          exit 1
        fi
        set -a
        . "../{{.SEED_ENV_FILE}}"
        set +a
        ./gradlew seedLocalData -PseedMode={{.SEED_MODE}}

  # Database
  be-migrate:
    desc: 現在のスキーマタグまでマイグレーション
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew migrateDatabase

  be-migrate-dev:
    desc: 作りかけを含む全changesetを開発DBへ適用
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew update

  _frontend-view-allowlist-check:
    internal: true
    silent: true
    cmds:
      - |
        # Collector の route allowlist（docker/otel-collector/config.yaml）が routeTree.gen.ts の fullPaths と同じ集合かを確かめる。
        # ponytail: 生成物の fullPaths の文字列リテラルと、allowlist のリテラルの選択肢だけを読む。route params の $ は allowlist で [$$] と書き、照合の前に $ へ戻す。
        routes="$(sed -n "/^  fullPaths:/,/^  fileRoutesByTo:/p" frontend/apps/web/src/routeTree.gen.ts | grep -o "'[^']*'" | tr -d "'" | sort -u)"
        patterns="$(grep -oF 'IsMatch(log.cache["route"], "^(?:' docker/otel-collector/config.yaml | wc -l)"
        allowed="$(grep -o 'IsMatch(log.cache\["route"\], "\^(?:[^)]*)\$\$")' docker/otel-collector/config.yaml \
          | sed -e 's/^IsMatch(log.cache\["route"\], "^(?://' -e 's/)\$\$")$//' -e 's/\[\$\$\]/$/g' | tr '|' '\n' | sort -u)"
        if [ "$patterns" -ne 1 ] || [ -z "$routes" ] || [ -z "$allowed" ] || [ "$routes" != "$allowed" ]; then
          echo "Collector の route allowlist（transform/frontend_validate の 1 か所）が routeTree.gen.ts の fullPaths と一致しません。" >&2
          echo "routeTree.gen.ts: $(echo $routes)" >&2
          echo "config.yaml（$patterns か所）: $(echo $allowed)" >&2
          exit 1
        fi

  _ensure-test-env:
    internal: true
    cmds:
      - test -f .env.test || cp .env.test.example .env.test
      # 既存の値は上書きせず、TEST_ENV_FILE で選んだファイルに無い変数だけを .env.test.example の行のまま追記する。
      - |
        test -f "{{.TEST_ENV_FILE}}" || { echo "{{.TEST_ENV_FILE}} がありません。" >&2; exit 1; }
        missing="$(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .env.test.example | while read -r key; do grep -q "^${key}=" "{{.TEST_ENV_FILE}}" || printf ' %s' "$key"; done)"
        if [ -n "$missing" ]; then
          # 末尾に改行の無いファイルへ追記すると、最後の行と最初の追記がつながるため。
          test -z "$(tail -c 1 "{{.TEST_ENV_FILE}}")" || echo >> "{{.TEST_ENV_FILE}}"
          for key in $missing; do grep -m 1 "^${key}=" .env.test.example >> "{{.TEST_ENV_FILE}}"; done
          echo "{{.TEST_ENV_FILE}} に .env.test.example の変数を追記しました:${missing}" >&2
        fi

  _require-migration-env:
    internal: true
    preconditions:
      - sh: 'test -n "${DB_URL:-}" || { test -n "${DB_HOST:-}" && test -n "${DB_PORT:-}" && test -n "${DB_NAME:-}"; }'
        msg: DB_URL、またはDB_HOST、DB_PORT、DB_NAMEを指定してください。
      - sh: 'test -n "${DB_USERNAME:-}"'
        msg: DB_USERNAMEを指定してください。
      - sh: 'test -n "${MIGRATION_DB_USERNAME:-}"'
        msg: MIGRATION_DB_USERNAMEを指定してください。
      - sh: 'test -n "${MIGRATION_DB_PASSWORD:-}"'
        msg: MIGRATION_DB_PASSWORDを指定してください。

  be-release-migrate:
    desc: 本番向けに現在のスキーマタグまでマイグレーション
    cmds:
      - task: _require-migration-env
      - task: _be-release-migrate

  _be-release-migrate:
    internal: true
    dir: backend
    cmds:
      - ./gradlew migrateDatabase

  be-schema-tag-check:
    desc: 現在のスキーマタグが対象DBへ適用済みか確認
    silent: true
    cmds:
      - |
        if [ -f "./{{.COMPOSE_ENV_FILE}}" ]; then
          set -a
          . "./{{.COMPOSE_ENV_FILE}}"
          set +a
        fi
        cd backend
        ./gradlew checkCurrentSchemaTag

  be-verify-migrations:
    desc: 使い捨てDBでマイグレーションとrollbackを検証
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - |
        set -a
        . "../{{.TEST_ENV_FILE}}"
        set +a
        ./gradlew verifyDatabaseMigrations

  be-rollback-check:
    desc: 切り戻し対象タグが存在するか確認
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        cd backend
        ./gradlew checkRollbackTag -PliquibaseTag="$DB_ROLLBACK_TAG"

  be-rollback-preview:
    desc: DBを変更せず指定タグまでの切り戻しSQLを生成
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        mkdir -p backend/build/reports/liquibase
        cd backend
        ./gradlew previewDatabaseRollback \
          -PliquibaseTag="$DB_ROLLBACK_TAG" \
          -PliquibaseOutputFile=build/reports/liquibase/rollback-preview.sql

  be-rollback:
    desc: 明示確認付きで指定タグより後のchangesetを切り戻し
    env:
      DB_ROLLBACK_TAG: '{{.DB_ROLLBACK_TAG}}'
      CONFIRM_ROLLBACK: '{{.CONFIRM_ROLLBACK}}'
    cmds:
      - task: _require-migration-env
      - |
        if [ -z "$DB_ROLLBACK_TAG" ]; then
          echo "DB_ROLLBACK_TAGを指定してください。" >&2
          exit 1
        fi
        if [ "$CONFIRM_ROLLBACK" != "yes" ]; then
          echo "切り戻すにはrollback previewとバックアップを確認し、CONFIRM_ROLLBACK=yesを指定してください。" >&2
          exit 1
        fi
        cd backend
        ./gradlew rollbackDatabase \
          -PliquibaseTag="$DB_ROLLBACK_TAG" \
          -PconfirmRollback=true

  be-generate-jooq:
    desc: 現在のDBスキーマからjOOQソースを生成
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew jooqCodegen

  be-refresh-jooq:
    desc: マイグレーション後の最新DBからjOOQソースを生成
    dir: backend
    cmds:
      - |
        set -a
        . "../{{.COMPOSE_ENV_FILE}}"
        set +a
        ./gradlew migrateAndGenerateJooq

  # Backend quality
  be-format:
    desc: バックエンドのコードフォーマットを適用
    dir: backend
    cmds:
      - ./gradlew spotlessApply

  be-lint:
    desc: バックエンドの静的解析を実行
    dir: backend
    cmds:
      - ./gradlew spotlessCheck pmdMain pmdTest spotbugsMain spotbugsTest
      # 検査の範囲に backend/src があるが、okf-check は backend/src の変更で起動しない。
      - task: removed-names-check

  be-openapi-lint:
    desc: OpenAPI 3.1契約をopenapi/openapi.yamlへ生成しSpectralで検査（テストの依存はTestcontainersが起動する）
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - ./gradlew test --tests com.example.demo.OpenApiContractTest -PopenapiExport=true -PtestEnvFile="../{{.TEST_ENV_FILE}}"
      - task: api-lint

  be-openapi-check:
    desc: 直前のbe-testが書き出したOpenAPI契約をSpectralで検査し、コミット済みの内容と一致するか検査（前提はbe-testの実行済み。be-testの開始後に契約が書かれていなければ失敗する）
    cmds:
      # be-test の開始より新しくなければ、テストは契約を書き出していない（#467）。
      # 契約を消さずに印の時刻と比べるのは、同じ実行の ApiContractCoverageTest が契約を読むため（ADR-077）。
      - |
        if [ ! -e backend/build/be-test.stamp ] || ! [ openapi/openapi.yaml -nt backend/build/be-test.stamp ]; then
          echo "be-test の実行中に openapi/openapi.yaml が書き出されていません。task be-test を実行してください。" >&2
          exit 1
        fi
      - task: api-lint
      - task: api-drift-check
        vars: { PATHS: openapi/openapi.yaml }

  be-test:
    desc: テストとカバレッジの検証を実行し、OpenApiContractTestがopenapi/openapi.yamlを書き出す（テストの依存はTestcontainersが起動する）
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - mkdir -p build && touch build/be-test.stamp
      - ./gradlew test jacocoTestCoverageVerification -PopenapiExport=true -PtestEnvFile="../{{.TEST_ENV_FILE}}"

  be-test-dev:
    desc: 作りかけを含む全changesetをTestcontainersのDBへ適用してテスト（カバレッジは検証しない）
    aliases: [test-dev]
    dir: backend
    deps: [_ensure-test-env]
    cmds:
      - ./gradlew test -PtestAllChangesets -PtestEnvFile="../{{.TEST_ENV_FILE}}"

  be-mutation-test:
    desc: PITミューテーションテストを実行（テストの依存はTestcontainersが起動する）
    aliases: [mutation-test]
    dir: backend
    deps: [_ensure-test-env]
    # git の参照をシェルの本文へ展開せず、環境変数で渡す。
    env:
      PIT_CHANGED_SINCE: '{{.PIT_CHANGED_SINCE}}'
    cmds:
      - |
        # PIT_CHANGED_SINCE があれば、差分の main のクラスと、差分のテスト（FooTest）が名前で対応する main のクラスだけを変異させる（ADR-076）。
        # テストは対象のクラスのパッケージ以下に絞る。対象のクラスがなければ PIT を実行しない。
        target_classes=""
        target_tests=""
        if [ -n "$PIT_CHANGED_SINCE" ]; then
          files="$(git diff --relative --name-only --diff-filter=d --end-of-options "${PIT_CHANGED_SINCE}...HEAD" -- 'src/main/java/*.java' 'src/test/java/*Test.java')"
          classes="$(printf '%s\n' "$files" | while IFS= read -r f; do
            case "$f" in
              *package-info.java | '') continue ;;
              src/test/java/*) f="src/main/java/${f#src/test/java/}"; f="${f%Test.java}.java"; [ -f "$f" ] || continue ;;
            esac
            f="${f#src/main/java/}"
            printf '%s\n' "${f%.java}" | tr / .
          done | sort -u)"
          if [ -z "$classes" ]; then
            echo "差分に変異させる main のクラスがないため、PIT を実行しません。" >&2
            exit 0
          fi
          target_classes="$(printf '%s\n' "$classes" | sed 's/.*/&,&$*/' | paste -sd, -)"
          target_tests="$(printf '%s\n' "$classes" | sed 's/\.[^.]*$/.*/' | sort -u | paste -sd, -)"
          echo "差分の $(printf '%s\n' "$classes" | wc -l | tr -d ' ') クラスを、${target_tests} のテストで変異させます。" >&2
        fi
        ./gradlew pitest -PtestEnvFile="../{{.TEST_ENV_FILE}}" \
          ${target_classes:+"-PpitTargetClasses=$target_classes"} ${target_tests:+"-PpitTargetTests=$target_tests"}

  test-deps-leftover-check:
    desc: compose-testのコンテナとvolumeが残っていないか検査
    silent: true
    cmds:
      - |
        # project 名は slot ごとに spring-modulith-test-<n> になる。CI の直接の compose の呼び出しは spring-modulith-test のまま。
        left="$({{.DOCKER}} ps -aq --filter name=spring-modulith-test)$({{.DOCKER}} volume ls -q --filter name=spring-modulith-test)"
        if [ -n "$left" ]; then
          {{.DOCKER}} ps -a --filter name=spring-modulith-test
          {{.DOCKER}} volume ls --filter name=spring-modulith-test
          echo "compose-test のコンテナか volume が残っています。" >&2
          exit 1
        fi

  test:
    desc: 使い捨てのPostgreSQLでマイグレーションを検証し、テストとカバレッジの検証の後に片付け
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        # 本体と後片付けの終了コードの扱いは docs/tooling/taskfile.md の「後片付けと終了コード」を参照する。
        # rollback の検証だけが compose の PostgreSQL を使い、テストは Testcontainers の依存を使う（ADR-085）。
        # テストの前に PostgreSQL を止め、テストが接続先（compose の PostgreSQL）へ黙ってつながらないようにする。
        # slot の取得は、中断した前の回の DB を使わないことも兼ねる。
        export DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}"
        # slot の取得に失敗したら、$(...) の失敗を eval に隠さず止める。
        slot_env="$(bash tooling/test-slot/test-slot.sh acquire "{{.TEST_ENV_FILE}}")"
        eval "$slot_env"
        status=0
        (
          set -e
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" up -d --wait postgres
          task be-verify-migrations TEST_ENV_FILE="$TEST_ENV_FILE"
          # コンテナは消さず止める。消すと slot が空き、ほかの実行が取った project を最後の down が消してしまう。
          {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" stop postgres
          task be-test TEST_ENV_FILE="$TEST_ENV_FILE"
          task api-lint
        ) || status=$?
        cleanup_status=0
        {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" down --volumes --remove-orphans || cleanup_status=$?
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        exit "$cleanup_status"

  be-sbom:
    desc: バックエンドのCycloneDX SBOMを生成
    dir: backend
    cmds:
      - ./gradlew cyclonedxBom

  # Docker を使う検査が、使えない環境でスキップするかを決める判定の本体（Docker を使う lefthook のジョブが呼ぶ）。
  # docker コマンドがあってもデーモンに接続できなければ、使えないとみなす。使えないときは 0 以外を返す。
  docker-available:
    desc: Dockerのデーモンに接続できるかを判定（使えなければ0以外）
    silent: true
    cmds:
      - '{{.DOCKER}} info >/dev/null 2>&1 || { echo "docker を使えないため、Docker を使う検査をスキップします（CI で検査されます）。" >&2; exit 1; }'

  # API contract（ADR-052）
  api-lint:
    desc: コミット済みのOpenAPI契約をSpectralで検査（DB不要）
    cmds:
      - |
        {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
          stoplight/spectral:6.16.3@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050 \
          lint openapi/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  # 作業ツリーを index と比べるため、pre-commit で再生成した結果がステージ済みの内容と同じなら通る。
  # 新しく生成された未追跡のファイルも差分として扱う。
  api-drift-check:
    internal: true
    requires:
      vars: [PATHS]
    cmds:
      - |
        # 追跡されていない path は git diff も ls-files --others も何も出さず、検査が素通りする。
        git ls-files --error-unmatch -- {{.PATHS}} >/dev/null || { echo "追跡されていない path があります。PATHS を確認してください。" >&2; exit 1; }
        status=0
        git diff --exit-code -- {{.PATHS}} || status=1
        untracked="$(git ls-files --others --exclude-standard -- {{.PATHS}})"
        if [ -n "$untracked" ]; then
          printf '未追跡の生成物:\n%s\n' "$untracked"
          status=1
        fi
        if [ "$status" -ne 0 ]; then
          echo "生成物がコミット済みの内容と一致しません。task api-gen を実行し、差分をコミットしてください。" >&2
          exit 1
        fi

  # 違反例は、全 severity の違反ごとの「ルール名|JSON パス」の組が invalid.expected と過不足なく一致することを確かめる。
  # text 形式は JSON パスを出さないため、既定の stylish 形式を使う。
  api-lint-rules-test:
    desc: SpectralのルールをOpenAPIのfixture（合格例と違反例）で検査
    silent: true
    cmds:
      - |
        spectral() {
          {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
            stoplight/spectral:6.16.3@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050 \
            lint "$@" --ruleset .spectral.yaml --fail-severity=warn
        }
        spectral openapi/spectral-fixtures/valid.yaml
        status=0
        output="$(spectral openapi/spectral-fixtures/invalid.yaml)" || status=$?
        if [ "$status" -eq 0 ]; then
          printf '%s\n' "$output"
          echo "違反例 invalid.yaml が Spectral の検査を通りました。" >&2
          exit 1
        fi
        expected="$(sort openapi/spectral-fixtures/invalid.expected)"
        actual="$(printf '%s\n' "$output" | awk '$2 ~ /^(error|warning|information|hint)$/ { print $3 "|" $NF }' | sort)"
        if [ "$expected" != "$actual" ]; then
          printf '%s\n' "$output"
          echo "違反例の検出が openapi/spectral-fixtures/invalid.expected と違います（< 期待、> 実際）。" >&2
          diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2
          exit 1
        fi
        echo "Spectral のルールは合格例を通し、違反例の全件を過不足なく検出しました。"

  api-client-gen:
    desc: コミット済みのOpenAPI契約からOrvalでAPI clientとMSW handlerを再生成（DB不要）
    dir: frontend
    cmds:
      - vp run {{.FE_API}} orval

  api-client-check:
    desc: Orvalで再生成したAPI clientがコミット済みの内容と一致するか検査（DB不要）
    cmds:
      - task: api-client-gen
      - task: api-drift-check
        vars: { PATHS: frontend/packages/api/src/generated }

  api-gen:
    desc: OpenAPI契約の生成、Spectral検査、Orvalの再生成を実行（テストの依存はTestcontainersが起動して片付ける）
    cmds:
      - task: be-openapi-lint
        vars: { TEST_ENV_FILE: '{{.TEST_ENV_FILE}}' }
      - task: api-client-gen

  api-check:
    desc: api-genで再生成したOpenAPI契約とAPI clientがコミット済みの内容と一致するか検査
    deps: [_ensure-test-env]
    cmds:
      - task: api-gen
      - task: api-drift-check
        vars: { PATHS: openapi/openapi.yaml frontend/packages/api/src/generated }

  # api-breaking-approved ラベルの PR では CI が API_BREAKING_APPROVED=true を渡し、結果を記録するだけにする。
  api-breaking:
    desc: baseブランチのOpenAPI契約と比べた破壊的変更をoasdiffで検査
    vars:
      BASE_REF: '{{.BASE_REF | default "main"}}'
    env:
      BASE_REF: '{{.BASE_REF}}'
    cmds:
      - |
        base="origin/$BASE_REF"
        if ! git cat-file -e "$base:openapi/openapi.yaml" 2>/dev/null; then
          echo "base に openapi/openapi.yaml がないため比較をとばします。"
          exit 0
        fi
        mkdir -p build
        git show "$base:openapi/openapi.yaml" > build/openapi-base.yaml
        fail_on=(--fail-on ERR)
        if [ "${API_BREAKING_APPROVED:-}" = "true" ]; then
          fail_on=()
          echo "api-breaking-approved ラベルがあるため、結果を記録して失敗にしません。PR 本文に理由を書いてください。"
        fi
        {{.DOCKER}} run --rm -v "$PWD:/repo" -w /repo \
          tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
          breaking build/openapi-base.yaml openapi/openapi.yaml "${fail_on[@]}"

  api-docs:
    desc: コミット済みのOpenAPI契約からRedocly CLIで静的HTMLの設計書を生成（build/api-docs/index.html）
    cmds:
      - mkdir -p build/api-docs
      - |
        {{.DOCKER}} run --rm -e REDOCLY_TELEMETRY=off -v "$PWD:/repo" -w /repo \
          redocly/cli:2.57.0@sha256:e320090ecd380878ff2aa671a928d5ac28fcbb7bb6230250d772790811125aea \
          build-docs openapi/openapi.yaml --output build/api-docs/index.html --disableGoogleFont

  # Compose and services
  compose-up:
    desc: ローカル依存サービスを起動
    env:
      # Collector が CSP の報告に付ける service.version（ADR-068）。正本は version.txt。
      FRONTEND_SERVICE_VERSION:
        sh: cat version.txt
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" up -d --wait'

  compose-up-backend:
    desc: backendを含む全サービスをビルドして起動
    env:
      # Collector が CSP の報告に付ける service.version（ADR-068）。正本は version.txt。
      FRONTEND_SERVICE_VERSION:
        sh: cat version.txt
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend up -d --build --wait'

  compose-down:
    desc: Composeサービスをnamed volumeを保持して停止
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend down'

  compose-ps:
    desc: Composeサービスの状態を表示
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend ps'

  compose-logs:
    desc: Composeサービスのログを追跡
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend logs --follow'

  keycloak-logs:
    desc: Keycloakのログを追跡
    cmds:
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" logs --follow keycloak'

  keycloak-reimport:
    desc: Keycloakデータだけを削除してrealmを再投入
    silent: true
    cmds:
      - |
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" create keycloak >/dev/null
        container_id="$({{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" ps -aq keycloak)"
        volume="$({{.DOCKER}} inspect "$container_id" | jq -r '.[0].Mounts | map(select(.Destination == "/opt/keycloak/data") | .Name) | first // empty')"
        if [ -z "$volume" ]; then
          echo "Keycloak data volume を特定できませんでした。" >&2
          exit 1
        fi
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" rm --stop --force keycloak
        {{.DOCKER}} volume rm "$volume"
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" up -d --wait keycloak
        echo "Keycloak realm を再投入しました。"

  oidc-check:
    desc: KeycloakのOIDC discoveryとPKCE S256対応を確認
    cmds:
      - |
        {{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" exec -T keycloak /bin/bash -ec '
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf "GET /realms/spring-modulith/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n" >&3
          response="$(cat <&3)"
          printf "%s" "$response" | grep -q "200 OK"
          printf "%s" "$response" | grep -q "\"issuer\":\"http://localhost:8080/realms/spring-modulith\""
          printf "%s" "$response" | grep -q "\"S256\""'
        echo "OIDC discovery と PKCE S256 を確認しました。"
        echo "Login URL: http://localhost:18080/oauth2/authorization/web"

  otel-collector-check:
    desc: Collectorの設定が許可したログの属性だけを残すことを確認
    silent: true
    cmds:
      - task: _frontend-view-allowlist-check
      - |
        # このタスクは、Collector の config.yaml が「残してよい値だけを残し、漏れてはいけない値を捨てる」ことの回帰テストである。
        # allowlist は YAML の設定で、型検査もコンパイルも効かない。processor を 1 行、正規表現を 1 文字間違えると、
        # 個人情報や URL のトークンが保存先に流れ、一度書かれたログは取り消せない。だから設定を変えたら必ず流して確かめる。
        # 検証する内容の正文は docs/observability/conventions.md の「検証」節と ADR-068 にある（Taskfile は手順だけを持つ）。
        # 本物の Grafana を立てず、check/check.yaml で出口だけをファイルに差し替える。processor は config.yaml のまま使う。
        # 出口はバックエンド（backend.json）、フロントエンドのログ（frontend.json）、CSP の報告（frontend-csp.json）に分け、それぞれ別の jq で検査する。
        # 入力の fixture は check/fixtures/ に置き、backend.json は OTLP 形式、frontend.json は Faro の payload 形式、csp-reports.json は Reporting API の形式である。
        # イメージは Compose の定義から取り、Dependabot の更新と揃える。
        image="$({{.DOCKER}} compose --env-file .env.example -f docker/compose.yml config --format json | jq -r '.services["otel-collector"].image')"
        out="$(mktemp -d)"
        chmod 777 "$out"
        container=""
        cleanup() {
          status=$?
          trap - EXIT
          if [ -n "$container" ]; then {{.DOCKER}} rm -f "$container" >/dev/null || true; fi
          rm -rf "$out"
          exit "$status"
        }
        # 後片付けの失敗は無視する（残るのはコンテナと一時ディレクトリだけ）ため、終了コードを合成せず trap のままにする。
        trap cleanup EXIT
        container="$({{.DOCKER}} run -d -p 127.0.0.1::4318 -p 127.0.0.1::12347 -p 127.0.0.1::12348 \
          -e OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT=0.0.0.0:4318 \
          -e OTEL_COLLECTOR_FARO_HTTP_ENDPOINT=0.0.0.0:12347 \
          -e OTEL_COLLECTOR_CSP_REPORT_HTTP_ENDPOINT=0.0.0.0:12348 \
          -e OTEL_SERVICE_NAMESPACE=demo -e OTEL_DEPLOYMENT_ENVIRONMENT_NAME=local -e FRONTEND_SERVICE_VERSION=0.0.0-fixture \
          -v "$PWD/docker/otel-collector:/etc/otelcol-check:ro" -v "$out:/out" \
          "$image" --config /etc/otelcol-check/config.yaml --config /etc/otelcol-check/check/check.yaml)"
        address="$({{.DOCKER}} port "$container" 4318/tcp | head -n 1)"
        faro_address="$({{.DOCKER}} port "$container" 12347/tcp | head -n 1)"
        csp_address="$({{.DOCKER}} port "$container" 12348/tcp | head -n 1)"
        accepted=0
        for _ in $(seq 1 30); do
          if curl -fsS -o /dev/null -X POST -H "Content-Type: application/json" 2>/dev/null \
            --data-binary "@docker/otel-collector/check/fixtures/backend.json" "http://$address/v1/logs"; then
            accepted=1
            break
          fi
          sleep 1
        done
        if [ "$accepted" -ne 1 ]; then
          echo "Collector がログを受け付けませんでした。" >&2
          {{.DOCKER}} logs "$container" >&2
          exit 1
        fi
        for _ in $(seq 1 30); do
          if grep -qF 'resourceLogs' "$out/backend.json" 2>/dev/null; then break; fi
          sleep 1
        done
        if ! jq -e '
          def value($key): first(.attributes[]? | select(.key == $key) | .value.stringValue);
          any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["exception.message", "exception.stacktrace", "exception.type", "http.response.status_code", "tenant.id", "user.id"]
              and (first(.attributes[]? | select(.key == "http.response.status_code") | .value.intValue) == "500")
              and value("tenant.id") == "5d2e8f4a-1b3c-4d6e-9f70-8a1b2c3d4e5f"
              and value("user.id") == "0b6f2c1e-4d3a-4e5f-8a7b-9c0d1e2f3a4b"
              and value("exception.type") == "java.lang.IllegalStateException"
              and value("exception.message") == "order failed"
              and (value("exception.stacktrace") | contains("OrderService.java:84"))
          )
          and any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["conflict.kind", "exception.message", "exception.stacktrace", "exception.type", "http.response.status_code"]
              and (first(.attributes[]? | select(.key == "http.response.status_code") | .value.intValue) == "409")
              and value("conflict.kind") == "unique"
          )
          and any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["event_publication.completion_attempts", "event_publication.event_type", "event_publication.id", "event_publication.listener_id"]
              and value("event_publication.id") == "3f2b8c1e-5d4a-4e6f-9a7b-1c2d3e4f5a6b"
              and value("event_publication.event_type") == "com.example.demo.ordering.OrderConfirmed"
              and (value("event_publication.listener_id") | startswith("com.example.demo.payment.application.OrderConfirmedListener.on"))
              and (first(.attributes[]? | select(.key == "event_publication.completion_attempts") | .value.intValue) == "6")
          )
          and any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["event_publication.over_limit.count", "event_publication.resubmitted.count"]
              and (first(.attributes[]? | select(.key == "event_publication.resubmitted.count") | .value.intValue) == "3")
              and (first(.attributes[]? | select(.key == "event_publication.over_limit.count") | .value.intValue) == "1")
          )
          and any(
            .resourceLogs[]?.scopeLogs[]?.logRecords[]?;
            ([.attributes[]?.key] | sort) == ["event_publication.completed.count", "event_publication.incomplete.count", "event_publication.remaining.count", "event_publication.resubmitted.count"]
              and (first(.attributes[]? | select(.key == "event_publication.remaining.count") | .value.intValue) == "5")
          )
        ' "$out/backend.json" >/dev/null; then
          echo "ログ属性が allowlist または期待値と一致しません。" >&2
          exit 1
        fi
        fail() {
          echo "$1" >&2
          {{.DOCKER}} logs "$container" >&2
          exit 1
        }
        # faro receiver の起動は OTLP より遅れうるので、202 になるまで送る。202 の後は再送しない（出口の記録が増えるため）。
        accepted=0
        for _ in $(seq 1 30); do
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            --data-binary "@docker/otel-collector/check/fixtures/frontend.json" "http://$faro_address/collect" || true)"
          if [ "$status" = "202" ]; then
            accepted=1
            break
          fi
          sleep 1
        done
        if [ "$accepted" -ne 1 ]; then fail "Collector の faro receiver が Faro の payload を受け付けませんでした。"; fi
        invalid="$out/invalid-session.json"
        jq '.meta.session.id = "0b1e5c1a-4f0e-4c55-9d8e-2f1a3b4c5d6e" | .meta.app.version = "invalid-session-probe"' \
          docker/otel-collector/check/fixtures/frontend.json > "$invalid"
        status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
          --data-binary "@$invalid" "http://$faro_address/collect")"
        if [ "$status" != "202" ]; then fail "不正 session の Faro payload を送れませんでした（$status）。"; fi
        # RFC 8259 の JSON number ではない値は processor に届く前に receiver が拒否する。
        for value in NaN Infinity -Infinity; do
          status="$(printf '{"meta":{"app":{"name":"demo-web"},"session":{"id":"Abc2345678"},"view":{"name":"/"}},"measurements":[{"type":"web-vitals","values":{"lcp":%s}}]}' "$value" \
            | curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" --data-binary @- "http://$faro_address/collect")"
          if [ "$status" != "400" ]; then fail "faro receiver が非有限値 $value を不正 JSON として拒否しませんでした（$status）。"; fi
        done
        # 受け口の挙動。本文の {} は例外も log も持たないので、出口の記録を増やさない。
        status="$(curl -s -o /dev/null -w '%{http_code}' "http://$faro_address/collect")"
        if [ "$status" != "405" ]; then fail "faro receiver が GET に 405 を返しませんでした（$status）。"; fi
        status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: text/plain" --data-binary '{}' "http://$faro_address/collect")"
        if [ "$status" != "415" ]; then fail "faro receiver が text/plain の POST に 415 を返しませんでした（$status）。"; fi
        status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" --data-binary '{}' "http://$faro_address/any/path")"
        if [ "$status" != "202" ]; then fail "faro receiver が /collect 以外のパスの POST に 202 を返しませんでした（$status）。"; fi
        status="$(head -c 1100000 /dev/zero | tr '\0' ' ' \
          | curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data-binary @- "http://$faro_address/collect")"
        if [ "$status" != "400" ]; then fail "faro receiver が 1 MiB を超える本文に 400 を返しませんでした（$status）。"; fi
        for _ in $(seq 1 30); do
          if grep -qF 'resourceLogs' "$out/frontend.json" 2>/dev/null; then break; fi
          sleep 1
        done
        if [ ! -s "$out/frontend.json" ]; then fail "フロントエンドのログが出口に届きませんでした。"; fi
        if grep -qE 'secret-|person@example\.com|fixture-user-id|FixtureAgent|invalid-session-probe|0b1e5c1a|orders/42|secret-query|secret-fragment' "$out/frontend.json"; then
          fail "フロントエンドのログに、許可していない値、URL、または不正 session が残りました。"
        fi
        # file exporter はバッチごとに一行を書くので -s で読む。
        if ! jq -s -e '
          def string_attr($key): first(.attributes[]? | select(.key == $key) | .value.stringValue);
          def number_attr($key): first(.attributes[]? | select(.key == $key) | .value.doubleValue);
          [.[].resourceLogs[]?] as $resources
          | [$resources[].scopeLogs[]?.logRecords[]?] as $records
          | ($resources | length) > 0
            and all($resources[]; .resource
              | string_attr("service.name") == "demo-web"
                and string_attr("service.namespace") == "demo"
                and string_attr("service.version") == "0.0.0-fixture"
                and string_attr("deployment.environment.name") == "local"
                and ([.attributes[]?.key] | sort) == ["deployment.environment.name", "service.name", "service.namespace", "service.version"])
            and ($records | length) == 6
            and all($records[]; string_attr("session.id") == "Abc2345678")
            and ([ $records[] | string_attr("telemetry.signal") ] | sort) == ["exception", "view", "web-vital", "web-vital", "web-vital", "web-vital"]
            and any($records[]; .body.stringValue == "Browser exception"
              and ([.attributes[]?.key] | sort) == ["exception.message", "exception.stacktrace", "exception.type", "session.id", "telemetry.signal", "view.name"]
              and string_attr("exception.type") == "Error"
              and string_attr("view.name") == "/"
              and (string_attr("exception.message") | contains("[redacted-url]") and contains("asset /assets/app-1.js:2:3") and contains("query [redacted-url] plain a/b?c"))
              and (string_attr("exception.stacktrace")
                | contains("([redacted-url]:10:5)")
                  and contains("(/assets/index-abc.js:10:5)")
                  and contains("(/assets/vendor.min-1.js:1:2)")
                  and contains("([redacted-url]:3:4)")
                  and (contains("localhost:5173") | not)))
            and any($records[]; .body.stringValue == "Browser view" and string_attr("view.name") == "/")
            and ([ $records[] | select(string_attr("measurement.name") == "lcp") | number_attr("measurement.value") ] | sort) == [123.4, 1000]
            and any($records[]; string_attr("measurement.name") == "inp" and number_attr("measurement.value") == 18)
            and any($records[]; string_attr("measurement.name") == "cls" and number_attr("measurement.value") == 0.12)
            and all($records[] | select(string_attr("telemetry.signal") == "web-vital");
              .body.stringValue == "Browser web vital"
                and string_attr("measurement.type") == "web-vitals"
                and string_attr("view.name") == "/"
                and ([.attributes[]?.key] | sort) == ["measurement.name", "measurement.type", "measurement.value", "session.id", "telemetry.signal", "view.name"])
        ' "$out/frontend.json" >/dev/null; then
          fail "フロントエンドの例外、View、Web Vitals、session の正規形が期待値と一致しません。"
        fi
        # fixture の trace は pipeline がないので捨てられる。faro を traces の receivers に足すと、ここで見つかる。
        if grep -qF "0af7651916cd43dd8448eb211c80319c" "$out/backend.json" "$out/frontend.json" "$out/frontend-csp.json"; then
          fail "faro receiver が受けた trace が出口に届きました。"
        fi
        # CSP の報告。webhook_event の起動も OTLP より遅れうるので、200 になるまで送る。200 の後は再送しない。
        accepted=0
        for _ in $(seq 1 30); do
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/reports+json" \
            --data-binary "@docker/otel-collector/check/fixtures/csp-reports.json" "http://$csp_address/csp-report" || true)"
          if [ "$status" = "200" ]; then
            accepted=1
            break
          fi
          sleep 1
        done
        if [ "$accepted" -ne 1 ]; then fail "Collector の webhook_event receiver が CSP の報告を受け付けませんでした。"; fi
        # 出口に届かない本文と受け口の挙動。
        # Content-Type が application/reports+json でない request（旧形式の report-uri、header なし、text/plain の有効な本文）は 401 で捨てる。
        # 正しい Content-Type の JSON でない本文と文字列の配列は 200 で受けて、本文の検証で捨てる。
        csp_status() {
          curl -s -o /dev/null -w '%{http_code}' "$@" || true
        }
        status="$(csp_status -X POST -H "Content-Type: application/csp-report" \
          --data-binary '{"csp-report":{"document-uri":"https://localhost:5173/?secret-legacy=1","effective-directive":"img-src","disposition":"enforce","blocked-uri":"https://blocked.example/?secret-legacy=1"}}' \
          "http://$csp_address/csp-report")"
        if [ "$status" != "401" ]; then fail "webhook_event receiver が旧形式の報告に 401 を返しませんでした（$status）。"; fi
        status="$(csp_status -X POST --data-binary 'not json secret-junk' "http://$csp_address/csp-report")"
        if [ "$status" != "401" ]; then fail "webhook_event receiver が Content-Type のない POST に 401 を返しませんでした（$status）。"; fi
        # 別オリジンのページが preflight なしで送れる形。有効な本文でも出口に届かないことを、後の件数の検査で確かめる。
        status="$(csp_status -X POST -H "Content-Type: text/plain" \
          --data-binary "@docker/otel-collector/check/fixtures/csp-reports.json" "http://$csp_address/csp-report")"
        if [ "$status" != "401" ]; then fail "webhook_event receiver が text/plain の有効な本文に 401 を返しませんでした（$status）。"; fi
        status="$(csp_status -X POST -H "Content-Type: application/reports+json" --data-binary 'not json secret-junk' "http://$csp_address/csp-report")"
        if [ "$status" != "200" ]; then fail "webhook_event receiver が JSON でない本文に 200 を返しませんでした（$status）。"; fi
        status="$(csp_status -X POST -H "Content-Type: application/reports+json" --data-binary '["secret-junk"]' "http://$csp_address/csp-report")"
        if [ "$status" != "200" ]; then fail "webhook_event receiver が文字列の配列に 200 を返しませんでした（$status）。"; fi
        status="$(head -c 65537 /dev/zero | tr '\0' ' ' \
          | csp_status -X POST -H "Content-Type: application/reports+json" --data-binary @- "http://$csp_address/csp-report")"
        if [ "$status" != "400" ]; then fail "webhook_event receiver が 64 KiB を超える本文に 400 を返しませんでした（$status）。"; fi
        status="$(csp_status -X POST -H "Content-Type: application/reports+json" --data-binary '' "http://$csp_address/csp-report")"
        if [ "$status" != "400" ]; then fail "webhook_event receiver が空の本文に 400 を返しませんでした（$status）。"; fi
        status="$(csp_status "http://$csp_address/csp-report")"
        if [ "$status" != "405" ]; then fail "webhook_event receiver が GET に 405 を返しませんでした（$status）。"; fi
        status="$(csp_status -X POST --data-binary '[]' "http://$csp_address/other")"
        if [ "$status" != "404" ]; then fail "webhook_event receiver が /csp-report 以外のパスに 404 を返しませんでした（$status）。"; fi
        for _ in $(seq 1 30); do
          if grep -qF 'resourceLogs' "$out/frontend-csp.json" 2>/dev/null; then break; fi
          sleep 1
        done
        # 後から送った本文が誤って出口に届く場合も捕まえるため、file exporter の flush を待ってから読む。
        sleep 2
        if [ ! -s "$out/frontend-csp.json" ]; then fail "CSP の報告が出口に届きませんでした。"; fi
        # good は、userinfo の区切りを \ でごまかした URL の誤った host（指摘 2）が残らないことを見る。
        if grep -qE 'secret-|FixtureAgent|orders/42|localhost:5173|jsessionid|pass@|ref\.example|good' "$out/frontend-csp.json"; then
          fail "CSP の報告に、許可していない値か URL の path、query、fragment が残りました。"
        fi
        if ! jq -s -e '
          # 属性がないときに null を返し、「属性がない」ことを == null で確かめられるようにする。
          def string_attr($key): first((.attributes[]? | select(.key == $key) | .value.stringValue), null);
          def int_attr($key): first((.attributes[]? | select(.key == $key) | .value.intValue), null);
          [.[].resourceLogs[]?] as $resources
          | [$resources[].scopeLogs[]?] as $scopes
          | [$scopes[].logRecords[]?] as $records
          | ($resources | length) > 0
            and all($resources[]; .resource
              | string_attr("service.name") == "demo-web"
                and string_attr("service.namespace") == "demo"
                and string_attr("service.version") == "0.0.0-fixture"
                and string_attr("deployment.environment.name") == "local"
                and ([.attributes[]?.key] | sort) == ["deployment.environment.name", "service.name", "service.namespace", "service.version"])
            and all($scopes[]; ((.scope.attributes // []) | length) == 0)
            and ($records | length) == 11
            and all($records[];
              .body.stringValue == "Browser CSP violation"
                and string_attr("telemetry.signal") == "csp-violation"
                and ([.attributes[]?.key] - ["telemetry.signal", "csp.directive", "csp.disposition", "csp.blocked", "code.file.path", "code.line.number", "code.column.number"]) == [])
            and any($records[]; string_attr("csp.blocked") == "https://blocked.example" and string_attr("csp.directive") == "img-src" and int_attr("code.line.number") == "16")
            and any($records[]; string_attr("csp.blocked") == "inline" and string_attr("csp.directive") == "style-src-attr" and string_attr("code.file.path") == null)
            and any($records[]; string_attr("csp.blocked") == "https://blocked.example:8443"
              and string_attr("code.file.path") == "/assets/index-abc.js"
              and int_attr("code.column.number") == "7"
              and string_attr("csp.disposition") == "report")
            and any($records[]; string_attr("csp.blocked") == "data")
            and any($records[]; string_attr("csp.blocked") == "eval" and int_attr("code.line.number") == null)
            and any($records[]; int_attr("code.line.number") == "10" and string_attr("csp.blocked") == null)
            and any($records[]; string_attr("csp.blocked") == "https://evil.example" and string_attr("csp.directive") == "connect-src")
            and any($records[]; string_attr("csp.directive") == "script-src-elem" and string_attr("code.file.path") == null)
            and any($records[]; int_attr("code.line.number") == "20" and string_attr("csp.blocked") == null)
            and any($records[]; int_attr("code.line.number") == "21" and string_attr("csp.blocked") == null)
            and all($records[]; string_attr("csp.blocked") != "https")
            and any($records[]; string_attr("csp.directive") == "script-src-attr" and int_attr("code.line.number") == null)
        ' "$out/frontend-csp.json" >/dev/null; then
          fail "CSP の報告の属性、resource 属性、scope の属性、件数のいずれかが期待値と一致しません。"
        fi
        echo "Collector OK: 許可した属性だけを残し、Faro の payload のログ、CSP の報告から URL の query と許可していない値を消しました。"

  compose-reset:
    desc: 明示確認付きでComposeサービスと全データを削除
    env:
      CONFIRM_RESET: '{{.CONFIRM_RESET}}'
    cmds:
      - |
        if [ "$CONFIRM_RESET" != "yes" ]; then
          echo "全サービスのデータを削除して初期化します。実行するには CONFIRM_RESET=yes を指定してください（例: task compose-reset CONFIRM_RESET=yes）。" >&2
          exit 1
        fi
      - '{{.DOCKER}} compose --env-file "{{.COMPOSE_ENV_FILE}}" -f "{{.COMPOSE_FILE}}" --profile backend down --volumes --remove-orphans'

  # Security
  # betterleaks v1.10.0 以降は .betterleaks.toml を自動で読み込まないため、-c で渡す。
  scan-secrets:
    desc: ステージ済みの変更をbetterleaksでスキャン
    cmds:
      - betterleaks git --staged -c .betterleaks.toml --no-banner --redact

  lint-betterleaks:
    desc: .betterleaks.tomlの除外したファイルに置いた秘密情報が、本物のbetterleaksで検出されることを検証
    silent: true
    cmds:
      - bash tooling/betterleaks/test.sh

  # --log-opts を渡すと betterleaks は Git 履歴を単一ワーカーで読むため、--git-workers は付けない。
  # --diff-merges=first-parent は merge commit の差分も走査する（既定では走査しない）。コンフリクトの解消だけで入った token を見逃さない。
  scan-secrets-all:
    desc: 現在のブランチから辿れる履歴（BETTERLEAKS_LOG_OPTSで範囲を変更可）をbetterleaksでスキャン
    cmds:
      - betterleaks git . -c .betterleaks.toml --no-banner --redact --log-opts="--diff-merges=first-parent ${BETTERLEAKS_LOG_OPTS:-HEAD}"

  scan-dast:
    desc: 隔離した環境で認証付きのpassive scan（OWASP ZAP）を実行し、レポートをbuild/dastに出力
    cmds:
      - task: dast-run
        vars: { DAST_PLAN: passive }

  scan-dast-active:
    desc: 隔離した環境で認証付きのactive scan（OWASP ZAP）を実行し、レポートをbuild/dastに出力
    cmds:
      - task: dast-run
        vars: { DAST_PLAN: active }

  # DAST の本体（ADR-056）。依存、backend、vp preview、ZAP を起動し、失敗したときも片付ける。
  # 検出では失敗させず、起動、ログイン、CSRF の前提確認の失敗だけで失敗させる。
  # vp は PATH 上にある前提（CI は frontend/node_modules/.bin を PATH に足す）。
  dast-run:
    internal: true
    silent: true
    deps: [_ensure-test-env]
    cmds:
      - |
        zap_image="zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef"
        report_dir="$PWD/build/dast"
        preview_pid_file="$report_dir/preview.pid"
        export DOCKER="{{.DOCKER}}" TEST_COMPOSE_FILE="{{.TEST_COMPOSE_FILE}}"
        # slot の取得に失敗したら、$(...) の失敗を eval に隠さず止める。
        slot_env="$(bash tooling/test-slot/test-slot.sh acquire "{{.TEST_ENV_FILE}}" web)"
        eval "$slot_env"
        compose() { {{.DOCKER}} compose -f "{{.TEST_COMPOSE_FILE}}" --profile backend-smoke "$@"; }
        fail() { echo "✗ $1" >&2; exit 1; }
        backend_name="spring-modulith-dast-$TEST_SLOT-backend"
        zap_name="spring-modulith-dast-$TEST_SLOT-zap"

        # 4173 は preview、18081 は backend、18082 は ZAP の proxy。slot を取れても、ほかの scan-dast がこの 3 つを使っていれば、同時には流せない。
        for port in 4173 18081 18082; do
          rc=0
          curl --silent --output /dev/null --connect-timeout 1 "http://127.0.0.1:$port/" || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "✗ ポート $port が使用中のため DAST を開始できません。" >&2
            echo "  ほかの scan-dast が動いていないか、前回の DAST が残っていないか確認してください（開発環境はこれらのポートを使いません）。" >&2
            # 取った slot を返す。
            compose down --volumes --remove-orphans >/dev/null 2>&1 || true
            exit 1
          fi
        done

        # 本体と後片付けの終了コードの扱いは docs/tooling/taskfile.md の「後片付けと終了コード」を参照する。
        status=0
        (
          set -e
          rm -rf "$report_dir" && mkdir -p "$report_dir" && chmod a+rwx "$report_dir"
          # plan が Keycloak の origin を直に書くため、slot の Keycloak のポートへ置き換えた写しを ZAP に渡す。
          cp -r docker/zap "$report_dir/plans"
          sed -i "s/:8081/:$TEST_KEYCLOAK_PORT/g" "$report_dir"/plans/*.yaml
          {{.DOCKER}} build --tag spring-modulith-backend:dast backend
          (cd frontend && vp exec {{.FE_WEB}} vp build)
          compose up -d --wait
          # ログインがアプリの DB に利用者を作るため、backend の起動の前にマイグレーションを適用する（ADR-056）。
          task be-migrate COMPOSE_ENV_FILE="$TEST_ENV_FILE"
          # test-admin を 1 つのテナントだけに所属させ、ログインの後に選ばずにテナントへ入れる。
          # テナントを選ぶ前は業務の API と認証の確認の /api/missing が 403 になり、scan が業務の API に届かない。
          task be-seed COMPOSE_ENV_FILE="$TEST_ENV_FILE"

          {{.DOCKER}} run --detach --name "$backend_name" --network host \
            --env-file "$TEST_ENV_FILE" --env SERVER_PORT=18081 \
            spring-modulith-backend:dast >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18081/actuator/health/readiness; then ready=1; break; fi
            if [ -z "$({{.DOCKER}} ps --quiet --filter name="$backend_name" --filter status=running)" ]; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            {{.DOCKER}} logs "$backend_name" >&2 || true
            fail "backend が 18081 で ready になりませんでした。"
          fi

          # preview を別セッションで起動し、片付けでプロセスグループごと止める。
          # production mode は .env.test を読まないため、--mode test で .env.test の OIDC_ISSUER_URI を .env より優先させ、
          # CSP の form-action の IdP の origin を backend の issuer と揃える。
          setsid sh -c 'echo $$ >"$1"; cd frontend/apps/web && SERVER_PORT=18081 exec vp preview --mode test --host 127.0.0.1 --port 4173' sh "$preview_pid_file" \
            >"$report_dir/preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          # 未認証の /api/missing が 401 なら、preview の proxy が backend へ届いている。
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4173/api/missing || true)"
          if [ "$code" != "401" ]; then
            cat "$report_dir/preview.log" >&2 || true
            fail "preview 経由の GET /api/missing が 401 ではありません（$code）。"
          fi

          # ZAP の Firefox は localhost も ZAP の proxy に通す（allow_hijacking_localhost）。
          # そのままでは http://localhost を安全とみなさず、Secure の __Host- の Cookie を捨ててログインできない（ADR-119）。
          zap() {
            {{.DOCKER}} run --rm --name "$zap_name" --network host \
              -v "$report_dir/plans:/zap/plans:ro" -v "$report_dir:/zap/wrk:rw" \
              "$zap_image" zap.sh -cmd -port 18082 \
              -config 'selenium.firefoxPrefs.pref(0).name=network.proxy.testing_localhost_is_secure_when_hijacked' \
              -config 'selenium.firefoxPrefs.pref(0).value=true' \
              -config 'selenium.firefoxPrefs.pref(0).enabled=true' \
              -autorun "/zap/plans/$1.yaml"
          }
          if ! zap preflight; then
            fail "認証付きの前提確認に失敗しました。GET /api/missing（ログイン）と POST /api/missing（CSRF）がどちらも 404 になる必要があります。"
          fi

          # ZAP は警告があると 2 で終わる。検出では失敗させないので、0 と 2 だけを成功として扱う。
          zap_status=0
          zap "{{.DAST_PLAN}}" || zap_status=$?
          if [ "$zap_status" -eq 2 ]; then
            echo "ZAP が警告を報告しました。ログを確認してください。"
          elif [ "$zap_status" -ne 0 ]; then
            fail "ZAP の {{.DAST_PLAN}} plan が終了コード $zap_status で失敗しました。"
          fi
          # ZAP の生の SARIF は別名で受け取り、変換と検査を通ったものだけを CI がアップロードする名前で置く。
          # 途中で失敗しても、変換前の SARIF が Code Scanning へ送られない。
          raw_sarif="$report_dir/zap-{{.DAST_PLAN}}.raw.sarif.json"
          sarif="$report_dir/zap-{{.DAST_PLAN}}.sarif.tmp"
          test -s "$raw_sarif" || fail "SARIF が出力されていません。"
          # Code Scanning は http の URI を受け付けず、リポジトリ内のファイルの位置だけを受け付ける。
          # そのため、位置を実行した plan のファイルへ書き換え、元の URL はメッセージの末尾に残す。
          # URL のクエリとフラグメントは OAuth の state や code など実行ごとに変わるため、メッセージと fingerprint から外す。
          # 位置が同じでも別の警告として残るよう、fingerprint を rule、method、URL、evidence、attack、元のメッセージから作る。
          # ZAP は risk を level だけで表す（High は error、Medium は warning、Low は note、Informational は none）。
          # Informational は Code Scanning に送らず、HTML と JSON のレポートに残す。
          # GitHub は rule の security-severity で重大度を表示するため、level から付ける（GitHub Docs の SARIF support for code scanning）。
          jq --arg plan "docker/zap/{{.DAST_PLAN}}.yaml" '
            def to_plan: map(.physicalLocation.artifactLocation = {uri: $plan} | .physicalLocation.region.startLine //= 1);
            def sev: {error: "8.0", warning: "5.0", note: "2.0"}[. // "warning"];
            .runs[] |= (del(.artifacts, .originalUriBaseIds) | .results |= map(select((.level // "warning") != "none")
              | .locations[0] as $loc
              | (($loc.physicalLocation.artifactLocation.uri // .webRequest.target // "") | sub("[?#].*$"; "")) as $url
              | .partialFingerprints.primaryLocationLineHash = ([.ruleId, .webRequest.method // "", $url,
                  ($loc.physicalLocation.region.snippet.text // ""), ($loc.properties.attack // ""), .message.text] | join("|"))
              | .message.text += "\nURL: \($url)"
              | .locations |= to_plan
              | if has("relatedLocations") then .relatedLocations |= to_plan else . end)
              | (reduce .results[] as $r ({}; .[$r.ruleId] = ([.[$r.ruleId], ($r.level | sev)] | map(select(.)) | max_by(tonumber)))) as $sev
              | .tool.driver.rules |= map(select($sev[.id]) | .properties["security-severity"] = $sev[.id] | .properties.tags = ["security"]))
          ' "$raw_sarif" >"$sarif" || fail "SARIF の変換に失敗しました。"
          jq -e '[.. | objects | .uri? | strings | select(test("^[A-Za-z][A-Za-z0-9+.-]*:"))] | length == 0' "$sarif" >/dev/null \
            || fail "SARIF に scheme 付きの URI が残っています。"
          jq -e '[.runs[].results[] | select((.level // "warning") == "none" or has("ruleIndex"))] | length == 0' "$sarif" >/dev/null \
            || fail "SARIF に Informational の結果か ruleIndex が残っています。"
          jq -e '[.runs[].results[] | select((.partialFingerprints.primaryLocationLineHash // "" | test("://[^|]*[?#]"))
              or (.message.text | test("\nURL: [^\n]*[?#]")))] | length == 0' "$sarif" >/dev/null \
            || fail "SARIF の fingerprint かメッセージの URL にクエリが残っています。"
          jq -e 'all(.runs[]; .tool.driver.name == "ZAP")' "$sarif" >/dev/null || fail "SARIF の tool 名が ZAP ではありません。"
          mv "$sarif" "$report_dir/zap-{{.DAST_PLAN}}.sarif.json"
          echo "DAST のレポートを $report_dir に出力しました。"
        ) || status=$?
        cleanup_status=0
        if [ -s "$preview_pid_file" ]; then
          preview_pid="$(cat "$preview_pid_file")" || cleanup_status=$?
          # Task の組み込みの kill はプロセスグループを指定できないので、外部の kill を使う。
          if [ -n "${preview_pid:-}" ]; then env kill -TERM -- "-$preview_pid" 2>/dev/null || true; fi
          rm -f "$preview_pid_file" || cleanup_status=$?
        fi
        {{.DOCKER}} logs "$backend_name" >"$report_dir/backend.log" 2>&1 || true
        {{.DOCKER}} rm --force "$zap_name" "$backend_name" >/dev/null 2>&1 || true
        compose down --volumes --remove-orphans || cleanup_status=$?
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        exit "$cleanup_status"

  # Lint and format
  lint-actions:
    desc: GitHub Actionsワークフローをactionlintで検査
    cmds:
      - |
        docker run --rm -v "$PWD":/repo -w /repo \
          rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
          -color

  lint-actions-security:
    desc: GitHub Actionsのワークフローとcomposite actionをzizmorで検査
    cmds:
      - zizmor .github/workflows/ .github/actions/

  lint-docker:
    desc: 全Dockerfileをhadolintで検査
    cmds:
      - |
        files="$(git ls-files '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile')"
        if [ -z "$files" ]; then
          echo "Dockerfile が見つかりません。"
        else
          printf 'linting: %s\n' $files
          docker run --rm -i -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint $files
        fi

  lint-docker-check:
    desc: 全Dockerfileをdocker build --checkで検査
    cmds:
      - |
        files="$(git ls-files '**/Dockerfile' '**/Dockerfile.*' '**/*.Dockerfile' 'Dockerfile')"
        if [ -z "$files" ]; then
          echo "Dockerfile が見つかりません。"
        else
          for file in $files; do
            echo "checking: $file"
            docker build --check -f "$file" "$(dirname "$file")"
          done
        fi

  lint-compose:
    desc: 全Composeファイルの構文と変数展開を検証
    deps: [_ensure-test-env]
    cmds:
      - |
        files="$(git ls-files '**/compose.yml' '**/compose.yaml' '**/compose-test.yml' '**/compose-test.yaml' '**/docker-compose.yml' '**/docker-compose.yaml' 'compose.yml' 'compose.yaml' 'compose-test.yml' 'compose-test.yaml' 'docker-compose.yml' 'docker-compose.yaml')"
        if [ -z "$files" ]; then
          echo "Compose ファイルが見つかりません。"
        else
          for file in $files; do
            echo "validating: $file"
            docker compose --env-file .env.example -f "$file" config --quiet
          done
        fi

  lint-md:
    desc: Markdownをmarkdownlint-cli2で検査
    cmds:
      - npx --yes markdownlint-cli2 "**/*.md"

  lint-md-fix:
    desc: Markdownlintで安全に修正できる問題を修正
    cmds:
      - npx --yes markdownlint-cli2 --fix "**/*.md"

  lint-taskfile:
    desc: TaskfileをTask本体で解析しYAML構文とスキーマ構造、後片付けの終了コード、フックとワークフローが呼ぶタスク名を検証
    silent: true
    cmds:
      # Taskfile 全体の解析は、task がこのタスクを起動する前に済ませている。
      - |
        echo "Taskfile OK: YAML構文とスキーマ構造の解析に成功しました。"
        bash tooling/taskfile-cleanup/test.sh
        bash tooling/task-calls/test.sh
        bash tooling/openapi-drift/test.sh
        bash tooling/task-calls/task-calls.sh

  lint-lefthook:
    desc: lefthook.ymlのglobが、ディレクトリ直下のファイルでも意図したjobを選ぶことを本物のlefthookで検証
    silent: true
    cmds:
      - bash tooling/lefthook-glob/test.sh

  lint-scratch-git:
    desc: 自己検査がgitを実行する前にtooling/scratch-git/scratch-git.shをsourceしているか検証
    silent: true
    cmds:
      - bash tooling/scratch-git/test.sh
      - bash tooling/scratch-git/scratch-git-check.sh

  lint-semgrep:
    desc: Semgrep OSSで静的解析
    cmds:
      - |
        docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD":/src -w /src \
          semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/typescript \
            --config p/dockerfile \
            --config p/secrets \
            --exclude .kiro \
            --error \
            --metrics off \
            --disable-version-check

  # Vulnerability scanning
  scan-vulns:
    desc: backendとfrontendの依存関係脆弱性をTrivyで検査
    cmds:
      - task: scan-vulns-backend
      - task: scan-vulns-frontend

  scan-vulns-backend:
    desc: backendのCycloneDX SBOMをTrivyで検査
    cmds:
      - |
        (cd backend && ./gradlew cyclonedxBom)
        docker run --rm -v "$PWD/backend":/src -w /src \
          -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2 \
          -e TRIVY_JAVA_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-java-db:1 \
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
          sbom build/reports/cyclonedx/application.cdx.json \
            --ignore-unfixed

  scan-vulns-frontend:
    desc: frontendの解決済み依存関係をTrivyで検査
    cmds:
      - |
        (cd frontend && pnpm install --frozen-lockfile)
        docker run --rm -v "$PWD/frontend":/src -w /src \
          -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2 \
          -e TRIVY_JAVA_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-java-db:1 \
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
          fs . \
            --scanners vuln \
            --ignore-unfixed

  # dep-scan（ADR-095）。Trivyと並べて動かし、VDRとHTMLをbuild/depscan/に出す。
  scan-depscan:
    desc: backendとfrontendの依存関係をdep-scanで検査
    cmds:
      - task: scan-depscan-backend
      - task: scan-depscan-frontend

  scan-depscan-backend:
    desc: backendのCycloneDX SBOMをdep-scanで検査
    cmds:
      - task: be-sbom
      - task: _depscan
        vars:
          TARGET: backend
          SBOM: backend/build/reports/cyclonedx/application.cdx.json
          ARGS: -t java --bom /app/build/reports/cyclonedx/application.cdx.json

  scan-depscan-frontend:
    desc: frontendのロックファイルをdep-scanで検査
    cmds:
      - task: _depscan
        vars:
          TARGET: frontend
          SBOM: build/depscan/frontend/sbom-js.cdx.json
          ARGS: -t js

  # 脆弱性DBは展開後に4GB超なので、app-onlyの範囲に絞り、DEPSCAN_VDB_HOMEに残して使い回す。
  # イメージの利用者（uid 1000）とCIの実行ユーザー（uid 1001）が違い、マウントしたディレクトリに書けなくなるため、呼び出したユーザーで動かす。
  # dep-scanは、cdxgenが1件も読めなくても終了コード0で終わる。SBOMに部品がなければ失敗にする。
  _depscan:
    internal: true
    cmds:
      - |
        vdb="${DEPSCAN_VDB_HOME:-$HOME/.cache/depscan-vdb}"
        out="build/depscan/{{.TARGET}}"
        rm -rf "$out" && mkdir -p "$out" "$vdb"
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e VDB_HOME=/db \
          -v "$vdb":/db \
          -v "$PWD/{{.TARGET}}":/app:ro \
          -v "$PWD/$out":/reports \
          ghcr.io/owasp-dep-scan/dep-scan:v6.3.2@sha256:9c69b3b743a95ac7901acc639ffabf4dc80426a948786d1dd10e680e6b6f5623 \
          depscan --no-banner --vdb-scope app {{.ARGS}} \
            --src /app --reports-dir /reports
        grep -q '"purl"' "{{.SBOM}}" || { echo "dep-scanが検査したSBOM（{{.SBOM}}）に部品がありません。" >&2; exit 1; }
