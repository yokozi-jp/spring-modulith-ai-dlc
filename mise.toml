# 版を変えたら `mise lock --platform linux-x64` を実行し、mise.lock と .mise/locks/ を同じコミットに含める。
# http: の道具の option（url、bin_path など）のため、新しいチェックアウトごとに mise trust が要る（ADR-090）。
[tools]
betterleaks = "1.10.1"
# iwe の実行に要る Node.js は mise では入れない（ADR-090）。
"npm:@iwe-org/iwe" = "0.33.0"
# okf-check、Kiro のフック、Taskfile の検査が使う。
jq = "1.8.2"
# 実行用のイメージと同じ Corretto の 25 系にする（ADR-090）。
java = "corretto-25.0.5.0.10"
task = "3.54.0"
# zizmor.yml の zizmor-action の version も同じ版にする（ADR-090）。
zizmor = "1.32.0"
# Kiro CLI の Java の LSP（.kiro/settings/lsp.json）。registry と aqua に無いので Eclipse の配布物を取り、版は手で上げる。
"http:jdtls" = { version = "1.63.0", url = "https://download.eclipse.org/jdtls/milestones/1.63.0/jdt-language-server-1.63.0-202610191322.tar.gz", bin_path = "bin" }
# jdtls に @Slf4j を解釈させる javaagent。Spring Boot が管理する版に揃える（backend/ の
# `./gradlew -q dependencyInsight --dependency org.projectlombok:lombok --configuration compileClasspath` で確かめる）。
"http:lombok" = { version = "1.18.48", url = "https://repo1.maven.org/maven2/org/projectlombok/lombok/{{ version }}/lombok-{{ version }}.jar", bin = "lombok.jar" }

# Kiro CLI は mise の registry に無いので、http backend で公式の zip を取る（ADR-090）。
# 各版の sha256 は公式の index.json（versions[].packages[].download と sha256）にあり、mise.lock が記録する。
[tools."http:kiro-cli"]
version = "3.6.2"
bin_path = "kirocli/bin"
checksum_url = "https://prod.download.cli.kiro.dev/stable/index.json"
checksum_expr = '"sha256:" + filter(filter(fromJSON(body).versions, { #.version == version })[0].packages, { #.download == version + "/" + filename })[0].sha256'

[tools."http:kiro-cli".platforms]
linux-x64 = { url = "https://prod.download.cli.kiro.dev/stable/{{ version }}/kirocli-x86_64-linux.zip" }
