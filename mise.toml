# 版を変えたら `mise lock --platform linux-x64` を実行し、mise.lock と .mise/locks/ を同じコミットに含める。
# http:kiro-cli の url と bin_path のため、新しいチェックアウトごとに mise trust が要る（ADR-090）。
[tools]
betterleaks = "1.10.1"
# iwe の実行に要る Node.js は mise では入れない（ADR-090）。
"npm:@iwe-org/iwe" = "0.29.2"
# 実行用のイメージと同じ Corretto の 25 系にする（ADR-090）。
java = "corretto-25.0.5.0.10"
task = "3.53.1"
# zizmor.yml の zizmor-action の version も同じ版にする（ADR-090）。
zizmor = "1.32.0"

# Kiro CLI は mise の registry に無いので、http backend で公式の zip を取る（ADR-090）。
# 各版の sha256 は公式の index.json にあり、mise.lock が記録する。
[tools."http:kiro-cli"]
version = "3.5.0"
bin_path = "kirocli/bin"
checksum_url = "https://prod.download.cli.kiro.dev/stable/index.json"
checksum_expr = '"sha256:" + filter(filter(fromJSON(body).versions, { #.version == version })[0].packages, { #.download == version + "/" + filename })[0].sha256'

[tools."http:kiro-cli".platforms]
linux-x64 = { url = "https://prod.download.cli.kiro.dev/stable/{{ version }}/kirocli-x86_64-linux.zip" }
