catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.3.3
  vitest: 4.1.11
  vite-plus: ^0.3.3
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# --- サプライチェーン対策（明示設定） ---
# 公開直後の悪意あるパッケージを避けるため、7日以上経過したバージョンのみ許可する。
minimumReleaseAge: 10080
# 信頼レベルが下がった（provenance/署名が失われた等の）バージョンの導入を拒否する。
trustPolicy: no-downgrade
# ADR-022: TanStack Router のビルド時依存に限定して provenance 不在を許容する。
trustPolicyExclude:
  - "semver@6.3.1"
# 推移的依存が Git リポジトリや直接 URL などの exotic なソースから取得されることを禁止する。
blockExoticSubdeps: true
allowBuilds:
  esbuild: false
  msw: false
