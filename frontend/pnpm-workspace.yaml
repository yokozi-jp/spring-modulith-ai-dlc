packages:
  - apps/*
  - packages/*
catalogMode: prefer
# 2つ以上のpackageが使う依存は、版をここで1つにする（ADR-100）。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  "@tanstack/react-query": 5.103.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.1.0
  msw: 2.15.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: ~7.0.2
  zod: 4.6.6
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Orval経由の@scalar/json-magicが脆弱なundici（7.24.4、7.29.0）を固定するため、修正版へ引き上げる。
  # ponytail: 上流が7.29.1以上を要求したら削除する。
  "undici@<7.29.1": 7.29.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# --- サプライチェーン対策（明示設定） ---
# 公開直後の悪意あるパッケージを避けるため、7日以上経過したバージョンのみ許可する。
minimumReleaseAge: 10080
# 信頼レベルが下がった（provenance/署名が失われた等の）バージョンの導入を拒否する。
trustPolicy: no-downgrade
# ADR-022: TanStack Router のビルド時依存に限定して provenance 不在を許容する。
trustPolicyExclude:
  - "semver@6.3.1"
  # ADR-068: Faro Web SDK が固定する版に限定して provenance 不在を許容する。
  - "ua-parser-js@1.0.41"
# 推移的依存が Git リポジトリや直接 URL などの exotic なソースから取得されることを禁止する。
blockExoticSubdeps: true
allowBuilds:
  esbuild: false
  msw: false
