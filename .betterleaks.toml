# Betterleaks 設定
# デフォルトルールセットを継承したうえで、プロジェクト固有の許可設定を追加する。
# 参照: https://github.com/betterleaks/betterleaks

# 組み込みのデフォルトルールを読み込む。
[extend]
useDefault = true

# 誤検知の許可（allowlist）
# .env.example はダミー値を並べるサンプルファイルであり、実際のシークレットは含まない。
# そのためファイル全体をスキャン対象から除外する。
[[allowlists]]
description = ".env.example はプレースホルダ専用のサンプルファイルのため除外"
paths = [
  '''(^|/)\.env\.example$''',
]

# Compose の secret 読み込みは実値ではなく /run/secrets からの読み出しであり、
# ローカル専用 Keycloak の admin/admin は使い捨ての開発用資格情報のため除外する。
# compose-test.yml の Keycloak は backend-smoke profile 限定の使い捨てスモーク用で、同じ admin/admin を直書きする。
[[allowlists]]
description = "docker/compose.yml と compose-test.yml の Compose secret 読み出しおよびローカル専用 Keycloak 開発用資格情報を除外"
paths = [
  '''(^|/)docker/compose\.yml$''',
  '''(^|/)docker/compose-test\.yml$''',
]
regexes = [
  '''\$\$\(cat /run/secrets/[a-z_]+\)''',
  '''KC_BOOTSTRAP_ADMIN_PASSWORD:\s*admin''',
]

# backend の Liquibase / jOOQ 設定は、パスワードを環境変数由来の変数へ束ねて
# 参照するだけで実値を直書きしない。password に変数名（英字識別子）を代入する行だけを除外し、
# 引用符付きリテラルの直書きは引き続き検出できるようにする。
# タスク定義は build.gradle から gradle/database.gradle へ切り出したため、両方を対象にする。
[[allowlists]]
description = "backend の Liquibase / jOOQ 設定（build.gradle・gradle/database.gradle）で password に変数参照を代入する行を除外（リテラル直書きは検出対象のまま）"
paths = [
  '''(^|/)backend/build\.gradle$''',
  '''(^|/)backend/gradle/database\.gradle$''',
]
regexes = [
  '''password\s*=?\s*[a-zA-Z_][a-zA-Z0-9_]*$''',
]
