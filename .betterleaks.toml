# Betterleaks 設定
# デフォルトルールセットを継承したうえで、プロジェクト固有の許可設定を追加する。
# 参照: https://github.com/betterleaks/betterleaks

# 組み込みのデフォルトルールを読み込む。
[extend]
useDefault = true

# 誤検知の許可（allowlist）
# .env.example はダミー値を並べるサンプルファイルであり、実際のシークレットは含まない。
# そのためファイル全体をスキャン対象から除外する。
[[allowlists]]
description = ".env.example はプレースホルダ専用のサンプルファイルのため除外"
paths = [
  '''(^|/)\.env\.example$''',
]

# Compose の secret 読み込みは実値ではなく /run/secrets からの読み出しであり、
# ローカル専用 Keycloak の admin/admin は使い捨ての開発用資格情報のため除外する。
[[allowlists]]
description = "docker/compose.yml の Compose secret 読み出しとローカル専用 Keycloak 開発用資格情報を除外"
paths = [
  '''(^|/)docker/compose\.yml$''',
]
regexes = [
  '''\$\$\(cat /run/secrets/[a-z_]+\)''',
  '''KC_BOOTSTRAP_ADMIN_PASSWORD:\s*admin''',
]
